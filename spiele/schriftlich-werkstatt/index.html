<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schriftlich-Werkstatt</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  /* Stellenwerttabelle: eine Spalte je Stelle, dazu links eine Spalte für das Rechenzeichen
     (bei × stehen Zeichen und Faktor rechts). --spalten setzt das Skript. */
  .werkstatt {
    --zelle: clamp(26px, calc((100vw - 84px) / var(--spalten) - 4px), 58px);
    display: grid;
    grid-template-columns: repeat(var(--spalten), var(--zelle));
    gap: 4px;
    justify-content: center;
    margin: 0 auto 8px;
  }
  .werkstatt > div {
    height: var(--zelle);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(var(--zelle) * .62);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
  }
  .werkstatt .kopfzelle {
    height: calc(var(--zelle) * .62);
    font-size: calc(var(--zelle) * .34);
    border-radius: 10px;
    background: var(--f);
    color: #fff;
    opacity: .55;
  }
  .werkstatt .kopfzelle.aktiv { opacity: 1; transform: scale(1.08); }
  .werkstatt .ziffer { color: var(--f); }
  .werkstatt .zeichen { color: var(--text); }
  /* Übertrag: kleine Zahl im Bläschen, direkt über dem Strich */
  .werkstatt .uebertrag { height: calc(var(--zelle) * .5); font-size: calc(var(--zelle) * .32); }
  .werkstatt .uebertrag span {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 1.5em; height: 1.5em; border-radius: 999px;
    background: var(--hinweis-hell); color: var(--text); border: 2px solid var(--hinweis);
    animation: plopp .4s;
  }
  .werkstatt .strich { grid-column: 1 / -1; height: 0; border-top: 4px solid var(--text); border-radius: 2px; }
  .werkstatt .erg { border: 3px dashed var(--rand); border-radius: 10px; background: #fbfcff; }
  .werkstatt .erg.aktiv { border: 4px solid var(--knopf); background: #eef0ff; }
  .werkstatt .erg.aktiv.leer::after { content: "?"; color: #c5c9de; }
  .werkstatt .erg.fertig { border: 3px solid var(--gut); background: var(--gut-hell); color: var(--f); }
  .werkstatt .erg.falsch { border-color: var(--hinweis); background: var(--hinweis-hell); animation: wackeln .4s; }
  @keyframes plopp { from { transform: scale(0); } 70% { transform: scale(1.3); } to { transform: scale(1); } }
  .hinweis-klein { text-align: center; color: var(--text-leise); font-size: 15px; margin-bottom: 4px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🛠️ Schriftlich-Werkstatt</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script>
"use strict";
// Lehrplan SG MA.1.A.3.d: schriftlich addieren und subtrahieren; MA.1.A.3.e (OP): × durch
// einstellige Zahlen. Das Kind rechnet in der Stellenwerttabelle Spalte für Spalte von rechts nach
// links und tippt je Spalte eine Ziffer ein; der Übertrag erscheint danach klein über dem Strich.
// Subtraktion: Übertrag wie beim Ergänzen (er kommt unten dazu) — Verfahren mit dem Lehrmittel
// abgleichen (offene Frage im Handover).

const { zahlText, zufall, waehle, el, dativ, STELLEN } = LS;
const STELLEN_RECHTS = STELLEN.slice().reverse(); // E, Z, H, T, ZT, HT, M

/** Ziffern einer Zahl, Einer zuerst: 347 → [7, 4, 3]. */
const ziffern = n => String(n).split("").reverse().map(Number);

/** Zahl mit 'stellen' Ziffern; jede Ziffer ausser der ersten ist mit Wahrscheinlichkeit 'p' eine Null. */
function mitNullen(stellen, p) {
  let s = String(zufall(1, 9));
  for (let i = 1; i < stellen; i++) s += Math.random() < p ? "0" : String(zufall(1, 9));
  return Number(s);
}

/**
 * Rechnet spaltenweise wie auf Papier: Ziffern des Ergebnisses r (Einer zuerst) und Überträge
 * ueber[i] = Übertrag, der in Spalte i ankommt (ueber[0] = 0). Bei − kommt der Übertrag unten dazu.
 */
function spaltenRechnen(art, zahlen) {
  const ergebnis = art === "+" ? zahlen.reduce((s, z) => s + z, 0) : art === "−" ? zahlen[0] - zahlen[1] : zahlen[0] * zahlen[1];
  const n = String(Math.max(ergebnis, 0)).length;
  const r = [];
  const ueber = [0];
  for (let i = 0; i < n; i++) {
    const c = ueber[i];
    if (art === "+") {
      const s = zahlen.reduce((t, z) => t + (ziffern(z)[i] || 0), 0) + c;
      r.push(s % 10); ueber.push(Math.floor(s / 10));
    } else if (art === "−") {
      const s = (ziffern(zahlen[0])[i] || 0) - (ziffern(zahlen[1])[i] || 0) - c;
      r.push((s + 10) % 10); ueber.push(s < 0 ? 1 : 0);
    } else {
      const s = (ziffern(zahlen[0])[i] || 0) * zahlen[1] + c;
      r.push(s % 10); ueber.push(Math.floor(s / 10));
    }
  }
  return { ergebnis, r, ueber };
}

// Je Stufe: Rechenarten, Zahlen je Rechenart, grösstes Ergebnis, Anzahl Überträge (min/max).
// Basisklasse 4: Stufe 1 = 3. Klasse (bis 1000), Stufe 3 = vierstellig, Stufe 5 = × einstellig.
const STUFE = {
  s1: { arten: ["+"], max: 999, uMin: 0, uMax: 1,
    zahlen: { "+": () => [zufall(100, 899), zufall(100, 899)] } },
  s2: { arten: ["+", "−"], max: 999, uMin: 1, uMax: 3,
    zahlen: { "+": () => [zufall(100, 899), zufall(100, 899)], "−": () => [zufall(200, 999), zufall(10, 899)] } },
  s3: { arten: ["+", "−"], max: 9999, uMin: 1, uMax: 4,
    zahlen: { "+": () => [zufall(1000, 8999), zufall(100, 8999)], "−": () => [zufall(2000, 9999), zufall(100, 8999)] } },
  s4: { arten: ["+", "−"], max: 999999, uMin: 2, uMax: 6,
    zahlen: { "+": () => [zufall(10000, 899999), zufall(1000, 899999)], "−": () => [mitNullen(zufall(5, 6), 0.3), zufall(1000, 899999)] } },
  s5: { arten: ["×"], max: 99999, uMin: 1, uMax: 5,
    zahlen: { "×": () => [zufall(100, 9999), zufall(2, 9)] } },
  // Königsstufe: drei Summanden, sechsstellige Subtraktion über viele Nullen, fünfstellig × einstellig.
  s6: { arten: ["+", "−", "×"], max: 999999, uMin: 2, uMax: 7,
    zahlen: {
      "+": () => [zufall(10000, 499999), zufall(10000, 399999), zufall(1000, 99999)],
      "−": () => [mitNullen(6, 0.45), zufall(10000, 899999)],
      "×": () => [zufall(10000, 99999), zufall(3, 9)],
    } },
};

const anzahlUeber = x => x.ueber.filter(c => c > 0).length;

/** Erfüllt die Aufgabe die Bedingungen der Stufe? (Zahlenraum, Überträge, Ergebnis so lang wie die erste Zahl bei −) */
function passtZurStufe(x, p) {
  if (!(x.ergebnis > 0 && x.ergebnis <= p.max)) return false;
  if (x.art === "−" && String(x.ergebnis).length !== String(x.zahlen[0]).length) return false;
  const u = anzahlUeber(x);
  return u >= p.uMin && u <= p.uMax;
}

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  for (let versuch = 0; versuch < 5000; versuch++) {
    const art = waehle(p.arten);
    const zahlen = p.zahlen[art]();
    if (art === "−" && zahlen[1] >= zahlen[0]) continue;
    const x = { art, zahlen, ...spaltenRechnen(art, zahlen) };
    if (passtZurStufe(x, p)) return x;
  }
  throw new Error(`Schriftlich-Werkstatt ${stufe}: keine passende Aufgabe gefunden`);
}

/** Mängel: Ergebnis (direkt gerechnet), Ziffern und Überträge stimmen, Zahlenraum, Stufe, Breite. */
function pruefeAufgabe(x, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p.arten.includes(x.art)) m.push("Rechenart nicht in der Stufe");
  const [a, b, c = 0] = x.zahlen;
  const direkt = x.art === "+" ? a + b + c : x.art === "−" ? a - b : a * b;
  if (direkt !== x.ergebnis) m.push("Ergebnis stimmt nicht");
  if (Number(x.r.slice().reverse().join("")) !== direkt || x.r.length !== String(direkt).length) m.push("Ziffern ergeben nicht das Ergebnis");
  if (x.ueber[x.r.length] !== 0) m.push("Übertrag aus der letzten Spalte bleibt übrig");
  // Jede Spalte nachrechnen. + und ×: Ziffer + 10 × weitergegebener Übertrag = Spaltenwert;
  // −: Ziffer − 10 × weitergegebener Übertrag = oben − unten − ankommender Übertrag.
  for (let i = 0; i < x.r.length; i++) {
    const d = z => ziffern(z)[i] || 0;
    const ok = x.art === "+" ? x.r[i] + 10 * x.ueber[i + 1] === x.zahlen.reduce((t, z) => t + d(z), 0) + x.ueber[i]
      : x.art === "−" ? x.r[i] - 10 * x.ueber[i + 1] === d(a) - d(b) - x.ueber[i]
      : x.r[i] + 10 * x.ueber[i + 1] === d(a) * b + x.ueber[i];
    if (!ok) m.push(`Spalte ${i} falsch gerechnet`);
    if (!(Number.isInteger(x.r[i]) && x.r[i] >= 0 && x.r[i] <= 9)) m.push("Ergebnisziffer keine Ziffer");
  }
  if (x.zahlen.some(z => !Number.isInteger(z) || z <= 0)) m.push("Zahl nicht positiv und ganz");
  if (x.art === "×" && !(b >= 2 && b <= 9)) m.push("Faktor nicht einstellig");
  if (x.art === "−" && b >= a) m.push("Subtrahend zu gross");
  if (!passtZurStufe(x, p)) m.push("passt nicht zur Stufe (Zahlenraum, Überträge oder Länge)");
  if (x.r.length > 7) m.push("zu viele Spalten für den Bildschirm");
  return m;
}

/** Hinweis für die Spalte i (Einer = 0), ohne die Ziffer zu nennen. */
function hinweisSpalte(x, i) {
  const c = x.ueber[i];
  const ue = c ? ` und der Übertrag ${c}` : "";
  if (x.art === "+") {
    const teile = x.zahlen.map(z => ziffern(z)[i]).filter(d => d !== undefined);
    if (!teile.length) return "Hier steht keine Ziffer mehr. Was kommt von rechts noch dazu?";
    const summe = teile.reduce((s, d) => s + d, 0) + c;
    return `Rechne ${teile.join(" + ")}${c ? ` + ${c} (Übertrag)` : ""}.` + (summe >= 10 ? " Schreib nur die Einer hin — die Zehner trägst du weiter." : "");
  }
  if (x.art === "−") {
    const oben = ziffern(x.zahlen[0])[i];
    const unten = ziffern(x.zahlen[1])[i];
    if (unten === undefined && !c) return "Unten steht keine Ziffer mehr. Was bleibt oben übrig?";
    const abzug = (unten || 0) + c;
    return `Oben steht ${oben}, unten ${unten === undefined ? "keine Ziffer" : unten}${ue}.` +
      (abzug > oben ? ` Das geht nicht — rechne mit ${10 + oben} und gib 1 weiter.` : " Wie viel fehlt von unten bis oben?");
  }
  const d = ziffern(x.zahlen[0])[i];
  if (d === undefined) return "Hier gibt es nichts mehr zum Malrechnen. Was kommt von rechts noch dazu?";
  return `Rechne ${x.zahlen[1]} × ${d}${c ? ` und zähl den Übertrag ${c} dazu` : ""}.` +
    (d * x.zahlen[1] + c >= 10 ? " Schreib nur die Einer hin — die Zehner trägst du weiter." : "");
}

LS.spiel({
  id: "schriftlich-werkstatt",
  einleitung: "Willkommen in der Werkstatt! Rechne schriftlich: Fang rechts bei den Einern an und arbeite Stelle für Stelle nach links. Den Übertrag schreibe ich dir klein hin.",
  anzahl: 5,
  stufen: {
    s1: "Plus bis 1000, höchstens ein Übertrag: 345 + 231.",
    s2: "Plus und minus bis 1000, mit Überträgen: 478 + 365, 812 − 347.",
    s3: "Plus und minus bis 10 000: 4785 + 2368, 7012 − 3456.",
    s4: "Bis zur Million, auch über Nullen: 40 005 − 2678.",
    s5: "Mal mit einer einstelligen Zahl: 347 × 6, 2809 × 7.",
    s6: "Endgegner: drei Zahlen untereinander, 600 400 − 278 657, 48 357 × 8.",
  },

  aufgabe(ctx) {
    const x = aufgabeErzeugen(ctx.stufe);
    if (STUFE[ctx.stufe].arten.length > 1) ctx.serie("rechenart", x.art);
    const n = x.r.length;
    const mal = x.art === "×";
    // Spalten: [Zeichen] + n Stellen (+ "×" und Faktor rechts bei der Multiplikation)
    const spalten = mal ? n + 2 : n + 1;
    const links = mal ? 0 : 1;
    const rechnung = x.zahlen.map(zahlText).join(` ${x.art} `);
    ctx.loesung(`${rechnung} = ${zahlText(x.ergebnis)}`);
    ctx.schritte(2 * n); // je Spalte eine Ziffer und OK
    const raster = el("div", { class: "werkstatt", role: "group", "aria-label": "Stellenwerttabelle" });
    raster.style.setProperty("--spalten", spalten);

    const zelle = (klasse, text = "") => { const z = el("div", { class: klasse, text }); raster.append(z); return z; };
    const stelle = i => STELLEN_RECHTS[i];
    const leerZellen = k => { for (let j = 0; j < k; j++) zelle(""); };

    // Kopfzeile mit den Stellen (Stellenfarben)
    const koepfe = [];
    leerZellen(links);
    for (let i = n - 1; i >= 0; i--) koepfe[i] = zelle(`kopfzelle st st-${stelle(i).k}`, stelle(i).k);
    if (mal) leerZellen(2);

    // Zahlen untereinander, rechtsbündig; bei × eine Zeile mit „× Faktor“ rechts
    const zahlZeile = (z, zeichen) => {
      const zf = ziffern(z);
      if (!mal) zelle("zeichen", zeichen);
      for (let i = n - 1; i >= 0; i--) zelle(zf[i] === undefined ? "" : `ziffer st st-${stelle(i).k}`, zf[i] === undefined ? "" : String(zf[i]));
      if (mal) { zelle("zeichen", "×"); zelle("zeichen", String(x.zahlen[1])); }
    };
    if (mal) zahlZeile(x.zahlen[0], "");
    else x.zahlen.forEach((z, j) => zahlZeile(z, j === 0 ? "" : x.art));

    // Übertragszeile direkt über dem Strich
    const ueberZellen = [];
    leerZellen(links);
    for (let i = n - 1; i >= 0; i--) ueberZellen[i] = zelle("uebertrag");
    if (mal) leerZellen(2);
    zelle("strich");

    // Ergebniszeile
    const ergZellen = [];
    leerZellen(links);
    for (let i = n - 1; i >= 0; i--) ergZellen[i] = zelle(`erg st st-${stelle(i).k}`);
    if (mal) leerZellen(2);

    const halter = el("div");
    ctx.flaeche.append(
      el("div", { class: "auftrag", text: `Rechne schriftlich: ${rechnung}` }),
      raster,
      el("div", { class: "hinweis-klein", text: "Tipp die Ziffer für das blaue Feld ein und drück OK." }),
      halter);

    let i = 0;            // aktuelle Spalte (0 = Einer)
    const fehlerJe = [];  // Fehlversuche je Spalte

    const spalte = () => {
      koepfe.forEach(k => k.classList.remove("aktiv"));
      koepfe[i].classList.add("aktiv");
      const feld = ergZellen[i];
      feld.classList.add("aktiv", "leer");
      halter.innerHTML = "";
      const tasten = LS.tastatur({
        anzeige: feld, maxStellen: 1,
        onOk(w) {
          if (w === x.r[i]) { LS.ton("tipp"); setzen(tasten, true); return; }
          feld.classList.remove("falsch");
          void feld.offsetWidth;
          feld.classList.add("falsch");
          fehlerJe[i] = (fehlerJe[i] || 0) + 1;
          // Ohne Lösungstext: eine Aufgabe hat viele Spalten, sie soll nicht nach drei Fehlern enden.
          ctx.falsch(hinweisSpalte(x, i));
          // Nach drei Fehlversuchen in derselben Spalte schreibt die Eule die Ziffer hin.
          if (fehlerJe[i] >= 3) setzen(tasten, false);
        },
      });
      halter.append(tasten.element);
    };

    const setzen = (tasten, selbst) => {
      tasten.gesperrt = true;
      const feld = ergZellen[i];
      feld.textContent = String(x.r[i]);
      feld.classList.remove("aktiv", "leer", "falsch");
      feld.classList.add("fertig");
      const c = x.ueber[i + 1];
      if (c && i + 1 < n) ueberZellen[i + 1].append(el("span", { text: String(c) }));
      const geschrieben = selbst ? "" : `Hier gehört die ${x.r[i]} hin. `;
      i++;
      if (i === n) { koepfe.forEach(k => k.classList.remove("aktiv")); ctx.richtig(selbst ? `Fertig gerechnet: ${zahlText(x.ergebnis)}! 🛠️` : undefined); return; }
      ctx.sag(geschrieben + (c ? `Übertrag ${c} — er wandert zu den ${dativ(stelle(i))}.` : `Weiter mit den ${dativ(stelle(i))}.`), selbst ? "gut" : "hinweis");
      spalte();
    };

    spalte();
    if (ctx.nr === 0) ctx.sag("Fang rechts bei den Einern an. Welche Ziffer gehört ins blaue Feld?");
  },
});
</script>
</body>
</html>
