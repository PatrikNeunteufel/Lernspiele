<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabellen-Post</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .zahl-gross {
    font-size: clamp(40px, 9vw, 64px);
    font-weight: 900;
    text-align: center;
    margin: 0 0 12px;
    font-variant-numeric: tabular-nums;
  }

  .zahl-gross .brief { font-size: .7em; vertical-align: middle; margin-right: 10px; }

  .tabelle {
    display: grid;
    grid-template-columns: repeat(var(--spalten), 1fr);
    gap: 6px;
    max-width: 640px;
    margin: 0 auto;
  }

  .tabelle .kopfzelle {
    background: var(--f);
    color: #fff;
    border-radius: 12px 12px 4px 4px;
    text-align: center;
    font-weight: 900;
    font-size: clamp(16px, 3.2vw, 22px);
    padding: 8px 0;
  }

  .tabelle .fach {
    border: 4px solid var(--f);
    background: #fff;
    border-radius: 4px 4px 14px 14px;
    min-height: clamp(58px, 11vw, 78px);
    font-size: clamp(30px, 7vw, 46px);
    font-weight: 900;
    color: var(--f);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
  }

  .tabelle .fach.gewaehlt { box-shadow: 0 0 0 5px rgba(91, 108, 255, .35); transform: translateY(-3px); }
  .tabelle .fach.richtig { background: var(--gut-hell); }
  .tabelle .fach.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .tabelle.nur-lesen .fach { cursor: default; }

  .ziffern {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    max-width: 560px;
    margin: 16px auto 0;
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>📮 Tabellen-Post</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script>
"use strict";
// Lernziel 4.2-G3: Zahlen in der Stellenwerttabelle lesen oder hineinschreiben.
// Abwechselnd: „Einsortieren“ (Zahl → Tabelle) und „Ablesen“ (Tabelle → Zahl).

const { STELLEN, zahlText, zufall, zerlege, el } = LS;

// Je Stufe: Spalten der Tabelle (ab dieser Stelle bis E), Länge der Zahlen, Anteil Nullen mittendrin.
const STUFE = {
  s1: { ab: "Z",  laenge: [2, 2], nullen: 0.1 },
  s2: { ab: "H",  laenge: [2, 3], nullen: 0.25 },
  s3: { ab: "HT", laenge: [4, 6], nullen: 0.15 },
  s4: { ab: "M",  laenge: [5, 6], nullen: 0.4 },
  s5: { ab: "M",  laenge: [6, 7], nullen: 0.45 },
};

function zahlErzeugen(stufe) {
  // Zahlenraum der 4. Klasse endet bei 1 Million; sie kommt in Stufe 4 selten vor.
  if (stufe === "s4" && Math.random() < 0.08) return 1000000;
  const { laenge, nullen } = STUFE[stufe];
  const stellen = zufall(...laenge);
  let s = String(zufall(1, 9));
  for (let i = 1; i < stellen; i++) s += Math.random() < nullen ? "0" : String(zufall(1, 9));
  return Number(s);
}

function spaltenFuer(stufe) {
  return STELLEN.slice(STELLEN.findIndex(st => st.k === STUFE[stufe].ab));
}

function tabelleZeichnen(spalten) {
  const tab = el("div", { class: "tabelle" });
  tab.style.setProperty("--spalten", spalten.length);
  const faecher = {};
  for (const st of spalten) tab.append(el("div", { class: `kopfzelle st st-${st.k}`, text: st.k, title: st.name }));
  for (const st of spalten) {
    faecher[st.k] = el("div", { class: `fach st st-${st.k}`, "aria-label": st.name });
    tab.append(faecher[st.k]);
  }
  return { tab, faecher };
}

function einsortieren(ctx, zahl) {
  const spalten = spaltenFuer(ctx.stufe);
  const soll = zerlege(zahl);
  const ersteStelle = 7 - String(zahl).length; // Index der höchsten Stelle in STELLEN
  ctx.flaeche.append(
    el("div", { class: "auftrag", text: "Sortiere die Zahl in die Tabelle ein!" }),
    el("div", { class: "zahl-gross", html: `<span class="brief">✉️</span>${zahlText(zahl)}` }));

  const { tab, faecher } = tabelleZeichnen(spalten);
  ctx.flaeche.append(tab);

  // Ein Fach wählen, dann Ziffer tippen; danach springt die Auswahl ein Fach nach rechts.
  let gewaehlt = 0;
  const wert = {};
  function waehle(i) {
    gewaehlt = i;
    spalten.forEach((st, j) => faecher[st.k].classList.toggle("gewaehlt", j === i));
  }
  spalten.forEach((st, i) => faecher[st.k].addEventListener("click", () => waehle(i)));
  waehle(0);

  const ziffern = el("div", { class: "ziffern tastatur" });
  let gesperrt = false;
  function setze(z) {
    if (gesperrt) return;
    const st = spalten[gewaehlt];
    wert[st.k] = z;
    faecher[st.k].textContent = z;
    faecher[st.k].classList.remove("richtig", "falsch");
    LS.ton("tipp");
    if (gewaehlt < spalten.length - 1) waehle(gewaehlt + 1);
  }
  function leere() {
    if (gesperrt) return;
    const st = spalten[gewaehlt];
    delete wert[st.k];
    faecher[st.k].textContent = "";
  }
  for (const z of ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]) {
    ziffern.append(el("button", { type: "button", text: z, onclick: () => setze(z) }));
  }
  ziffern.append(el("button", { type: "button", class: "loeschen", text: "⌫", "aria-label": "Fach leeren", onclick: leere }));
  ziffern.append(el("button", { type: "button", class: "loeschen", text: "◀", "aria-label": "Fach nach links", onclick: () => waehle(Math.max(0, gewaehlt - 1)) }));
  ziffern.append(el("button", {
    type: "button", class: "ok", text: "OK ✓", onclick: () => {
      if (gesperrt) return;
      // Leere Fächer vor der höchsten Stelle sind richtig; danach braucht es Ziffern (auch Nullen).
      let fehlerStelle = null;
      spalten.forEach(st => {
        const i = STELLEN.indexOf(st);
        const erwartet = i < ersteStelle ? undefined : String(soll[st.k]);
        const ok = wert[st.k] === erwartet;
        faecher[st.k].classList.toggle("richtig", ok && wert[st.k] !== undefined);
        faecher[st.k].classList.toggle("falsch", !ok);
        if (!ok && !fehlerStelle) fehlerStelle = { st, erwartet };
      });
      if (!fehlerStelle) { gesperrt = true; ctx.richtig(); return; }
      const { st, erwartet } = fehlerStelle;
      const hinweis = erwartet === undefined
        ? `Vor der ersten Ziffer bleiben die Fächer leer. Schau bei ${st.k}.`
        : wert[st.k] === undefined
          ? `Bei den ${LS.dativ(st)} (${st.k}) fehlt noch etwas — auch eine Null zählt!`
          : `Schau nochmal bei den ${LS.dativ(st)} (${st.k}). Lies die Zahl von hinten: E, Z, H, …`;
      ctx.falsch(hinweis, `${zahlText(zahl)} → ` + spalten.filter(s => STELLEN.indexOf(s) >= ersteStelle).map(s => `${soll[s.k]} ${s.k}`).join(", "));
      if (ctx.flaeche.querySelector(".knopfzeile")) gesperrt = true;
    },
  }));
  ctx.flaeche.append(ziffern);
  ctx.sag(ctx.nr === 0 ? "Tipp auf ein Fach und dann auf eine Ziffer. Es geht automatisch ein Fach weiter." : "Wohin gehören die Ziffern?");
}

function ablesen(ctx, zahl) {
  const spalten = spaltenFuer(ctx.stufe);
  const soll = zerlege(zahl);
  const ersteStelle = 7 - String(zahl).length;
  ctx.flaeche.append(el("div", { class: "auftrag", text: "Welche Zahl steht in der Tabelle?" }));
  const { tab, faecher } = tabelleZeichnen(spalten);
  tab.classList.add("nur-lesen");
  for (const st of spalten) if (STELLEN.indexOf(st) >= ersteStelle) faecher[st.k].textContent = soll[st.k];
  ctx.flaeche.append(tab);

  const anzeige = el("div", { class: "anzeige leer", style: "margin-top:16px", "aria-label": "Deine Zahl" });
  ctx.flaeche.append(anzeige);
  const tasten = LS.tastatur({
    anzeige,
    maxStellen: 7,
    onOk(w) {
      if (w === zahl) { anzeige.classList.add("richtig"); tasten.gesperrt = true; ctx.richtig(); return; }
      anzeige.classList.add("falsch");
      const hinweis = String(w).length !== String(zahl).length
        ? "Zähl die Ziffern in der Tabelle — deine Zahl hat eine andere Länge. Nullen nicht vergessen!"
        : "Fast! Lies Fach für Fach von links nach rechts.";
      ctx.falsch(hinweis, `In der Tabelle steht ${zahlText(zahl)}.`);
      if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
    },
  });
  ctx.flaeche.append(tasten.element);
  ctx.sag(ctx.nr === 1 ? "Jetzt umgekehrt: Lies die Tabelle und tipp die Zahl ein." : "Lies die Tabelle!");
}

LS.spiel({
  id: "tabellen-post",
  einleitung: "Hallo, hier ist Eule Zahlina mit der Zahlen-Post! Jede Ziffer muss ins richtige Fach der Stellenwerttabelle. Manchmal musst du auch eine Zahl aus der Tabelle ablesen.",
  anzahl: 8,
  stufen: {
    s1: "Kleine Tabelle mit Z und E — Zahlen bis 100.",
    s2: "Tabelle mit H, Z und E — Zahlen bis 1000, manchmal mit Nullen.",
    s3: "Zahlen bis 999 999, wenige Nullen.",
    s4: "Ganze Tabelle bis zur Million, viele Nullen.",
    s5: "Siebenstellige Zahlen mit vielen Nullen.",
  },
  aufgabe(ctx) {
    const zahl = zahlErzeugen(ctx.stufe);
    if (ctx.nr % 2 === 0) einsortieren(ctx, zahl);
    else ablesen(ctx, zahl);
  },
});
</script>
</body>
</html>
