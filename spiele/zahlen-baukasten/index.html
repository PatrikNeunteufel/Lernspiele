<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlen-Baukasten</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .bausteine {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .baustein {
    border: none;
    cursor: pointer;
    background: var(--f);
    color: #fff;
    border-radius: 18px;
    padding: 12px 22px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 900;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .18);
    min-width: 120px;
    line-height: 1.1;
    transition: transform .15s;
  }

  .baustein:hover { transform: translateY(-2px) rotate(-1deg); }
  .baustein small { display: block; font-size: 15px; font-weight: 700; opacity: .95; margin-top: 4px; min-height: 18px; }
  .baustein.lang { font-size: clamp(20px, 4vw, 26px); }
  .plus { font-size: 34px; font-weight: 900; color: var(--text-leise); }

  /* Kleine Stellenwerttabelle, die beim Tippen mitläuft */
  .mini-tabelle {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    max-width: 560px;
    margin: 12px auto 0;
  }

  .mini-tabelle div {
    text-align: center;
    border-radius: 10px;
    padding: 4px 0;
    font-weight: 900;
  }

  .mini-tabelle .k { background: var(--f); color: #fff; font-size: 16px; }
  .mini-tabelle .z { background: #f4f6fc; font-size: 26px; min-height: 42px; color: var(--f); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧱 Zahlen-Baukasten</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script>
"use strict";
// Lernziel 4.2-G2: Abkürzungen und Werte der Wertziffern kennen und eine Zahl
// aus Teilen zusammensetzen (z. B. 3 ZT und 4 H = 30 400).

const { STELLEN, zahlText, zufall, mische, zerlege, el } = LS;
const nurStellen = (...k) => STELLEN.filter(s => k.includes(s.k));

// Je Stufe: erlaubte Stellen, Anzahl Bausteine, Anteil ausgeschriebener Namen.
// Ob die Bausteine geordnet (grösste Stelle links) stehen, bestimmt die Einstellung im Profil (ctx.geordnet).
const STUFE = {
  s1: { stellen: nurStellen("Z", "E"), teile: [1, 2], ausgeschrieben: 0 },
  s2: { stellen: nurStellen("H", "Z", "E"), teile: [2, 3], ausgeschrieben: 0 },
  s3: { stellen: STELLEN.slice(1), teile: [2, 3], ausgeschrieben: 0 },
  s4: { stellen: STELLEN.slice(1), teile: [3, 4], ausgeschrieben: 0.4 },
  s5: { stellen: STELLEN, teile: [4, 5], ausgeschrieben: 0.5 },
};

function aufgabeErzeugen(stufe, geordnet) {
  const p = STUFE[stufe];
  // Erweitert: selten genau eine Million (Zahlenraum der 4. Klasse endet dort).
  if (stufe === "s4" && Math.random() < 0.08) return { teile: [{ st: STELLEN[0], ziffer: 1 }], ausgeschrieben: false };
  const teile = mische(p.stellen).slice(0, zufall(...p.teile)).map(st => ({ st, ziffer: zufall(1, 9) }));
  if (geordnet) teile.sort((a, b) => b.st.wert - a.st.wert);
  return { teile, ausgeschrieben: Math.random() < p.ausgeschrieben };
}

LS.spiel({
  id: "zahlen-baukasten",
  einleitung: "Hallo! Ich bin Eule Zahlina. Setz die Bausteine zu einer Zahl zusammen. Tipp auf einen Baustein, dann verrate ich dir, wie viel er wert ist.",
  anzahl: 8,
  stufen: {
    s1: "Zehner und Einer: 3 Z + 4 E",
    s2: "Mit Hundertern — Achtung, leere Stellen: 4 H + 2 E",
    s3: "2 bis 3 Bausteine bis zu den HT: 3 ZT + 4 H",
    s4: "3 bis 4 Bausteine, manchmal ausgeschrieben.",
    s5: "Bis zu den Millionen, 4 bis 5 Bausteine.",
  },

  aufgabe(ctx) {
    const { teile, ausgeschrieben } = aufgabeErzeugen(ctx.stufe, ctx.geordnet);
    const loesung = teile.reduce((s, t) => s + t.ziffer * t.st.wert, 0);

    ctx.flaeche.append(el("div", { class: "auftrag", text: "Welche Zahl bauen diese Bausteine?" }));

    const reihe = el("div", { class: "bausteine" });
    teile.forEach((t, i) => {
      if (i > 0) reihe.append(el("span", { class: "plus", text: "+" }));
      const info = el("small", { text: "" });
      const knopf = el("button", {
        type: "button",
        class: `baustein st st-${t.st.k}` + (ausgeschrieben ? " lang" : ""),
        onclick: () => {
          info.textContent = `1 ${t.st.k} = ${zahlText(t.st.wert)}`;
          ctx.sag(`${t.st.k} heisst ${t.st.name}. Ein ${t.st.k} ist ${zahlText(t.st.wert)} wert.`);
        },
      }, `${t.ziffer} ${!ausgeschrieben ? t.st.k : t.st.k === "M" && t.ziffer === 1 ? "Million" : t.st.name}`, info);
      reihe.append(knopf);
    });
    ctx.flaeche.append(reihe);

    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Deine Zahl" });
    ctx.flaeche.append(anzeige);

    // Mini-Tabelle zeigt, in welcher Stelle jede getippte Ziffer landet.
    const mini = el("div", { class: "mini-tabelle", "aria-hidden": "true" });
    const zellen = {};
    for (const st of STELLEN) mini.append(el("div", { class: `k st st-${st.k}`, text: st.k }));
    for (const st of STELLEN) { zellen[st.k] = el("div", { class: `z st st-${st.k}` }); mini.append(zellen[st.k]); }
    ctx.flaeche.append(mini);

    function miniZeigen(wert) {
      const stellenZahl = wert === null ? 0 : String(wert).length;
      STELLEN.forEach((st, i) => {
        const sichtbar = wert !== null && 7 - i <= stellenZahl;
        zellen[st.k].textContent = sichtbar ? zerlege(wert)[st.k] : "";
      });
    }

    const tasten = LS.tastatur({
      anzeige,
      maxStellen: 7,
      onAenderung: miniZeigen,
      onOk(wert) {
        if (wert === loesung) {
          anzeige.classList.add("richtig");
          tasten.gesperrt = true;
          ctx.richtig();
          return;
        }
        anzeige.classList.add("falsch");
        const soll = zerlege(loesung), ist = zerlege(wert);
        const falscheStelle = STELLEN.find(st => soll[st.k] !== ist[st.k]);
        let hinweis;
        if (String(wert).length < String(loesung).length) hinweis = "Deine Zahl ist zu kurz. Denk an die Nullen bei den leeren Stellen!";
        else if (String(wert).length > String(loesung).length) hinweis = "Deine Zahl hat zu viele Stellen. Welches ist der grösste Baustein?";
        else hinweis = `Schau nochmal bei den ${LS.dativ(falscheStelle)} (${falscheStelle.k}).`;
        ctx.falsch(hinweis, `${teile.map(t => `${t.ziffer} ${t.st.k}`).join(" + ")} = ${zahlText(loesung)}`);
        if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
      },
    });
    ctx.flaeche.append(tasten.element);
    miniZeigen(null);
    ctx.sag(ctx.nr === 0 ? "Tipp die Zahl ein und drück OK." : "Und die nächste!");
  },
});
</script>
</body>
</html>
