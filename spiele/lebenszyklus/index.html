<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebenszyklus-Puzzle</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🐛 Lebenszyklus-Puzzle</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="zyklen.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.2.3: b (Grundanspruch 1. Zyklus) Wachstum und Entwicklung beobachten (Raupe über
// Puppe zum Schmetterling; Blüten und Früchte); c Fortbestand bei Tieren: Entwicklung im Ei, im
// Beutel, im Tierleib; d Bestäubung, Keimung; f (Grundanspruch 2. Zyklus) Entwicklung der
// Amphibien von der Kaulquappe zum Frosch, von der Kiemen- zur Lungenatmung.

const { waehle, mische, el } = LS;
// „ab Stufe“ in zyklen.js = Nummer der Spielstufe; je Stufe die Zyklen der letzten drei Stufen.
const ID = "lebenszyklus";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : ZYKLUS_LISTEN);
const ZYKLEN_FREI = ZYKLEN.filter(z => FREI.has(z[3]));
const GEBURT_FREI = FREI.has("geburt") ? GEBURT : [];
const FRAGEN_FREI = FREI.has("fragen") ? ZYKLUS_FRAGEN : [];

const zyklen = n => ZYKLEN_FREI.filter(z => z[0] <= n && z[0] >= n - 2).map(([, name, stadien]) => ({ name, stadien }));
const GEBURT_TEXT = { Ei: { bild: "🥚", text: "aus dem Ei" }, Beutel: { bild: "👜", text: "im Beutel" }, lebend: { bild: "🍼", text: "lebend geboren" } };

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  ordnen(n, mindestens = 0) {
    const z = waehle(zyklen(n).filter(x => x.stadien.length >= mindestens));
    return z ? { art: "ordnen", z } : null;
  },
  geburt() {
    if (!GEBURT_FREI.length) return null;
    const [bild, tier, richtig] = waehle(GEBURT_FREI);
    return { art: "geburt", bild, tier, richtig };
  },
  naechstes(n) {
    // Was kommt nach …? (nicht das letzte Stadium)
    const z = waehle(zyklen(n).filter(x => x.stadien.length >= 4));
    if (!z) return null;
    const i = Math.floor(Math.random() * (z.stadien.length - 1));
    const vor = z.stadien[i][1];
    const richtig = z.stadien[i + 1][1];
    const andere = mische(z.stadien.map(s => s[1]).filter(s => s !== vor && s !== richtig)).slice(0, 2);
    return { art: "naechstes", z, vor, richtig, optionen: mische([richtig, ...andere]) };
  },
  frage() {
    if (!FRAGEN_FREI.length) return null;
    const [frage, richtig, f1, f2] = waehle(FRAGEN_FREI);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [() => ARTEN.ordnen(1)],
  s2: [() => ARTEN.ordnen(2)],
  s3: [ARTEN.geburt, () => ARTEN.ordnen(3)],
  s4: [() => ARTEN.ordnen(4), () => ARTEN.naechstes(4), ARTEN.geburt],
  s5: [ARTEN.frage, () => ARTEN.naechstes(5), () => ARTEN.ordnen(5)],
  // Königsstufe: Wissensfragen und fünfstufige Zyklen
  s6: [ARTEN.frage, () => ARTEN.ordnen(6, 5), () => ARTEN.ordnen(6, 5), () => ARTEN.naechstes(6)],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Ei → Küken → Huhn: drei Bilder ordnen.",
  s2: "Vier Stufen: Mensch, Sonnenblume, Schmetterling.",
  s3: "Aus dem Ei, im Beutel oder lebend geboren?",
  s4: "Frosch, Marienkäfer, Biene, Apfelbaum.",
  s5: "Kiemen oder Lunge? Bestäubung und Keimung.",
  s6: "Fünf Stufen ordnen und knifflige Wissensfragen.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
/** Stufen, in denen die freien Listen mehr als eine Art hergeben (für ctx.serie). */
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));
const MEHRERE_GEBURTEN = new Set(GEBURT_FREI.map(g => g[2])).size > 1;

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (zyklen.js). */
function herkunft(a) {
  if (a.z) {
    const zeile = ZYKLEN.find(z => z[1] === a.z.name && z[2].map(s => s[1]).join() === a.z.stadien.map(s => s[1]).join());
    return [zeile ? zeile[3] : "?"];
  }
  if (a.art === "geburt") return [GEBURT.some(g => g[1] === a.tier && g[2] === a.richtig) ? "geburt" : "?"];
  return [ZYKLUS_FRAGEN.some(f => f[0] === a.frage) ? "fragen" : "?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.optionen && (!a.optionen.includes(a.richtig) || new Set(a.optionen).size !== a.optionen.length)) m.push("Auswahl doppelt oder ohne Lösung");
  if ((stufe === "s1" || stufe === "s2") && a.z && a.z.stadien.some(s => !s[0])) m.push("Stadium ohne Bild in Stufe 1–2");
  return m;
}

const stadiumInhalt = ([bild, text]) => ({ bild: bild || "", text });

LS.spiel({
  id: "lebenszyklus",
  einleitung: "Aus dem Ei wird ein Küken, aus der Raupe ein Schmetterling. Bringst du alles in die richtige Reihenfolge?",
  anzahl: 6,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
    if (a.art === "geburt" && MEHRERE_GEBURTEN) ctx.serie("antwort", a.richtig);
    if (a.art === "ordnen") {
      ctx.flaeche.append(el("div", { class: "frage", text: `${a.z.name}: Was kommt zuerst? Tipp der Reihe nach.` }));
      LS.reihenfolge(ctx, {
        reihe: a.z.stadien, breite: 130, pfeile: true,
        inhalt: stadiumInhalt, ablage: ([bild, text]) => (bild ? `${bild} ${text}` : text),
        hinweis: "Was ist zuerst da — und was wird daraus? Denk daran, wie es wächst.",
        loesung: a.z.stadien.map(s => s[1]).join(" → "),
        lob: `Richtig! ${a.z.stadien.map(s => s[1]).join(" → ")}`,
      });
    } else if (a.art === "geburt") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Wie kommen die Jungen zur Welt?" }));
      LS.koerbe(ctx, {
        karte: { bild: a.bild, text: a.tier }, koerbe: ["Ei", "Beutel", "lebend"], richtig: a.richtig,
        korbInhalt: k => GEBURT_TEXT[k],
        hinweis: "Denk nach: Die meisten Säugetiere werden lebend geboren. Vögel, Reptilien, Fische und Frösche schlüpfen aus dem Ei. Junge Beuteltiere wachsen im Beutel auf.",
        loesung: `${a.tier}: ${GEBURT_TEXT[a.richtig].text}.`, lob: `Richtig: ${a.tier} — ${GEBURT_TEXT[a.richtig].text}.`,
      });
    } else if (a.art === "naechstes") {
      ctx.flaeche.append(el("div", { class: "frage", text: `${a.z.name}: Was kommt nach «${a.vor}»?` }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 160,
        hinweis: "Denk an die ganze Reihe vom Anfang bis zum Ende.", loesung: a.z.stadien.map(s => s[1]).join(" → ") });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 180, hinweis: "Denk an das, was du über Pflanzen und Tiere weisst.", loesung: `${a.frage} ${a.richtig.replace(/\.$/, "")}.` });
    }
    if (ctx.nr === 0) ctx.sag("Was ist zuerst da?");
  },
});
</script>
</body>
</html>
