<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tier-Sortierer</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .tierkarte {
    margin: 6px auto 18px;
    width: fit-content;
    max-width: 100%;
    background: #fff;
    border: 4px solid var(--rand);
    border-radius: 20px;
    padding: 10px 28px;
    text-align: center;
    box-shadow: var(--schatten);
  }
  .tierkarte .bild { font-size: clamp(60px, 14vw, 90px); line-height: 1.1; display: block; }
  .tierkarte b { font-size: clamp(24px, 5.6vw, 36px); font-weight: 900; }

  .koerbe { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 12px; max-width: 720px; margin: 0 auto; }
  .korb {
    border: none;
    border-radius: 20px 20px 28px 28px;
    padding: 12px 8px 10px;
    min-height: 92px;
    cursor: pointer;
    color: #fff;
    background: var(--k);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .2);
    font-family: inherit;
    font-size: clamp(18px, 3.8vw, 22px);
    font-weight: 900;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .korb:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
  .korb small { font-size: 14px; font-weight: 700; opacity: .9; }
  .korb.falsch { animation: wackeln .4s; }
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 14px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🐾 Tier-Sortierer</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="tiere.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.2.4 (Artenvielfalt kategorisieren): a Tiergruppen auf Eigenschaften untersuchen
// („Vögel haben ein Gefieder, Reptilien eine Haut aus Hornschuppen“), b Wildtiere/Nutztiere/
// Heimtiere zuordnen (Grundanspruch 1. Zyklus), e Tiere Ordnungssystemen zuordnen und die
// Kriterien begründen (Grundanspruch 2. Zyklus). Die Tiere stehen in tiere.js.

const { waehle, mische, el } = LS;

const LEBEWESEN = TIERE.map(([name, bild, klasse, gruppe, haltung, lebensraum]) => ({ name, bild, klasse, gruppe, haltung, lebensraum }));
const TIER = LEBEWESEN.filter(t => !["Pflanze", "Pilz"].includes(t.klasse));
const tier = name => TIER.find(t => t.name === name);

// Je Merkmal: Korbname, kurzer Zusatz im Korb, Erklärung. Die Farben sind Deko, keine Stellenfarben.
const KOERBE = {
  Wildtier: { bild: "🌳", zusatz: "lebt frei", erklaerung: "Wildtiere leben frei in der Natur. Niemand füttert sie." },
  Nutztier: { bild: "🚜", zusatz: "gibt uns etwas", erklaerung: "Nutztiere hält der Mensch, weil sie ihm etwas geben: Milch, Eier, Wolle oder Fleisch." },
  Heimtier: { bild: "🏠", zusatz: "lebt bei uns", erklaerung: "Heimtiere leben bei uns zu Hause. Wir kümmern uns um sie." },
  Säugetier: { bild: "🍼", zusatz: "Fell, Milch", erklaerung: "Säugetiere haben ein Fell oder Haare, und die Jungen trinken Milch bei der Mutter." },
  Vogel: { bild: "🪶", zusatz: "Federn", erklaerung: "Vögel haben Federn und einen Schnabel und legen Eier." },
  Fisch: { bild: "🫧", zusatz: "Kiemen", erklaerung: "Fische leben im Wasser, atmen mit Kiemen und haben meist Schuppen." },
  Reptil: { bild: "🛡️", zusatz: "Hornschuppen", erklaerung: "Reptilien haben eine trockene Haut aus Hornschuppen. Die meisten legen Eier an Land." },
  Amphibie: { bild: "💧", zusatz: "feuchte Haut", erklaerung: "Amphibien haben eine feuchte, nackte Haut. Ihre Jungen leben meist zuerst im Wasser (Kaulquappen)." },
  Insekt: { bild: "6️⃣", zusatz: "sechs Beine", erklaerung: "Insekten haben sechs Beine, und ihr Körper hat drei Teile: Kopf, Brust und Hinterleib." },
  Spinnentier: { bild: "8️⃣", zusatz: "acht Beine", erklaerung: "Spinnen haben acht Beine — darum sind sie keine Insekten." },
  Weichtier: { bild: "🐚", zusatz: "weicher Körper", erklaerung: "Schnecken haben einen weichen Körper ohne Knochen und ohne Beine. Sie sind Weichtiere, keine Insekten." },
  Wurm: { bild: "〰️", zusatz: "ohne Beine", erklaerung: "Regenwürmer haben keine Beine und einen Körper aus vielen Ringen. Sie sind Würmer, keine Insekten." },
  Nagetier: { bild: "🦷", zusatz: "Nagezähne", erklaerung: "Nagetiere haben vorne grosse Nagezähne, die immer nachwachsen." },
  Hasenartige: { bild: "👂", zusatz: "Stiftzähne", erklaerung: "Hasen und Kaninchen sind keine Nagetiere: Hinter ihren oberen Nagezähnen haben sie noch zwei kleine Stiftzähne." },
  Raubtier: { bild: "🥩", zusatz: "Fangzähne", erklaerung: "Raubtiere haben grosse Eckzähne (Fangzähne). Viele von ihnen fressen Fleisch." },
  Insektenfresser: { bild: "🐛", zusatz: "spitze Zähnchen", erklaerung: "Igel, Maulwurf und Spitzmaus haben viele kleine, spitze Zähne. Sie fressen vor allem Insekten, Würmer und Schnecken." },
  Fledertier: { bild: "🌙", zusatz: "fliegt", erklaerung: "Fledermäuse sind die einzigen Säugetiere, die richtig fliegen können. Mäuse sind sie nicht." },
  Paarhufer: { bild: "✌️", zusatz: "zwei Hufe", erklaerung: "Paarhufer stehen an jedem Fuss auf zwei Hufen (Zehen), zum Beispiel Reh, Kuh und Wildschwein." },
  Unpaarhufer: { bild: "☝️", zusatz: "ein Huf", erklaerung: "Pferd, Esel und Zebra stehen an jedem Fuss auf einem einzigen Huf." },
  Wal: { bild: "🌊", zusatz: "im Meer", erklaerung: "Wale und Delfine leben im Meer, sind aber Säugetiere: Sie atmen Luft und säugen ihre Jungen." },
};
const FARBEN = ["var(--deko-6)", "var(--deko-3)", "var(--deko-5)", "var(--deko-2)", "var(--deko-1)", "var(--deko-4)"];

const HALTUNGEN = ["Wildtier", "Nutztier", "Heimtier"];
const WIRBELTIERE = ["Säugetier", "Vogel", "Fisch", "Reptil", "Amphibie"];
const KLASSEN = [...WIRBELTIERE, "Insekt"];
const GRUPPEN = ["Nagetier", "Hasenartige", "Raubtier", "Insektenfresser", "Fledertier", "Paarhufer", "Unpaarhufer", "Wal"];

// Knifflige Tiere für Stufe 5: richtige Gruppe und die naheliegende falsche.
const KNIFFLIG = [
  ["Fledermaus", "klasse", "Vogel"], ["Wal", "klasse", "Fisch"], ["Delfin", "klasse", "Fisch"],
  ["Pinguin", "klasse", "Fisch"], ["Blindschleiche", "klasse", "Amphibie"], ["Bergmolch", "klasse", "Reptil"],
  ["Feuersalamander", "klasse", "Reptil"], ["Kreuzspinne", "klasse", "Insekt"], ["Weinbergschnecke", "klasse", "Insekt"],
  ["Regenwurm", "klasse", "Insekt"], ["Feldhase", "gruppe", "Nagetier"], ["Kaninchen", "gruppe", "Nagetier"],
  ["Spitzmaus", "gruppe", "Nagetier"], ["Fledermaus", "gruppe", "Nagetier"], ["Igel", "gruppe", "Nagetier"],
];

function sortieren(merkmal, auswahlKoerbe, anzahlKoerbe, mitBild) {
  const t = waehle(TIER.filter(x => auswahlKoerbe.includes(x[merkmal]) && (!mitBild || x.bild)));
  const andere = mische(auswahlKoerbe.filter(k => k !== t[merkmal])).slice(0, anzahlKoerbe - 1);
  return { art: "sortieren", tier: t, richtig: t[merkmal], koerbe: mische([t[merkmal], ...andere]) };
}

const ARTEN = {
  haltung: () => sortieren("haltung", HALTUNGEN, 3, true),
  wirbeltier: mitBild => sortieren("klasse", WIRBELTIERE, 5, mitBild),
  klasse: () => sortieren("klasse", KLASSEN, 6, false),
  gruppe: () => sortieren("gruppe", GRUPPEN, 4, false),
  merkmal() {
    // Welches Tier gehört zu …? Die anderen Tiere sind aus anderen Klassen.
    const klasse = waehle(KLASSEN);
    const richtig = waehle(TIER.filter(t => t.klasse === klasse));
    const andere = mische(KLASSEN.filter(k => k !== klasse)).slice(0, 3).map(k => waehle(TIER.filter(t => t.klasse === k)));
    return { art: "merkmal", klasse, richtig, optionen: mische([richtig, ...andere]) };
  },
  knifflig() {
    const [name, merkmal, falle] = waehle(KNIFFLIG);
    const t = tier(name);
    const liste = merkmal === "klasse" ? [...KLASSEN, "Spinnentier", "Weichtier", "Wurm"] : GRUPPEN;
    const dritte = waehle(liste.filter(k => k !== t[merkmal] && k !== falle));
    return { art: "sortieren", tier: t, richtig: t[merkmal], falle, koerbe: mische([t[merkmal], falle, dritte]) };
  },
};

const STUFE = {
  s1: () => ARTEN.haltung(),
  s2: () => waehle([ARTEN.haltung, () => ARTEN.wirbeltier(true)])(),
  s3: () => waehle([() => ARTEN.wirbeltier(false), ARTEN.klasse, ARTEN.merkmal])(),
  s4: () => waehle([ARTEN.gruppe, ARTEN.gruppe, ARTEN.merkmal])(),
  s5: () => waehle([ARTEN.knifflig, ARTEN.knifflig, ARTEN.gruppe])(),
};

function aufgabeErzeugen(stufe) { return STUFE[stufe](); }

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  if (a.art === "sortieren") {
    if (!a.koerbe.includes(a.richtig)) m.push("richtiger Korb fehlt");
    if (new Set(a.koerbe).size !== a.koerbe.length) m.push("Korb doppelt");
    if (a.koerbe.some(k => !KOERBE[k])) m.push("Korb ohne Erklärung");
    if ((stufe === "s1" || stufe === "s2") && !a.tier.bild) m.push("Tier ohne Bild in Stufe 1–2");
    if (a.falle && a.falle === a.richtig) m.push("Falle ist die Lösung");
  } else {
    if (a.optionen.filter(t => t.klasse === a.klasse).length !== 1) m.push("nicht genau ein Tier der gesuchten Klasse");
  }
  return m;
}

// Klassen im Satz: „ein Säugetier“, „zu den Säugetieren“
const KLASSE_TEXT = {
  Säugetier: ["ein Säugetier", "Säugetieren"], Vogel: ["ein Vogel", "Vögeln"], Fisch: ["ein Fisch", "Fischen"],
  Reptil: ["ein Reptil", "Reptilien"], Amphibie: ["eine Amphibie", "Amphibien"], Insekt: ["ein Insekt", "Insekten"],
};

LS.spiel({
  id: "tier-sortierer",
  einleitung: "Jedes Tier gehört in eine Gruppe. Schau genau: Hat es Fell, Federn oder Schuppen? Wie viele Beine?",
  anzahl: 10,
  stufen: {
    s1: "Wildtier, Nutztier oder Heimtier?",
    s2: "Säugetier, Vogel, Fisch, Reptil oder Amphibie?",
    s3: "Dazu Insekten — und welches Tier passt zu welcher Gruppe?",
    s4: "Säugetiere genauer: Nagetier, Raubtier, Paarhufer und mehr.",
    s5: "Knifflig: Fledermaus, Wal, Spinne, Hase …",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (a.art === "merkmal") {
      ctx.flaeche.append(el("div", { class: "frage", text: `Welches Tier gehört zu den ${KLASSE_TEXT[a.klasse][1]}?` }),
        el("div", { class: "auftrag leise", text: KOERBE[a.klasse].erklaerung }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 140,
        inhalt: t => ({ bild: t.bild || "", text: t.name }),
        hinweis: t => `${t.name} ist ${KLASSE_TEXT[t.klasse][0]}. ${KOERBE[t.klasse].erklaerung}`,
        loesung: `${a.richtig.name} gehört dazu.`,
      });
      if (ctx.nr === 0) ctx.sag("Lies das Merkmal und tipp auf das passende Tier.");
      return;
    }

    const karte = el("div", { class: "tierkarte" }, el("span", { class: "bild", text: a.tier.bild || "❔" }), el("b", { text: a.tier.name }));
    ctx.flaeche.append(el("div", { class: "auftrag", text: "In welchen Korb gehört das Tier?" }), karte);
    const koerbe = el("div", { class: "koerbe" });
    let fertig = false;
    a.koerbe.forEach((name, i) => {
      const info = KOERBE[name];
      const korb = el("button", { type: "button", class: "korb" }, el("span", { text: info.bild }), name, el("small", { text: info.zusatz }));
      korb.style.setProperty("--k", FARBEN[i % FARBEN.length]);
      korb.addEventListener("click", () => {
        if (fertig) return;
        if (name === a.richtig) {
          fertig = true;
          LS.fliegen(karte, korb);
          ctx.richtig(`Richtig! ${KOERBE[name].erklaerung}`);
          return;
        }
        korb.classList.remove("falsch"); void korb.offsetWidth; korb.classList.add("falsch");
        const warum = a.falle === name ? `Das denken viele! Aber: ${KOERBE[a.richtig].erklaerung}` : `${KOERBE[name].erklaerung} Passt das zu ${a.tier.name}?`;
        ctx.falsch(warum, `${a.tier.name}: ${a.richtig}. ${KOERBE[a.richtig].erklaerung}`);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      koerbe.append(korb);
    });
    ctx.flaeche.append(koerbe);
    if (ctx.nr === 0) ctx.sag("Schau das Tier an und tipp auf den richtigen Korb.");
  },
});
</script>
</body>
</html>
