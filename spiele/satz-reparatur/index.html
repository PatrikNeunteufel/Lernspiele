<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satz-Reparatur</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .satz { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 8px 0 18px; }
  .wort {
    border: none; border-radius: 12px; padding: 8px 12px; min-height: 52px;
    font-family: inherit; font-size: clamp(22px, 5vw, 32px); font-weight: 800;
    background: #fff; color: var(--text); box-shadow: 0 4px 0 var(--rand); cursor: pointer;
  }
  .wort.gross { background: #eef0ff; color: var(--knopf); }
  .wort .erster { display: inline-block; min-width: .6em; text-align: center; }
  .wort.gross .erster { text-decoration: underline 3px; text-underline-offset: 4px; }
  .wort.fehler { box-shadow: 0 0 0 3px var(--hinweis); }
  .zeichen {
    border: 3px dashed #c5c9de; border-radius: 10px; width: 46px; height: 52px;
    font-family: inherit; font-size: 34px; font-weight: 900; background: #fbfcff; color: var(--knopf); cursor: pointer;
  }
  .zeichen.gesetzt { border-style: solid; border-color: var(--knopf); }
  .zeichen.fehler { border-color: var(--hinweis); }
  .tipp-zeile { text-align: center; color: var(--text-leise); font-size: 15px; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🔧 Satz-Reparatur</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="saetze.js"></script>
<script>
"use strict";
// Lehrplan SG D.4.F.1: a Satzanfang gross, Eigennamen und konkrete Nomen gross, Punkt am Satzende;
// b abstrakte Nomen gross, Satzschlusszeichen. Die Sätze stehen richtig in saetze.js;
// gezeigt werden sie klein und ohne Schlusszeichen.

const { waehle, el } = LS;
const ZEICHEN = ["", ".", "!", "?"];

/**
 * "Wo ist mein Buch? Ich finde es nicht." → Wörter mit Soll-Schreibung und Satzende-Zeichen.
 * 'erlaubt': richtige Satzzeichen am Satzende — bei Aussagen mit Nachdruck (AUCH_PUNKT) auch der Punkt.
 */
function zerlege(satz) {
  let satzAnfang = 0;
  const woerter = satz.split(" ");
  return woerter.map((t, i) => {
    const m = t.match(/^(.+?)([.!?]?)$/);
    const ende = m[2] || null;
    let erlaubt = null;
    if (ende) {
      const teilsatz = woerter.slice(satzAnfang, i + 1).join(" ");
      erlaubt = ende === "!" && AUCH_PUNKT.includes(teilsatz) ? ["!", "."] : [ende];
      satzAnfang = i + 1;
    }
    return { soll: m[1], ende, erlaubt };
  });
}

// ---------- Freigabe (Entscheid L4 a) ----------
// Kinder üben nur Sätze aus freien Listen (LS.freieListen; die Aufsicht sieht alle). Kennt der
// Katalog die Listen dieses Spiels noch nicht, gilt alles als frei — wie bei einem Spiel ohne Listen.
const SPIEL_ID = "satz-reparatur";
const FREI = new Set(LS.spielListen(SPIEL_ID).length ? LS.freieListen(SPIEL_ID) : Object.values(SAETZE_LISTEN));
/** Sätze einer Gruppe (s1 … s5), leer, wenn ihre Liste nicht frei ist. */
const frei = gruppe => (FREI.has(SAETZE_LISTEN[gruppe]) ? SAETZE[gruppe] : []);
const KOENIG_EINZEL = [...frei("s3"), ...frei("s4")];
/** Angebotene Stufen: s1–s5 mit freier eigener Liste, s6 mit Satzpaaren und einem Einzelsatz. */
const ANGEBOTEN = new Set([...["s1", "s2", "s3", "s4", "s5"].filter(s => frei(s).length),
  ...(frei("s5").length && KOENIG_EINZEL.length ? ["s6"] : [])]);

const satzende = satz => (satz.match(/[.!?]/g) || []).join("");
/** Stufen mit Einzelsätzen und verschiedenen Satzzeichen: Dort ist das Zeichen ein Merkmal (ctx.serie). */
const ZEICHEN_WECHSELT = new Set(["s1", "s2", "s3", "s4"].filter(s => new Set(frei(s).map(satzende)).size > 1));

/** Satz der Stufe. Königsstufe: ein kleiner Text aus drei Sätzen — ein Satzpaar der Stufe 5 und
    ein Satz der Stufe 3 oder 4 (abstrakte Nomen, ? und !), in zufälliger Reihenfolge. */
function aufgabeErzeugen(stufe) {
  if (stufe !== "s6") return waehle(frei(stufe));
  const teile = [waehle(frei("s5")), waehle(KOENIG_EINZEL)];
  return (Math.random() < 0.5 ? teile : teile.reverse()).join(" ");
}

/** Mängel: jeder Satz beginnt gross und endet mit . ! oder ?, keine Kommas, kein ß; Königsstufe mit drei Sätzen. */
function pruefeAufgabe(satz, stufe) {
  const m = [];
  const saetze = satz.match(/[^.!?]+[.!?]/g) || [];
  if (saetze.join("").replace(/\s/g, "") !== satz.replace(/\s/g, "")) m.push("Text endet nicht mit einem Satzzeichen");
  if (saetze.some(s => !/^[A-ZÄÖÜ]/.test(s.trim()))) m.push("Satzanfang klein");
  if (/[,;:ß]/.test(satz)) m.push("Komma, Doppelpunkt oder ß im Satz");
  if (/\s{2}/.test(satz) || satz !== satz.trim()) m.push("doppelte Leerzeichen");
  if (stufe === "s6" && saetze.length !== 3) m.push("Königsstufe nicht mit drei Sätzen");
  if (!ANGEBOTEN.has(stufe)) m.push("Stufe wird mit den freien Listen nicht angeboten");
  // Inhalt aus freien Listen: der Satz selbst, in der Königsstufe ein Satzpaar und ein Einzelsatz.
  const ausFrei = stufe === "s6" ? frei("s5").some(p => satz.includes(p) && KOENIG_EINZEL.includes(satz.replace(p, "").trim()))
    : frei(stufe).includes(satz);
  if (!ausFrei) m.push("Satz stammt nicht aus einer freien Liste der Stufe");
  for (const s of AUCH_PUNKT) if (!Object.values(SAETZE).flat().some(x => x.includes(s))) m.push(`AUCH_PUNKT: «${s}» steht in keinem Satz`);
  return m;
}

LS.spiel({
  id: "satz-reparatur",
  einleitung: "Oje, in diesen Sätzen ist alles klein geschrieben und die Satzzeichen fehlen! Repariere sie: Tipp ein Wort an, um den ersten Buchstaben gross zu machen.",
  anzahl: 8,
  stufen: Object.fromEntries(Object.entries({
    s1: "Satzanfang gross und Punkt am Ende.",
    s2: "Dazu Namen und Nomen gross: Hund, Lina.",
    s3: "Auch Nomen wie Angst und Freude — und ? oder !",
    s4: "Längere Sätze mit mehreren Nomen.",
    s5: "Zwei Sätze hintereinander.",
    s6: "Endgegner: drei Sätze am Stück — mit Nomen wie Angst, ? und !",
  }).filter(([s]) => ANGEBOTEN.has(s))),

  aufgabe(ctx) {
    const satz = aufgabeErzeugen(ctx.stufe);
    ctx.loesung(satz);
    if (ZEICHEN_WECHSELT.has(ctx.stufe)) ctx.serie("satzzeichen", satzende(satz));
    const woerter = zerlege(satz);
    ctx.flaeche.append(el("div", { class: "auftrag", text: "Repariere den Satz!" }),
      el("div", { class: "tipp-zeile", text: "Wort antippen = gross/klein · Kästchen antippen = Satzzeichen wählen" }));
    const zeile = el("div", { class: "satz" });
    const zustand = woerter.map(w => ({ ...w, gross: false, zeichen: "" }));
    let fertig = false;

    zustand.forEach(w => {
      const rest = w.soll.slice(1).toLowerCase();
      const erster = el("span", { class: "erster", text: w.soll[0].toLowerCase() });
      const knopf = el("button", { type: "button", class: "wort", "aria-label": w.soll.toLowerCase() }, erster, rest);
      knopf.addEventListener("click", () => {
        if (fertig) return;
        w.gross = !w.gross;
        erster.textContent = w.gross ? w.soll[0].toUpperCase() : w.soll[0].toLowerCase();
        knopf.classList.toggle("gross", w.gross);
        knopf.classList.remove("fehler");
        LS.ton("tipp");
      });
      w.knopf = knopf;
      zeile.append(knopf);
      if (w.ende) {
        const z = el("button", { type: "button", class: "zeichen", "aria-label": "Satzzeichen" });
        z.addEventListener("click", () => {
          if (fertig) return;
          w.zeichen = ZEICHEN[(ZEICHEN.indexOf(w.zeichen) + 1) % ZEICHEN.length];
          z.textContent = w.zeichen;
          z.classList.toggle("gesetzt", !!w.zeichen);
          z.classList.remove("fehler");
          LS.ton("tipp");
        });
        w.zeichenKnopf = z;
        zeile.append(z);
      }
    });
    ctx.flaeche.append(zeile);

    const ok = el("button", { class: "knopf gruen", type: "button", text: "Fertig ✓" });
    ok.addEventListener("click", () => {
      if (fertig) return;
      const grossFalsch = zustand.filter(w => w.gross !== (w.soll[0] !== w.soll[0].toLowerCase()));
      const zeichenFalsch = zustand.filter(w => w.ende && !w.erlaubt.includes(w.zeichen));
      if (!grossFalsch.length && !zeichenFalsch.length) { fertig = true; ctx.richtig(`Richtig repariert: ${satz}`); return; }
      const anfangFalsch = grossFalsch.some((w, i) => i === 0 || zustand[zustand.indexOf(w) - 1]?.ende);
      // Königsstufe: knapper — nur wie viele Stellen noch nicht stimmen, nicht welche Art.
      const offen = grossFalsch.length + zeichenFalsch.length;
      const hinweis = ctx.stufe === "s6" ? `Noch ${offen === 1 ? "eine Stelle stimmt" : `${offen} Stellen stimmen`} nicht. Prüfe jeden Satzanfang, jedes Nomen und jedes Satzende.`
        : anfangFalsch ? "Wie beginnt ein Satz? Mit einem grossen Buchstaben!"
        : grossFalsch.some(w => !w.gross) ? "Ein Nomen fehlt noch. Probe: Passt der, die oder das davor? Namen schreibt man auch gross."
        : grossFalsch.length ? "Ein Wort ist zu viel gross. Nur Satzanfang, Namen und Nomen schreibt man gross."
        : zeichenFalsch.some(w => !w.zeichen) ? "Am Satzende fehlt ein Zeichen." : "Ist es eine Frage (?), ein Ausruf (!) oder ein normaler Satz (.)?";
      ctx.falsch(hinweis, satz);
      // Nach dem Aufgeben zeigen, wo die Fehler waren
      if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)")) {
        fertig = true;
        grossFalsch.forEach(w => w.knopf.classList.add("fehler"));
        zeichenFalsch.forEach(w => w.zeichenKnopf.classList.add("fehler"));
      }
    });
    ctx.flaeche.append(el("div", { class: "knopfzeile" }, ok));
    if (ctx.nr === 0) ctx.sag("Tipp auf die Wörter, die gross geschrieben werden. Dann das Kästchen am Ende für das Satzzeichen.");
  },
});
</script>
</body>
</html>
