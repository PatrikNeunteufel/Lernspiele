<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blitzlesen</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .tafel { min-height: 120px; display: grid; place-items: center; background: #2d3047; color: #fff; border-radius: 20px; margin: 4px 0 12px; padding: 12px; }
  .tafel .blitz { font-size: clamp(38px, 9vw, 60px); font-weight: 900; letter-spacing: 2px; }
  .tafel .leer { font-size: 54px; opacity: .5; }
  .wahl-knopf .reihe { font-size: clamp(22px, 5vw, 30px); letter-spacing: -2px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>⚡ Blitzlesen</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../anlaut-angel/woerter.js"></script>
<script src="../buchstaben-zwillinge/woerter.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.2.A.1: b Buchstaben zu kurzen Wörtern verbinden, c (Grundanspruch 1. Zyklus)
// „vertraute Wörter auf einen Blick erkennen (Sichtwortschatz)“, f vertraute Wortbilder schnell
// erkennen. Das Wort blitzt kurz auf — nochmal zeigen geht immer.

const { zufall, waehle, mische, el } = LS;

const WOERTER = ANLAUT_WOERTER.map(([wort, bild]) => ({ wort, bild }));
const mitLaenge = (min, max) => WOERTER.filter(w => w.wort.length >= min && w.wort.length <= max);

const ARTEN = {
  bild(min, max, n) {
    const w = waehle(mitLaenge(min, max));
    // Ablenker mit anderem Bild und anderem Anfang, damit nur das Lesen entscheidet
    const andere = mische(WOERTER.filter(x => x.bild !== w.bild && x.wort[0] !== w.wort[0])).slice(0, n - 1);
    return { art: "bild", text: w.wort, richtig: w, optionen: mische([w, ...andere]) };
  },
  aehnlich() {
    const [[wort], ...andere] = waehle(WORTPAARE);
    const gezeigt = waehle([wort, ...andere]);
    return { art: "wort", text: gezeigt, richtig: gezeigt, optionen: mische([wort, ...andere]) };
  },
  gruppe() {
    const [einz, mehr, ein, bild] = waehle(ZAEHLDINGE);
    const n = zufall(1, 5);
    const text = n === 1 ? `${ein} ${einz}` : `${ZAHLWOERTER[n]} ${mehr}`;
    const anders = waehle(ZAEHLDINGE.filter(d => d[0] !== einz))[3];
    const m = waehle([1, 2, 3, 4, 5].filter(x => x !== n));
    const richtig = bild.repeat(n);
    return { art: "gruppe", text, richtig, optionen: mische([richtig, anders.repeat(n), bild.repeat(m)]) };
  },
};

// Je Stufe: Aufgabe und wie lange das Wort sichtbar bleibt (ms)
const STUFE = {
  s1: { neu: () => ARTEN.bild(2, 4, 3), zeit: 3000 },
  s2: { neu: () => ARTEN.bild(3, 5, 4), zeit: 1800 },
  s3: { neu: () => ARTEN.bild(4, 8, 4), zeit: 1200 },
  s4: { neu: () => waehle([ARTEN.aehnlich, () => ARTEN.bild(5, 8, 4)])(), zeit: 1000 },
  s5: { neu: () => waehle([ARTEN.gruppe, ARTEN.aehnlich])(), zeit: 1500 },
  // Königsstufe: sehr kurz sichtbar, lange und ähnliche Wörter und Wortgruppen gemischt
  s6: { neu: () => waehle([() => ARTEN.bild(6, 8, 5), ARTEN.aehnlich, ARTEN.gruppe])(), zeit: 700 },
};

function aufgabeErzeugen(stufe) { return STUFE[stufe].neu(); }

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a) {
  const m = [];
  if (!a.optionen.includes(a.richtig)) m.push("richtige Antwort fehlt");
  const schluessel = a.optionen.map(o => (typeof o === "string" ? o : o.wort));
  if (new Set(schluessel).size !== schluessel.length) m.push("Auswahl doppelt");
  if (a.art === "bild" && new Set(a.optionen.map(o => o.bild)).size !== a.optionen.length) m.push("zwei gleiche Bilder");
  return m;
}

LS.spiel({
  id: "blitzlesen",
  einleitung: "Ein Wort blitzt auf — und ist gleich wieder weg! Lies schnell und tipp auf das passende Bild.",
  anzahl: 10,
  stufen: {
    s1: "Kurze Wörter, drei Sekunden: Maus, Bus, Hut.",
    s2: "Etwas längere Wörter, kürzer sichtbar.",
    s3: "Lange Wörter, ganz kurz: Pinguin, Zitrone.",
    s4: "Genau lesen: Hund, Hand oder Mund?",
    s5: "Wortgruppen: drei Birnen, ein Stern.",
    s6: "Blitzschnell: lange Wörter, ähnliche Wörter und Wortgruppen.",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const zeit = STUFE[ctx.stufe].zeit;
    const tafel = el("div", { class: "tafel", "aria-live": "polite" });
    const zeige = () => {
      tafel.replaceChildren(el("div", { class: "blitz", text: a.text }));
      clearTimeout(uhr);
      uhr = setTimeout(() => tafel.replaceChildren(el("div", { class: "leer", text: "👀" })), zeit);
    };
    let uhr = null;
    ctx.flaeche.append(tafel, el("div", { class: "hoer-zeile" }, el("button", { type: "button", class: "knopf hell", text: "⚡ Nochmal blitzen", onclick: zeige })));
    zeige();

    const frage = a.art === "wort" ? "Welches Wort hast du gelesen?" : "Welches Bild passt?";
    ctx.flaeche.append(el("div", { class: "auftrag", text: frage }));
    LS.auswahl(ctx, {
      optionen: a.optionen, richtig: a.richtig, breite: a.art === "gruppe" ? 160 : 120,
      inhalt: o => (a.art === "bild" ? { bild: o.bild } : a.art === "gruppe" ? el("span", { class: "reihe", text: o }) : o),
      hinweis: "Lass es nochmal blitzen und lies ganz genau — Buchstabe für Buchstabe.",
      loesung: `Da stand: «${a.text}».`,
      lob: `Richtig: «${a.text}» ⚡`,
    });
    if (ctx.nr === 0) ctx.sag("Schau genau auf die Tafel — gleich blitzt es!");
  },
});
</script>
</body>
</html>
