<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlenhaus</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .haus { width: min(280px, 90%); margin: 4px auto 14px; }
  .dach { height: 0; border-left: 140px solid transparent; border-right: 140px solid transparent; border-bottom: 74px solid var(--deko-2); position: relative; margin: 0 auto; width: 0; }
  .dach b { position: absolute; left: 50%; top: 26px; transform: translateX(-50%); color: #fff; font-size: 36px; font-weight: 900; }
  .stock { display: grid; grid-template-columns: 1fr 1fr; border: 4px solid var(--text); border-top: none; background: #fff; }
  .stock:first-of-type { border-top: 4px solid var(--text); }
  .stock span { text-align: center; font-size: clamp(26px, 6vw, 36px); font-weight: 900; padding: 6px 0; font-variant-numeric: tabular-nums; }
  .stock span + span { border-left: 4px solid var(--text); }
  .stock span.luecke { color: var(--deko-4); background: var(--hinweis-hell); }
  .stock.drei { grid-template-columns: 1fr 1fr 1fr; }
  .stock.drei span { font-size: clamp(22px, 5vw, 30px); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🏠 Zahlenhaus</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script>
"use strict";
// Lehrplan SG MA.1.A.3: a „im Zahlenraum bis 20 ohne Zählen … addieren und subtrahieren“,
// b (Grundanspruch 1. Zyklus) „zweistellige Zahlen in 10er und 1er zerlegen“; MA.1.A.1.c Begriff
// ergänzen. Im Zahlenhaus steht die Zahl im Dach, jedes Stockwerk zerlegt sie in zwei Teile.

const { zufall, mische, el, zahlText } = LS;

// Je Stufe: Dachzahl (min–max), Schrittweite des linken Teils und ob es Stockwerke mit drei
// Teilen gibt. Bis 100 ist der linke Teil eine Zehnerzahl: 47 = 40 + 7 = 30 + 17 (Zehner und
// Einer). Basisklasse 1: s1 Kindergarten, s2–s4 1. Klasse, s5 2. Klasse, s6 Königsstufe.
const STUFE = {
  s1: { min: 3, max: 5, dach: () => zufall(3, 5), schritt: 1 },
  s2: { min: 5, max: 7, dach: () => zufall(5, 7), schritt: 1 },
  s3: { min: 6, max: 10, dach: () => (Math.random() < 0.4 ? 10 : zufall(6, 9)), schritt: 1 },
  s4: { min: 11, max: 20, dach: () => zufall(11, 20), schritt: 1 },
  s5: { min: 21, max: 100, dach: () => (Math.random() < 0.5 ? zufall(3, 10) * 10 : zufall(21, 99)), schritt: 10 },
  // Königsstufe: Zehnerzahlen bis 1000, Stockwerke mit zwei oder drei Teilen (alle Teile Zehnerzahlen).
  s6: { min: 200, max: 990, dach: () => zufall(20, 99) * 10, schritt: 10, drei: true },
};

/** Ein Stockwerk mit drei Teilen (Vielfache von 'schritt', keiner 0), Summe = dach. */
function dreiTeile(dach, schritt) {
  const n = dach / schritt;            // n ≥ 3
  const a = zufall(1, n - 2);
  const b = zufall(1, n - 1 - a);
  return [a * schritt, b * schritt, (n - a - b) * schritt];
}

function aufgabeErzeugen(stufe) {
  const { dach: dachFn, schritt, drei } = STUFE[stufe];
  const dach = dachFn();
  // bis zu drei verschiedene Zerlegungen ohne 0
  const moeglich = [];
  for (let a = schritt; a < dach; a += schritt) moeglich.push([a, dach - a]);
  let stockwerke = mische(moeglich).slice(0, Math.min(3, moeglich.length));
  if (drei) {
    // ein oder zwei Stockwerke mit drei Teilen; Wiederholungen werden verworfen (begrenzte Versuche)
    const zahl = zufall(1, 2);
    const neu = [];
    for (let v = 0; v < 20 && neu.length < zahl; v++) {
      const t = dreiTeile(dach, schritt);
      if (!neu.some(s => s.join() === t.join())) neu.push(t);
    }
    stockwerke = mische([...stockwerke.slice(0, 3 - neu.length), ...neu]);
  }
  const stock = zufall(0, stockwerke.length - 1);
  const luecke = { stock, seite: zufall(0, stockwerke[stock].length - 1) };
  return { dach, stockwerke, luecke, richtig: stockwerke[luecke.stock][luecke.seite] };
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const s = STUFE[stufe];
  const summe = t => t.reduce((x, y) => x + y, 0);
  if (a.dach < s.min || a.dach > s.max) m.push("Dachzahl ausserhalb des Zahlenraums");
  if (a.stockwerke.some(t => summe(t) !== a.dach || t.some(x => !Number.isInteger(x) || x <= 0))) m.push("Stockwerk ergibt nicht die Dachzahl");
  if (a.stockwerke.some(t => t.length !== 2 && !(s.drei && t.length === 3))) m.push("falsche Zahl von Teilen je Stockwerk");
  if (s.schritt > 1 && a.stockwerke.some(t => t.slice(0, -1).some(x => x % s.schritt !== 0))) m.push("linker Teil keine Zehnerzahl");
  if (new Set(a.stockwerke.map(t => t.join())).size !== a.stockwerke.length) m.push("Stockwerk doppelt");
  if (!a.stockwerke.length || a.stockwerke.length > 3) m.push("Zahl der Stockwerke");
  if (a.stockwerke[a.luecke.stock]?.[a.luecke.seite] !== a.richtig) m.push("Lücke passt nicht zur Lösung");
  return m;
}

LS.spiel({
  id: "zahlenhaus",
  einleitung: "Im Zahlenhaus wohnt oben die Dachzahl. In jedem Stockwerk wohnen zwei Zahlen, die zusammen die Dachzahl ergeben.",
  anzahl: 10,
  stufen: {
    s1: "Kleine Häuser bis 5.",
    s2: "Häuser bis 7.",
    s3: "Häuser bis 10: die Zehnerfreunde.",
    s4: "Häuser bis 20.",
    s5: "Bis 100: 60 = 40 + ?, 47 = 40 + ?",
    s6: "Bis 1000, manche Stockwerke mit drei Zahlen: 700 = 230 + ? + 150",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const luecke = el("span", { class: "luecke", text: "?" });
    const haus = el("div", { class: "haus" }, el("div", { class: "dach" }, el("b", { text: zahlText(a.dach) })));
    a.stockwerke.forEach((teile, i) => {
      const felder = teile.map((z, seite) => (i === a.luecke.stock && seite === a.luecke.seite ? luecke : el("span", { text: zahlText(z) })));
      const stock = el("div", { class: "stock" + (teile.length === 3 ? " drei" : "") }, ...felder);
      haus.append(stock);
    });
    const reihe = a.stockwerke[a.luecke.stock];
    const bekannt = reihe.reduce((x, y) => x + y, 0) - a.richtig;
    /** Rechnung des Stockwerks mit w an der Stelle der Lücke: „230 + 320 + 150“. */
    const rechnung = w => reihe.map((z, i) => zahlText(i === a.luecke.seite ? w : z)).join(" + ");
    ctx.flaeche.append(el("div", { class: "auftrag", text: "Welche Zahl fehlt im Stockwerk?" }), haus);
    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Fehlende Zahl" });
    ctx.flaeche.append(anzeige);
    const tasten = LS.tastatur({
      anzeige,
      maxStellen: 4,
      onAenderung(w) { luecke.textContent = w === null ? "?" : zahlText(w); },
      onOk(w) {
        if (w === a.richtig) {
          tasten.gesperrt = true;
          anzeige.classList.add("richtig");
          ctx.richtig(`${rechnung(a.richtig)} = ${zahlText(a.dach)} 🏠`);
          return;
        }
        anzeige.classList.add("falsch");
        const summe = bekannt + w;
        ctx.falsch(`${rechnung(w)} = ${zahlText(summe)}. ${summe > a.dach ? "Das ist zu viel" : "Da fehlt noch etwas"} bis ${zahlText(a.dach)}.`,
          `${rechnung(a.richtig)} = ${zahlText(a.dach)}`);
        if (ctx.vorbei()) tasten.gesperrt = true;
      },
    });
    ctx.flaeche.append(tasten.element);
    if (ctx.nr === 0) ctx.sag("Wie viel fehlt bis zur Dachzahl? Tipp die Zahl ein.");
  },
});
</script>
</body>
</html>
