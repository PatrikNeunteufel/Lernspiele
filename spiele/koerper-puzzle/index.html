<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Körper-Puzzle</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
  .bild-gross { text-align: center; font-size: clamp(64px, 15vw, 96px); line-height: 1.1; margin-bottom: 10px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🫀 Körper-Puzzle</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="koerper.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.1.4: a Körperteile, deren Lage und Funktion beschreiben; b (Grundanspruch
// 1. Zyklus) Eigenschaften zuordnen (Gelenke beweglich, Schädel schützt); c Organsysteme
// (Bewegung: Muskeln und Skelett; Verdauung); d Haut, schwitzen, Sonnenbrand; e (Grundanspruch
// 2. Zyklus) Blutkreislauf: Herz, Venen, Arterien. Inhalte in koerper.js.

const { waehle, mische, el } = LS;
// „ab Stufe“ in koerper.js = Nummer der Spielstufe (s1–s6).
const STUFE_NR = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 };
const ID = "koerper-puzzle";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : KOERPER_LISTEN);
const nurFrei = (liste, daten) => (FREI.has(liste) ? daten : []);
const TEILE = nurFrei("koerperteile", KOERPERTEILE);
const SINNE_FREI = nurFrei("sinne", SINNE);
const FRAGEN = KOERPER_FRAGEN.filter(f => FREI.has(f[5]));
const WEGE_FREI = nurFrei("wege", WEGE);

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  teil(n = 3) {
    if (!TEILE.length) return null;
    const [bild, name, artikel] = waehle(TEILE);
    const andere = mische(TEILE.filter(t => t[1] !== name)).slice(0, n - 1).map(t => t[1]);
    return { art: "teil", bild, artikel, richtig: name, optionen: mische([name, ...andere]) };
  },
  finde(n = 3) {
    if (!TEILE.length) return null;
    const [bild, name] = waehle(TEILE);
    const andere = mische(TEILE.filter(t => t[1] !== name)).slice(0, n - 1);
    return { art: "finde", name, richtig: bild, optionen: mische([bild, ...andere.map(t => t[0])]) };
  },
  sinn() {
    if (!SINNE_FREI.length) return null;
    const [frage, , organ] = waehle(SINNE_FREI);
    return { art: "sinn", frage, richtig: organ, optionen: SINNE_FREI.map(s => s[2]) };
  },
  frage(n) {
    // Fragen dieser Stufe, ab und zu eine der Stufe davor; ohne freie Frage dieser Stufe keine Aufgabe.
    const eigene = FRAGEN.filter(f => f[0] === n);
    if (!eigene.length) return null;
    const liste = FRAGEN.filter(f => f[0] === n || (f[0] === n - 1 && Math.random() < 0.3));
    const [, frage, richtig, f1, f2] = waehle(liste);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
  weg() {
    if (!WEGE_FREI.length) return null;
    const [name, stationen] = waehle(WEGE_FREI);
    return { art: "weg", name, reihe: stationen };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [ARTEN.teil, ARTEN.finde],
  s2: [ARTEN.sinn, ARTEN.finde],
  s3: [() => ARTEN.frage(3), ARTEN.sinn],
  // gemischt: Gelenke und Schutz, Sinne und Körperteile mit mehr Auswahl
  s4: [() => ARTEN.frage(3), () => ARTEN.frage(3), ARTEN.sinn, () => ARTEN.teil(4), () => ARTEN.finde(4)],
  s5: [() => ARTEN.frage(5)],
  // Königsstufe: Blutkreislauf, Haut, Wege durch den Körper
  s6: [() => ARTEN.frage(6), () => ARTEN.frage(6), ARTEN.weg],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Körperteile: Auge, Ohr, Nase, Hand …",
  s2: "Die fünf Sinne: Womit hörst du?",
  s3: "Gelenke, Schädel, Milchzähne.",
  s4: "Alles gemischt: Körperteile, Sinne, Gelenke.",
  s5: "Herz, Lunge, Magen, Gehirn: Was machen sie?",
  s6: "Blutkreislauf, Haut und der Weg des Essens.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (koerper.js). */
function herkunft(a) {
  const teil = t => (KOERPERTEILE.some(x => x.includes(t)) ? "koerperteile" : "?");
  if (a.art === "teil" || a.art === "finde") return [a.art === "teil" ? a.richtig : a.name, ...a.optionen].map(teil);
  if (a.art === "sinn") return [a.frage, ...a.optionen].map(t => (SINNE.some(x => x.includes(t)) ? "sinne" : "?"));
  if (a.art === "frage") return [KOERPER_FRAGEN.find(f => f[1] === a.frage)?.[5] || "?"];
  return [WEGE.some(([name, st]) => name === a.name && st.join() === a.reihe.join()) ? "wege" : "?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.optionen && (!a.optionen.includes(a.richtig) || new Set(a.optionen).size !== a.optionen.length)) m.push("Auswahl doppelt oder ohne Lösung");
  if (a.art === "frage") {
    const f = KOERPER_FRAGEN.find(x => x[1] === a.frage);
    if (f[0] > STUFE_NR[stufe]) m.push("Frage aus einer höheren Stufe");
  }
  return m;
}

const sinnBild = Object.fromEntries(SINNE.map(([, bild, organ]) => [organ, bild]));

LS.spiel({
  id: "koerper-puzzle",
  einleitung: "Dein Körper kann so viel: sehen, hören, rennen, denken! Kennst du dich aus?",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (a.art === "teil") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Wie heisst dieser Körperteil?" }), el("div", { class: "bild-gross", text: a.bild }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 110, hinweis: "Zeig auf deinen eigenen Körper: Wo ist das?", loesung: `Das ist ${a.artikel} ${a.richtig}.` });
    } else if (a.art === "finde") {
      ctx.flaeche.append(el("div", { class: "frage", text: `Tipp auf: ${a.name}` }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 100, inhalt: b => ({ bild: b }), hinweis: "Zeig zuerst auf deinem Körper, wo das ist.", loesung: `${a.richtig} ${a.name}` });
    } else if (a.art === "sinn") {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 110, inhalt: o => ({ bild: sinnBild[o], text: o }),
        hinweis: "Probier es aus: Mach es nach. Welchen Teil deines Körpers brauchst du dabei?", loesung: `${a.frage} Mit: ${a.richtig}.` });
    } else if (a.art === "frage") {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 200, hinweis: "Denk an deinen eigenen Körper. Was passt?", loesung: `${a.frage} ${a.richtig}` });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: `${a.name}: Tipp die Stationen der Reihe nach an.` }));
      LS.reihenfolge(ctx, { reihe: a.reihe, breite: 130, pfeile: true,
        hinweis: "Wo beginnt der Weg? Denk an deinen Körper von oben nach unten.", loesung: a.reihe.join(" → ") });
    }
    if (ctx.nr === 0) ctx.sag("Schau genau und tipp auf deine Antwort.");
  },
});
</script>
</body>
</html>
