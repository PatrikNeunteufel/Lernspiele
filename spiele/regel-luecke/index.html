<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regel-Lücke</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .regelkarte {
    background: #fff8e1;
    border: 3px dashed #f5c451;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 17px;
    margin: 0 auto 14px;
    max-width: 700px;
  }

  .regelkarte b { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: #a0703d; }

  .bild-gross { text-align: center; font-size: clamp(56px, 12vw, 84px); line-height: 1.1; }

  .lueckenwort {
    text-align: center;
    font-size: clamp(40px, 9vw, 66px);
    font-weight: 900;
    margin: 8px 0 20px;
    letter-spacing: 1px;
  }

  .lueckenwort .luecke {
    display: inline-block;
    min-width: 1.6em;
    border-bottom: 6px solid var(--knopf);
    color: var(--knopf);
    margin: 0 2px;
  }

  .lueckenwort .luecke.richtig { color: var(--gut); border-color: var(--gut); }

  .optionen { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

  .option {
    border: none;
    border-radius: 20px;
    min-width: 130px;
    min-height: 84px;
    font-family: inherit;
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 900;
    background: #fff;
    color: var(--text);
    box-shadow: 0 6px 0 var(--rand), 0 8px 16px rgba(45, 48, 71, .1);
    cursor: pointer;
  }

  .option:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rand); }
  .option.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .option.richtig { background: var(--gut-hell); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>✏️ Regel-Lücke</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.5.E.1: Rechtschreibregeln in dafür konstruierten Übungen anwenden.
// Stufe 1–4: die Regel steht sichtbar daneben, keine Ausnahmen (wie Lehrplan Stufe b/c).
// Stufe 5: Regel erst beim Fehler, mit Ausnahmen und Doppelkonsonanten (wie Lehrplan Stufe d).

const { waehle, mische, el } = LS;

const STUFE = {
  s1: { regeln: ["spst"], sichtbar: true, ausnahmen: false },
  s2: { regeln: ["spst", "ie"], sichtbar: true, ausnahmen: false },
  s3: { regeln: ["ie", "cktz"], sichtbar: true, ausnahmen: false },
  s4: { regeln: ["ie", "cktz", "fv", "eae"], sichtbar: true, ausnahmen: false },
  s5: { regeln: ["ie", "cktz", "fv", "eae", "doppel"], sichtbar: false, ausnahmen: true },
};

/** "B{ie|i}ne" → { vor: "B", richtig: "ie", falsch: "i", nach: "ne", ganz: "Biene" } */
function zerlegeWort(text) {
  const m = text.match(/^(.*)\{([^|]+)\|([^}]+)\}(.*)$/);
  return { vor: m[1], richtig: m[2], falsch: m[3], nach: m[4], ganz: m[1] + m[2] + m[4] };
}

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const regelId = waehle(p.regeln);
  const regel = REGELN[regelId];
  const liste = p.ausnahmen && regel.ausnahmen ? [...regel.woerter, ...regel.ausnahmen] : regel.woerter;
  const [text, bild] = waehle(liste);
  return { regel, bild, ...zerlegeWort(text) };
}

LS.spiel({
  id: "regel-luecke",
  einleitung: "In jedem Wort fehlt etwas. Welche Schreibweise ist richtig? Die Regel hilft dir!",
  anzahl: 10,
  stufen: {
    s1: "sp oder schp, st oder scht: Stern, Spiel.",
    s2: "Dazu ie oder i: Biene, Kind.",
    s3: "ie oder i, ck oder k, tz oder z — die Regel steht dabei.",
    s4: "Dazu f oder v und e oder ä: Vogel, Hände.",
    s5: "Alles gemischt, mit Ausnahmen (Igel, Tiger) und Doppelkonsonanten — ohne Regelkarte.",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const p = STUFE[ctx.stufe];
    if (p.sichtbar) ctx.flaeche.append(el("div", { class: "regelkarte" }, el("b", { text: `Regel: ${a.regel.name}` }), a.regel.regel));
    if (a.bild) ctx.flaeche.append(el("div", { class: "bild-gross", "aria-hidden": "true", text: a.bild }));

    const luecke = el("span", { class: "luecke", text: "?" });
    ctx.flaeche.append(el("div", { class: "lueckenwort", "aria-label": "Wort mit Lücke" }, a.vor, luecke, a.nach));

    const optionen = el("div", { class: "optionen" });
    let fertig = false;
    for (const o of mische([a.richtig, a.falsch])) {
      const knopf = el("button", { type: "button", class: "option", text: o });
      knopf.addEventListener("click", () => {
        if (fertig) return;
        if (o === a.richtig) {
          fertig = true;
          knopf.classList.add("richtig");
          luecke.textContent = o;
          luecke.classList.add("richtig");
          ctx.richtig(`Richtig: ${a.ganz}`);
          return;
        }
        knopf.classList.remove("falsch");
        void knopf.offsetWidth;
        knopf.classList.add("falsch");
        ctx.falsch(p.sichtbar ? `Lies die Regel nochmal: ${a.regel.regel}` : `Regel ${a.regel.name}: ${a.regel.regel}`, `Man schreibt ${a.ganz}.`);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      optionen.append(knopf);
    }
    ctx.flaeche.append(optionen);
    if (ctx.nr === 0) ctx.sag("Tipp auf die richtige Schreibweise.");
  },
});
</script>
</body>
</html>
