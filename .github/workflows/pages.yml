# Veröffentlichen auf GitHub Pages (Entscheide P1 a, P2 a; LERN-17).
# Online geht nur die Einstiegsseite (portal/) und die App-Ordner, in derselben Ordnerstruktur wie im
# Repo, damit die relativen Verweise lokal und online gleich gelten; die Wurzel leitet nur auf portal/
# weiter. Doku, Werkzeuge und Material bleiben draussen. In den Repo-Einstellungen unter Pages ist
# die Quelle „GitHub Actions“ gewählt.
# Start (Entscheid W1 a, nach dem Datenschutz-Scan LERN_Session6): von selbst bei jedem Push auf master,
# der Veröffentlichtes ändert — reine Doku-Commits lösen nichts aus —, und weiter von Hand.
name: Pages

on:
  push:
    branches: [master]
    paths:
      - "portal/**"
      - "eulenpfad/**"
      - "lernsteig/**"
      - "gratwanderung/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen (Einstiegsseite und App-Ordner)
        run: |
          mkdir -p _site
          cp -r portal _site/portal
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Eulenpfad</title>' \
            '<meta http-equiv="refresh" content="0; url=portal/">' '<a href="portal/">Weiter zur Startseite</a>' > _site/index.html
          for app in eulenpfad lernsteig gratwanderung; do
            if [ -d "$app" ]; then cp -r "$app" "_site/$app"; fi
          done
          touch _site/.nojekyll

      - name: Keine Spielerdaten und keine Fotos
        run: |
          funde=$(find _site \( -name 'lernspiele-*.json' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.heic' \) -print)
          if [ -n "$funde" ]; then echo "Nicht veröffentlichen:"; echo "$funde"; exit 1; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
