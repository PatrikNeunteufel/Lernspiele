<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masse-Umwandler</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .rechnung { text-align: center; font-size: clamp(30px, 7vw, 52px); font-weight: 900; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
  .rechnung .einheit { color: var(--knopf); }
  .ergebnis-zeile { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 520px; margin: 0 auto; }
  .ergebnis-zeile .anzeige { flex: 1; }
  .ergebnis-zeile .einheit { font-size: clamp(28px, 6vw, 40px); font-weight: 900; color: var(--knopf); min-width: 2.2em; }

  .treppe { display: flex; justify-content: center; align-items: flex-end; gap: 4px; margin: 0 auto 14px; flex-wrap: wrap; }
  .stufe-t { display: flex; flex-direction: column; align-items: center; }
  .stufe-t b { background: var(--f, var(--deko-6)); color: var(--auf-stelle); border-radius: 10px; padding: 6px 12px; font-size: 18px; }
  .pfeil-t { font-size: 13px; font-weight: 800; color: var(--text-leise); text-align: center; padding: 0 4px 10px; }
  /* Notizen (NZ1 a): eine Zeile unter der Rechnung */
  .nz-zeile { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 16px; margin: -6px 0 10px;
    font-size: clamp(16px, 3.8vw, 20px); font-weight: 800; color: var(--text-leise); font-variant-numeric: tabular-nums; }
  .nz-zeile label { display: inline-flex; align-items: center; gap: 6px; }
  .nz-zeile .zw-notiz { font-size: 17px; min-height: 34px; padding: 2px 4px; }
  .familie { text-align: center; color: var(--text-leise); font-weight: 700; margin-bottom: 6px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>📏 Masse-Umwandler</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/notizblock.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.3.A.2.e: Grössen in benachbarte Masseinheiten umwandeln (l, dl; m, cm, mm; kg, g;
// z.B. 2'000 g = 2 kg) und mit ihnen rechnen (z.B. 3 cm 5 mm + 2 cm 7 mm);
// MA.3.A.1.e/f: km, dm, mm, cl, ml, t, mg, h, min, s; Vorsätze Kilo, Dezi, Centi, Milli.

const { zahlText, zufall, waehle, el } = LS;

// Familien: Einheiten von klein nach gross mit Wert in der kleinsten Einheit.
const FAMILIEN = {
  laenge: { name: "Längen", einheiten: [["mm", 1], ["cm", 10], ["dm", 100], ["m", 1000], ["km", 1000000]] },
  hohl: { name: "Hohlmasse", einheiten: [["ml", 1], ["cl", 10], ["dl", 100], ["l", 1000]] },
  gewicht: { name: "Gewichte", einheiten: [["mg", 1], ["g", 1000], ["kg", 1000000], ["t", 1000000000]] },
  zeit: { name: "Zeit", einheiten: [["s", 1], ["min", 60], ["h", 3600]] },
  geld: { name: "Geld", einheiten: [["Rp.", 1], ["Fr.", 100]] },
};

// Je Stufe: erlaubte Paare [Familie, gross, klein], Aufgabenart.
const STUFE = {
  s1: { paare: [["laenge", "m", "cm"], ["geld", "Fr.", "Rp."]], art: "einfach", max: 9 },
  s2: { paare: [["laenge", "m", "cm"], ["laenge", "cm", "mm"], ["hohl", "l", "dl"], ["gewicht", "kg", "g"]], art: "einfach", max: 20 },
  s3: { paare: [["laenge", "m", "cm"], ["laenge", "cm", "mm"], ["hohl", "l", "dl"], ["gewicht", "kg", "g"], ["geld", "Fr.", "Rp."]], art: "gemischt", max: 9 },
  s4: { paare: [["laenge", "km", "m"], ["laenge", "m", "mm"], ["laenge", "dm", "cm"], ["hohl", "dl", "cl"], ["hohl", "l", "ml"], ["gewicht", "t", "kg"], ["gewicht", "g", "mg"], ["zeit", "h", "min"], ["zeit", "min", "s"]], art: "einfach", max: 12 },
  s5: { paare: [["laenge", "cm", "mm"], ["laenge", "m", "cm"], ["gewicht", "kg", "g"], ["hohl", "l", "dl"], ["zeit", "h", "min"]], art: "rechnen", max: 5 },
  // Königsstufe: je ein Drittel weite Sprünge über mehrere Stufen der Treppe (3 km = ? cm),
  // gemischte Grössen mit den Einheiten der Stufe 4 und Subtraktion gemischter Grössen;
  // die Treppe erscheint erst nach dem ersten Fehler.
  s6: {
    art: "koenig", max: 9,
    weit: [["laenge", "km", "cm"], ["laenge", "m", "mm"], ["laenge", "dm", "mm"], ["hohl", "l", "ml"], ["gewicht", "t", "g"], ["gewicht", "kg", "mg"], ["zeit", "h", "s"]],
    gemischt: [["laenge", "km", "m"], ["laenge", "m", "mm"], ["hohl", "l", "ml"], ["gewicht", "t", "kg"], ["zeit", "h", "min"], ["zeit", "min", "s"]],
    minus: [["laenge", "m", "cm"], ["laenge", "km", "m"], ["gewicht", "kg", "g"], ["hohl", "l", "dl"], ["zeit", "h", "min"], ["zeit", "min", "s"]],
  },
};

const wert = (fam, e) => FAMILIEN[fam].einheiten.find(x => x[0] === e)?.[1];

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  let art = p.art, paare = p.paare;
  if (art === "koenig") { art = waehle(["weit", "gemischt", "minus"]); paare = p[art]; }
  const [fam, gross, klein] = waehle(paare);
  const f = wert(fam, gross) / wert(fam, klein);
  // Anteil in der kleinen Einheit, kleiner als eine grosse Einheit (bei 1000er-Schritten in Zehnern: 2 kg 350 g)
  const teil = () => f >= 1000 ? zufall(1, 99) * 10 : zufall(1, f - 1);
  // groessen (Notizen, NZ1 a): die Grössen, die man einzeln in die Zieleinheit umrechnet; von: Einheit links
  if (art === "einfach" || art === "weit") {
    const v = zufall(1, p.max);
    return Math.random() < 0.5
      ? { art, fam, f, links: `${zahlText(v)} ${gross}`, von: gross, ziel: klein, loesung: v * f, richtung: "gross→klein" }
      : { art, fam, f, links: `${zahlText(v * f)} ${klein}`, von: klein, ziel: gross, loesung: v, richtung: "klein→gross" };
  }
  const s = (a, b) => (a ? `${a} ${gross} ` : "") + `${zahlText(b)} ${klein}`;
  if (art === "gemischt") {
    const a = zufall(1, p.max), b = teil();
    return { art, fam, f, links: s(a, b), ziel: klein, loesung: a * f + b, groessen: [`${a} ${gross}`] };
  }
  if (art === "minus") {
    // Zwei gemischte Grössen, die erste grösser; meist muss man eine grosse Einheit „aufbrechen“.
    const a1 = zufall(2, p.max), b1 = teil(), a2 = zufall(1, a1 - 1), b2 = teil();
    return { art, fam, f, links: `${s(a1, b1)} − ${s(a2, b2)}`, ziel: klein, loesung: (a1 - a2) * f + b1 - b2, groessen: [s(a1, b1), s(a2, b2)] };
  }
  // rechnen: zwei gemischte Grössen addieren, Ergebnis in der kleinen Einheit
  const a1 = zufall(0, p.max), b1 = teil(), a2 = zufall(0, p.max), b2 = teil();
  return { art, fam, f, links: `${s(a1, b1)} + ${s(a2, b2)}`, ziel: klein, loesung: (a1 + a2) * f + b1 + b2,
    groessen: [[a1, b1], [a2, b2]].filter(([x]) => x).map(([x, y]) => s(x, y)) }; // ohne grosse Einheit steht sie schon in klein
}

/**
 * Mängel einer Aufgabe: Die linke Seite wird unabhängig vom Generator nachgerechnet
 * („2 km 350 m − 1 km 20 m“ → Summe der Teile in der Zieleinheit) und mit der Lösung verglichen.
 */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const inZiel = teil => {
    const t = teil.replace(/[   ]/g, "").trim().split(/\s+/);
    let summe = 0;
    for (let i = 0; i < t.length; i += 2) {
      const w = wert(a.fam, t[i + 1]);
      if (!/^\d+$/.test(t[i]) || w === undefined) { m.push(`unlesbarer Teil «${teil}»`); return NaN; }
      summe += Number(t[i]) * w;
    }
    return summe / wert(a.fam, a.ziel);
  };
  const [links, op, rechts] = a.links.split(/ ([+−]) /);
  const soll = op === "+" ? inZiel(links) + inZiel(rechts) : op === "−" ? inZiel(links) - inZiel(rechts) : inZiel(links);
  if (soll !== a.loesung) m.push(`Lösung stimmt nicht (nachgerechnet ${soll})`);
  if (!(Number.isInteger(a.loesung) && a.loesung > 0)) m.push("Lösung keine positive ganze Zahl");
  if (String(a.loesung).length > 9) m.push("Lösung passt nicht in die Tastatur");
  if (op === "−" && stufe !== "s6") m.push("Subtraktion ausserhalb der Königsstufe");
  return m;
}

/**
 * Notizen (NZ1 a): Felder für Zwischenergebnisse — je Grösse „… = ✏️ mm“ (gemischt, rechnen, minus) oder bei weiten
 * Sprüngen je Treppenstufe dazwischen „= ✏️ m“. Leer bei einer Umwandlung über eine Stufe.
 */
function notizFelder(a) {
  if (a.groessen) return a.groessen.map(g => ({ vor: `${g} =`, einheit: a.ziel, label: `${g} in ${a.ziel}` }));
  const e = FAMILIEN[a.fam].einheiten.map(x => x[0]);
  const [i, j] = [e.indexOf(a.von), e.indexOf(a.ziel)];
  const zwischen = i < j ? e.slice(i + 1, j) : e.slice(j + 1, i).reverse();
  return zwischen.map(z => ({ vor: "=", einheit: z, label: `${a.links} in ${z}` }));
}

/** Einheiten-Treppe der Familie als Hilfe: m —×100→ cm … */
function treppe(fam) {
  const e = FAMILIEN[fam].einheiten.slice().reverse();
  const box = el("div", { class: "treppe", "aria-label": "Einheiten-Treppe" });
  e.forEach(([name, w], i) => {
    if (i) box.append(el("div", { class: "pfeil-t", html: `×${zahlText(e[i - 1][1] / w)}<br>→` }));
    box.append(el("div", { class: "stufe-t" }, el("b", { text: name })));
  });
  return box;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Richtung, Faktor, Vorgehen — nie das Ergebnis.
 * Ein Tipp, der die Lösung als Zahl enthält (1 m = ? cm mit dem Faktor 100), fällt weg.
 */
function tippsFuer(a) {
  const zeit = a.fam === "zeit" ? "Bei der Zeit geht jeder Schritt mal 60, nicht mal 10." : "";
  let liste;
  if (a.art === "einfach") liste = [
    "Wird die Einheit kleiner, wird die Zahl grösser — und umgekehrt.",
    `Zwischen ${a.links.split(" ").pop()} und ${a.ziel} liegt der Faktor ${zahlText(a.f)}. Mal oder geteilt?`,
  ];
  else if (a.art === "weit") liste = [
    "Wird die Einheit kleiner, wird die Zahl grösser — und umgekehrt.",
    "Geh die Einheiten-Treppe Stufe für Stufe und rechne jeden Schritt.", zeit,
  ];
  else if (a.art === "gemischt") liste = [`Rechne zuerst die grosse Einheit in ${a.ziel} um.`, "Zähl dann den Rest dazu.", zeit];
  else if (a.art === "rechnen") liste = [`Rechne beide Grössen ganz in ${a.ziel} um.`, "Zähl sie danach zusammen.", zeit];
  else liste = [`Rechne beide Grössen ganz in ${a.ziel} um.`, "Subtrahiere danach die zweite von der ersten.", zeit];
  const zahlen = t => t.replace(/[   ']/g, "").match(/\d+/g) || [];
  return liste.filter(t => t && !zahlen(t).includes(String(a.loesung)));
}

LS.spiel({
  id: "masse-umwandler",
  einleitung: "Meter, Liter, Kilo und Co.: Wandle die Grössen in die andere Einheit um. Die Einheiten-Treppe hilft dir!",
  hilfe: stufe => "Lies die Grösse links und rechne sie in die Einheit hinter dem ? um."
    + (stufe === "s5" ? "" : stufe === "s6" ? " Die Einheiten-Treppe erscheint erst nach einem Fehler."
      : " Die Einheiten-Treppe zeigt, mit welcher Zahl du von einer Einheit zur nächsten kommst."),
  anzahl: 8,
  stufen: {
    s1: "Meter und Zentimeter, Franken und Rappen: 2 m = 200 cm.",
    s2: "Dazu mm, l und dl, kg und g: 2000 g = 2 kg.",
    s3: "Gemischt: 3 m 25 cm = 325 cm.",
    s4: "km, t, ml, cl, h, min, s — Kilo, Dezi, Centi, Milli.",
    s5: "Rechnen: 3 cm 5 mm + 2 cm 7 mm = ? mm.",
    s6: "Endgegner: 3 km = ? cm, 2 h = ? s, 5 m 20 cm − 2 m 75 cm — ohne Treppe.",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (ctx.stufe === "s6") ctx.serie("art", a.art);
    if (a.richtung) ctx.serie("richtung", a.richtung);
    const loesung = `${a.links} = ${zahlText(a.loesung)} ${a.ziel}`;
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(a));
    ctx.schritte(LS.tippSchritte(a.loesung));
    ctx.flaeche.append(el("div", { class: "familie", text: FAMILIEN[a.fam].name }));
    // Königsstufe: Treppe erst nach dem ersten Fehler, über der Rechnung eingefügt.
    const koenig = ctx.stufe === "s6";
    const hilfeOrt = el("div");
    ctx.flaeche.append(hilfeOrt);
    if (ctx.stufe !== "s5" && !koenig) hilfeOrt.append(treppe(a.fam));
    ctx.flaeche.append(el("div", { class: "rechnung", html: `${a.links} = <span class="einheit">? ${a.ziel}</span>` }));
    // Notizen (NZ1 a) nach Stufe ab s5: zwei Grössen zusammenrechnen, weite Sprünge über mehrere Treppenstufen
    const notizen = notizFelder(a);
    if (notizen.length && ctx.notizen(Number(ctx.stufe.slice(1)) >= 5)) ctx.flaeche.append(el("div", { class: "nz-zeile" },
      ...notizen.map(n => el("label", {}, el("span", { text: n.vor }), LS.notizFeld({ breite: 7, label: n.label }), el("span", { text: n.einheit })))));
    const anzeige = el("div", { class: "anzeige leer", "aria-label": `Ergebnis in ${a.ziel}` });
    ctx.flaeche.append(el("div", { class: "ergebnis-zeile" }, anzeige, el("span", { class: "einheit", text: a.ziel })));
    const tasten = LS.tastatur({
      anzeige, maxStellen: 9,
      onOk(w) {
        if (w === a.loesung) { tasten.gesperrt = true; anzeige.classList.add("richtig"); ctx.richtig(); return; }
        anzeige.classList.add("falsch");
        if (koenig && !hilfeOrt.firstChild) hilfeOrt.append(treppe(a.fam));
        // Falsche Richtung erkennt man nur bei einer reinen Umwandlung.
        const umwandlung = a.art === "einfach" || a.art === "weit";
        const zuKlein = umwandlung && w * a.f === a.loesung, zuGross = umwandlung && w === a.loesung * a.f;
        const hinweis = zuKlein || zuGross
          ? (koenig ? "Fast — du hast in die falsche Richtung umgerechnet."
            : `Fast — du hast in die falsche Richtung umgerechnet. Grosse Einheit → kleine Einheit: mal ${zahlText(a.f)}. Kleine → grosse: geteilt durch ${zahlText(a.f)}.`)
          : !koenig ? `Schau auf die Treppe: Zwischen den beiden Einheiten liegt der Faktor ${zahlText(a.f)}.`
          : a.art === "weit" ? "Geh die Treppe Stufe für Stufe und rechne jeden Schritt."
          : a.art === "minus" ? `Rechne beide Grössen ganz in ${a.ziel} um und subtrahiere dann.`
          : `Rechne die grosse Einheit in ${a.ziel} um und zähle den Rest dazu.`;
        ctx.falsch(hinweis, loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
      },
    });
    ctx.flaeche.append(tasten.element);
    if (ctx.nr === 0) ctx.sag("Von gross nach klein wird die Zahl grösser — von klein nach gross kleiner.");
  },
});
</script>
</body>
</html>
