<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erdzeit-Leiter</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(19px, 4.4vw, 26px); font-weight: 800; margin: 0 0 10px; }
  .frage b { color: var(--knopf); }
  .ez-ereignis { max-width: 620px; margin: 0 auto 12px; padding: 10px 16px; border-radius: 16px; background: #fff8e1;
    border: 3px dashed #f5c451; text-align: center; font-size: clamp(17px, 4vw, 22px); font-weight: 800; }
  .ez-ereignis .ez-bild { display: block; font-size: clamp(40px, 9vw, 56px); line-height: 1.1; }
  .ez-ereignis small { display: block; font-size: clamp(15px, 3.6vw, 19px); color: var(--text-leise); font-weight: 800; margin-top: 4px; }
  .ez-erklaerung { max-width: 620px; margin: 0 auto 8px; text-align: center; font-size: clamp(14px, 3.4vw, 17px); color: var(--text-leise); font-weight: 700; }
  .ez-leiter { display: block; width: 100%; max-width: 400px; height: auto; margin: 0 auto 10px; touch-action: manipulation; }
  .ez-leiter .ez-band { fill: #fff; stroke: var(--rand); stroke-width: 2; cursor: pointer; }
  .ez-leiter .ez-band.richtig { fill: var(--gut-hell); stroke: var(--gut); stroke-width: 4; }
  .ez-leiter .ez-band.falsch { fill: var(--hinweis-hell); stroke: var(--hinweis); stroke-width: 4; }
  .ez-leiter .ez-holm { stroke: var(--deko-4); stroke-width: 8; stroke-linecap: round; }
  .ez-leiter .ez-sprosse { stroke: var(--deko-4); stroke-width: 6; stroke-linecap: round; }
  .ez-leiter .ez-zahl { font: 800 13px var(--schrift); fill: var(--text); text-anchor: end; dominant-baseline: central; }
  .ez-leiter .ez-heute { font: 800 13px var(--schrift); fill: var(--text-leise); text-anchor: middle; }
  .ez-uhr-text { font-size: clamp(15px, 3.6vw, 18px); }
  .wahl-knopf { font-size: clamp(16px, 3.8vw, 20px); font-weight: 800; }
  .wahl-knopf small { font-size: 14px; }
  /* Ganze Aufgabe im Bild (BH3 a): Karte kompakter, quer neben der Leiter. */
  @media (max-width: 560px), (max-height: 820px) {
    .ez-ereignis { padding: 8px 12px; margin-bottom: 8px; }
    .ez-ereignis .ez-bild { display: inline-block; font-size: 34px; vertical-align: middle; margin-right: 6px; }
    .frage { margin-bottom: 8px; }
    /* Zeitalter-Körbe: Karte kleiner, Körbe zu zweit */
    .korb-karte { margin: 4px auto 10px; padding: 8px 14px; }
    .korb-karte .bild { font-size: 44px; }
    .korb-karte b { font-size: clamp(18px, 4.6vw, 24px); }
  }
  @media (max-width: 560px) {
    .ez-leiter { width: min(100%, 400px, calc((100vh - 490px) * 320 / 345)); } /* Abschnitte bleiben über 44 px hoch */
    .wahl.ez-ordnen { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .ez-ordnen .wahl-knopf { font-size: 16px; padding: 6px; }
    .ez-ordnen .wahl-knopf .bild { font-size: 30px; }
    .ablage { min-height: 50px; margin-bottom: 8px; padding: 4px; }
    .korb-reihe { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .korb-reihe .korb-knopf { min-height: 80px; padding: 8px 6px; }
    .korb-reihe .korb-knopf .bild { font-size: 28px; }
  }
  @media (max-height: 820px) and (min-width: 561px) { /* Ordnen: zwei breite Karten je Zeile, Bild links */
    .wahl.ez-ordnen { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .ez-ordnen .wahl-knopf { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; align-items: center; justify-items: start; text-align: left; }
    .ez-ordnen .wahl-knopf .bild { grid-row: span 2; font-size: 36px; }
  }
  @media (min-width: 700px) {
    .ez-leiter-zeile { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; max-width: 900px; margin: 0 auto; }
    .ez-leiter-zeile .ez-leiter { width: min(400px, calc((100vh - 250px) * 320 / 345)); margin: 0; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🦕 Erdzeit-Leiter</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.2.5.e (Grundanspruch 2. Zyklus): Erdgeschichte zeitlich ordnen. Basisklasse 5:
// s1 4. Klasse (zwei Ereignisse: was war früher?), s2–s4 5. Klasse (drei, vier ordnen; auf der
// gestauchten Leiter einordnen; Zeitalter Erdurzeit, Erdaltertum, Erdmittelalter, Erdneuzeit),
// s5 6. Klasse (Abstände schätzen, Erdgeschichte als ein Tag), s6 Königsstufe.
// Ereignisse in woerter.js (Liste „ereignisse“), nur vor der Schrift. Der Zeitstrahl-Sortierer
// (NMG.9.1) übt Lebensabschnitte, Generationen und Zeitalter ab der Steinzeit; hier kommt nichts davon vor.
// Grosse Zahlen nur ganzzahlig über LS.zahlText („4600 Millionen“), keine Dezimalzahlen.

const { zahlText, waehle, mische, el } = LS;
const SVGNS = "http://www.w3.org/2000/svg";
function S(tag, attr = {}, ...kinder) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attr)) { if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  for (const k of kinder) if (k != null) e.append(k);
  return e;
}

// ---------- Freigabe und Zeiten ----------

const FREI = new Set(LS.spielListen("erdzeit-leiter").length ? LS.freieListen("erdzeit-leiter") : ["ereignisse"]);
const EREIGNISSE = FREI.has("ereignisse") ? ERDZEIT_EREIGNISSE : [];
const ERDALTER = 4600e6;

/** Vor wie vielen Jahren (ganze Zahl). */
const jahreVon = e => (e.mio ? e.mio * 1e6 : e.jahre);
/** „4600 Millionen Jahre“, „1 Million Jahre“, „300 000 Jahre“ — ganzzahlig, ohne „vor“. */
function dauerText(j, fall = "nom") {
  const jahre = fall === "dat" ? "Jahren" : "Jahre";
  if (j >= 1e6 && j % 1e6 === 0) return j === 1e6 ? `1 Million ${jahre}` : `${zahlText(j / 1e6)} Millionen ${jahre}`;
  return `${zahlText(j)} ${jahre}`;
}
const vorText = e => `vor etwa ${dauerText(jahreVon(e), "dat")}`;
const verhaeltnis = (a, b) => Math.max(jahreVon(a), jahreVon(b)) / Math.min(jahreVon(a), jahreVon(b));

const ZEITALTER = [
  { name: "Erdurzeit", bild: "🦠", von: 4600, bis: 541 },
  { name: "Erdaltertum", bild: "🐟", von: 541, bis: 252 },
  { name: "Erdmittelalter", bild: "🦕", von: 252, bis: 66 },
  { name: "Erdneuzeit", bild: "🦣", von: 66, bis: 0 },
];
const zeitalterSpanne = z => (z.bis ? `vor ${z.von} bis ${z.bis} Millionen Jahren` : `seit ${z.von} Millionen Jahren`);

// Leiter: gestauchte Skala (logarithmisch), je Sprosse zehnmal weiter zurück.
const SPROSSEN = [1e4, 1e5, 1e6, 1e7, 1e8, 1e9];
const yVon = j => 310 - 50 * (Math.log10(j) - 4);
/** Abschnitt der Leiter (0 = 10 000 bis 100 000 Jahre … 5 = 1000 Millionen bis zur Entstehung der Erde); -1 = genau auf einer Sprosse. */
function abschnitt(j) {
  if (SPROSSEN.includes(j)) return -1;
  return Math.min(5, Math.floor(Math.log10(j)) - 4);
}
const sprossenText = j => (j >= 1e6 ? dauerText(j).replace(/ Jahre$/, "") : `${zahlText(j)} Jahre`);
const ABSCHNITT_TEXT = i => (i === 5 ? `${sprossenText(1e9)} bis ${sprossenText(ERDALTER)}` : `${sprossenText(SPROSSEN[i])} bis ${sprossenText(SPROSSEN[i + 1])}`);

// Erdgeschichte als ein Tag: um 0 Uhr entsteht die Erde, um Mitternacht ist heute.
function tagText(j) {
  const sek = 86400 * j / ERDALTER;
  if (sek < 1) return "weniger als 1 Sekunde vor Mitternacht";
  if (sek < 120) return `${Math.round(sek)} Sekunden vor Mitternacht`;
  const min = Math.round((86400 - sek) / 60);
  return `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")} Uhr`;
}

// ---------- Aufgaben als Daten ----------

/** k Ereignisse, deren Zeiten paarweise mindestens um den Faktor r auseinanderliegen; älteste zuerst. */
function auswahlMitAbstand(k, r, filter = () => true) {
  const pool = EREIGNISSE.filter(filter);
  for (let versuch = 0; versuch < 200; versuch++) {
    const gewaehlt = [];
    for (const e of mische(pool)) {
      if (gewaehlt.every(g => verhaeltnis(g, e) >= r)) gewaehlt.push(e);
      if (gewaehlt.length === k) return gewaehlt.sort((a, b) => jahreVon(b) - jahreVon(a));
    }
  }
  return null;
}

const ARTEN = {
  frueher: r => {
    const paar = auswahlMitAbstand(2, r);
    return paar && { art: "frueher", richtig: paar[0].text, optionen: mische(paar.map(e => e.text)) };
  },
  ordnen: (k, r, zahlen) => {
    const reihe = auswahlMitAbstand(k, r);
    return reihe && { art: "ordnen", reihe: reihe.map(e => e.text), zahlen };
  },
  leiter: zahl => {
    const pool = EREIGNISSE.filter(e => abschnitt(jahreVon(e)) >= 0);
    if (!pool.length) return null;
    const e = waehle(pool);
    return { art: "leiter", text: e.text, richtig: abschnitt(jahreVon(e)), zahl };
  },
  zeitalter: zahl => {
    const pool = EREIGNISSE.filter(e => !e.grenze);
    if (!pool.length) return null;
    const e = waehle(pool);
    return { art: "zeitalter", text: e.text, richtig: e.zeitalter, zahl };
  },
  tag: r => {
    const e = waehle(EREIGNISSE.filter(x => jahreVon(x) >= 1e5));
    if (!e) return null;
    const richtig = tagText(jahreVon(e));
    const texte = [richtig];
    for (const x of mische(EREIGNISSE)) {
      const t = tagText(jahreVon(x));
      if (texte.length < 4 && !texte.includes(t) && verhaeltnis(x, e) >= r && texte.every(u => u !== t)) texte.push(t);
    }
    return texte.length === 4 ? { art: "tag", text: e.text, richtig, optionen: mische(texte) } : null;
  },
  tagRueck: () => {
    const drei = auswahlMitAbstand(3, 3, x => jahreVon(x) >= 1e5);
    if (!drei) return null;
    const e = waehle(drei);
    return { art: "tagRueck", uhr: tagText(jahreVon(e)), richtig: e.text, optionen: mische(drei.map(x => x.text)) };
  },
  abstand: () => {
    const paar = auswahlMitAbstand(2, 1.5);
    if (!paar) return null;
    const d = jahreVon(paar[0]) - jahreVon(paar[1]);
    if (d % 10000 !== 0) return null;
    const optionen = [d, d * 10, d / 10];
    return { art: "abstand", texte: paar.map(e => e.text), richtig: d, optionen: mische(optionen) };
  },
};

const STUFE = {
  s1: [() => ARTEN.frueher(8)],
  s2: [() => ARTEN.ordnen(3, 2.5, false), () => ARTEN.ordnen(3, 2.5, false), () => ARTEN.frueher(3)],
  s3: [() => ARTEN.leiter(true), () => ARTEN.leiter(true), () => ARTEN.ordnen(4, 1.4, true)],
  s4: [() => ARTEN.zeitalter(true), () => ARTEN.zeitalter(true), () => ARTEN.ordnen(4, 1.6, false), () => ARTEN.leiter(false)],
  s5: [() => ARTEN.tag(2), () => ARTEN.tag(2), () => ARTEN.tagRueck(), () => ARTEN.abstand()],
  // Königsstufe: fünf Ereignisse ohne Zahlen, Zeitalter ohne Zeitangabe, Leiter ohne Zahl, Erd-Tag mit nahen Uhrzeiten.
  s6: [() => ARTEN.ordnen(5, 1.25, false), () => ARTEN.zeitalter(false), () => ARTEN.leiter(false), () => ARTEN.tag(1.25), () => ARTEN.abstand()],
};

function aufgabeErzeugen(stufe) {
  for (let versuch = 0; versuch < 5; versuch++) {
    for (const art of mische(STUFE[stufe])) {
      const a = art();
      if (a) return a;
    }
  }
  return null;
}

const ereignis = text => ERDZEIT_EREIGNISSE.find(e => e.text === text);

function pruefeAufgabe(a, stufe) {
  const m = [];
  if (!a) return ["keine Aufgabe"];
  const einmal = (optionen, richtig) => {
    if (optionen.filter(o => o === richtig).length !== 1) m.push("richtige Antwort nicht genau einmal");
    if (new Set(optionen).size !== optionen.length) m.push("doppelte Optionen");
  };
  if (a.art === "frueher") {
    einmal(a.optionen, a.richtig);
    const [x, y] = a.optionen.map(ereignis);
    if (jahreVon(ereignis(a.richtig)) !== Math.max(jahreVon(x), jahreVon(y))) m.push("früheres Ereignis falsch");
    if (verhaeltnis(x, y) < 3) m.push("Zeiten zu nah");
  }
  if (a.art === "ordnen") {
    const j = a.reihe.map(t => jahreVon(ereignis(t)));
    if (j.some((v, i) => i && v >= j[i - 1])) m.push("Reihe nicht vom ältesten zum jüngsten");
    if (j.some((v, i) => i && j[i - 1] / v < 1.25)) m.push("Zeiten zu nah");
  }
  if (a.art === "leiter") {
    const j = jahreVon(ereignis(a.text));
    const unten = SPROSSEN[a.richtig], oben = a.richtig === 5 ? ERDALTER : SPROSSEN[a.richtig + 1];
    if (!(j > unten && j < oben) && !(a.richtig === 5 && j === ERDALTER)) m.push("Abschnitt der Leiter falsch");
  }
  if (a.art === "zeitalter") {
    const e = ereignis(a.text);
    const z = ZEITALTER.find(x => x.name === a.richtig);
    if (e.grenze) m.push("Grenz-Ereignis beim Zeitalter");
    const mio = jahreVon(e) / 1e6;
    if (!(mio <= z.von && mio >= z.bis)) m.push("Zeitalter passt nicht zur Zeit");
  }
  if (a.art === "tag") {
    einmal(a.optionen, a.richtig);
    if (tagText(jahreVon(ereignis(a.text))) !== a.richtig) m.push("Uhrzeit falsch");
  }
  if (a.art === "tagRueck") {
    einmal(a.optionen, a.richtig);
    if (a.optionen.filter(t => tagText(jahreVon(ereignis(t))) === a.uhr).length !== 1) m.push("Uhrzeit passt nicht zu genau einem Ereignis");
  }
  if (a.art === "abstand") {
    einmal(a.optionen, a.richtig);
    const [x, y] = a.texte.map(t => jahreVon(ereignis(t)));
    if (x - y !== a.richtig) m.push("Abstand falsch");
    if (a.optionen.some(d => !Number.isInteger(d) || d <= 0)) m.push("Abstand keine ganze Zahl");
  }
  return m;
}

// ---------- Darstellung ----------

/** Karte eines Ereignisses; mit Zeit, wenn zahl. */
function ereignisKarte(text, zahl) {
  const e = ereignis(text);
  return el("div", { class: "ez-ereignis auftrag" }, el("span", { class: "ez-bild", "aria-hidden": "true", text: e.bild }), e.text,
    zahl ? el("small", { text: vorText(e) }) : null);
}

const TIPP_ORDNEN = "Überlege: Was musste es schon geben, damit das andere passieren konnte? Zuerst Leben im Meer, dann an Land …";
const TIPP_ZAHLEN = "Vergleiche die Zeiten: Millionen Jahre sind viel mehr als Tausende Jahre.";

function zeigeFrueher(ctx, a) {
  const loesung = `Zuerst: ${a.richtig}`;
  ctx.kennung(`frueher|${[...a.optionen].sort().join("|")}`);
  ctx.flaeche.append(el("div", { class: "frage", html: "Was war <b>früher</b>?" }));
  LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 220,
    inhalt: t => { const e = ereignis(t); return { bild: e.bild, text: e.text }; },
    hinweis: TIPP_ORDNEN, loesung,
    lob: `Richtig! ${a.optionen.map(t => `${ereignis(t).bild} ${vorText(ereignis(t))}`).join(", ")}.` });
}

function zeigeOrdnen(ctx, a) {
  ctx.kennung(`ordnen|${a.reihe.join("|")}|${a.zahlen}`);
  ctx.flaeche.append(el("div", { class: "frage", html: `Ordne die ${a.reihe.length} Ereignisse: <b>das älteste zuerst</b>.` }));
  LS.reihenfolge(ctx, {
    reihe: a.reihe, pfeile: true, breite: 180,
    inhalt: t => { const e = ereignis(t); return { bild: e.bild, text: e.text, klein: a.zahlen ? vorText(e) : null }; },
    ablage: t => ereignis(t).bild,
    hinweis: a.zahlen ? TIPP_ZAHLEN : TIPP_ORDNEN,
    loesung: a.reihe.map(t => `${ereignis(t).bild} ${t}`).join(" → "),
    lob: `Richtig! ${a.reihe.map(t => `${ereignis(t).bild} ${vorText(ereignis(t))}`).join(" · ")}`,
  }).box.classList.add("ez-ordnen"); // auf dem Handy zwei Karten nebeneinander (BH3 a)
}

/** Leiter mit gestauchter Skala; das Kind tippt den Abschnitt an. */
function zeigeLeiter(ctx, a) {
  const e = ereignis(a.text);
  const j = jahreVon(e);
  const loesung = `${e.text} ${vorText(e)}: zwischen ${ABSCHNITT_TEXT(a.richtig)}`;
  ctx.kennung(`leiter|${a.text}|${a.zahl}`);
  ctx.loesung(loesung);
  ctx.schritte(1);
  const svg = S("svg", { class: "ez-leiter", viewBox: "0 0 320 345", role: "img", "aria-label": "Erdzeit-Leiter" });
  // Ab 700 px Breite stehen Karte und Erklärung neben der Leiter (BH3 a).
  ctx.flaeche.append(el("div", { class: "frage", html: "Wo gehört das auf die <b>Erdzeit-Leiter</b>?" }),
    el("div", { class: "ez-leiter-zeile" }, el("div", { class: "ez-leiter-text" }, ereignisKarte(a.text, a.zahl),
      el("div", { class: "ez-erklaerung", text: "Die Leiter ist gestaucht: Jede Sprosse liegt zehnmal so weit zurück wie die darunter." })), svg));
  const baender = [];
  for (let i = 0; i < 6; i++) {
    const unten = yVon(SPROSSEN[i]), oben = i === 5 ? yVon(ERDALTER) : yVon(SPROSSEN[i + 1]);
    const r = S("rect", { class: "ez-band", x: 130, y: oben, width: 150, height: unten - oben, rx: 6, "data-abschnitt": i });
    baender.push(r);
    svg.append(r);
  }
  svg.append(
    S("line", { class: "ez-holm", x1: 150, y1: yVon(ERDALTER) - 4, x2: 150, y2: 330 }),
    S("line", { class: "ez-holm", x1: 260, y1: yVon(ERDALTER) - 4, x2: 260, y2: 330 }),
    ...SPROSSEN.map(s => S("line", { class: "ez-sprosse", x1: 150, y1: yVon(s), x2: 260, y2: yVon(s), "pointer-events": "none" })),
    ...SPROSSEN.map(s => S("text", { class: "ez-zahl", x: 122, y: yVon(s), text: sprossenText(s) })),
    S("text", { class: "ez-zahl", x: 122, y: yVon(ERDALTER), text: `${sprossenText(ERDALTER)} 🌍` }),
    S("text", { class: "ez-heute", x: 205, y: 342, text: "⋮ heute" }),
  );
  let fertig = false;
  baender.forEach((r, i) => r.addEventListener("click", () => {
    if (fertig || r.classList.contains("falsch")) return;
    if (i === a.richtig) {
      fertig = true;
      r.classList.add("richtig");
      svg.append(S("text", { x: 205, y: yVon(j) + 7, "text-anchor": "middle", "font-size": 20, text: e.bild }));
      ctx.richtig(`Richtig: ${vorText(e)}.`);
      return;
    }
    r.classList.add("falsch");
    ctx.falsch(a.zahl ? (i < a.richtig ? "Das ist zu nah an heute. Die Zahl ist grösser: Geh höher hinauf." : "Das ist zu weit zurück. Die Zahl ist kleiner: Geh weiter hinunter.")
      : (i < a.richtig ? "Das ist zu nah an heute. Es ist viel länger her." : "So lange ist es noch nicht her. Geh weiter hinunter."), loesung);
    if (ctx.vorbei()) fertig = true;
  }));
}

function zeigeZeitalter(ctx, a) {
  const e = ereignis(a.text);
  const z = ZEITALTER.find(x => x.name === a.richtig);
  ctx.kennung(`zeitalter|${a.text}|${a.zahl}`);
  ctx.flaeche.append(el("div", { class: "frage", html: "In welches <b>Zeitalter</b> gehört das?" }));
  LS.koerbe(ctx, {
    karte: { bild: e.bild, text: a.zahl ? `${e.text} (${vorText(e)})` : e.text },
    koerbe: ZEITALTER.map(x => x.name), richtig: a.richtig,
    korbInhalt: n => { const x = ZEITALTER.find(y => y.name === n); return { bild: x.bild, text: x.name, klein: a.zahl ? zeitalterSpanne(x) : null }; },
    hinweis: n => (a.zahl ? `${n}: ${zeitalterSpanne(ZEITALTER.find(y => y.name === n))}. Passt die Zeit dazu?`
      : "Denk an die Tiere: Die Erdurzeit hat nur Einzeller und weiche Tiere, das Erdaltertum Fische und erste Landtiere, das Erdmittelalter die Dinosaurier."),
    loesung: `${z.name} (${zeitalterSpanne(z)})`,
  });
}

const TAG_SATZ = "Stell dir die ganze Erdgeschichte als einen Tag vor: Um 0 Uhr entsteht die Erde, um Mitternacht ist heute.";

function zeigeTag(ctx, a) {
  const e = ereignis(a.text);
  ctx.kennung(`tag|${a.text}`);
  ctx.flaeche.append(el("div", { class: "ez-erklaerung", text: TAG_SATZ }), el("div", { class: "frage", html: "<b>Um wie viel Uhr</b> geschieht das?" }), ereignisKarte(a.text, true));
  LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 170, inhalt: t => ({ text: t }),
    hinweis: `Die ganze Erdgeschichte sind ${dauerText(ERDALTER)}. Welcher Teil davon ist ${dauerText(jahreVon(e))}? So viel fehlt bis Mitternacht.`,
    loesung: `${e.bild} ${a.richtig}` });
}

function zeigeTagRueck(ctx, a) {
  ctx.kennung(`tagRueck|${a.uhr}|${[...a.optionen].sort().join("|")}`);
  ctx.flaeche.append(el("div", { class: "ez-erklaerung", text: TAG_SATZ }), el("div", { class: "frage", html: `Was geschieht auf der Erd-Uhr um <b>${a.uhr}</b>?` }));
  LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 220,
    inhalt: t => { const e = ereignis(t); return { bild: e.bild, text: e.text, klein: vorText(e) }; },
    hinweis: "Je später am Tag, desto näher an heute. Was ist kurz vor Mitternacht, was am Morgen?",
    loesung: `${a.uhr}: ${a.richtig}` });
}

function zeigeAbstand(ctx, a) {
  const [x, y] = a.texte.map(ereignis);
  ctx.kennung(`abstand|${a.texte.join("|")}`);
  ctx.flaeche.append(el("div", { class: "frage", html: "Wie viel Zeit liegt <b>dazwischen</b>? Schätze!" }), ereignisKarte(x.text, true), ereignisKarte(y.text, true));
  LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 190, inhalt: d => ({ text: `etwa ${dauerText(d)}` }),
    hinweis: "Rechne grob: die grössere Zeit minus die kleinere. Achte auf Millionen und Tausende!",
    loesung: `${dauerText(jahreVon(x))} − ${dauerText(jahreVon(y))} = ${dauerText(a.richtig)}` });
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Denkwege (was musste es schon geben, Zahlen vergleichen),
 * keine Zuordnung Tier → Zeitalter wie im Hinweis nach einem Fehler — die verriete die Lösung.
 */
function tippsFuer(a) {
  switch (a.art) {
    case "frueher": return ["Was musste es schon geben, damit das andere passieren konnte?", "Stell dir die Erde ganz am Anfang vor: heiss und ohne Leben. Was davon kam zuerst dazu?"];
    case "ordnen": return a.zahlen ? [TIPP_ZAHLEN, "Die grösste Zeit ist am längsten her — sie kommt zuerst."] : ["Such zuerst das Ereignis, das am längsten her ist.", TIPP_ORDNEN];
    case "leiter": return a.zahl
      ? ["Lies die Zeit auf der Karte und vergleiche sie mit den Zahlen an den Sprossen.", "Such die zwei Sprossen, zwischen denen die Zeit liegt. Achte auf Millionen und Tausende!"]
      : ["Jede Sprosse liegt zehnmal so weit zurück wie die darunter.", "Ist es eher Tausende oder Millionen Jahre her? Was gab es davor, was danach?"];
    case "zeitalter": return a.zahl
      ? ["Lies die Zeit auf der Karte.", "Vergleiche sie mit den Zeiten bei den Körben. Wo passt sie hinein?"]
      : ["Denk an die Tiere und Pflanzen, die es damals gab.", "Die Reihenfolge: Erdurzeit, Erdaltertum, Erdmittelalter, Erdneuzeit. Was gab es damals schon, was noch nicht?"];
    case "tag": {
      const e = ereignis(a.text);
      return ["Je länger es her ist, desto früher am Tag.", `Die ganze Erdgeschichte sind ${dauerText(ERDALTER)}. Welcher Teil davon ist ${dauerText(jahreVon(e))}? So viel fehlt bis Mitternacht.`];
    }
    case "tagRueck": return ["Je später am Tag, desto näher an heute.", "Was ist kurz vor Mitternacht, was am Morgen? Vergleiche die Zeiten auf den Karten."];
    case "abstand": return ["Rechne grob: die grössere Zeit minus die kleinere.", "Achte auf Millionen und Tausende! Ist eine Zeit viel kleiner als die andere, zählt fast nur die grössere."];
  }
  return [];
}

const ZEIGE = { frueher: zeigeFrueher, ordnen: zeigeOrdnen, leiter: zeigeLeiter, zeitalter: zeigeZeitalter, tag: zeigeTag, tagRueck: zeigeTagRueck, abstand: zeigeAbstand };
const ARTEN_JE_STUFE = Object.fromEntries(Object.keys(STUFE).map(s => [s, new Set(STUFE[s].map(f => f()?.art).filter(Boolean)).size]));

const STUFEN_TEXT = {
  s1: "Zwei Ereignisse: Was war früher, Dinosaurier oder Menschen? (4. Klasse)",
  s2: "Drei Ereignisse ordnen: das älteste zuerst.",
  s3: "Auf der Erdzeit-Leiter einordnen: 450 Millionen Jahre — wo ist das?",
  s4: "Zeitalter: Erdaltertum, Erdmittelalter, Erdneuzeit — und vier ordnen.",
  s5: "Die Erdgeschichte als ein Tag: Um wie viel Uhr kamen die Dinosaurier? (6. Klasse)",
  s6: "Endgegner: fünf Ereignisse ohne Zahlen, Zeitalter ohne Hilfe.",
};
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));

LS.spiel({
  id: "erdzeit-leiter",
  hilfe: "Tippe die passende Antwort an oder lege die Karte in den passenden Korb. Beim Ordnen tippst du die Ereignisse der Reihe nach an, das älteste zuerst. Auf der Erdzeit-Leiter tippst du den Abschnitt an, in den das Ereignis gehört.",
  einleitung: "Die Erde ist unvorstellbar alt: etwa 4600 Millionen Jahre! Klettere die Erdzeit-Leiter hinauf und ordne, was wann geschah.",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    if (ctx.nr === 0) ctx.sag("Tipp: Zuerst gab es nur Leben im Meer, dann an Land. Die Menschen kamen ganz zum Schluss.");
    const a = aufgabeErzeugen(ctx.stufe);
    if (ARTEN_JE_STUFE[ctx.stufe] > 1) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    ZEIGE[a.art](ctx, a);
  },
});
</script>
