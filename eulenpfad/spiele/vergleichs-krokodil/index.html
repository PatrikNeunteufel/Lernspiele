<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vergleichs-Krokodil</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  /* minmax(0, …) und kleinere Schrift unter 480 px: Stufe 6 („8 000 000 + 530 000“) lief auf dem Handy seitlich über (LERN_Session13) */
  .vergleich { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; max-width: 720px; margin: 8px auto 18px; }
  .seite { text-align: center; font-size: clamp(20px, 5.6vw, 48px); font-weight: 900; font-variant-numeric: tabular-nums; background: #fff; border-radius: 18px; padding: 12px 6px; box-shadow: var(--schatten); }
  .seite .punkte { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 180px; margin: 0 auto; font-size: 30px; line-height: 1; }
  /* nicht .mitte: so heisst im Rahmen die zentrierte Schlusskarte */
  .kroko-mitte { width: clamp(70px, 16vw, 110px); height: clamp(70px, 16vw, 110px); border-radius: 50%; border: 4px dashed #c5c9de; display: flex; align-items: center; justify-content: center; font-size: clamp(44px, 10vw, 70px); font-weight: 900; color: var(--gut); }
  .kroko-mitte.krokodil { border-style: solid; border-color: var(--gut); background: var(--gut-hell); }
  .zeichen-wahl { display: flex; justify-content: center; gap: 14px; }
  .zeichen-wahl button { width: 92px; height: 80px; border: none; border-radius: 18px; font-family: inherit; font-size: 46px; font-weight: 900; background: #fff; color: var(--text); box-shadow: 0 6px 0 var(--rand); cursor: pointer; }
  .zeichen-wahl button.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .zeichen-wahl small { display: block; font-size: 12px; font-weight: 700; color: var(--text-leise); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🐊 Vergleichs-Krokodil</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.1.A.1: a Anzahlen vergleichen (grösser, kleiner, gleich viele), c die Begriffe
// „grösser als“, „kleiner als“ und die Symbole <, >; MA.1.A.2.e/f Zahlen bis 1000 bzw. 1 Million ordnen.
// Das Krokodil öffnet sein Maul immer zur grösseren Zahl.

const { zahlText, zufall, waehle, el } = LS;

// Je Stufe: Erzeuger für die beiden Seiten { text, wert }, grösster vorkommender Wert, Rechnungen?
// Stufe 3 ist das Lernziel der 4. Klasse (MA.1.A.2.f: bis 1 Million ordnen), Stufe 1 die 3. Klasse (bis 1000).
const STUFE = {
  s1: { paar: () => zahlenPaar(100, 1000), max: 999 },
  s2: { paar: () => zahlenPaar(1000, 10000), max: 9999 },
  s3: { paar: () => zahlenPaar(10000, 1000000), max: 999999 },
  s4: { paar: () => kniffligesPaar(), max: 1000000 },
  s5: { paar: () => termPaar(false), max: 9999, rechnen: true },
  s6: { paar: () => termPaar(true), max: 10000000, rechnen: true },
};

/** Zwei Zahlen, oft mit gleichen Anfangsziffern, damit man Stelle für Stelle vergleichen muss. */
function zahlenPaar(min, max) {
  const a = zufall(min, max - 1);
  let b;
  const r = Math.random();
  if (r < 0.15) b = a;
  else if (r < 0.6 && a >= 10) {
    // gleiche Länge, nur eine Stelle verschieden (z. B. 47 382 / 47 832)
    const s = String(a).split("");
    const i = zufall(1, s.length - 1);
    s[i] = String((Number(s[i]) + zufall(1, 9)) % 10);
    b = Number(s.join(""));
  } else b = zufall(min, max - 1);
  return [{ text: zahlText(a), wert: a }, { text: zahlText(b), wert: b }];
}

const zahlSeite = n => ({ text: zahlText(n), wert: n });

/**
 * Knifflig bis zur Million: nur eine hintere Stelle verschieden, zwei Ziffern vertauscht
 * (47 382 / 47 832) oder die Längenfalle (99 870 / 100 020).
 */
function kniffligesPaar() {
  const r = Math.random();
  if (r < 0.15) { const a = zufall(100000, 999999); return [zahlSeite(a), zahlSeite(a)]; }
  if (r < 0.75) {
    const s = String(zufall(100000, 999999)).split("");
    const t = s.slice();
    const i = zufall(2, s.length - 2);
    if (r < 0.45 || s[i] === s[i + 1]) t[i] = String((Number(t[i]) + zufall(1, 9)) % 10);
    else [t[i], t[i + 1]] = [t[i + 1], t[i]];
    return [zahlSeite(Number(s.join(""))), zahlSeite(Number(t.join("")))];
  }
  if (r < 0.9) {
    // Viele Neuner gegen eine Stelle mehr: Wer mehr Stellen hat, ist grösser.
    const z = 10 ** zufall(4, 5);
    const a = z - zufall(1, z / 100), b = z + zufall(0, z / 100);
    return Math.random() < 0.5 ? [zahlSeite(a), zahlSeite(b)] : [zahlSeite(b), zahlSeite(a)];
  }
  return [zahlSeite(zufall(100000, 999999)), zahlSeite(zufall(100000, 999999))];
}

/**
 * Rechnungen vergleichen: 300 · 4 ? 1000 + 250. Königsstufe (gross): bis 10 Millionen, und oft
 * steht gegenüber eine Zahl, die nur knapp neben dem Ergebnis liegt.
 */
function termPaar(gross) {
  const klein = [
    () => { const x = zufall(2, 9) * 100, y = zufall(2, 9); return { text: `${zahlText(x)} · ${y}`, wert: x * y }; },
    () => { const x = zufall(1, 9) * 1000, y = zufall(1, 9) * 50; return { text: `${zahlText(x)} + ${y}`, wert: x + y }; },
    () => { const x = zufall(2, 9) * 1000, y = zufall(1, 9) * 100; return { text: `${zahlText(x)} − ${y}`, wert: x - y }; },
    () => { const y = zufall(2, 9), q = zufall(2, 9) * 100; return { text: `${zahlText(q * y)} : ${y}`, wert: q }; },
  ];
  const koenig = [
    () => { const x = zufall(2, 9) * 10 ** zufall(3, 5), y = zufall(2, 9); return { text: `${zahlText(x)} · ${y}`, wert: x * y }; },
    () => { const x = waehle([25, 50, 125]) * 10 ** zufall(2, 3), y = waehle([4, 8, 40, 80]); return { text: `${zahlText(x)} · ${y}`, wert: x * y }; },
    () => { const x = zufall(1, 8) * 1000000, y = zufall(1, 99) * 10000; return { text: `${zahlText(x)} + ${zahlText(y)}`, wert: x + y }; },
    () => { const x = zufall(2, 9) * 1000000, y = zufall(1, 9) * 100000 + zufall(1, 9) * 1000; return { text: `${zahlText(x)} − ${zahlText(y)}`, wert: x - y }; },
    () => { const y = zufall(2, 9), q = zufall(11, 99) * 10000; return { text: `${zahlText(q * y)} : ${y}`, wert: q }; },
  ];
  const term = () => waehle(gross ? koenig : klein)();
  const a = term();
  const r = Math.random();
  if (r < 0.15) return [a, zahlSeite(a.wert)];
  // Königsstufe: knapp daneben (± 1, 10 oder 1000) — nur genaues Rechnen hilft.
  if (gross && r < 0.45) {
    const d = waehle([1, 10, 1000]);
    // Nach oben nur, solange die Zahl unter 10 Millionen bleibt.
    const n = a.wert + d < 10000000 && Math.random() < 0.5 ? a.wert + d : a.wert - d;
    return Math.random() < 0.5 ? [a, zahlSeite(n)] : [zahlSeite(n), a];
  }
  return [a, term()];
}

/** Für das Testskript: ein Paar der Stufe. */
function aufgabeErzeugen(stufe) { return STUFE[stufe].paar(); }

function pruefeAufgabe(paar, stufe) {
  const m = [];
  const p = STUFE[stufe];
  for (const s of paar) {
    // Text nachrechnen: schmale Leerzeichen weg, Rechenzeichen in JavaScript-Schreibweise.
    const ausdruck = s.text.replace(/[\s ]/g, "").replace(/·/g, "*").replace(/−/g, "-").replace(/:/g, "/");
    if (!/^[\d*+\-/]+$/.test(ausdruck)) { m.push(`Text «${s.text}» nicht lesbar`); continue; }
    const wert = Function(`return ${ausdruck}`)();
    if (wert !== s.wert) m.push(`«${s.text}» ergibt ${wert}, nicht ${s.wert}`);
    if (!Number.isInteger(s.wert) || s.wert < 1 || s.wert > p.max) m.push(`Wert ${s.wert} ausserhalb 1–${p.max}`);
    if (!p.rechnen && /[·+−:]/.test(s.text)) m.push("Rechnung in einer Stufe ohne Rechnungen");
  }
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Stelle für Stelle vergleichen bzw. zuerst rechnen —
 * ohne die Wörter der Knöpfe („kleiner“, „gleich“, „grösser“), damit kein Tipp nach einer Antwort klingt.
 */
function tippsFuer(stufe) {
  if (!STUFE[stufe].rechnen) return ["Zähl zuerst die Ziffern. Die Zahl mit mehr Ziffern ist mehr wert.",
    "Haben beide dieselbe Anzahl Ziffern, vergleiche von links Stelle für Stelle: Die erste Ziffer, die verschieden ist, entscheidet.",
    "Das offene Maul zeigt immer zur grösseren Zahl."];
  return ["Rechne zuerst beide Seiten aus — ganz genau.",
    "Bei · und : hilft es, zuerst ohne die Nullen zu rechnen und sie dann wieder anzuhängen.",
    stufe === "s6" ? "Schau genau hin: Manchmal liegt die Zahl nur ganz knapp neben dem Ergebnis. Vergleiche Stelle für Stelle."
      : "Vergleiche dann die zwei Ergebnisse Stelle für Stelle."];
}

LS.spiel({
  id: "vergleichs-krokodil",
  hilfe: "Schau beide Seiten an und tippe das Zeichen, das in die Mitte gehört: < (kleiner als), = (gleich) oder > (grösser als). Das Maul des Krokodils zeigt zur grösseren Zahl.",
  einleitung: "Das hungrige Krokodil frisst immer die grössere Zahl! Wähle das richtige Zeichen: < (kleiner als), > (grösser als) oder = (gleich).",
  anzahl: 10,
  stufen: {
    s1: "Zahlen bis 1000.",
    s2: "Vierstellige Zahlen: 4527 oder 4572?",
    s3: "Grosse Zahlen bis zur Million: 47 382 oder 47 832?",
    s4: "Knifflig bis zur Million: 99 870 oder 100 020?",
    s5: "Rechnungen vergleichen: 300 · 4 oder 1000 + 250?",
    s6: "Rechnungen mit Millionen: 125 000 · 8 oder 999 999?",
  },

  aufgabe(ctx) {
    const [a, b] = STUFE[ctx.stufe].paar();
    const richtig = a.wert < b.wert ? "<" : a.wert > b.wert ? ">" : "=";
    ctx.serie("antwort", richtig);
    const rechnen = STUFE[ctx.stufe].rechnen;
    const loesung = `${a.text} ${richtig} ${b.text}${rechnen ? ` (${zahlText(a.wert)} ${richtig} ${zahlText(b.wert)})` : ""}`;
    ctx.loesung(loesung);
    ctx.schritte(1); // ein Zeichen antippen
    ctx.tipp(tippsFuer(ctx.stufe));
    const seite = x => x.punkte ? el("div", { class: "seite" }, el("div", { class: "punkte", text: x.punkte })) : el("div", { class: "seite", text: x.text });
    const mitte = el("div", { class: "kroko-mitte", text: "?" });
    ctx.flaeche.append(el("div", { class: "vergleich" }, seite(a), mitte, seite(b)));

    let fertig = false;
    const wahl = el("div", { class: "zeichen-wahl" });
    for (const [z, wort] of [["<", "kleiner"], ["=", "gleich"], [">", "grösser"]]) {
      const k = el("button", { type: "button" }, z, el("small", { text: wort }));
      k.addEventListener("click", () => {
        if (fertig) return;
        if (z === richtig) {
          fertig = true;
          mitte.textContent = z;
          mitte.classList.add("krokodil");
          ctx.richtig(z === "=" ? "Gleich gross — das Krokodil kann sich nicht entscheiden!" : "Happs! 🐊");
          return;
        }
        k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch");
        const hinweis = rechnen ? "Rechne zuerst beide Seiten aus — ganz genau." :
          "Vergleiche Stelle für Stelle von links: Zuerst die Anzahl Ziffern, dann die erste Ziffer, die verschieden ist.";
        ctx.falsch(hinweis, loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      wahl.append(k);
    }
    ctx.flaeche.append(wahl);
    LS.kurztasten(wahl); // < = > auf Y X C (erster Text des Knopfs ist das Zeichen)
    if (ctx.nr === 0) ctx.sag("Das Maul (die offene Seite) zeigt immer zur grösseren Zahl: 3 < 5.");
  },
});
</script>
</body>
</html>
