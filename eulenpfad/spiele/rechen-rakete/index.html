<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rechen-Rakete</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .start-zeile { display: flex; gap: 16px; align-items: stretch; }

  /* Flugbahn: die Rakete steigt mit jeder gelösten Aufgabe */
  .bahn {
    position: relative;
    flex: none;
    width: 58px;
    border-radius: 999px;
    background: linear-gradient(180deg, #1e1b4b, #4338ca 60%, #93c5fd);
    overflow: hidden;
  }

  .bahn::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 12%, #fff 0 1.5px, transparent 2px),
      radial-gradient(circle at 70% 25%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 40% 40%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 65% 6%, #fff 0 1.5px, transparent 2px);
  }

  .rakete {
    position: absolute;
    left: 50%;
    font-size: 34px;
    transform: translate(-50%, 50%) rotate(-45deg);
    transition: bottom .8s cubic-bezier(.3, 1.4, .5, 1);
  }

  .inhalt { flex: 1; min-width: 0; }

  .rechnung {
    text-align: center;
    font-size: clamp(30px, 7.5vw, 58px);
    font-weight: 900;
    margin: 4px 0 14px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🚀 Rechen-Rakete</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.1.A.3: Stufe b „bis 100 ohne 10er-Übergänge addieren und subtrahieren“,
// Stufe c „im Zahlenraum bis 100 … addieren und subtrahieren“, Stufe e „bis 4 Wertziffern im Kopf
// addieren und subtrahieren (z.B. 320'000 + 38'000; 402 + 90)“ und multiplizieren/dividieren.
// Wertziffern = Ziffern ungleich 0 (320 000 hat zwei: 3 und 2).

const { zahlText, zufall, waehle, el, zerlege, STELLEN } = LS;

/** Zahl mit genau w Wertziffern (aufeinanderfolgend, erste ≠ 0), verschoben um 10^stelle. */
function mitWertziffern(w, stelle) {
  let n = zufall(1, 9);
  for (let i = 1; i < w; i++) n = n * 10 + zufall(1, 9);
  return n * 10 ** stelle;
}

const wertziffern = n => String(n).replace(/0/g, "").length;

// Je Stufe: Zahlenraum (grösste Zahl a mindestens 'min', Ergebnis unter 'max'), Rechenarten,
// höchstens 'wz' Wertziffern in a und b zusammen ('wb': davon höchstens so viele in b),
// 'drei': Stufe der 3. Klasse (bis 100 mit Übergang, bis 1000 mit Zehnern), 'knapp': kurze Hinweise.
const STUFE = {
  s1: { min: 15, max: 1000, arten: ["+", "−"], drei: true },
  s2: { min: 100, max: 10000, arten: ["+", "−"], wz: 3, wb: 1 },
  s3: { min: 300, max: 10000, arten: ["+", "−"], wz: 4 },
  s4: { min: 10000, max: 1000000, arten: ["+", "−"], wz: 4 },
  s5: { min: 100, max: 1000000, arten: ["+", "−", "×", ":"], wz: 4 },
  // Königsstufe: bis knapp 10 Millionen, fünf Wertziffern, Teiler auch 25, 50 oder Zehner.
  s6: { min: 10000, max: 10000000, arten: ["+", "−", "×", ":"], wz: 5, gross: true, knapp: true },
};

const rechne = (a, art, b) => art === "+" ? a + b : art === "−" ? a - b : art === "×" ? a * b : a / b;

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const { min, max, arten } = p;
  const art = waehle(arten);
  for (let versuch = 0; versuch < 2000; versuch++) {
    let a, b;
    if (p.drei) {
      // bis 100 mit Übergang oder Hunderter/Zehner bis 1000 (340 + 50, 700 − 30)
      if (Math.random() < 0.5) { a = zufall(15, 85); b = zufall(6, 39); }
      else { a = zufall(11, 95) * 10; b = zufall(1, 9) * 10; }
    } else if (art === "+" || art === "−") {
      // höchstens wz Wertziffern; b liegt an derselben oder einer tieferen Stelle als a
      const wa = zufall(1, Math.min(3, p.wz - 1)), wb = zufall(1, Math.min(p.wb || 9, p.wz - wa));
      // hoch: Exponent der höchsten Stelle unter 'max' (bei 10 000 die Tausender); die erste
      // Wertziffer von a steht bei 10^(sa + wa − 1) und darf bis dorthin reichen.
      const hoch = Math.max(wa - 1, Math.floor(Math.log10(max)) - 1);
      const sa = zufall(0, Math.max(0, hoch - wa + 1));
      const sb = zufall(Math.max(0, sa - 2), sa + wa - 1);
      a = mitWertziffern(wa, sa);
      b = mitWertziffern(wb, Math.max(0, sb - wb + 1));
    } else if (art === "×") {
      // z. B. 40 × 300, 25 × 40; Königsstufe auch 300 × 4000 = 1 200 000
      const wa = zufall(1, 2), wb = zufall(1, 2);
      a = mitWertziffern(wa, zufall(0, p.gross ? 3 : 2));
      b = mitWertziffern(wb, zufall(0, p.gross ? 3 : 2));
    } else {
      // z. B. 2400 : 6 — Teiler einstellig, Ergebnis mit 1–2 Wertziffern; Königsstufe: 4 800 000 : 60
      b = p.gross ? waehle([zufall(2, 9), zufall(2, 9) * 10, 25, 50]) : zufall(2, 9);
      const q = mitWertziffern(zufall(1, 2), zufall(0, p.gross ? 4 : 3));
      a = q * b;
    }
    if (art === "−" && b > a) [a, b] = [b, a];
    const ergebnis = rechne(a, art, b);
    if (ergebnis <= 0 || ergebnis >= max || a >= max || Math.max(a, ergebnis) < min) continue;
    if (!p.drei && wertziffern(a) + wertziffern(b) > p.wz) continue;
    if (art === "−" && a === b) continue;
    // Ab Stufe 2 keine trivialen Aufgaben wie 330 + 1: b höchstens zwei Stellen kleiner als a.
    if ((art === "+" || art === "−") && !p.drei && b * 100 < a) continue;
    return { a, b, art, ergebnis };
  }
  // Notausgang (praktisch nie): 3·10^k + 10^k mit 10^k ≥ min liegt in jeder Stufe im Zahlenraum.
  const z = 10 ** Math.ceil(Math.log10(min));
  return { a: 3 * z, b: z, art: "+", ergebnis: 4 * z };
}

function pruefeAufgabe(x, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p.arten.includes(x.art)) m.push("Rechenart nicht erlaubt");
  if (rechne(x.a, x.art, x.b) !== x.ergebnis) m.push("Ergebnis stimmt nicht");
  if (!Number.isInteger(x.ergebnis) || x.ergebnis <= 0 || x.ergebnis >= p.max) m.push(`Ergebnis ausserhalb 1–${p.max - 1}`);
  if (x.a >= p.max || Math.max(x.a, x.ergebnis) < p.min) m.push("Zahlenraum");
  if (String(x.ergebnis).length > 7) m.push("passt nicht in die Tastatur");
  if (!p.drei && wertziffern(x.a) + wertziffern(x.b) > p.wz) m.push("zu viele Wertziffern");
  if (p.wb && (x.art === "+" || x.art === "−") && wertziffern(x.b) > p.wb && wertziffern(x.a) > p.wb) m.push("b hat zu viele Wertziffern");
  return m;
}

/** Hinweis: den zweiten Summanden in seine Stellen zerlegen (320 000 + 30 000 + 8 000). */
function hinweisFuer(x, knapp) {
  if (knapp) return x.art === "×" || x.art === ":" ? "Rechne zuerst ohne die Nullen — und zähl sie genau!" : "Rechne Stelle für Stelle — und denk an den Übertrag!";
  if (x.art === "×") return `Rechne ohne Nullen (${String(x.a).replace(/0+$/, "")} × ${String(x.b).replace(/0+$/, "")}) und hänge dann alle Nullen an.`;
  if (x.art === ":") return `Welche Zahl mal ${x.b} gibt ${zahlText(x.a)}? Rechne zuerst ohne die Nullen.`;
  const teile = STELLEN.filter(st => zerlege(x.b)[st.k]).map(st => zerlege(x.b)[st.k] * st.wert);
  if (teile.length < 2) return `Rechne Stelle für Stelle. Welche Stelle ändert sich bei ${x.art} ${zahlText(x.b)}?`;
  return `Zerlege: ${zahlText(x.a)} ${x.art} ${teile.map(zahlText).join(` ${x.art} `)}`;
}

/** Tipps vor dem Antworten (ctx.tipp, LERN_Session9): erst die Strategie, dann der Hinweis (Zerlegen, ohne Nullen). */
function tippsFuer(x, knapp) {
  const anstoss = { "+": "Rechne Stelle für Stelle, zuerst die grossen Stellen.", "−": "Rechne Stelle für Stelle, zuerst die grossen Stellen.",
    "×": "Zähl zuerst die Nullen beider Zahlen.", ":": "Teilen ist die Umkehrung vom Malnehmen." }[x.art];
  return [anstoss, hinweisFuer(x, knapp)];
}

LS.spiel({
  id: "rechen-rakete",
  einleitung: "3, 2, 1 … Start! Jede richtige Antwort bringt die Rakete höher ins All. Rechne im Kopf!",
  hilfe: "Rechne die Aufgabe im Kopf und tippe das Ergebnis ein. Jede richtige Antwort bringt die Rakete ein Stück höher.",
  anzahl: 8,
  stufen: {
    s1: "Bis 100 mit Übergang und bis 1000 mit Zehnern: 47 + 28, 340 + 50.",
    s2: "Bis 10 000, die zweite Zahl hat eine Wertziffer: 402 + 90, 3400 − 600.",
    s3: "Mit Wertziffern bis 10 000: 4020 + 390, 3450 − 600.",
    s4: "Bis zur Million: 320 000 + 38 000.",
    s5: "Auch mal und geteilt: 40 × 300, 2400 : 6.",
    s6: "Bis 10 Millionen, alle vier Rechenarten: 300 × 4000, 4 800 000 : 60.",
  },

  aufgabe(ctx) {
    const x = aufgabeErzeugen(ctx.stufe);
    ctx.serie("rechenart", x.art);
    const loesung = `${zahlText(x.a)} ${x.art} ${zahlText(x.b)} = ${zahlText(x.ergebnis)}`;
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(x, STUFE[ctx.stufe].knapp));
    ctx.schritte(LS.tippSchritte(x.ergebnis));
    const bahn = el("div", { class: "bahn", "aria-hidden": "true" });
    const rakete = el("div", { class: "rakete", text: "🚀" });
    bahn.append(rakete);
    const hoehe = n => `${8 + (n / 8) * 84}%`;
    rakete.style.bottom = hoehe(ctx.nr);

    const inhalt = el("div", { class: "inhalt" },
      el("div", { class: "rechnung", text: `${zahlText(x.a)} ${x.art} ${zahlText(x.b)} =` }));
    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Ergebnis" });
    inhalt.append(anzeige);
    ctx.flaeche.append(el("div", { class: "start-zeile" }, bahn, inhalt));

    const tasten = LS.tastatur({
      anzeige,
      maxStellen: 7,
      onOk(w) {
        if (w === x.ergebnis) {
          tasten.gesperrt = true;
          anzeige.classList.add("richtig");
          rakete.style.bottom = hoehe(ctx.nr + 1);
          ctx.richtig(ctx.nr === 7 ? "Die Rakete ist im All! 🌟" : undefined);
          return;
        }
        anzeige.classList.add("falsch");
        ctx.falsch(hinweisFuer(x, STUFE[ctx.stufe].knapp), loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
      },
    });
    ctx.flaeche.append(tasten.element);
    if (ctx.nr === 0) ctx.sag("Rechne im Kopf und tipp das Ergebnis ein.");
  },
});
</script>
</body>
</html>
