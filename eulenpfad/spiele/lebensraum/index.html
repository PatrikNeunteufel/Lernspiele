<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebensraum-Zuordnung</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 14px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🌳 Lebensraum-Zuordnung</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="../tier-sortierer/tiere.js"></script>
<script src="nahrung.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.2.1: b „Lebewesen ihren typischen Lebensräumen zuordnen (z.B. Wiese:
// Wildkräuter, Gräser, Insekten, Regenwurm, Käfer)“ (Grundanspruch 1. Zyklus); d erklären, welche
// Tiere voneinander abhängig sind (Nahrungsketten, Grundanspruch 2. Zyklus). Die Lebewesen stehen
// in tier-sortierer/tiere.js, die Nahrungsketten in nahrung.js.

const { waehle, mische, el } = LS;

// Landschaftsfarben (Deko, keine Stellenfarben)
const RAEUME = {
  Wald: { bild: "🌲", name: "Wald", farbe: "#2f7d4f" },
  Wiese: { bild: "🌼", name: "Wiese", farbe: "#7cb342" },
  Weiher: { bild: "💧", name: "Weiher und Bach", farbe: "#2f8fe0" },
  Gebirge: { bild: "🏔️", name: "Gebirge", farbe: "#7a6f9b" },
};
const ID = "lebensraum";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf — je Lebensraum
// eine Liste, dazu die Nahrungsketten. Kennt der Katalog die Listen des Spiels noch nicht, gilt der
// ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : LEBENSRAUM_LISTEN);
const LEBEWESEN = TIERE.map(([name, bild, klasse, , , lebensraum]) => ({ name, bild, klasse, lebensraum }))
  .filter(t => t.lebensraum && FREI.has(LEBENSRAUM_LISTE_JE_RAUM[t.lebensraum]));

const KETTEN = (FREI.has("nahrungsketten") ? NAHRUNGSKETTEN : []).map(k => k.map(([name, bild, pflanze]) => ({ name, bild, pflanze: !!pflanze })));
/** Alle Paare „frisst“: { esser, futter } aus allen Ketten. */
const FRISST = KETTEN.flatMap(k => k.slice(1).map((esser, i) => ({ esser: esser.name, futter: k[i] })));
const glied = name => KETTEN.flat().find(g => g.name === name);

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  /** Lebewesen aus einem der 'raeume', dazu weitere dieser Räume als Körbe, zusammen 'anzahl'. */
  zuordnen(raeume, anzahl, mitBild) {
    const w = waehle(LEBEWESEN.filter(t => raeume.includes(t.lebensraum) && (!mitBild || t.bild)));
    if (!w) return null;
    const auswahl = [w.lebensraum, ...mische(raeume.filter(r => r !== w.lebensraum)).slice(0, anzahl - 1)];
    return { art: "zuordnen", w, raeume: Object.keys(RAEUME).filter(r => auswahl.includes(r)) };
  },
  /** Nahrungskette mit 'laenge' Gliedern (null = jede); mitBild: nur Ketten, deren Glieder alle ein Bild haben. */
  kette(laenge, mitBild) {
    const kette = waehle(KETTEN.filter(k => (!laenge || k.length === laenge) && (!mitBild || k.every(g => g.bild))));
    return kette ? { art: "kette", kette } : null;
  },
  wasFrisst() {
    if (!FRISST.length) return null;
    const { esser, futter } = waehle(FRISST);
    const andere = futter.pflanze ? GROSSE_RAEUBER.filter(n => n !== esser) : NICHT_FUTTER;
    return { art: "wasFrisst", esser: glied(esser), richtig: futter, optionen: mische([futter, ...mische(andere).slice(0, 2).map(glied)]) };
  },
};

// Basisklasse 2: Stufe 1 = 1. Klasse, 2–4 = 2. Klasse, 5 = 3. Klasse, 6 Endgegner.
// Bis Stufe 4 (2. Klasse) trägt jedes Lebewesen ein Bild — ohne Lesetext lösbar.
const DREI = ["Wald", "Wiese", "Weiher"];
const VIER = ["Wald", "Wiese", "Weiher", "Gebirge"];
const BILD_NOETIG = ["s1", "s2", "s3", "s4"];
// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [() => ARTEN.zuordnen(DREI, 2, true)],
  s2: [() => ARTEN.zuordnen(DREI, 3, true)],
  s3: [() => ARTEN.zuordnen(VIER, 4, true)],
  s4: [() => ARTEN.kette(3, true), () => ARTEN.zuordnen(VIER, 4, true)],
  s5: [() => ARTEN.kette(4, false), ARTEN.wasFrisst],
  s6: [() => ARTEN.zuordnen(VIER, 4, false), () => ARTEN.kette(null, false), ARTEN.wasFrisst],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Zwei Lebensräume: Wald, Wiese oder Weiher.",
  s2: "Drei Lebensräume: Wald, Wiese, Weiher und Bach.",
  s3: "Vier Lebensräume: dazu das Gebirge.",
  s4: "Vier Lebensräume und kurze Nahrungsketten: Gras → Feldmaus → Fuchs.",
  s5: "Nahrungsketten mit vier Gliedern — und: Was frisst …?",
  s6: "Endgegner: alles gemischt, auch Tiere ohne Bild.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
/** Stufen, in denen die freien Listen mehr als eine Art hergeben (für ctx.serie). */
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (tiere.js, nahrung.js). */
function herkunft(a) {
  if (a.art === "zuordnen") {
    const zeile = TIERE.find(z => z[0] === a.w.name && z[5] === a.w.lebensraum);
    return [zeile ? LEBENSRAUM_LISTE_JE_RAUM[zeile[5]] : "?"];
  }
  const inKette = name => NAHRUNGSKETTEN.some(k => k.some(g => g[0] === name));
  const namen = a.art === "kette" ? a.kette.map(g => g.name) : [a.esser.name, ...a.optionen.map(o => o.name)];
  return [namen.every(inKette) ? "nahrungsketten" : "?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (a.art === "wasFrisst" && a.optionen.some(o => !o)) return [...m, "Auswahl unbekannt"];
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.art === "zuordnen") {
    if (!a.raeume.includes(a.w.lebensraum)) m.push("richtiger Lebensraum fehlt");
    if (BILD_NOETIG.includes(stufe) && !a.w.bild) m.push("Lebewesen ohne Bild bis Stufe 4");
  }
  if (a.art === "kette") {
    if (!a.kette[0].pflanze) m.push("Kette beginnt nicht mit einer Pflanze");
    if (BILD_NOETIG.includes(stufe) && a.kette.some(g => !g.bild)) m.push("Kettenglied ohne Bild bis Stufe 4");
    if (stufe === "s4" && a.kette.length !== 3) m.push("Stufe 4 verlangt eine Kette mit drei Gliedern");
    if (stufe === "s5" && a.kette.length !== 4) m.push("Stufe 5 verlangt eine Kette mit vier Gliedern");
  }
  if (a.art === "wasFrisst") {
    if (a.optionen.some(o => !o)) m.push("Auswahl unbekannt");
    else {
      const falscheFrisst = a.optionen.filter(o => o !== a.richtig && FRISST.some(f => f.esser === a.esser.name && f.futter.name === o.name));
      if (falscheFrisst.length) m.push("eine falsche Antwort steht in einer Kette als Futter");
      if (new Set(a.optionen.map(o => o.name)).size !== 3) m.push("doppelte Auswahl");
    }
    if (!ARTIKEL[a.esser.name]) m.push("Artikel fehlt");
  }
  return m;
}

const mitBild = g => (g.bild ? `${g.bild} ${g.name}` : g.name);

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Futter, Schutz, Reihenfolge der Kette. Bei „Was
 * frisst …?“ nichts über Pflanze oder Tier: Die Auswahl hat ein Futter und zwei Ablenker der anderen Art,
 * so ein Tipp wiese gleich auf die Lösung.
 */
function tippsFuer(a) {
  if (a.art === "kette") return ["Am Anfang steht immer eine Pflanze.",
    "Dann kommt das Tier, das die Pflanze frisst — und danach, wer dieses Tier frisst."];
  if (a.art === "wasFrisst") return ["Stell dir vor, wo das Tier lebt: Was findet es dort zu fressen?",
    "Denk an die Nahrungsketten: Wer steht direkt vor diesem Tier?"];
  return a.w.klasse === "Pflanze" || a.w.klasse === "Pilz"
    ? ["Wo wächst das? Ist der Boden dort schattig, sonnig oder nass?", "Denk an einen Spaziergang: Wo hast du es schon gesehen?"]
    : ["Wo findet das Tier Futter und Schutz?", "Denk an einen Spaziergang: Wo hast du es schon gesehen — zwischen Bäumen, im Gras, im Wasser oder hoch in den Bergen?"];
}

LS.spiel({
  id: "lebensraum",
  hilfe: "Leg das Lebewesen in den Lebensraum, wo man es am meisten findet. Bei einer Nahrungskette tippst du der Reihe nach an — der Pfeil heisst: wird gefressen von.",
  einleitung: "Wo wohnen Tiere und Pflanzen? Im Wald, auf der Wiese, im Weiher oder im Gebirge? Und wer frisst wen?",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
    if (a.art === "zuordnen" && a.raeume.length > 1 && a.raeume.length <= 3) ctx.serie("antwort", a.w.lebensraum);
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    if (a.art === "kette") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Wer wird von wem gefressen? Fang mit der Pflanze an." }));
      LS.reihenfolge(ctx, {
        reihe: a.kette, breite: 130, pfeile: true, ablage: mitBild,
        inhalt: g => ({ bild: g.bild || "", text: g.name }),
        hinweis: (g, erwartet) => (erwartet.pflanze ? "Am Anfang steht immer eine Pflanze." : `${erwartet.name} kommt zuerst — wer frisst wen?`),
        loesung: a.kette.map(g => g.name).join(" → "),
        lob: "Richtig! Jedes Tier frisst das, was links davon steht. 🌱",
      });
      if (ctx.nr === 0) ctx.sag("Der Pfeil heisst: wird gefressen von.");
      return;
    }
    if (a.art === "wasFrisst") {
      ctx.flaeche.append(el("div", { class: "frage", text: `Was frisst ${ARTIKEL[a.esser.name]} ${a.esser.name}?` }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 130,
        inhalt: g => ({ bild: g.bild || "", text: g.name }),
        hinweis: g => (g.pflanze ? `${g.name} ist kein Futter für ${a.esser.name}: Hier geht es um ein Tier, das gefressen wird.`
          : `${g.name} ist viel grösser — das ist kein Futter für ${a.esser.name}.`),
        loesung: `${a.richtig.name} → ${a.esser.name}`,
      });
      return;
    }
    ctx.flaeche.append(el("div", { class: "auftrag", text: "Wo lebt das?" }));
    const { karte } = LS.koerbe(ctx, {
      karte: { bild: a.w.bild || "❔", text: a.w.name },
      koerbe: a.raeume, richtig: a.w.lebensraum,
      korbInhalt: r => ({ bild: RAEUME[r].bild, text: RAEUME[r].name }),
      farbe: r => RAEUME[r].farbe,
      hinweis: a.w.klasse === "Pflanze" || a.w.klasse === "Pilz"
        ? `Hm, ${a.w.name} wächst meistens woanders. Wo ist der Boden passend — schattig, sonnig oder nass?`
        : `Hm, ${a.w.name} trifft man meistens woanders. Wo findet das Tier Futter und Schutz?`,
      loesung: `${a.w.name} lebt typisch im Lebensraum ${RAEUME[a.w.lebensraum].name}.`,
      lob: `Richtig: ${a.w.name} — ${RAEUME[a.w.lebensraum].name}.`,
    });
    // Name des Lebewesens ist Sachkunde, kein Lesestoff: Die Eule liest ihn mit vor (rahmen.md Abschnitt 12).
    karte.querySelector("b").classList.add("frage");
    if (ctx.nr === 0) ctx.sag("Tipp auf den Lebensraum, wo man es am meisten findet.");
  },
});
</script>
</body>
</html>
