<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlen-Baukasten</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .bausteine {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .baustein {
    border: none;
    cursor: pointer;
    background: var(--f);
    color: #fff;
    border-radius: 18px;
    padding: 12px 22px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 900;
    box-shadow: 0 6px 0 rgba(0, 0, 0, .18);
    min-width: 120px;
    line-height: 1.1;
    transition: transform .15s;
  }

  .baustein:hover { transform: translateY(-2px) rotate(-1deg); }
  .baustein small { display: block; font-size: 15px; font-weight: 700; opacity: .95; margin-top: 4px; min-height: 18px; }
  .baustein.lang { font-size: clamp(20px, 4vw, 26px); }
  .baustein-plus { font-size: 34px; font-weight: 900; color: var(--text-leise); }

  /* Kleine Stellenwerttabelle, die beim Tippen mitläuft */
  .mini-tabelle {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    max-width: 560px;
    margin: 12px auto 0;
  }

  .mini-tabelle div {
    text-align: center;
    border-radius: 10px;
    padding: 4px 0;
    font-weight: 900;
  }

  .mini-tabelle .k { background: var(--f); color: #fff; font-size: 16px; }
  .mini-tabelle .z { background: #f4f6fc; font-size: 26px; min-height: 42px; color: var(--f); }

  /* Ganze Aufgabe im Bild (BH3 a): auf dem Handy und auf niedrigen Bildschirmen kleinere Bausteine, damit
     auch fünf oder sechs in zwei, drei Reihen über der Tastatur Platz haben */
  @media (max-width: 560px), (max-height: 820px) {
    .bausteine { gap: 6px 4px; margin-bottom: 6px; }
    .baustein { min-width: 0; min-height: 44px; padding: 6px 10px; font-size: clamp(22px, 6vw, 30px); border-radius: 14px; box-shadow: 0 4px 0 rgba(0, 0, 0, .18); }
    .baustein.lang { font-size: 16px; }
    .baustein small { font-size: 15px; margin-top: 2px; min-height: 0; }
    .baustein small:empty { display: none; }
    .baustein-plus { font-size: 24px; }
    .mini-tabelle { margin-top: 6px; }
    .mini-tabelle .z { min-height: 36px; font-size: 24px; padding: 2px 0; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧱 Zahlen-Baukasten</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lernziel 4.2-G2: Abkürzungen und Werte der Wertziffern kennen und eine Zahl
// aus Teilen zusammensetzen (z. B. 3 ZT und 4 H = 30 400).

const { STELLEN, zahlText, zufall, mische, zerlege, el } = LS;
const nurStellen = (...k) => STELLEN.filter(s => k.includes(s.k));

// Je Stufe: erlaubte Stellen, Anzahl Bausteine, Anteil ausgeschriebener Namen.
// buendeln: Anteil Aufgaben mit einem Baustein über 9 (z. B. 14 H = 1400) — Königsstufe.
// Ob die Bausteine geordnet (grösste Stelle links) stehen, bestimmt die Einstellung im Profil (ctx.geordnet).
const STUFE = {
  s1: { stellen: nurStellen("H", "Z", "E"), teile: [2, 3], ausgeschrieben: 0 },
  s2: { stellen: nurStellen("T", "H", "Z", "E"), teile: [2, 3], ausgeschrieben: 0 },
  s3: { stellen: STELLEN.slice(1), teile: [2, 3], ausgeschrieben: 0 },
  s4: { stellen: STELLEN.slice(1), teile: [3, 4], ausgeschrieben: 0.4 },
  s5: { stellen: STELLEN, teile: [4, 5], ausgeschrieben: 0.5 },
  s6: { stellen: STELLEN, teile: [4, 6], ausgeschrieben: 0.5, buendeln: 0.6 },
};

const GRENZE = 9999999; // die Tastatur nimmt höchstens sieben Ziffern
const wertVon = teile => teile.reduce((s, t) => s + t.ziffer * t.st.wert, 0);

function aufgabeErzeugen(stufe, geordnet) {
  const p = STUFE[stufe];
  // Erweitert: selten genau eine Million (Zahlenraum der 4. Klasse endet dort).
  if (stufe === "s4" && Math.random() < 0.08) return { teile: [{ st: STELLEN[0], ziffer: 1 }], ausgeschrieben: false };
  const teile = mische(p.stellen).slice(0, zufall(...p.teile)).map(st => ({ st, ziffer: zufall(1, 9) }));
  if (p.buendeln && Math.random() < p.buendeln) {
    // Ein Baustein unterhalb der Millionen bekommt 11–19: Zehn davon sind eine Stelle weiter links.
    const kandidaten = teile.filter(t => t.st.k !== "M");
    const t = kandidaten[zufall(0, kandidaten.length - 1)];
    t.ziffer = zufall(11, 19);
    // Bleibt die Zahl siebenstellig? Sonst die Millionen verkleinern (sicher: 8 M + 19 HT < 10 Mio.).
    const m = teile.find(x => x.st.k === "M");
    if (m && wertVon(teile) > GRENZE) m.ziffer = Math.min(m.ziffer, 8);
  }
  if (geordnet) teile.sort((a, b) => b.st.wert - a.st.wert);
  return { teile, ausgeschrieben: Math.random() < p.ausgeschrieben };
}

function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  const wert = wertVon(a.teile);
  if (wert < 1 || wert > GRENZE) m.push(`Wert ${wert} ausserhalb 1–${GRENZE}`);
  const millionFall = stufe === "s4" && a.teile.length === 1 && a.teile[0].st.k === "M";
  if (!millionFall && (a.teile.length < p.teile[0] || a.teile.length > p.teile[1])) m.push(`${a.teile.length} Bausteine`);
  if (!millionFall && a.teile.some(t => !p.stellen.includes(t.st))) m.push("Stelle nicht erlaubt");
  if (new Set(a.teile.map(t => t.st.k)).size !== a.teile.length) m.push("Stelle doppelt");
  const gross = a.teile.filter(t => t.ziffer > 9);
  if (gross.length > (p.buendeln ? 1 : 0)) m.push("zu viele Bausteine über 9");
  if (a.teile.some(t => t.ziffer < 1 || t.ziffer > 19 || (t.ziffer === 10))) m.push("Ziffer ungültig");
  if (gross.some(t => t.st.k === "M")) m.push("Millionen über 9");
  return m;
}

LS.spiel({
  id: "zahlen-baukasten",
  einleitung: "Hallo! Ich bin Eule Zahlina. Setz die Bausteine zu einer Zahl zusammen. Tipp auf einen Baustein, dann verrate ich dir, wie viel er wert ist.",
  hilfe: "Die Bausteine zeigen, wie viele Einer, Zehner, Hunderter … die Zahl hat. Tipp die ganze Zahl ein. Tippst du einen Baustein an, sagt die Eule, wie viel er wert ist; die Tabelle unter der Anzeige zeigt, wo deine Ziffern landen.",
  anzahl: 8,
  stufen: {
    s1: "Mit Hundertern — Achtung, leere Stellen: 4 H + 2 E",
    s2: "Mit Tausendern, 2 bis 3 Bausteine: 3 T + 5 Z",
    s3: "2 bis 3 Bausteine bis zu den HT: 3 ZT + 4 H",
    s4: "3 bis 4 Bausteine, manchmal ausgeschrieben.",
    s5: "Bis zu den Millionen, 4 bis 5 Bausteine.",
    s6: "Bis 6 Bausteine, und mal mehr als 9: 14 H + 3 T",
  },

  aufgabe(ctx) {
    const { teile, ausgeschrieben } = aufgabeErzeugen(ctx.stufe, ctx.geordnet);
    const loesung = teile.reduce((s, t) => s + t.ziffer * t.st.wert, 0);
    const loesungText = `${teile.map(t => `${t.ziffer} ${t.st.k}`).join(" + ")} = ${zahlText(loesung)}`;
    ctx.loesung(loesungText);
    ctx.schritte(LS.tippSchritte(loesung));
    // Tipps vor dem Antworten (ctx.tipp, LERN_Session9): grösste Stelle, leere Stellen, Bündeln — nie die Zahl.
    ctx.tipp([
      "Such den Baustein mit der grössten Stelle. Wie viele Stellen hat dann deine Zahl?",
      "Jede Ziffer kommt an ihre Stelle. Stellen ohne Baustein bekommen eine 0 — die Tabelle unter der Anzeige hilft dir.",
      teile.some(t => t.ziffer > 9)
        ? "Ein Baustein hat mehr als 9: Zehn davon sind einer der nächsten Stelle, zum Beispiel 10 Z = 1 H."
        : "Weisst du nicht, was ein Baustein wert ist? Tipp ihn an.",
    ]);

    ctx.flaeche.append(el("div", { class: "auftrag", text: "Welche Zahl bauen diese Bausteine?" }));

    const reihe = el("div", { class: "bausteine" });
    teile.forEach((t, i) => {
      if (i > 0) reihe.append(el("span", { class: "baustein-plus", text: "+" }));
      const info = el("small", { text: "" });
      const knopf = el("button", {
        type: "button",
        class: `baustein st st-${t.st.k}` + (ausgeschrieben ? " lang" : ""),
        onclick: () => {
          info.textContent = `1 ${t.st.k} = ${zahlText(t.st.wert)}`;
          ctx.sag(`${t.st.k} heisst ${t.st.name}. Ein ${t.st.k} ist ${zahlText(t.st.wert)} wert.`);
        },
      }, `${t.ziffer} ${!ausgeschrieben ? t.st.k : t.st.k === "M" && t.ziffer === 1 ? "Million" : t.st.name}`, info);
      reihe.append(knopf);
    });
    ctx.flaeche.append(reihe);

    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Deine Zahl" });
    ctx.flaeche.append(anzeige);

    // Mini-Tabelle zeigt, in welcher Stelle jede getippte Ziffer landet.
    const mini = el("div", { class: "mini-tabelle", "aria-hidden": "true" });
    const zellen = {};
    for (const st of STELLEN) mini.append(el("div", { class: `k st st-${st.k}`, text: st.k }));
    for (const st of STELLEN) { zellen[st.k] = el("div", { class: `z st st-${st.k}` }); mini.append(zellen[st.k]); }
    ctx.flaeche.append(mini);

    function miniZeigen(wert) {
      const stellenZahl = wert === null ? 0 : String(wert).length;
      STELLEN.forEach((st, i) => {
        const sichtbar = wert !== null && 7 - i <= stellenZahl;
        zellen[st.k].textContent = sichtbar ? zerlege(wert)[st.k] : "";
      });
    }

    const tasten = LS.tastatur({
      anzeige,
      maxStellen: 7,
      onAenderung: miniZeigen,
      onOk(wert) {
        if (wert === loesung) {
          anzeige.classList.add("richtig");
          tasten.gesperrt = true;
          ctx.richtig();
          return;
        }
        anzeige.classList.add("falsch");
        const soll = zerlege(loesung), ist = zerlege(wert);
        const falscheStelle = STELLEN.find(st => soll[st.k] !== ist[st.k]);
        let hinweis;
        if (String(wert).length < String(loesung).length) hinweis = "Deine Zahl ist zu kurz. Denk an die Nullen bei den leeren Stellen!";
        else if (String(wert).length > String(loesung).length) hinweis = "Deine Zahl hat zu viele Stellen. Welches ist der grösste Baustein?";
        else hinweis = `Schau nochmal bei den ${LS.dativ(falscheStelle)} (${falscheStelle.k}).`;
        ctx.falsch(hinweis, loesungText);
        if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
      },
    });
    ctx.flaeche.append(tasten.element);
    miniZeigen(null);
    ctx.sag(ctx.nr === 0 ? "Tipp die Zahl ein und drück OK." : "Und die nächste!");
  },
});
</script>
</body>
</html>
