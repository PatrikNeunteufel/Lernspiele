<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regel-Lücke</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .regelkarte {
    background: #fff8e1;
    border: 3px dashed #f5c451;
    border-radius: 16px;
    padding: 10px 16px;
    font-size: 17px;
    margin: 0 auto 14px;
    max-width: 700px;
  }

  .regelkarte b { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .5px; color: #a0703d; }

  .bild-gross { text-align: center; font-size: clamp(56px, 12vw, 84px); line-height: 1.1; }

  .lueckenwort {
    text-align: center;
    font-size: clamp(40px, 9vw, 66px);
    font-weight: 900;
    margin: 8px 0 20px;
    letter-spacing: 1px;
  }

  .lueckenwort .luecke {
    display: inline-block;
    min-width: 1.6em;
    border-bottom: 6px solid var(--knopf);
    color: var(--knopf);
    margin: 0 2px;
  }

  .lueckenwort .luecke.richtig { color: var(--gut); border-color: var(--gut); }

  .optionen { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }

  .option {
    border: none;
    border-radius: 20px;
    min-width: 130px;
    min-height: 84px;
    font-family: inherit;
    font-size: clamp(34px, 7vw, 48px);
    font-weight: 900;
    background: #fff;
    color: var(--text);
    box-shadow: 0 6px 0 var(--rand), 0 8px 16px rgba(45, 48, 71, .1);
    cursor: pointer;
  }

  .option:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--rand); }
  .option.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .option.richtig { background: var(--gut-hell); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>✏️ Regel-Lücke</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.5.E.1: Rechtschreibregeln in dafür konstruierten Übungen anwenden.
// Stufe 1–4: die Regel steht sichtbar daneben, keine Ausnahmen (wie Lehrplan Stufe b/c).
// Stufe 5: Regel erst beim Fehler, mit Ausnahmen und Doppelkonsonanten (wie Lehrplan Stufe d).

const { waehle, mische, el } = LS;

const STUFE = {
  s1: { regeln: ["sp-st"], sichtbar: true, ausnahmen: false },
  s2: { regeln: ["sp-st", "ie-i"], sichtbar: true, ausnahmen: false },
  s3: { regeln: ["ie-i", "ck-tz"], sichtbar: true, ausnahmen: false },
  s4: { regeln: ["ie-i", "ck-tz", "f-v", "e-ae"], sichtbar: true, ausnahmen: false },
  s5: { regeln: ["ie-i", "ck-tz", "f-v", "e-ae", "doppel"], sichtbar: false, ausnahmen: true },
  // Königsstufe: alle sechs Regeln, Ausnahmen öfter, beim Fehler nur der Name der Regel statt ihres
  // Texts. Das Bild bleibt: ohne Bild wären Wörter wie Haken/Hacken, viel/fiel, Rose/Rosse mehrdeutig.
  s6: { regeln: ["sp-st", "ie-i", "ck-tz", "f-v", "e-ae", "doppel"], sichtbar: false, ausnahmen: true, knapp: true, ausnahmeAnteil: 0.4 },
};

// Freigabe (Entscheid L4 a): je Regel eine Liste (Schlüssel in REGELN), die Ausnahmen der ie-Regel
// eine eigene. Nur Wörter aus Listen, die der Spieler üben darf (Aufsicht: alle). Kennt der Katalog
// die Listen nicht, gilt alles als frei — dann entscheidet die Freigabe des Spiels.
const AUSNAHMEN_LISTE = { "ie-i": "ie-ausnahmen" };
const LISTEN = [...Object.keys(REGELN), ...Object.values(AUSNAHMEN_LISTE)];
const FREI = new Set(LS.spielListen("regel-luecke").length ? LS.freieListen("regel-luecke") : LISTEN);

/** Freie Wörter einer Regel in einer Stufe: Regelwörter und (falls die Stufe sie hat) Ausnahmen. */
function woerterIn(regelId, p) {
  const r = REGELN[regelId];
  const ausnahmeListe = AUSNAHMEN_LISTE[regelId];
  return {
    woerter: FREI.has(regelId) ? r.woerter : [],
    ausnahmen: p.ausnahmen && r.ausnahmen && ausnahmeListe && FREI.has(ausnahmeListe) ? r.ausnahmen : [],
  };
}
/** Regeln der Stufe, zu denen es freie Wörter gibt; leer = Stufe wird nicht angeboten. */
const regelnIn = stufe => STUFE[stufe].regeln.filter(id => { const w = woerterIn(id, STUFE[stufe]); return w.woerter.length + w.ausnahmen.length > 0; });
const nurMoegliche = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => regelnIn(s).length));

/** "B{ie|i}ne" → { vor: "B", richtig: "ie", falsch: "i", nach: "ne", ganz: "Biene" } */
function zerlegeWort(text) {
  const m = text.match(/^(.*)\{([^|]+)\|([^}]+)\}(.*)$/);
  return { vor: m[1], richtig: m[2], falsch: m[3], nach: m[4], ganz: m[1] + m[2] + m[4] };
}

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const regeln = regelnIn(stufe);
  if (!regeln.length) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  const regelId = waehle(regeln);
  const regel = REGELN[regelId];
  const { woerter, ausnahmen } = woerterIn(regelId, p);
  let liste = [...woerter, ...ausnahmen];
  // Königsstufe: Ausnahmen gezielt häufiger ziehen.
  if (p.ausnahmeAnteil && ausnahmen.length && Math.random() < p.ausnahmeAnteil) liste = ausnahmen;
  const [text, bild] = waehle(liste);
  return { regel, regelId, text, bild, ...zerlegeWort(text) };
}

/** Mängel: Lücke lesbar, zwei verschiedene Möglichkeiten, Regel und Ausnahmen passend zur Stufe. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p.regeln.includes(a.regelId)) m.push("Regel nicht in der Stufe");
  const frei = woerterIn(a.regelId, p);
  if (![...frei.woerter, ...frei.ausnahmen].some(([t]) => t === a.text)) m.push("Wort nicht aus einer freien Liste");
  if (!a.richtig || !a.falsch || a.richtig === a.falsch) m.push("Möglichkeiten fehlen oder sind gleich");
  if (/[{}|]/.test(a.ganz + a.richtig + a.falsch)) m.push("Lücke nicht aufgelöst");
  const ausnahme = (a.regel.ausnahmen || []).some(([t]) => t === a.text);
  if (ausnahme && !p.ausnahmen) m.push("Ausnahme in einer Stufe ohne Ausnahmen");
  if (!a.bild) m.push("Bild fehlt (ohne Bild ist das Wort nicht immer eindeutig)");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): je Regel eine Hilfsfrage zum Hinhören — keine
 * Schreibweise als Antwortknopf, keine Beispielwörter aus den Listen (sie könnten das gesuchte Wort sein).
 */
const TIPPS = {
  "sp-st": ["Sprich das Wort langsam. Steht der Laut am Wortanfang?", "Denk an die Regel: Am Wortanfang schreibt man diesen Laut anders, als man ihn hört."],
  "ie-i": ["Sprich das Wort langsam: Klingt der Laut lang wie in «Lied» oder kurz wie in «Ding»?"],
  "ck-tz": ["Sprich das Wort langsam: Ist der Vokal vor der Lücke kurz oder lang?", "Steht vor der Lücke l, n, r oder au, ei, eu? Denk an die Regel."],
  "f-v": ["Die meisten Wörter mit diesem Laut schreibt man wie «Ferien». Nur wenige Merkwörter schreibt man anders.", "Stell dir das Wort geschrieben vor: Hast du es schon oft gelesen?"],
  "e-ae": ["Such ein verwandtes Wort: die Einzahl oder die Grundform.", "Hat das verwandte Wort ein a? Denk an die Regel."],
  doppel: ["Sprich das Wort langsam: Ist der Vokal vor der Lücke kurz oder lang?", "Nach einem kurzen Vokal folgt oft ein doppelter Konsonant, nach einem langen nicht."],
};
function tippsFuer(a, p) {
  const t = [...(p.sichtbar ? ["Lies zuerst die Regel auf der Karte."] : []), ...TIPPS[a.regelId]];
  if (a.regelId === "ie-i" && p.ausnahmen) t.push("Vorsicht: Einige Wörter klingen lang wie «Lied» und haben trotzdem kein e. Die muss man sich merken.");
  return t;
}

LS.spiel({
  id: "regel-luecke",
  einleitung: "In jedem Wort fehlt etwas. Welche Schreibweise ist richtig? Die Regel hilft dir!",
  hilfe: "Schau das Bild an und lies das Wort mit der Lücke. Tippe unten die Schreibweise an, die in die Lücke gehört.",
  anzahl: 10,
  stufen: nurMoegliche({
    s1: "sp oder schp, st oder scht: Stern, Spiel.",
    s2: "Dazu ie oder i: Biene, Kind.",
    s3: "ie oder i, ck oder k, tz oder z — die Regel steht dabei.",
    s4: "Dazu f oder v und e oder ä: Vogel, Hände.",
    s5: "Alles gemischt, mit Ausnahmen (Igel, Tiger) und Doppelkonsonanten — ohne Regelkarte.",
    s6: "Endgegner: alle sechs Regeln, viele Ausnahmen — ohne Regelkarte.",
  }),

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (regelnIn(ctx.stufe).length > 1) ctx.serie("regel", a.regelId);
    ctx.serie("antwort", a.richtig.toLowerCase());
    const p = STUFE[ctx.stufe];
    const loesung = p.knapp ? `Man schreibt ${a.ganz}. ${a.regel.regel}` : `Man schreibt ${a.ganz}.`;
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(a, p));
    if (p.sichtbar) ctx.flaeche.append(el("div", { class: "regelkarte" }, el("b", { text: `Regel: ${a.regel.name}` }), a.regel.regel));
    if (a.bild) ctx.flaeche.append(el("div", { class: "bild-gross", "aria-hidden": "true", text: a.bild }));

    const luecke = el("span", { class: "luecke", text: "?" });
    ctx.flaeche.append(el("div", { class: "lueckenwort", "aria-label": "Wort mit Lücke" }, a.vor, luecke, a.nach));

    const optionen = el("div", { class: "optionen" });
    let fertig = false;
    for (const o of mische([a.richtig, a.falsch])) {
      const knopf = el("button", { type: "button", class: "option", text: o });
      knopf.addEventListener("click", () => {
        if (fertig) return;
        if (o === a.richtig) {
          fertig = true;
          knopf.classList.add("richtig");
          luecke.textContent = o;
          luecke.classList.add("richtig");
          ctx.richtig(`Richtig: ${a.ganz}`);
          return;
        }
        knopf.classList.remove("falsch");
        void knopf.offsetWidth;
        knopf.classList.add("falsch");
        ctx.falsch(p.sichtbar ? `Lies die Regel nochmal: ${a.regel.regel}`
          // Königsstufe: der Regelname („sp / st“) nennt die Schreibweise schon, deshalb ohne ihn.
          : p.knapp ? "Sprich das Wort langsam und hör genau hin. Welche Regel passt hier?"
          : `Regel ${a.regel.name}: ${a.regel.regel}`,
          loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      optionen.append(knopf);
    }
    ctx.flaeche.append(optionen);
    if (ctx.nr === 0) ctx.sag("Tipp auf die richtige Schreibweise.");
  },
});
</script>
</body>
</html>
