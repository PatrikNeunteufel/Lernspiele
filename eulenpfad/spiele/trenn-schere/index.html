<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trenn-Schere</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(18px, 4vw, 24px); font-weight: 800; margin: 0 0 10px; }
  .frage b { color: var(--knopf); }
  .regelkarte { background: #fff8e1; border: 3px dashed #f5c451; border-radius: 16px; padding: 8px 14px; font-size: 16px; margin: 0 auto 14px; max-width: 700px; }
  .regelkarte b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: #a0703d; }

  /* Wort mit Fugen zwischen den Buchstaben; die Fuge ist breiter als sie aussieht. */
  .wortkarte { display: flex; justify-content: center; align-items: center; flex-wrap: nowrap; margin: 6px auto 16px; font-weight: 900; line-height: 1.3; max-width: 100%; }
  .wortkarte .ts-buchstabe { position: relative; z-index: 0; padding: 0 1px; }
  .wortkarte .ts-fuge { position: relative; z-index: 1; width: 26px; height: 1.6em; margin: 0 -9px; padding: 0; border: none; background: transparent; cursor: pointer; }
  .wortkarte .ts-fuge::after { content: ""; position: absolute; left: 50%; top: 20%; height: 60%; width: 2px; margin-left: -1px; border-radius: 2px; background: var(--rand); }
  .wortkarte .ts-fuge.getrennt { margin: 0 -3px; }
  .wortkarte .ts-fuge.getrennt::after { content: "-"; background: none; width: auto; height: auto; top: 0; left: 50%; transform: translateX(-50%); margin: 0; color: var(--knopf); font-weight: 900; }
  .wortkarte .ts-fuge.falsch { animation: wackeln .4s; }
  .wortkarte .ts-fuge.richtig::after { color: var(--gut); }
  .wortkarte .ts-fuge:focus-visible { outline: 3px solid var(--knopf); border-radius: 6px; }

  /* Zeilenende: ein Heft mit Rand; was rechts vom Rand steht, passt nicht mehr auf die Zeile. */
  .ts-heft { max-width: 720px; margin: 0 auto 14px; padding: 10px 12px 4px; background: #fff; border-radius: 14px; border: 2px solid var(--rand);
    background-image: repeating-linear-gradient(to bottom, transparent 0 46px, #dfe6f5 46px 48px); }
  .ts-heft .ts-davor { font-size: clamp(16px, 3.8vw, 21px); font-weight: 700; color: var(--text-leise); margin-bottom: 2px; text-align: center; }
  .ts-heft .wortkarte { margin-bottom: 6px; }
  .wortkarte .ts-buchstabe.draussen { color: #b9bfcc; }
  .wortkarte .ts-buchstabe.rand { box-shadow: inset -4px 0 0 var(--deko-1); padding-right: 6px; }
  .ts-platz { text-align: center; font-size: 16px; font-weight: 700; color: var(--text-leise); margin: 0 0 10px; }
  .ts-zeile { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 4px; }
  .ts-ganz { font: inherit; font-size: clamp(16px, 4vw, 20px); font-weight: 800; min-height: 58px; padding: 6px 16px; border: none; border-radius: 16px;
    background: #fff; color: var(--text); box-shadow: 0 5px 0 var(--rand), 0 7px 14px rgba(45, 48, 71, .1); cursor: pointer; }
  .ts-ganz.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .ts-ganz.richtig { background: var(--gut-hell); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>📄 Trenn-Schere</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.5.E.1.d (Grundanspruch 2. Zyklus): Trennregel in eigens gebauten Übungen anwenden.
// Basisklasse 5. s1 4. Klasse (D.5.E.1.c sinngemäss: nach Sprechsilben trennen, die Zahl der Trennstriche
// steht dabei), s2 einfache Wörter, alle Trennstellen selbst, s3 ck, ch, sch bleiben zusammen, st wird
// getrennt, s4 zusammengesetzte Wörter und Vorsilben, s5 6. Klasse: Wörter, die man nicht trennt
// (einsilbig, einzelner Vokal am Anfang), und Trennen am Zeilenende mit wenig Platz, s6 Königsstufe:
// alles gemischt, ohne Regelkarte, knappe Hinweise.
// Bezug: Der Silben-Klatscher (Basisklasse 1) zählt und ordnet Sprechsilben; hier geht es um die
// Rechtschreibregel: wo man am Zeilenende trennen DARF. Der Wörter-Trenner trennt Wörter in einem Satz
// ohne Lücken voneinander — etwas anderes. Die Morphem-Schere schneidet nach Bausteinen (Vorsilbe,
// Stamm, Endung), nicht nach Silben. Inhalte nur aus woerter.js und nur aus freien Listen.

const { waehle, zufall, el } = LS;
const ID = "trenn-schere";

const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : Object.keys(TRENN_WOERTER));

/** Welche Regel das Wort übt (Feld regel): zusammen (|), ohne (keine Trennstelle), vokal (einzelner Vokal vorne), ckst, einfach. */
function artVon(t) {
  if (t.includes("|")) return "zusammen";
  if (!/-/.test(t)) return "ohne";
  if (/^[aeiouäöü][^aeiouäöü-][aeiouäöü]/i.test(t)) return "vokal";
  if (/ck|s-t|-s?ch/.test(t)) return "ckst";
  return "einfach";
}

/** "Ta-schen|lam-pe" → { wort: "Taschenlampe", stellen: [2, 7, 10], teile: [...], art } — Trennstelle nach so vielen Buchstaben. */
function zerlegeWort(text) {
  const buchstaben = [];
  const stellen = [];
  for (const c of text) {
    if (c === "-" || c === "|") stellen.push(buchstaben.length);
    else buchstaben.push(c);
  }
  return { text, wort: buchstaben.join(""), laenge: buchstaben.length, stellen, teile: text.split(/[-|]/), regel: artVon(text) };
}
const getrennt = w => w.teile.join("-");

const WOERTER = FREI.has("woerter") ? TRENN_WOERTER.woerter.map(zerlegeWort) : [];
const vonArt = (...arten) => WOERTER.filter(w => arten.includes(w.regel));

// Beispiele in den Regeln stehen absichtlich NICHT in der Liste, damit die Regel kein Wort vorsagt.
const REGEL = {
  einfach: "Trenne nach Sprechsilben: Ro-se, Ker-ze. Ein einzelner Mitlaut kommt auf die neue Zeile, von mehreren nur der letzte.",
  ckst: "ck, ch und sch bleiben zusammen: Ho-cker, Wä-sche. st wird getrennt: Pos-ten.",
  zusammen: "Zusammengesetzte Wörter trennt man zwischen den Teilen, Vorsilben nach der Vorsilbe: Tisch-bein, ver-kau-fen. Die Teile selbst nach Silben.",
  vokal: "Ein einzelner Vokal am Anfang oder am Ende wird nicht abgetrennt: Ame-ri-ka, nicht A-me-ri-ka. Ekel trennt man gar nicht.",
  ohne: "Wörter mit nur einer Silbe trennt man nie: Baum. Auch einen einzelnen Vokal am Anfang oder Ende trennt man nicht ab: Ekel bleibt ganz.",
};

const ANFAENGE = [
  "Im Heft passt am Zeilenende nur noch ein Stück vom Wort",
  "Im Aufsatz steht ganz rechts am Rand das Wort",
  "Auf dem Plakat wird der Platz knapp für das Wort",
  "Im Brief an Grossmutter kommt am Zeilenende das Wort",
];

// Je Stufe: Wortarten für „alle Trennstellen“, Anteil Zeilenende, Zahl der Striche zeigen, Regelkarte, knapp.
const STUFE = {
  s1: { alle: () => vonArt("einfach").filter(w => w.stellen.length <= 2), anzahl: true, karte: true },
  s2: { alle: () => vonArt("einfach"), karte: true },
  s3: { alle: () => vonArt("ckst"), karte: true },
  s4: { alle: () => vonArt("zusammen"), karte: true },
  s5: { alle: () => vonArt("vokal", "ohne"), zeile: 0.5, karte: true, ohneHinweis: true },
  s6: { alle: () => WOERTER, zeile: 0.5, knapp: true, ohneHinweis: true },
};
const angeboten = stufe => STUFE[stufe].alle().length > 0;

// ---------- Aufgaben als Daten ----------

/** Zeilenende: grösste erlaubte Trennstelle, die in den Platz passt; 0 = ganzes Wort auf die neue Zeile. */
const besteStelle = (w, platz) => Math.max(0, ...w.stellen.filter(s => s <= platz));

function aufgabeErzeugen(stufe) {
  if (!angeboten(stufe)) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  const p = STUFE[stufe];
  if (p.zeile && Math.random() < p.zeile) {
    // Etwa jedes dritte Wort ohne frühe Trennstelle, damit „ganz auf die neue Zeile“ vorkommt.
    const schwer = vonArt("vokal", "ohne");
    const w = schwer.length && Math.random() < 0.3 ? waehle(schwer) : waehle(WOERTER);
    const platz = zufall(2, Math.max(2, w.laenge - 2));
    return { art: "zeile", ...w, platz, richtig: besteStelle(w, platz), anfang: waehle(ANFAENGE) };
  }
  return { art: "alle", ...waehle(p.alle()) };
}

function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!angeboten(stufe)) m.push("Stufe mit den freien Listen nicht angeboten");
  if (!FREI.has("woerter")) m.push("Liste woerter nicht frei");
  if (!TRENN_WOERTER.woerter.includes(a.text)) m.push("Wort nicht in der Liste");
  if (a.art === "alle" && !p.alle().some(w => w.text === a.text)) m.push("Wort passt nicht zur Stufe");
  if (a.art === "zeile") {
    if (!p.zeile) m.push("Zeilenende nicht in der Stufe");
    if (a.platz < 2 || a.platz > Math.max(2, a.laenge - 2)) m.push("Platz ausserhalb des Bereichs");
    if (a.richtig !== besteStelle(a, a.platz)) m.push("Lösung Zeilenende falsch");
    if (a.richtig && !a.stellen.includes(a.richtig)) m.push("Lösung ist keine Trennstelle");
  } else if (a.art !== "alle") m.push("unbekannte Aufgabenart");
  // Die Trennregel an den Daten selbst nachprüfen
  if (/ß/.test(a.text)) m.push("ß im Wort");
  if (!/^[A-Za-zÄÖÜäöü|-]+$/.test(a.text) || /[-|]{2}|^[-|]|[-|]$/.test(a.text)) m.push("Wort falsch aufgebaut");
  if (a.teile.some(t => !/[aeiouäöüy]/i.test(t))) m.push("Teil ohne Vokal (keine Silbe)");
  if (a.teile.length > 1 && (/^[aeiouäöü]$/i.test(a.teile[0]) || /^[aeiouäöü]$/i.test(a.teile[a.teile.length - 1]))) m.push("einzelner Vokal abgetrennt");
  if (/c[-|]k|s[-|]ch|c[-|]h/.test(a.text)) m.push("ck, ch oder sch getrennt");
  if (/[aeiouäöü]-st/i.test(a.text)) m.push("st nicht getrennt");
  if (a.wort !== a.teile.join("") || a.stellen.length !== a.teile.length - 1) m.push("Trennstellen passen nicht zum Wort");
  for (const r of Object.values(REGEL)) if (new RegExp(`(^|[^a-zäöü])${a.wort}([^a-zäöü]|$)`, "i").test(r.replace(/-/g, ""))) m.push(`Regel nennt das Wort ${a.wort}`);
  return m;
}

// ---------- Darstellung ----------

/** Wort als Buchstaben mit Fugen; beiFuge(i, fuge) mit i = Trennstelle nach i Buchstaben. */
function wortKarte(w, beiFuge, klasseFuer) {
  const karte = el("div", { class: "wortkarte", "aria-label": `Wort ${w.wort}` });
  karte.style.fontSize = `min(56px, ${(86 / (w.laenge + 1)).toFixed(2)}vw)`;
  const fugen = [];
  [...w.wort].forEach((b, i) => {
    karte.append(el("span", { class: `ts-buchstabe ${klasseFuer ? klasseFuer(i) : ""}`, text: b }));
    if (i === w.laenge - 1) return;
    const fuge = el("button", { type: "button", class: "ts-fuge", "aria-label": `Trennen nach ${b}`, "aria-pressed": "false" });
    fuge.addEventListener("click", () => beiFuge(i + 1, fuge));
    karte.append(fuge);
    fugen.push(fuge);
  });
  return { karte, fugen };
}

/** Alle Trennstellen setzen, dann „Prüfen“. */
function alleStellen(ctx, a, p) {
  const f = ctx.flaeche;
  const loesung = a.stellen.length ? getrennt(a) : `${a.wort} — nicht trennbar`;
  ctx.loesung(loesung);
  ctx.schritte(a.stellen.length + 1);
  if (p.karte) f.append(el("div", { class: "regelkarte" }, el("b", { text: "Regel" }), REGEL[a.regel]));
  const n = a.stellen.length;
  f.append(el("div", { class: "frage", html: p.anzahl
    ? `Wo darf man trennen? Setze <b>${n === 1 ? "einen Trennstrich" : `${n} Trennstriche`}</b>.`
    : `Wo darf man das Wort trennen? Setze alle Trennstriche.${p.ohneHinweis ? " Geht es nicht, tippe gleich auf „Prüfen“." : ""}` }));
  let fertig = false;
  const { karte, fugen } = wortKarte(a, (i, fuge) => {
    if (ctx.vorbei() || fertig) return;
    const an = !fuge.classList.contains("getrennt");
    fuge.classList.toggle("getrennt", an);
    fuge.setAttribute("aria-pressed", String(an));
    LS.ton("tipp");
  });
  f.append(karte);
  const regel = REGEL[a.regel];
  const pruefen = el("button", { type: "button", class: "knopf gruen", text: "Prüfen ✓" });
  pruefen.addEventListener("click", () => {
    if (ctx.vorbei() || fertig) return;
    const gesetzt = fugen.map((x, i) => (x.classList.contains("getrennt") ? i + 1 : -1)).filter(i => i > 0);
    const fehlen = a.stellen.filter(i => !gesetzt.includes(i)).length;
    const zuviel = gesetzt.filter(i => !a.stellen.includes(i)).length;
    if (!fehlen && !zuviel) {
      fertig = true;
      fugen.forEach(x => x.classList.toggle("richtig", x.classList.contains("getrennt")));
      ctx.richtig(n ? `Richtig: ${loesung}` : `Richtig: ${a.wort} trennt man nicht.`);
      return;
    }
    const teile = [];
    if (p.knapp) teile.push("Noch nicht ganz. Sprich das Wort langsam in Silben.");
    else {
      if (zuviel) teile.push(zuviel === 1 ? "Ein Trennstrich steht an einer Stelle, wo man nicht trennen darf." : `${zuviel} Trennstriche stehen an Stellen, wo man nicht trennen darf.`);
      if (fehlen) teile.push(fehlen === 1 ? "Es fehlt noch ein Trennstrich." : `Es fehlen noch ${fehlen} Trennstriche.`);
      teile.push(regel);
    }
    ctx.falsch(teile.join(" "), loesung);
  });
  f.append(el("div", { class: "ts-zeile" }, pruefen));
}

/** Zeilenende: so viel wie möglich auf diese Zeile — eine Fuge antippen oder das ganze Wort auf die neue Zeile. */
function zeilenende(ctx, a, p) {
  const f = ctx.flaeche;
  const r = a.richtig;
  const loesung = r ? `${a.wort.slice(0, r)}- | ${a.wort.slice(r)}` : `${a.wort} ganz auf die neue Zeile`;
  ctx.loesung(loesung);
  ctx.schritte(1);
  ctx.serie("antwort", r ? "trennen" : "ganz");
  if (p.karte) f.append(el("div", { class: "regelkarte" }, el("b", { text: "Regel" }), "Am Zeilenende trennt man nur an einer erlaubten Trennstelle. Schreib so viel vom Wort auf die Zeile, wie Platz hat."));
  f.append(el("div", { class: "frage", html: "Wo trennst du? <b>Schreib so viel wie möglich auf diese Zeile.</b>" }));
  let fertig = false;
  const loesen = (lob) => { fertig = true; ctx.richtig(lob); };
  const { karte } = wortKarte(a, (i, fuge) => {
    if (ctx.vorbei() || fertig || fuge.classList.contains("gewaehlt")) return;
    if (i === r) {
      fuge.classList.add("getrennt", "richtig");
      loesen(`Richtig: ${loesung}`);
      return;
    }
    fuge.classList.add("gewaehlt");
    fuge.classList.remove("falsch"); void fuge.offsetWidth; fuge.classList.add("falsch");
    let hinweis;
    if (!a.stellen.includes(i)) hinweis = p.knapp ? "Hier darf man nicht trennen." : `Hier darf man nicht trennen. ${REGEL[a.regel]}`;
    else if (i > a.platz) hinweis = "Dann passt der erste Teil nicht mehr auf die Zeile. Schau, wie viel Platz bleibt.";
    else hinweis = "Das ginge — aber es hat noch mehr Platz. Schreib so viel wie möglich auf diese Zeile.";
    ctx.falsch(hinweis, loesung);
  }, i => (i >= a.platz ? "draussen" : i === a.platz - 1 ? "rand" : ""));
  f.append(el("div", { class: "ts-heft" }, el("div", { class: "ts-davor", text: `${a.anfang} …` }), karte));
  f.append(el("div", { class: "ts-platz", text: `Platz bis zum roten Rand: ${a.platz} Buchstaben und der Trennstrich.` }));
  const ganz = el("button", { type: "button", class: "ts-ganz", text: "↵ Ganzes Wort auf die neue Zeile" });
  ganz.addEventListener("click", () => {
    if (ctx.vorbei() || fertig || ganz.classList.contains("falsch")) return;
    if (!r) { ganz.classList.add("richtig"); loesen(`Richtig: ${loesung}.`); return; }
    ganz.classList.add("falsch");
    ctx.falsch("Ein Teil des Wortes passt noch auf diese Zeile.", loesung);
  });
  f.append(el("div", { class: "ts-zeile" }, ganz));
}

// ---------- Spiel ----------

// Tipps vor dem Antworten (ctx.tipp, LERN_Session9): erst in Silben sprechen, dann worauf bei diesem Wort
// zu achten ist — nie, wo getrennt wird. Für Wörter mit einzelnem Vokal und nicht trennbare derselbe Text,
// damit der Tipp die Art nicht verrät.
const SILBEN_TIPP = "Sprich das Wort langsam und klatsch bei jeder Silbe.";
const REGEL_TIPP = {
  einfach: "Treffen zwischen zwei Silben mehrere Mitlaute aufeinander, kommt nur der letzte auf die neue Zeile.",
  ckst: "Such im Wort nach ck, ch, sch und st. Welche davon bleiben zusammen, welche werden getrennt?",
  zusammen: "Aus welchen Wörtern oder Teilen ist das Wort gebaut? Zwischen den Teilen darfst du trennen — und die Teile selbst nach Silben.",
  vokal: "Wie viele Silben hörst du? Eine Silbe, die nur aus einem einzelnen Vokal am Anfang oder Ende besteht, trennt man nicht ab.",
};
REGEL_TIPP.ohne = REGEL_TIPP.vokal;
function tippsFuer(a) {
  if (a.art === "zeile") return ["Such zuerst alle Stellen, an denen man das Wort trennen darf.",
    "Nimm davon die, die am weitesten rechts liegt und noch vor den roten Rand passt.",
    "Passt keine Trennstelle, schreibst du das Wort auf der nächsten Zeile."];
  return [SILBEN_TIPP, REGEL_TIPP[a.regel]];
}
const nurAngebotene = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => angeboten(s)));

LS.spiel({
  id: ID,
  hilfe: stufe => "Tippe zwischen zwei Buchstaben, dann setzt die Schere dort einen Trennstrich; nochmal tippen nimmt ihn weg. Sind alle gesetzt, tippst du „Prüfen ✓“."
    + (STUFE[stufe]?.zeile ? " Am Zeilenende tippst du die eine Stelle an, wo du trennst — oder „Ganzes Wort auf die neue Zeile“." : ""),
  einleitung: "Am Ende der Zeile ist kein Platz mehr? Dann trennst du das Wort — aber nur an den richtigen Stellen! Tippe zwischen zwei Buchstaben, dann setzt die Schere einen Trennstrich.",
  anzahl: 8,
  stufen: nurAngebotene({
    s1: "Nach Silben trennen: Ba-na-ne. Die Zahl der Striche steht dabei.",
    s2: "Alle Trennstellen selbst finden: Kar-tof-fel.",
    s3: "ck bleibt zusammen, st wird getrennt: Zu-cker, Kis-te. (Lehrplan 5. Klasse)",
    s4: "Zusammengesetzte Wörter und Vorsilben: Haus-tür, ver-lie-ren.",
    s5: "Wörter, die man nicht trennt — und Trennen am Zeilenende.",
    s6: "Endgegner: alle Regeln gemischt, ohne Regelkarte.",
  }),

  aufgabe(ctx) {
    const p = STUFE[ctx.stufe];
    if (ctx.nr === 0) ctx.sag(p.zeile
      ? "Manche Wörter darf man gar nicht trennen. Am Zeilenende zählt auch der Platz bis zum roten Rand."
      : "Sprich das Wort langsam in Silben und tippe dort zwischen die Buchstaben, wo du trennen darfst.");
    const a = aufgabeErzeugen(ctx.stufe);
    if (p.zeile) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a));
    if (a.art === "zeile") zeilenende(ctx, a, p);
    else alleStellen(ctx, a, p);
  },
});
</script>
</body>
</html>
