<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiegel-Raster</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.2vw, 28px); font-weight: 800; margin: 0 0 12px; }
  .frage b { color: var(--knopf); }
  .raster-rahmen { position: relative; width: min(440px, 88vw, 49vh); margin: 0 auto 14px; }
  .raster { display: grid; gap: 2px; background: #c9cde0; border: 2px solid #c9cde0; border-radius: 8px; overflow: hidden; }
  .zelle { aspect-ratio: 1; border: none; padding: 0; background: #fff; cursor: pointer; }
  .zelle.fest { cursor: default; background: #f3f4f8; }
  .zelle.vorlage { background: var(--deko-6); }
  .zelle.gesetzt { background: var(--deko-3); }
  .zelle.fehlt { box-shadow: inset 0 0 0 4px var(--gut); }
  .zelle.zuviel { box-shadow: inset 0 0 0 4px var(--hinweis); }
  .achse { position: absolute; background: #e5484d; pointer-events: none; border-radius: 3px; }
  .achse.diagonal { transform-origin: 0 0; }
  .legende { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 15px; color: var(--text-leise); margin-bottom: 8px; }
  .legende i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  /* Ganze Aufgabe im Bild (BH3 a): breit und quer steht das Raster links, Frage, Legende und „Fertig“ rechts. */
  @media (min-width: 900px) and (orientation: landscape) {
    .sr-paar { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-rows: 1fr auto auto auto 1fr; column-gap: 28px; }
    .sr-paar > * { grid-column: 2; min-width: 0; }
    .sr-paar > .frage { grid-row: 2; }
    .sr-paar > .legende { grid-row: 3; }
    .sr-paar > .knopfzeile { grid-row: 4; }
    .sr-paar > .raster-rahmen { grid-column: 1; grid-row: 1 / 6; width: min(440px, 100vh - 250px); margin: 6px 0; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🪞 Spiegel-Raster</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.2.A.2: c „Figuren in Rastern nachzeichnen, symmetrisch ergänzen bzw. spiegeln“,
// d „Figuren in Rastern … verschieben“, e „Figuren an Achsen spiegeln“.
// Das Kind tippt Felder an, bis das Spiegelbild (bzw. die verschobene Figur) vollständig ist.

const { zufall, waehle, mische, el } = LS;

// Je Stufe: Rastergrösse, Anzahl Vorlagefelder, Aufgabenarten.
const STUFE = {
  s1: { n: 6, felder: [3, 4], arten: ["senkrecht"] },
  s2: { n: 8, felder: [5, 7], arten: ["senkrecht"] },
  s3: { n: 8, felder: [6, 9], arten: ["senkrecht", "waagrecht"] },
  s4: { n: 8, felder: [5, 8], arten: ["senkrecht", "waagrecht", "verschieben"] },
  s5: { n: 8, felder: [6, 9], arten: ["diagonal", "verschieben", "waagrecht"] },
  // Königsstufe: an zwei Achsen zugleich spiegeln, an der anderen Diagonale, an einer Achse
  // ausserhalb der Mitte, und schräg nach links/oben verschieben.
  s6: { n: 8, felder: [5, 7], arten: ["doppelt", "gegendiagonal", "versetzt", "verschiebenFrei"] },
};

const teile = s => s.split(",").map(Number);

/** Königsstufe: jede Art mit begrenzten Versuchen, damit der Generator sicher endet. */
function koenigsAufgabe(p, art) {
  const n = p.n, h = n / 2, k = zufall(...p.felder);
  if (art === "doppelt") {
    // Vorlage oben links; Spiegelbilder an der senkrechten, der waagrechten und an beiden Achsen.
    const vorlage = figur(Math.min(k, 6), { r0: 0, r1: h - 1, c0: 0, c1: h - 1 });
    const ziel = new Set();
    for (const s of vorlage) {
      const [r, c] = teile(s);
      ziel.add(key(r, n - 1 - c)); ziel.add(key(n - 1 - r, c)); ziel.add(key(n - 1 - r, n - 1 - c));
    }
    return { art, n, vorlage, ziel, bereich: (r, c) => r >= h || c >= h, achsen: ["senkrecht", "waagrecht"],
      frage: "Spiegle die Figur an <b>beiden</b> roten Achsen — es braucht drei Spiegelbilder." };
  }
  if (art === "gegendiagonal") {
    // Achse von unten links nach oben rechts: (r, c) → (n−1−c, n−1−r); Vorlage oberhalb.
    let vorlage = new Set();
    for (let v = 0; v < 50 && vorlage.size < 4; v++) {
      vorlage = new Set([...figur(k, { r0: 0, r1: n - 2, c0: 0, c1: n - 2 })].filter(s => { const [r, c] = teile(s); return r + c < n - 1; }));
    }
    if (!vorlage.size) vorlage.add(key(0, 0));
    const ziel = new Set([...vorlage].map(s => { const [r, c] = teile(s); return key(n - 1 - c, n - 1 - r); }));
    return { art, n, vorlage, ziel, bereich: (r, c) => r + c > n - 1, achsen: ["gegendiagonal"],
      frage: "Spiegle die Figur an der schrägen roten Achse." };
  }
  if (art === "versetzt") {
    // Senkrechte Achse links oder rechts der Mitte, zwischen Spalte a−1 und a.
    const a = waehle([3, 5]);
    const vorlage = figur(k, { r0: 0, r1: n - 1, c0: Math.max(0, 2 * a - n), c1: a - 1 });
    const ziel = new Set([...vorlage].map(s => { const [r, c] = teile(s); return key(r, 2 * a - 1 - c); }));
    return { art, n, vorlage, ziel, bereich: (r, c) => c >= a, achsen: ["versetzt"], achseBei: a,
      frage: "Die Achse steht nicht in der Mitte. Spiegle die Figur an der roten Achse." };
  }
  // verschiebenFrei: Figur in einem 3×3-Kasten; mindestens 4 Schritte in eine Richtung — so
  // überlappen Vorlage und Bild nie. Auch nach links und nach oben.
  const weit = zufall(4, 5) * waehle([1, -1]), quer = zufall(0, 3) * waehle([1, -1]);
  const [dx, dy] = Math.random() < 0.5 ? [weit, quer] : [quer, weit];
  const r0 = zufall(Math.max(0, -dy), n - 3 - Math.max(0, dy)), c0 = zufall(Math.max(0, -dx), n - 3 - Math.max(0, dx));
  const vorlage = figur(Math.min(k, 6), { r0, r1: r0 + 2, c0, c1: c0 + 2 });
  const ziel = new Set([...vorlage].map(s => { const [r, c] = teile(s); return key(r + dy, c + dx); }));
  const richtung = (d, plus, minus) => (d ? `<b>${Math.abs(d)} nach ${d > 0 ? plus : minus}</b>` : "");
  return { art, n, vorlage, ziel, bereich: () => true, verschiebung: { dx, dy },
    frage: `Verschiebe die blaue Figur um ${[richtung(dx, "rechts", "links"), richtung(dy, "unten", "oben")].filter(Boolean).join(" und ")}.` };
}

/** Mängel: Bild liegt im Raster, nur auf antippbaren Feldern, nicht auf der Vorlage, und folgt der Abbildung. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const n = a.n, h = n / 2;
  if (!a.vorlage.size || a.ziel.size === 0) m.push("leere Figur");
  for (const s of a.ziel) {
    const [r, c] = teile(s);
    if (r < 0 || c < 0 || r >= n || c >= n) m.push("Bild ausserhalb des Rasters");
    else if (a.vorlage.has(s) || !a.bereich(r, c)) m.push("Bildfeld nicht antippbar");
  }
  const bild = {
    senkrecht: ([r, c]) => [[r, n - 1 - c]], waagrecht: ([r, c]) => [[n - 1 - r, c]], diagonal: ([r, c]) => [[c, r]],
    doppelt: ([r, c]) => [[r, n - 1 - c], [n - 1 - r, c], [n - 1 - r, n - 1 - c]],
    gegendiagonal: ([r, c]) => [[n - 1 - c, n - 1 - r]],
    versetzt: ([r, c]) => [[r, 2 * a.achseBei - 1 - c]],
  }[a.art] || (([r, c]) => [[r + a.verschiebung.dy, c + a.verschiebung.dx]]);
  const soll = new Set([...a.vorlage].flatMap(s => bild(teile(s)).map(([r, c]) => key(r, c))));
  if (soll.size !== a.ziel.size || [...soll].some(s => !a.ziel.has(s))) m.push("Bild folgt nicht der Abbildung");
  if (a.art === "doppelt" && [...a.vorlage].some(s => { const [r, c] = teile(s); return r >= h || c >= h; })) m.push("Vorlage nicht im Viertel oben links");
  return m;
}

const key = (r, c) => `${r},${c}`;

/** Zusammenhängende Figur aus k Feldern in einem Bereich (Zufallswachstum). */
function figur(k, bereich) {
  const { r0, r1, c0, c1 } = bereich;
  const start = [zufall(r0, r1), zufall(c0, c1)];
  const felder = new Set([key(...start)]);
  let versuche = 0;
  while (felder.size < k && versuche++ < 500) {
    const [r, c] = [...felder][zufall(0, felder.size - 1)].split(",").map(Number);
    const [dr, dc] = waehle([[1, 0], [-1, 0], [0, 1], [0, -1]]);
    const nr = r + dr, nc = c + dc;
    if (nr >= r0 && nr <= r1 && nc >= c0 && nc <= c1) felder.add(key(nr, nc));
  }
  return felder;
}

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe], n = p.n, h = n / 2;
  const art = waehle(p.arten);
  if (stufe === "s6") return koenigsAufgabe(p, art);
  const k = zufall(...p.felder);
  if (art === "senkrecht") {
    const vorlage = figur(k, { r0: 0, r1: n - 1, c0: 0, c1: h - 1 });
    const ziel = new Set([...vorlage].map(s => { const [r, c] = s.split(",").map(Number); return key(r, n - 1 - c); }));
    return { art, n, vorlage, ziel, bereich: (r, c) => c >= h, frage: "Spiegle die Figur an der roten Achse." };
  }
  if (art === "waagrecht") {
    const vorlage = figur(k, { r0: 0, r1: h - 1, c0: 0, c1: n - 1 });
    const ziel = new Set([...vorlage].map(s => { const [r, c] = s.split(",").map(Number); return key(n - 1 - r, c); }));
    return { art, n, vorlage, ziel, bereich: (r) => r >= h, frage: "Spiegle die Figur an der roten Achse." };
  }
  if (art === "diagonal") {
    // Achse von oben links nach unten rechts: (r, c) → (c, r); Vorlage unterhalb der Diagonale
    let vorlage;
    do { vorlage = new Set([...figur(k, { r0: 1, r1: n - 1, c0: 0, c1: n - 2 })].filter(s => { const [r, c] = s.split(",").map(Number); return r > c; })); } while (vorlage.size < 4);
    const ziel = new Set([...vorlage].map(s => { const [r, c] = s.split(",").map(Number); return key(c, r); }));
    return { art, n, vorlage, ziel, bereich: (r, c) => c > r, frage: "Spiegle die Figur an der schrägen roten Achse." };
  }
  // verschieben: Figur oben links, um dx nach rechts und dy nach unten verschieben
  const dx = zufall(2, 4), dy = zufall(0, 3);
  const vorlage = figur(Math.min(k, 6), { r0: 0, r1: n - 1 - dy - 1, c0: 0, c1: n - 1 - dx - 1 });
  const ziel = new Set([...vorlage].map(s => { const [r, c] = s.split(",").map(Number); return key(r + dy, c + dx); }));
  if ([...ziel].some(s => vorlage.has(s))) return aufgabeErzeugen(stufe); // keine Überlappung, damit es eindeutig bleibt
  return { art, n, vorlage, ziel, bereich: () => true, verschiebung: { dx, dy },
    frage: `Verschiebe die blaue Figur um <b>${dx} nach rechts</b>${dy ? ` und <b>${dy} nach unten</b>` : ""}.` };
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): erst die Regel der Abbildung, dann wie man abzählt,
 * zuletzt wie viele Felder es braucht — nie, welche Felder.
 */
function tippsFuer(a) {
  const k = a.vorlage.size;
  const anzahl = n => `Die Vorlage hat ${k} Felder — du brauchst ${n === k ? "genau so viele" : `${n}`}.`;
  if (a.art === "senkrecht" || a.art === "versetzt") return [
    "Jedes blaue Feld hat sein Spiegelbild in derselben Zeile, gleich weit weg von der roten Achse.",
    (a.art === "versetzt" ? "Die Achse steht nicht in der Mitte — zähl von der Achse aus, nicht vom Rand. " : "")
      + "Zähl bei einem blauen Feld die Felder bis zur Achse. Auf der anderen Seite gehst du gleich viele weiter.",
    anzahl(a.ziel.size)];
  if (a.art === "waagrecht") return [
    "Jedes blaue Feld hat sein Spiegelbild in derselben Spalte, gleich weit weg von der roten Achse.",
    "Zähl bei einem blauen Feld die Felder bis zur Achse. Unter der Achse gehst du gleich viele weiter.",
    anzahl(a.ziel.size)];
  if (a.art === "diagonal" || a.art === "gegendiagonal") return [
    "Das Spiegelbild liegt auf der anderen Seite der schrägen Achse, gleich weit weg von ihr.",
    "Geh von einem blauen Feld schräg über die Ecken auf die Achse zu. Auf der anderen Seite gehst du gleich viele Schritte weiter.",
    anzahl(a.ziel.size)];
  if (a.art === "doppelt") return [
    "Es braucht drei Spiegelbilder: eins rechts, eins unten und eins schräg gegenüber.",
    "Spiegle zuerst an der senkrechten Achse. Dann spiegelst du beide Figuren an der waagrechten Achse.",
    anzahl(a.ziel.size)];
  return [
    "Beim Verschieben rutscht jedes Feld gleich weit — die Form bleibt genau gleich.",
    "Nimm eine Ecke der Figur, zähl die Schritte ab und setz dort das erste Feld. Dann baust du die Form drum herum nach.",
    anzahl(a.ziel.size)];
}

LS.spiel({
  id: "spiegel-raster",
  einleitung: "Spieglein, Spieglein! Tipp die Felder an, damit auf der anderen Seite das Spiegelbild entsteht.",
  hilfe: "Tipp ein Feld an, um es zu färben; nochmal tippen macht es wieder weiss. Wenn das Spiegelbild (oder die verschobene Figur) fertig ist, tippst du auf „Fertig ✓“.",
  anzahl: 6,
  stufen: {
    s1: "Kleines Raster, senkrechte Achse in der Mitte.",
    s2: "Grösseres Raster, mehr Felder.",
    s3: "Auch an der waagrechten Achse spiegeln.",
    s4: "Dazu: Figuren im Raster verschieben.",
    s5: "Profi: an der schrägen Achse spiegeln.",
    s6: "Endgegner: an zwei Achsen zugleich, Achse nicht in der Mitte, schräg verschieben.",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (STUFE[ctx.stufe].arten.length > 1) ctx.serie("art", a.art);
    const proZeile = {};
    for (const k of a.ziel) { const [r, c] = teile(k); (proZeile[r] ||= []).push(c + 1); }
    ctx.loesung("Färbe " + Object.keys(proZeile).map(r => `Zeile ${+r + 1}: Spalte ${proZeile[r].sort((x, y) => x - y).join(", ")}`).join(" · "));
    ctx.tipp(tippsFuer(a));
    // Handgriffe: jedes Bildfeld einmal antippen, dazu „Fertig ✓“
    ctx.schritte(a.ziel.size + 1);
    const paar = el("div", { class: "sr-paar" });
    ctx.flaeche.append(paar);
    paar.append(el("div", { class: "frage", html: a.frage }),
      el("div", { class: "legende", html: `<span><i style="background:var(--deko-6)"></i>Vorlage</span><span><i style="background:var(--deko-3)"></i>deine Felder</span>` }));
    const rahmen = el("div", { class: "raster-rahmen" });
    const raster = el("div", { class: "raster" });
    raster.style.gridTemplateColumns = `repeat(${a.n}, 1fr)`;
    const zellen = {};
    const gesetzt = new Set();
    let fertig = false;
    for (let r = 0; r < a.n; r++) for (let c = 0; c < a.n; c++) {
      const k = key(r, c);
      const vorlage = a.vorlage.has(k);
      const tippbar = !vorlage && a.bereich(r, c);
      const z = el("button", { type: "button", class: "zelle" + (vorlage ? " vorlage" : tippbar ? "" : " fest"), "aria-label": `Zeile ${r + 1}, Spalte ${c + 1}` });
      if (!tippbar) z.disabled = true;
      else z.addEventListener("click", () => {
        if (fertig) return;
        gesetzt.has(k) ? gesetzt.delete(k) : gesetzt.add(k);
        z.classList.toggle("gesetzt", gesetzt.has(k));
        z.classList.remove("fehlt", "zuviel");
        LS.ton("tipp");
      });
      zellen[k] = z;
      raster.append(z);
    }
    rahmen.append(raster);
    // Achse einzeichnen (in Prozent des Rasters)
    if (a.art === "senkrecht") rahmen.append(el("div", { class: "achse", style: "left:calc(50% - 3px);top:-6px;bottom:-6px;width:6px" }));
    if (a.art === "waagrecht") rahmen.append(el("div", { class: "achse", style: "top:calc(50% - 3px);left:-6px;right:-6px;height:6px" }));
    if (a.art === "diagonal") rahmen.append(el("div", { class: "achse diagonal", style: "left:0;top:0;width:141.4%;height:6px;transform:rotate(45deg) translateY(-3px)" }));
    // Königsstufe: Achsen aus a.achsen
    for (const achse of a.achsen || []) {
      if (achse === "senkrecht") rahmen.append(el("div", { class: "achse", style: "left:calc(50% - 3px);top:-6px;bottom:-6px;width:6px" }));
      if (achse === "waagrecht") rahmen.append(el("div", { class: "achse", style: "top:calc(50% - 3px);left:-6px;right:-6px;height:6px" }));
      if (achse === "versetzt") rahmen.append(el("div", { class: "achse", style: `left:calc(${(a.achseBei / a.n) * 100}% - 3px);top:-6px;bottom:-6px;width:6px` }));
      if (achse === "gegendiagonal") rahmen.append(el("div", { class: "achse diagonal", style: "left:0;top:100%;width:141.4%;height:6px;transform:rotate(-45deg) translateY(-3px)" }));
    }
    paar.append(rahmen);

    const ok = el("button", { class: "knopf gruen", type: "button", text: "Fertig ✓" });
    ok.addEventListener("click", () => {
      if (fertig) return;
      const fehlt = [...a.ziel].filter(k => !gesetzt.has(k));
      const zuviel = [...gesetzt].filter(k => !a.ziel.has(k));
      if (!fehlt.length && !zuviel.length) { fertig = true; ctx.richtig(); return; }
      const teile = [fehlt.length ? `${fehlt.length} Feld${fehlt.length === 1 ? " fehlt" : "er fehlen"}` : "", zuviel.length ? `${zuviel.length} Feld${zuviel.length === 1 ? " ist" : "er sind"} zu viel` : ""].filter(Boolean).join(", ");
      ctx.falsch(`${teile}. ${a.verschiebung ? "Nimm dir eine Ecke der Figur vor und zähl die Schritte ab." : "Jedes Feld hat sein Spiegelbild gleich weit weg von der Achse."}`,
        "Die grün umrandeten Felder gehören dazu, die orange umrandeten nicht.");
      // Nach dem 2. Fehlversuch zeigen, wo es nicht stimmt; beim Aufgeben ebenso.
      if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)") || fehlt.length + zuviel.length <= 2) {
        fehlt.forEach(k => zellen[k].classList.add("fehlt"));
        zuviel.forEach(k => zellen[k].classList.add("zuviel"));
      }
      if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)")) fertig = true;
    });
    paar.append(el("div", { class: "knopfzeile" }, ok));
    if (ctx.nr === 0) ctx.sag("Tipp ein Feld an, um es zu färben. Nochmal tippen macht es wieder weiss.");
  },
});
</script>
</body>
</html>
