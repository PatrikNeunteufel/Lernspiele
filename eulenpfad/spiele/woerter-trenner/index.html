<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wörter-Trenner</title>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  /* Eine Zeile, nie umbrechen: ein Zeilenumbruch sähe aus wie eine Wortgrenze. Lange Sätze: seitlich schieben. */
  .schlange-rahmen { overflow-x: auto; margin: 10px 0 18px; padding-bottom: 6px; }
  .schlange { display: flex; flex-wrap: nowrap; align-items: stretch; width: max-content; margin: 0 auto; font-size: var(--gr, 40px); }
  .buchstabe { font-weight: 900; padding: .15em 0; color: var(--text); line-height: 1.1; }
  .luecke { width: .5em; min-width: 12px; border: none; background: transparent; cursor: pointer; position: relative; padding: 0; }
  .luecke::after { content: ""; position: absolute; left: calc(50% - 2px); top: .2em; bottom: .2em; width: 4px; border-radius: 2px; background: transparent; }
  .luecke:hover::after { background: #dfe3ef; }
  .luecke.strich::after { background: var(--hinweis); top: 0; bottom: 0; }
  .luecke.fehlt::after { background: var(--gut); top: 0; bottom: 0; }
  .luecke.zuviel::after { background: #e5484d; }
  .loesung { text-align: center; font-size: clamp(22px, 4.6vw, 30px); font-weight: 800; color: var(--gut); min-height: 36px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>✂️ Wörter-Trenner</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="../satz-reparatur/saetze.js"></script>
<script>
"use strict";
// Lehrplan SG D.4.F.1.a: Wortgrenzen beachten. Ein Satz steht ohne Lücken in Grossbuchstaben da;
// das Kind setzt Trennstriche zwischen die Wörter. Die Sätze stammen aus der Satz-Reparatur.

const { waehle, el } = LS;

// Je Stufe: Anzahl Wörter im Satz (alle Sätze der Satz-Reparatur, ohne Satzzeichen)
// Königsstufe: zwei Sätze aneinander, zusammen 14 bis 24 Wörter, knappere Hilfe.
const STUFE = { s1: [2, 3], s2: [4, 4], s3: [5, 5], s4: [6, 7], s5: [8, 20], s6: [14, 24] };
const woerterVon = s => s.replace(/[.!?]/g, "").split(" ");
// Die Listen sind die der Satz-Reparatur (Katalog: von "satz-reparatur/…"); Kinder üben nur freie Sätze.
const FREI = new Set(LS.freieListen("woerter-trenner"));
const frei = gruppe => (FREI.has(SAETZE_LISTEN[gruppe]) ? SAETZE[gruppe] : []);
const ALLE = Object.keys(SAETZE).flatMap(frei).map(woerterVon);
const LANGE = [...frei("s4"), ...frei("s5")];
/** Königsstufe: alle Paare langer Sätze, die zusammen in den Rahmen passen. */
const PAARE = LANGE.flatMap((a, i) => LANGE.filter((b, j) => j !== i).map(b => woerterVon(`${a} ${b}`)))
  .filter(w => w.length >= STUFE.s6[0] && w.length <= STUFE.s6[1]);
const kandidaten = stufe => (stufe === "s6" ? PAARE : ALLE.filter(w => w.length >= STUFE[stufe][0] && w.length <= STUFE[stufe][1]));

/** Wörter der Aufgabe; null, wenn die freien Sätze für diese Stufe nichts hergeben. */
function aufgabeErzeugen(stufe) {
  const k = kandidaten(stufe);
  return k.length ? waehle(k) : null;
}

/** Mängel: Wortzahl im Rahmen der Stufe, nur Buchstaben, Sätze nur aus freien Listen. */
function pruefeAufgabe(woerter, stufe) {
  const m = [];
  if (!woerter) return ["Stufe angeboten, aber kein freier Satz"];
  const [min, max] = STUFE[stufe];
  if (woerter.length < min || woerter.length > max) m.push(`Wortzahl ${woerter.length} ausserhalb ${min}–${max}`);
  if (woerter.some(w => !/^[A-Za-zÄÖÜäöü]+$/.test(w))) m.push("Wort mit Zeichen, die keine Buchstaben sind");
  const text = woerter.join(" ");
  const quelle = Object.keys(SAETZE).filter(g => FREI.has(SAETZE_LISTEN[g])).flatMap(g => SAETZE[g]).map(s => woerterVon(s).join(" "));
  if (!quelle.some(s => text.includes(s))) m.push("Satz nicht aus einer freien Liste");
  return m;
}

const STUFEN_TEXT = {
  s1: "Kurze Sätze mit 2 bis 3 Wörtern: ERLACHTLAUT.",
  s2: "Sätze mit 4 Wörtern.",
  s3: "Sätze mit 5 Wörtern.",
  s4: "Lange Sätze mit 6 bis 7 Wörtern.",
  s5: "Ganz lange Sätze — auch zwei hintereinander.",
  s6: "Endgegner: zwei lange Sätze ohne Lücke, bis 24 Wörter.",
};

LS.spiel({
  id: "woerter-trenner",
  einleitung: "Hilfe, die Wörter kleben aneinander! Tipp zwischen die Buchstaben, um die Wörter zu trennen.",
  hilfe: "Die Wörter kleben ohne Lücke aneinander. Tipp zwischen zwei Buchstaben, wo ein Wort aufhört — dort erscheint ein Strich. Nochmals tippen nimmt ihn weg. Bist du fertig, tippst du auf „Fertig ✓“.",
  anzahl: 8,
  // Nur Stufen, für die die freien Sätze etwas hergeben.
  stufen: Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => kandidaten(s).length)),

  aufgabe(ctx) {
    const woerter = aufgabeErzeugen(ctx.stufe);
    const buchstaben = woerter.join("").toUpperCase().split("");
    // Soll: Trennstellen nach dem i-ten Buchstaben (Index im zusammengeklebten Text)
    const soll = new Set();
    let pos = 0;
    woerter.slice(0, -1).forEach(w => { pos += w.length; soll.add(pos); });
    const loesungText = `Der ${ctx.stufe === "s6" ? "Text" : "Satz"} heisst: ${woerter.join(" ")}`;
    ctx.loesung(loesungText);
    // Handgriffe: je Trennstelle ein Tipp, dazu „Fertig ✓“
    ctx.schritte(soll.size + 1);
    // Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Strategie, dann die Zahl der Wörter — nie eine Trennstelle.
    ctx.tipp([
      "Lies ganz langsam von vorn. Sobald du ein Wort erkennst, setzt du dahinter einen Strich.",
      ctx.stufe === "s6"
        ? "Hier stehen zwei Sätze hintereinander. Nach jedem Wort kommt ein Strich — nur nach dem allerletzten nicht."
        : `Der Satz hat ${woerter.length} Wörter. Du brauchst also ${woerter.length - 1} Strich${woerter.length === 2 ? "" : "e"}.`,
    ]);

    ctx.flaeche.append(el("div", { class: "auftrag", text: "Wo hört ein Wort auf?" }));
    const schlange = el("div", { class: "schlange", "aria-label": "Buchstaben ohne Lücken" });
    const gesetzt = new Set();
    const luecken = {};
    let fertig = false;
    buchstaben.forEach((b, i) => {
      schlange.append(el("span", { class: "buchstabe", text: b }));
      if (i < buchstaben.length - 1) {
        const stelle = i + 1;
        const l = el("button", { type: "button", class: "luecke", "aria-label": `Trennen nach ${b}` });
        l.addEventListener("click", () => {
          if (fertig) return;
          gesetzt.has(stelle) ? gesetzt.delete(stelle) : gesetzt.add(stelle);
          l.classList.toggle("strich", gesetzt.has(stelle));
          l.classList.remove("fehlt", "zuviel");
          LS.ton("tipp");
        });
        luecken[stelle] = l;
        schlange.append(l);
      }
    });
    const loesung = el("div", { class: "loesung" });
    ctx.flaeche.append(el("div", { class: "schlange-rahmen" }, schlange), loesung);
    // Schriftgrösse so wählen, dass der Satz möglichst in eine Zeile passt (mindestens 22 px)
    const breite = ctx.flaeche.clientWidth || 600;
    schlange.style.setProperty("--gr", `${Math.max(22, Math.min(44, Math.floor(breite / (buchstaben.length * 1.25))))}px`);

    const ok = el("button", { class: "knopf gruen", type: "button", text: "Fertig ✓" });
    ok.addEventListener("click", () => {
      if (fertig) return;
      const fehlt = [...soll].filter(s => !gesetzt.has(s));
      const zuviel = [...gesetzt].filter(s => !soll.has(s));
      if (!fehlt.length && !zuviel.length) { fertig = true; loesung.textContent = woerter.join(" "); ctx.richtig(); return; }
      // Königsstufe: knapper — ohne Zahl der fehlenden oder überzähligen Striche.
      if (ctx.stufe === "s6") ctx.falsch("Noch nicht ganz. Lies leise Wort für Wort und klatsche bei jedem Wort.", loesungText);
      else ctx.falsch(`${fehlt.length ? `Es fehlen noch ${fehlt.length} Trennstrich${fehlt.length === 1 ? "" : "e"}.` : ""} ${zuviel.length ? `${zuviel.length} Strich${zuviel.length === 1 ? " ist" : "e sind"} zu viel — dort geht ein Wort weiter.` : ""} Lies leise und klatsche bei jedem Wort.`.trim(),
        loesungText);
      if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)")) {
        fertig = true;
        fehlt.forEach(s => luecken[s].classList.add("fehlt"));
        zuviel.forEach(s => luecken[s].classList.add("zuviel"));
        loesung.textContent = woerter.join(" ");
      }
    });
    ctx.flaeche.append(el("div", { class: "knopfzeile" }, ok));
    if (ctx.nr === 0) ctx.sag("Tipp genau zwischen zwei Buchstaben — dort erscheint ein Trennstrich.");
  },
});
</script>
</body>
</html>
