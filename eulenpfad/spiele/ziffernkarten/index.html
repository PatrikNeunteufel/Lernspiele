<style>
  .vorgabe {
    background: var(--regel);
    border: 3px dashed var(--regel-rand);
    border-radius: 18px;
    padding: 12px 18px;
    font-size: clamp(20px, 3.6vw, 26px);
    font-weight: 800;
    text-align: center;
    margin: 0 auto 18px;
    max-width: 720px;
  }
  .vorgabe-regel { font-size: .75em; font-weight: 700; margin-top: 6px; }

  .faecher {
    display: grid;
    grid-template-columns: repeat(var(--n), minmax(0, 1fr));
    max-width: calc(var(--n) * 106px);
    margin: 0 auto;
    gap: clamp(4px, 1.5vw, 10px);
  }

  .fach-kopf {
    text-align: center;
    font-weight: 900;
    color: var(--auf-stelle);
    background: var(--f);
    border-radius: 10px;
    padding: 4px 0;
    font-size: 18px;
  }

  .platz {
    border: 4px dashed var(--f);
    border-radius: 16px;
    aspect-ratio: .78;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--anzeige);
    cursor: pointer;
  }

  .karten {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    min-height: 130px;
    margin: 22px 0 6px;
    padding: 12px;
    border-radius: 20px;
    background: color-mix(in srgb, var(--knopf) 7%, transparent);
  }

  .karte-ziffer {
    width: clamp(64px, 14vw, 88px);
    aspect-ratio: .72;
    border: none;
    border-radius: 14px;
    background: var(--k-feld);
    box-shadow: 0 5px 0 var(--aus), 0 8px 16px rgba(45, 48, 71, .12);
    font-family: inherit;
    font-size: clamp(40px, 9vw, 56px);
    font-weight: 900;
    color: var(--text);
    cursor: pointer;
    position: relative;
    animation: karte-rein .35s backwards;
  }

  .karte-ziffer::before, .karte-ziffer::after {
    content: "";
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--knopf);
    opacity: .5;
  }
  .karte-ziffer::before { top: 8px; left: 8px; }
  .karte-ziffer::after { bottom: 8px; right: 8px; }

  /* In schmalen Fächern (sieben Stellen auf dem Handy) wird die Ziffer kleiner. */
  .platz .karte-ziffer { width: 100%; height: 100%; animation: none; font-size: clamp(28px, 7vw, 56px); }

  @keyframes karte-rein {
    from { transform: translateY(20px) rotate(-8deg); opacity: 0; }
  }

  .faecher.richtig .platz { border-style: solid; border-color: var(--gut); background: var(--gut-hell); }
  .faecher.falsch { animation: wackeln .4s; }

  .ergebnis { text-align: center; font-size: 22px; font-weight: 800; min-height: 32px; margin-top: 10px; }

  /* Ganze Aufgabe im Bild (BH3 a): Auf niedrigen Bildschirmen werden Fächer und Karten niedriger (nicht schmaler),
     die Abstände enger. */
  @media (max-height: 820px) {
    .vorgabe { padding: 8px 14px; margin-bottom: 10px; font-size: clamp(20px, 3.6vw, 22px); }
    .platz { max-height: 12vh; }
    .karten { min-height: 0; margin: 12px 0 4px; padding: 8px; gap: 8px; }
    .karte-ziffer { max-height: 10.5vh; }
    .ergebnis { margin-top: 6px; }
  }
  /* Sieben Karten brechen sonst schon auf dem Tablet in zwei Reihen um. */
  .karten { gap: 8px; padding: 8px; }
  /* Handy: Die Karten liegen in zwei Reihen, darum dort noch etwas niedriger. */
  @media (max-width: 560px) and (max-height: 820px) {
    .platz { max-height: 10vh; }
    .karten { margin-top: 8px; }
    .karte-ziffer { max-height: 8vh; font-size: 40px; }
    .vorgabe { padding: 6px 12px; }
    .fach-kopf { padding: 2px 0; }
  }
</style>

<script>
"use strict";
// Lernziel 4.2-G4 (Grund): aus mehreren Ziffern Zahlen bilden, die den schriftlichen Vorgaben entsprechen.
// Lernziel 4.2-E2 (Erweitert): aus mehreren Ziffern Zahlen bilden, die den Vorgaben entsprechen —
// hier mit mehreren Bedingungen gleichzeitig (gerade/ungerade, Nähe, Grenzen, feste Stelle + Extremwert).

const { STELLEN, zahlText, zufall, waehle, mische, el } = LS;

/** Alle Zahlen aus den Karten (jede Karte genau einmal), ohne führende Null. */
function alleZahlen(karten) {
  const ergebnis = new Set();
  (function lege(rest, bisher) {
    if (!rest.length) { if (bisher[0] !== 0) ergebnis.add(Number(bisher.join(""))); return; }
    rest.forEach((z, i) => lege([...rest.slice(0, i), ...rest.slice(i + 1)], [...bisher, z]));
  })(karten, []);
  return [...ergebnis];
}

function kartenZiehen(anzahl, mitNull) {
  const pool = mische([1, 2, 3, 4, 5, 6, 7, 8, 9]).slice(0, anzahl - (mitNull ? 1 : 0));
  if (mitNull) pool.push(0);
  return mische(pool);
}

const stelleVon = (n, st) => Math.floor(n / st.wert) % 10;
const gerade = n => n % 2 === 0;
// Je Stufe: Anzahl Karten, Art der Vorgaben und ob eine Null dabei ist (0.5 = jede zweite Aufgabe).
// art: "leicht" = grösste, kleinste, feste Stelle, zwischen; "grund" = dazu grösste mit fester Stelle;
// "erweitert" = gerade/ungerade, Nähe, Grenzen; "profi" = zwei Bedingungen; "koenig" = bis drei.
const STUFE = {
  s1: { karten: 3, art: "grund", null: 0.5 },
  s2: { karten: 4, art: "leicht", null: 0 },
  s3: { karten: 4, art: "grund", null: 0.5 },
  s4: { karten: 5, art: "erweitert", null: 0.5 },
  s5: { karten: 6, art: "profi", null: 0.5 },
  s6: { karten: 7, art: "koenig", null: 1 },
};

const GERADE = "Die Zahl muss gerade sein: Bei den Einern steht 0, 2, 4, 6 oder 8.";
const UNGERADE = "Die Zahl muss ungerade sein: Bei den Einern steht 1, 3, 5, 7 oder 9.";

/**
 * Vorgaben: Text, Bedingung (filter) und Ziel ('alle' = jede passende Zahl zählt,
 * 'max'/'min' = die grösste/kleinste passende, 'nah' = am nächsten bei 'bei').
 */
function vorgabeErzeugen(stufe, karten, stellen, zahlen) {
  const n = karten.length;
  const st = waehle(stellen);
  const d = waehle(karten.filter(z => !(z === 0 && st === stellen[0])));
  const beispiel = waehle(zahlen);
  const hoch = STELLEN[7 - n]; // höchste Stelle
  const unten = Math.floor(beispiel / hoch.wert) * hoch.wert;
  const anStelle = `Die ${d} muss bei den ${LS.dativ(st)} stehen.`;

  const grund = [
    { text: "Bilde die grösste Zahl.", filter: () => true, ziel: "max" },
    { text: "Bilde die kleinste Zahl.", filter: () => true, ziel: "min" },
    { text: `Bilde eine Zahl, bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => stelleVon(z, st) === d, ziel: "alle", regel: anStelle },
    { text: `Bilde eine Zahl zwischen ${zahlText(unten)} und ${zahlText(unten + hoch.wert)}.`, filter: z => z > unten && z < unten + hoch.wert, ziel: "alle", regel: `Die Zahl muss zwischen ${zahlText(unten)} und ${zahlText(unten + hoch.wert)} liegen.` },
    { text: `Bilde die grösste Zahl, bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => stelleVon(z, st) === d, ziel: "max", regel: anStelle },
  ];
  const art = STUFE[stufe].art;
  if (art === "leicht") return waehle(grund.slice(0, 4));
  if (art === "grund") return waehle(grund);

  const mitte = waehle([3, 4, 5, 6, 7]) * hoch.wert;
  const grenze = Math.round(beispiel / (hoch.wert / 10)) * (hoch.wert / 10);
  const erweitert = [
    { text: "Bilde die grösste gerade Zahl.", filter: gerade, ziel: "max", regel: GERADE },
    { text: "Bilde die kleinste ungerade Zahl.", filter: z => !gerade(z), ziel: "min", regel: UNGERADE },
    { text: `Bilde die Zahl, die am nächsten bei ${zahlText(mitte)} liegt.`, filter: () => true, ziel: "nah", bei: mitte },
    { text: `Bilde die grösste Zahl, die kleiner als ${zahlText(grenze)} ist.`, filter: z => z < grenze, ziel: "max", regel: `Die Zahl muss kleiner als ${zahlText(grenze)} sein.` },
    { text: `Bilde die kleinste Zahl, die grösser als ${zahlText(grenze)} ist.`, filter: z => z > grenze, ziel: "min", regel: `Die Zahl muss grösser als ${zahlText(grenze)} sein.` },
    { text: `Die ${d} steht bei den ${LS.dativ(st)} (${st.k}), und die Zahl ist so klein wie möglich.`, filter: z => stelleVon(z, st) === d, ziel: "min", regel: anStelle },
    { text: `Bilde die grösste ungerade Zahl, bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => stelleVon(z, st) === d && !gerade(z), ziel: "max", regel: `${UNGERADE} ${anStelle}` },
  ];
  if (art === "erweitert") return waehle(Math.random() < 0.25 ? grund.slice(2) : erweitert);

  // Profi: zwei Bedingungen gleichzeitig.
  const profi = [
    { text: `Bilde die gerade Zahl, die am nächsten bei ${zahlText(mitte)} liegt.`, filter: gerade, ziel: "nah", bei: mitte, regel: GERADE },
    { text: `Bilde die grösste Zahl, die kleiner als ${zahlText(grenze)} ist und bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => z < grenze && stelleVon(z, st) === d, ziel: "max", regel: `Die Zahl muss kleiner als ${zahlText(grenze)} sein. ${anStelle}` },
    { text: `Bilde die kleinste ungerade Zahl, die grösser als ${zahlText(grenze)} ist.`, filter: z => z > grenze && !gerade(z), ziel: "min", regel: `Die Zahl muss grösser als ${zahlText(grenze)} sein. ${UNGERADE}` },
  ];
  if (art === "profi") return waehle(Math.random() < 0.5 ? profi : erweitert);

  // Königsstufe: sieben Karten mit Null, zwei oder drei Bedingungen gleichzeitig.
  const koenig = [
    { text: `Bilde die ungerade Zahl, die am nächsten bei ${zahlText(mitte)} liegt.`, filter: z => !gerade(z), ziel: "nah", bei: mitte, regel: UNGERADE },
    { text: `Bilde die grösste gerade Zahl, die kleiner als ${zahlText(grenze)} ist und bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => z < grenze && gerade(z) && stelleVon(z, st) === d, ziel: "max", regel: `Die Zahl muss kleiner als ${zahlText(grenze)} sein. ${GERADE} ${anStelle}` },
    { text: `Bilde die kleinste Zahl, die grösser als ${zahlText(grenze)} ist und bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => z > grenze && stelleVon(z, st) === d, ziel: "min", regel: `Die Zahl muss grösser als ${zahlText(grenze)} sein. ${anStelle}` },
    { text: `Bilde die gerade Zahl, die am nächsten bei ${zahlText(mitte)} liegt und bei der die ${d} bei den ${LS.dativ(st)} (${st.k}) steht.`, filter: z => gerade(z) && stelleVon(z, st) === d, ziel: "nah", bei: mitte, regel: `${GERADE} ${anStelle}` },
  ];
  return waehle(Math.random() < 0.7 ? koenig : profi);
}

/** Menge der richtigen Antworten zur Vorgabe; leer, wenn die Karten nicht passen. */
function loesungen(vorgabe, zahlen) {
  const passend = zahlen.filter(vorgabe.filter);
  if (!passend.length) return [];
  if (vorgabe.ziel === "alle") return passend;
  if (vorgabe.ziel === "max") return [Math.max(...passend)];
  if (vorgabe.ziel === "min") return [Math.min(...passend)];
  const abstand = Math.min(...passend.map(z => Math.abs(z - vorgabe.bei)));
  return passend.filter(z => Math.abs(z - vorgabe.bei) === abstand);
}

function aufgabeErzeugen(stufe) {
  const { karten: anzahl, null: mitNull } = STUFE[stufe];
  const stellen = STELLEN.slice(7 - anzahl);
  let karten, zahlen;
  for (let versuch = 0; versuch < 100; versuch++) {
    karten = kartenZiehen(anzahl, Math.random() < mitNull);
    zahlen = alleZahlen(karten);
    const vorgabe = vorgabeErzeugen(stufe, karten, stellen, zahlen);
    const richtig = loesungen(vorgabe, zahlen);
    if (richtig.length) return { karten, stellen, vorgabe, richtig };
  }
  // Notausgang (praktisch nie): die grösste Zahl gibt es immer.
  const vorgabe = { text: "Bilde die grösste Zahl.", filter: () => true, ziel: "max" };
  return { karten, stellen, vorgabe, richtig: loesungen(vorgabe, zahlen) };
}

function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (a.karten.length !== p.karten) m.push(`${a.karten.length} Karten`);
  if (new Set(a.karten).size !== a.karten.length) m.push("Karte doppelt");
  if (p.null === 0 && a.karten.includes(0)) m.push("Null in Stufe ohne Null");
  if (p.null === 1 && !a.karten.includes(0)) m.push("Null fehlt");
  if (!a.richtig.length) m.push("keine Lösung");
  const sortiert = z => String(z).split("").sort().join("");
  const soll = a.karten.slice().sort().join("");
  for (const z of a.richtig) {
    if (sortiert(z) !== soll) m.push(`Lösung ${z} nutzt nicht genau die Karten`);
    if (!a.vorgabe.filter(z)) m.push(`Lösung ${z} erfüllt die Vorgabe nicht`);
  }
  const passend = alleZahlen(a.karten).filter(a.vorgabe.filter);
  const r = a.richtig;
  if (a.vorgabe.ziel === "max" && (r.length !== 1 || r[0] !== Math.max(...passend))) m.push("nicht die grösste");
  if (a.vorgabe.ziel === "min" && (r.length !== 1 || r[0] !== Math.min(...passend))) m.push("nicht die kleinste");
  if (a.vorgabe.ziel === "nah" && passend.some(z => Math.abs(z - a.vorgabe.bei) < Math.abs(r[0] - a.vorgabe.bei))) m.push("nicht die nächste");
  if (a.vorgabe.ziel === "alle" && r.length !== passend.length) m.push("Lösungsmenge unvollständig");
  return m;
}

LS.spiel({
  id: "ziffernkarten",
  einleitung: "Ich habe Ziffernkarten gemischt! Leg sie in die Fächer, sodass eine Zahl entsteht, die zur Vorgabe passt. Jede Karte wird genau einmal gebraucht. Eine Zahl fängt nie mit 0 an.",
  hilfe: "Tipp eine Karte an — sie rutscht ins nächste freie Fach. Nochmals antippen holt sie zurück. Sind alle Fächer voll, drückst du „OK ✓“.",
  anzahl: 8,
  stufen: {
    s1: "3 Karten: grösste, kleinste Zahl, eine Ziffer an fester Stelle.",
    s2: "4 Karten ohne Null: grösste, kleinste Zahl, eine Ziffer an fester Stelle.",
    s3: "4 Karten nach schriftlichen Vorgaben (Lernziel G4).",
    s4: "5 Karten, Vorgaben wie die grösste gerade Zahl (Lernziel E2).",
    s5: "6 Karten und zwei Bedingungen gleichzeitig.",
    s6: "7 Karten mit Null und bis zu drei Bedingungen auf einmal.",
  },

  aufgabe(ctx) {
    const { karten, stellen, vorgabe, richtig } = aufgabeErzeugen(ctx.stufe);
    ctx.serie("ziel", vorgabe.ziel); // grösste, kleinste, nächste oder jede passende Zahl
    const loesung = `Eine richtige Lösung ist ${zahlText(richtig[0])}.`;
    ctx.loesung(loesung);
    ctx.schritte(karten.length + 1); // jede Karte einmal antippen, dann OK
    // Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Vorgabe zerlegen, welche Ziffern nach vorne,
    // was zuerst festlegen — nie eine Ziffernfolge.
    const tippZiel = {
      max: "Für eine möglichst grosse Zahl gehören die grossen Ziffern nach vorne.",
      min: "Für eine möglichst kleine Zahl gehören die kleinen Ziffern nach vorne.",
      nah: `Schau zuerst auf die vorderste Stelle: Mit welcher Ziffer kommst du am nächsten an ${zahlText(vorgabe.bei || 0)} heran? Dann die nächste Stelle.`,
      alle: "Leg zuerst die Karte, deren Platz festgelegt ist. Die vorderste Ziffer entscheidet, wie gross die Zahl ungefähr wird.",
    }[vorgabe.ziel];
    const t = ["Lies die Vorgabe Stück für Stück: Was muss die Zahl alles erfüllen?", tippZiel];
    if (vorgabe.regel && vorgabe.ziel !== "alle") t.push("Leg zuerst fest, was vorgegeben ist — eine Ziffer an fester Stelle, eine gerade oder ungerade Einerziffer. Dann verteilst du die übrigen Karten.");
    if (karten.includes(0)) t.push("Eine Zahl fängt nie mit 0 an.");
    ctx.tipp(t);
    // Mit Null die Regel gleich sichtbar nennen, nicht erst als Tipp oder nach dem Fehler (Meldung 8, LERN_Session12).
    const vorgabeKasten = el("div", { class: "vorgabe", text: vorgabe.text });
    if (karten.includes(0)) vorgabeKasten.append(el("div", { class: "vorgabe-regel", text: "Vorne darf keine 0 stehen." }));
    ctx.flaeche.append(vorgabeKasten);

    const faecher = el("div", { class: "faecher" });
    faecher.style.setProperty("--n", stellen.length);
    for (const st of stellen) faecher.append(el("div", { class: `fach-kopf st st-${st.k}`, text: st.k }));
    const plaetze = stellen.map(st => {
      const p = el("div", { class: `platz st st-${st.k}`, "aria-label": st.name });
      faecher.append(p);
      return p;
    });
    const stapel = el("div", { class: "karten" });
    const ergebnis = el("div", { class: "ergebnis" });
    const ok = el("button", { class: "knopf gruen", type: "button", text: "OK ✓", disabled: "" });
    ctx.flaeche.append(faecher, stapel, ergebnis, el("div", { class: "knopfzeile" }, ok));

    let gesperrt = false;
    function aktualisiere() {
      const voll = plaetze.every(p => p.firstChild);
      ok.disabled = !voll || gesperrt;
      // Mit führender Null die Karten so zeigen, wie sie liegen — sonst verschwände die Null still.
      const roh = plaetze.map(p => p.firstChild?.textContent).join("");
      ergebnis.textContent = !voll ? "" : roh.startsWith("0") ? `Deine Karten: ${roh} — vorne steht eine 0.` :`Deine Zahl: ${zahlText(gelegt())}`;
      faecher.classList.remove("falsch");
    }
    const gelegt = () => Number(plaetze.map(p => p.firstChild.textContent).join(""));

    // Karte antippen: vom Stapel ins erste freie Fach, aus einem Fach zurück auf den Stapel.
    const kartenKnoepfe = karten.map((z, i) => {
      const k = el("button", { type: "button", class: "karte-ziffer", text: String(z), style: `animation-delay:${i * 0.07}s` });
      k.addEventListener("click", () => {
        if (gesperrt) return;
        LS.ton("tipp");
        if (k.parentElement === stapel) {
          const frei = plaetze.find(p => !p.firstChild);
          if (frei) frei.append(k);
        } else {
          stapel.append(k);
        }
        aktualisiere();
        tastenNeu();
      });
      stapel.append(k);
      return k;
    });
    // Kurztasten an den Karten selbst: Die Ziffer ist die Taste, auch doppelt. Die Taste nimmt den ersten Knopf der
    // Liste — darum stehen die Karten auf dem Stapel vorne: Liegt eine 3 schon im Fach, legt die Taste 3 die nächste
    // freie 3; erst wenn keine mehr frei ist, holt sie die zuletzt gelegte zurück. Nach jedem Zug neu (gleiche Box
    // ersetzt die Gruppe).
    function tastenNeu() {
      const imFach = plaetze.map(p => p.firstChild).filter(Boolean).reverse();
      LS.kurztasten(stapel, [...kartenKnoepfe.filter(k => k.parentElement === stapel), ...imFach]);
    }
    tastenNeu();

    ok.addEventListener("click", () => {
      if (gesperrt) return;
      const zahl = gelegt();
      if (richtig.includes(zahl)) {
        gesperrt = true;
        ok.disabled = true;
        faecher.classList.add("richtig");
        ctx.richtig();
        return;
      }
      faecher.classList.add("falsch");
      let hinweis;
      if (plaetze[0].firstChild.textContent === "0") hinweis = "Eine Zahl fängt nie mit 0 an!";
      else if (!vorgabe.filter(zahl)) hinweis = vorgabe.regel || "Lies die Vorgabe nochmal genau.";
      else if (vorgabe.ziel === "max") hinweis = "Das passt — aber es geht noch grösser! Die grossen Ziffern gehören nach vorne.";
      else if (vorgabe.ziel === "min") hinweis = "Das passt — aber es geht noch kleiner! Die kleinen Ziffern gehören nach vorne.";
      else if (vorgabe.ziel === "nah") hinweis = `Es gibt eine Zahl, die noch näher bei ${zahlText(vorgabe.bei)} liegt. Schau zuerst auf die vorderste Stelle.`;
      else hinweis = "Lies die Vorgabe nochmal genau.";
      ctx.falsch(hinweis, loesung);
      if (ctx.flaeche.querySelector(".knopfzeile button.knopf:not(.gruen)")) { gesperrt = true; ok.disabled = true; }
    });

    ctx.sag(ctx.nr === 0 ? "Tipp eine Karte an, dann rutscht sie ins nächste freie Fach. Nochmal tippen holt sie zurück." : "Neue Karten, neue Vorgabe!");
  },
});
</script>
</body>
