<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preis-Tabelle</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(19px, 4.2vw, 26px); font-weight: 800; margin: 0 0 12px; }
  .titel { text-align: center; font-size: clamp(20px, 4.4vw, 26px); font-weight: 900; margin: 0 0 8px; }

  /* Wertetabelle: senkrecht, damit sie auch auf dem Handy Platz hat */
  .werte { border-collapse: collapse; margin: 0 auto 14px; font-size: clamp(19px, 4.4vw, 24px); font-weight: 800; background: #fff; font-variant-numeric: tabular-nums; }
  .werte th, .werte td { border: 3px solid var(--rand); padding: 6px 14px; text-align: right; min-width: 92px; }
  .werte th { background: #f6f7fd; font-size: 16px; color: var(--text-leise); text-align: center; }
  .werte .luecke { display: inline-block; min-width: 54px; text-align: center; border-radius: 10px; background: var(--hinweis-hell); color: var(--deko-3); border: 3px dashed var(--deko-3); padding: 0 8px; }
  .werte .gefuellt { display: inline-block; border-radius: 10px; background: var(--gut-hell); padding: 0 8px; }
  .werte .mehr td { color: var(--text-leise); text-align: center; }
  .werte button.zelle { font: inherit; border: none; border-radius: 10px; background: #fff8e1; box-shadow: 0 3px 0 #f5c451; padding: 4px 10px; min-height: 44px; cursor: pointer; width: 100%; text-align: right; }
  .werte button.zelle.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .werte button.zelle.richtig { background: var(--gut-hell); box-shadow: 0 3px 0 var(--gut); }
  .werte button.zelle.gewaehlt { opacity: .45; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧾 Preis-Tabelle</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="artikel.js"></script>
<script>
"use strict";
// Lehrplan SG MA.3.A.3 Funktionale Zusammenhänge: b Zahlenfolgen und Wertetabellen beschreiben und
// weiterführen (1. Zyklus); d (Orientierungspunkt 4. Klasse) proportionale Zusammenhänge in Tabellen,
// z. B. Anzahl → Preis, auch rückwärts; im 2. Zyklus weiter mit Zwischenschritt über 1 Stück
// (Dreisatz) und Gewichten. Geld wie in der Kiosk-Kasse (MA.3.A.1.d): 25 Fr. 60 Rp. — alles intern
// in Rappen. Inhalte in artikel.js. Basisklasse 4: s1 3. Klasse, s5 5. Klasse, s6 Königsstufe.

const { zufall, waehle, mische, el, zahlText } = LS;

/** Betrag in Schweizer Schreibweise mit Fr. und Rp. (wie Kiosk-Kasse): 25 Fr. 60 Rp., 13 Fr., 60 Rp. */
function betrag(rp) {
  const fr = Math.floor(rp / 100), r = rp % 100;
  if (!fr) return `${r} Rp.`;
  return r ? `${zahlText(fr)} Fr. ${r} Rp.` : `${zahlText(fr)} Fr.`;
}

/** Satzende nach „Fr.“ oder „Rp.“: kein doppelter Punkt. */
const satz = s => s.replace(/\.\./g, ".");

const grammText = g => (g === 1000 ? "1 kg" : `${g} g`);

// Je Stufe: Aufgabenarten, Preisraster (Rp.), höchster Betrag (Rp.)
const STUFE = {
  s1: { arten: ["folge"], raster: 100, max: 5000 },
  s2: { arten: ["preis"], raster: 100, max: 5000 },
  s3: { arten: ["preis", "preis", "anzahl"], raster: 10, max: 10000 },
  s4: { arten: ["ohneEins", "ohneEins", "anzahl"], raster: 5, max: 20000 },
  s5: { arten: ["dreisatz", "gewicht", "anzahlDreisatz"], raster: 5, max: 50000 },
  // Königsstufe: falschen Preis finden, Dreisatz vorwärts und rückwärts, Gewichte ohne 100-g-Zeile.
  s6: { arten: ["fehler", "fehler", "anzahlDreisatz", "dreisatz", "gewicht"], raster: 5, max: 50000 },
};

// ---------- Freigabe (Entscheid L4 a) ----------
// Kinder üben nur Waren und Folgen aus freien Listen (LS.freieListen; die Aufsicht sieht alle). Kennt
// der Katalog die Listen dieses Spiels noch nicht, gilt alles als frei — wie bei einem Spiel ohne Listen.
const SPIEL_ID = "preis-tabelle";
const FREI = new Set(LS.spielListen(SPIEL_ID).length ? LS.freieListen(SPIEL_ID) : ["stueckware", "gewichtsware", "folgen"]);
/** Aus welcher Liste nimmt eine Aufgabenart ihren Inhalt? */
const listeVon = art => (art === "folge" ? "folgen" : art === "gewicht" ? "gewichtsware" : "stueckware");
// Aufgabenarten ohne freie Liste fallen weg, Stufen ohne Aufgabenart ebenso.
for (const [s, p] of Object.entries(STUFE)) {
  p.arten = p.arten.filter(art => FREI.has(listeVon(art)));
  if (!p.arten.length) delete STUFE[s];
}

/** Stückpreis im Raster der Stufe aus dem Preisbereich der Ware. */
function stueckPreis(ding, raster) {
  const [, , , min, max] = ARTIKEL[ding];
  const moeglich = [];
  for (let p = Math.ceil(min / raster) * raster; p <= max; p += raster) moeglich.push(p);
  // Im 10- und 5-Rappen-Raster meist „krumme“ Preise, damit Rappen vorkommen.
  const krumm = moeglich.filter(p => p % 100);
  return waehle(raster < 100 && krumm.length && Math.random() < 0.8 ? krumm : moeglich);
}

/** Anzahlen: 'n' verschiedene aus der Liste, aufsteigend sortiert. */
const ziehe = (liste, n) => mische(liste).slice(0, n).sort((a, b) => a - b);

/** Neue Aufgabe für die Stufe — alle Zahlen und die Lösung; aufgabe(ctx) zeichnet sie nur. */
function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const art = waehle(p.arten);

  if (art === "folge") {
    // y = Start + Schritt · (Zeile − 1); das leere Feld steht hinten (fortsetzen) oder mitten drin.
    const f = zufall(0, FOLGEN.length - 1);
    const geld = FOLGEN[f][3];
    const start = geld ? zufall(0, 10) * 100 : zufall(2, 20);
    const schritt = geld ? zufall(2, 6) * 100 : zufall(2, 9);
    const x = [1, 2, 3, 4, 5, 6];
    const y = x.map(k => start + schritt * (k - 1));
    const hinten = Math.random() < 0.5;
    const luecke = hinten ? zufall(3, 5) : zufall(2, 4);
    return { art, f, x, y, luecke, zeilen: hinten ? luecke + 1 : 6, loesung: y[luecke], schritt };
  }

  if (art === "gewicht") {
    // Preis für 100 g; mit 50-g-Schritten ein Preis, der sich halbieren lässt.
    const w = zufall(0, WARE_GEWICHT.length - 1);
    const [, , min, max] = WARE_GEWICHT[w];
    const halbe = stufe === "s6";
    const r = halbe ? 20 : 10;
    const pro100 = zufall(Math.ceil(min / r), Math.floor(max / r)) * r;
    let gramm, luecke;
    if (stufe === "s5") {
      gramm = [100, ...ziehe([200, 300, 500, 1000], 3)];
      luecke = zufall(1, 3);
    } else {
      // ohne 100-g-Zeile: von 200 g oder 500 g aus auf 50-g-Schritte rechnen
      const basis = waehle([200, 500]);
      const ziel = waehle([50, 150, 250, 350, 750].filter(g => g !== basis));
      gramm = ziehe([basis, ziel, waehle([1000, basis * 2].filter(g => g !== ziel))], 3);
      gramm = [...new Set(gramm)];
      luecke = gramm.indexOf(ziel);
    }
    const preise = gramm.map(g => (pro100 * g) / 100);
    return { art, w, menge: gramm, preise, luecke, nach: "preis", pro100, loesung: preise[luecke] };
  }

  const ding = zufall(0, ARTIKEL.length - 1);
  const e = stueckPreis(ding, p.raster);
  let anzahl, luecke, nach = "preis";

  if (art === "preis") {
    anzahl = stufe === "s2" ? [1, 2, 3, 4, 5] : [1, ...ziehe([2, 3, 4, 5, 6, 8, 10], 3)];
    luecke = zufall(1, anzahl.length - 1);
  } else if (art === "anzahl") {
    anzahl = stufe === "s3" ? [1, ...ziehe([2, 3, 4, 5, 6, 8, 10], 3)] : ziehe([2, 3, 4, 5, 6, 7, 8, 9, 10, 12], 4);
    luecke = zufall(1, anzahl.length - 1);
    nach = "anzahl";
  } else if (art === "ohneEins") {
    // Vielfache einer Grundanzahl; gesucht ist der Preis für 1 Stück oder eine Anzahl dazwischen.
    const b = zufall(2, 5);
    const gegeben = ziehe([1, 2, 3, 4, 5].map(k => k * b), 3);
    const ziel = waehle([1, 1, ...[2, 3, 5, 7, 9, 11].filter(z => !gegeben.includes(z))]);
    anzahl = [...gegeben, ziel].sort((x, y) => x - y);
    luecke = anzahl.indexOf(ziel);
  } else if (art === "dreisatz" || art === "anzahlDreisatz") {
    const n0 = zufall(3, stufe === "s6" ? 8 : 6);
    const m = waehle([2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 20].filter(z => z !== n0 && (stufe === "s6" || z <= 12)));
    anzahl = [n0, m].sort((x, y) => x - y);
    luecke = anzahl.indexOf(m);
    nach = art === "anzahlDreisatz" ? "anzahl" : "preis";
  } else {
    // fehler: fünf Zeilen, ein Preis ist falsch (typische Rechenfehler: ein Stück zu viel oder zu
    // wenig, ein Franken daneben, Rappen vergessen)
    anzahl = ziehe([1, 2, 3, 4, 5, 6, 8, 10], 5);
    const preise = anzahl.map(n => n * e);
    const i = zufall(1, 4);
    const falsch = waehle([preise[i] + e, preise[i] - e, preise[i] + 100, preise[i] - 100, preise[i] - (preise[i] % 100)]
      .filter(x => x > 0 && x !== preise[i] && !preise.includes(x)));
    if (falsch === undefined) return aufgabeErzeugen(stufe);
    preise[i] = falsch;
    return { art, ding, e, anzahl, preise, luecke: i, nach: "fehler", loesung: falsch, richtigerPreis: anzahl[i] * e };
  }

  const preise = anzahl.map(n => n * e);
  if (Math.max(...preise) > p.max) return aufgabeErzeugen(stufe);
  return { art, ding, e, anzahl, preise, luecke, nach, loesung: nach === "anzahl" ? anzahl[luecke] : preise[luecke] };
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. Rechnet unabhängig nach. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p) return ["Stufe wird mit den freien Listen nicht angeboten"];
  if (!p.arten.includes(a.art)) m.push("Aufgabentyp gehört nicht in diese Stufe");
  if (!FREI.has(listeVon(a.art))) m.push(`Inhalt aus der Liste ${listeVon(a.art)}, die nicht frei ist`);
  if (!(a.art === "folge" ? FOLGEN[a.f] : a.art === "gewicht" ? WARE_GEWICHT[a.w] : ARTIKEL[a.ding])) m.push("Ware oder Folge unbekannt");

  if (a.art === "folge") {
    const geld = FOLGEN[a.f][3];
    const d = a.y.map((v, i) => (i ? v - a.y[i - 1] : null)).slice(1);
    if (new Set(d).size !== 1 || d[0] <= 0) m.push("Schritt nicht gleich bleibend");
    if (a.loesung !== a.y[a.luecke]) m.push("Lösung falsch");
    // Den Schritt sieht man nur an zwei gezeigten, benachbarten Zeilen.
    const sichtbar = a.x.map((v, i) => i < a.zeilen && i !== a.luecke);
    if (!sichtbar.some((s, i) => s && sichtbar[i + 1])) m.push("keine zwei benachbarten Zeilen sichtbar");
    if (a.luecke >= a.zeilen) m.push("leeres Feld nicht sichtbar");
    if (geld ? Math.max(...a.y) > p.max || a.y.some(v => v % 100) : Math.max(...a.y) > 100) m.push("Zahlenraum der Stufe überschritten");
    return m;
  }

  const zeilen = a.anzahl || a.menge;
  if (new Set(zeilen).size !== zeilen.length || zeilen.some((z, i) => i && z <= zeilen[i - 1])) m.push("Zeilen doppelt oder nicht aufsteigend");
  if (a.preise.length !== zeilen.length) m.push("Preise passen nicht zu den Zeilen");
  if (a.preise.some(x => !Number.isInteger(x) || x <= 0 || x % (a.art === "gewicht" ? 5 : p.raster))) m.push("Preis nicht im Raster der Stufe");
  if (Math.max(...a.preise) > p.max) m.push("Betrag zu gross für die Stufe");
  if (a.luecke < 0 || a.luecke >= zeilen.length) m.push("Lücke ausserhalb der Tabelle");

  if (a.art === "gewicht") {
    const falsch = zeilen.filter((g, i) => a.preise[i] * 100 !== g * a.pro100);
    if (falsch.length) m.push("Preis passt nicht zum Gewicht");
    if (a.loesung !== a.preise[a.luecke]) m.push("Lösung falsch");
    if (stufe === "s5" && (zeilen[0] !== 100 || a.luecke === 0)) m.push("100-g-Zeile fehlt");
    if (stufe === "s6" && zeilen.includes(100)) m.push("Königsstufe soll ohne 100-g-Zeile sein");
    return m;
  }

  const e = a.e;
  if (e % p.raster) m.push("Stückpreis nicht im Raster");
  const stimmt = zeilen.map((n, i) => a.preise[i] === n * e);
  if (a.art === "fehler") {
    if (stimmt.filter(s => !s).length !== 1 || stimmt[a.luecke]) m.push("nicht genau ein falscher Preis");
    if (stimmt.filter(Boolean).length < 3) m.push("zu wenige richtige Zeilen, um den Fehler sicher zu finden");
    if (new Set(a.preise).size !== a.preise.length) m.push("doppelte Preise");
    if (a.loesung !== a.preise[a.luecke]) m.push("Lösung falsch");
    return m;
  }
  if (stimmt.some(s => !s)) m.push("Tabelle nicht proportional");
  const soll = a.nach === "anzahl" ? zeilen[a.luecke] : zeilen[a.luecke] * e;
  if (a.loesung !== soll) m.push("Lösung falsch");
  if (zeilen.length < 2) m.push("keine vollständige Zeile");
  const hatEins = zeilen.indexOf(1);
  if (["s2", "s3"].includes(stufe) && (hatEins !== 0 || a.luecke === 0)) m.push("Zeile mit 1 Stück fehlt");
  if (a.art === "ohneEins" && zeilen.some((n, i) => n === 1 && i !== a.luecke)) m.push("Preis für 1 Stück schon gegeben");
  if (stufe === "s2" && e % 100) m.push("Stufe 2 nur ganze Franken");
  return m;
}

// ---------- Darstellung ----------

/** Tabelle mit zwei Spalten; inhalt(i, spalte) liefert Text oder Element einer Zelle. */
function wertetabelle(kopf, zeilen, inhalt, mehr) {
  const t = el("table", { class: "werte" });
  t.append(el("tr", {}, el("th", { text: kopf[0] }), el("th", { text: kopf[1] })));
  zeilen.forEach((z, i) => t.append(el("tr", {}, el("td", {}, inhalt(i, 0)), el("td", {}, inhalt(i, 1)))));
  if (mehr) t.append(el("tr", { class: "mehr" }, el("td", { text: "…" }), el("td", { text: "…" })));
  return t;
}

const luecke = () => el("span", { class: "luecke", text: "?" });

LS.spiel({
  id: "preis-tabelle",
  einleitung: "Willkommen im Laden! In der Preistabelle fehlen Zahlen. Findest du heraus, was hineingehört?",
  anzahl: 8,
  stufen: Object.fromEntries(Object.entries({
    s1: "Folgen in Tabellen weiterführen: jede Woche 3 Fr. mehr.",
    s2: "Preistabelle mit ganzen Franken: 1 Stück kostet 4 Fr.",
    s3: "Franken und Rappen, auch rückwärts: Wie viele bekommst du?",
    s4: "Ohne Preis für 1 Stück: 4 Stück kosten 7 Fr. 20 Rp.",
    s5: "Dreisatz und Gewichte: 3 Stück → 5 Stück, 100 g → 500 g.",
    s6: "Endgegner: falschen Preis finden, 250 g aus 200 g, Dreisatz rückwärts.",
  }).filter(([s]) => STUFE[s])),

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const p = STUFE[ctx.stufe];
    if (new Set(p.arten).size > 1) ctx.serie("art", a.art);
    const f = ctx.flaeche;
    // Ab Stufe 3 wird in Rappen getippt (1 3 6 0 → 13 Fr. 60 Rp.), sonst in ganzen Franken.
    const mitRappen = p.raster < 100 || a.art === "gewicht";
    let zelle = null; // Element der Lücke, wird nach der richtigen Antwort gefüllt

    if (a.art === "fehler") {
      const [bild, , mehrzahl] = ARTIKEL[a.ding];
      f.append(el("div", { class: "titel", text: `${bild} ${mehrzahl}` }));
      const knoepfe = [];
      let fertig = false;
      const loesungText = satz(`${a.anzahl[a.luecke]} × ${betrag(a.e)} = ${betrag(a.richtigerPreis)}, nicht ${betrag(a.loesung)}.`);
      ctx.loesung?.(loesungText);
      f.append(wertetabelle(["Anzahl", "Preis"], a.anzahl, (i, s) => {
        if (s === 0) return String(a.anzahl[i]);
        const k = el("button", { type: "button", class: "zelle", text: betrag(a.preise[i]) });
        k.addEventListener("click", () => {
          if (fertig || k.classList.contains("gewaehlt")) return;
          if (i === a.luecke) { fertig = true; k.classList.add("richtig"); ctx.richtig(satz(`Richtig! ${a.anzahl[i]} Stück kosten ${betrag(a.richtigerPreis)}.`)); return; }
          k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch", "gewaehlt");
          ctx.falsch("Dieser Preis stimmt. Rechne jede Zeile nach: Anzahl mal Preis für 1 Stück.", loesungText);
          if (ctx.vorbei()) { fertig = true; knoepfe[a.luecke].classList.add("richtig"); }
        });
        knoepfe[i] = k;
        return k;
      }));
      f.append(el("div", { class: "frage", text: "Ein Preis in der Tabelle ist falsch. Tipp ihn an!" }));
      if (ctx.nr === 0) ctx.sag("Tipp: Zuerst den Preis für 1 Stück herausfinden — er muss in jeder Zeile passen.");
      return;
    }

    let frage, hinweis, loesungText;
    if (a.art === "folge") {
      const [bild, links, rechts, geld, satzText] = FOLGEN[a.f];
      const wert = v => (geld ? betrag(v) : zahlText(v));
      f.append(el("div", { class: "titel", text: `${bild} ${rechts[0].toUpperCase()}${rechts.slice(1)}` }));
      f.append(wertetabelle([links, rechts], a.x.slice(0, a.zeilen), (i, s) => {
        if (s === 0) return String(a.x[i]);
        if (i !== a.luecke) return wert(a.y[i]);
        return (zelle = luecke());
      }, a.zeilen === 6));
      frage = `${satzText} Was gehört ins leere Feld?`;
      hinweis = "Wie viel kommt von einer Zeile zur nächsten dazu? Es ist jedes Mal gleich viel.";
      // Die Zeile vor der Lücke ist immer sichtbar (Lücke frühestens in Zeile 3).
      loesungText = `${wert(a.y[a.luecke - 1])} + ${wert(a.schritt)} = ${wert(a.loesung)}`;
    } else if (a.art === "gewicht") {
      const [bild, name] = WARE_GEWICHT[a.w];
      f.append(el("div", { class: "titel", text: `${bild} ${name}` }));
      f.append(wertetabelle(["Menge", "Preis"], a.menge, (i, s) => {
        if (s === 0) return grammText(a.menge[i]);
        return i === a.luecke ? (zelle = luecke()) : betrag(a.preise[i]);
      }));
      const g = a.menge[a.luecke];
      // „1 kg“ ist eine Menge in der Einzahl: „Was kostet 1 kg Schoggi?“, aber „Was kosten 300 g …?“
      frage = `Was ${grammText(g).startsWith("1 ") ? "kostet" : "kosten"} ${grammText(g)} ${name}?`;
      hinweis = ctx.stufe === "s5" ? "Wie viel kosten 100 g? Wie oft stecken 100 g in der gesuchten Menge?"
        : "Rechne zuerst aus, was 100 g kosten — oder 50 g. Dann mal so oft, wie es braucht.";
      // Lösungsweg über 100 g und, wenn nötig, über 50 g
      const basis = a.menge.find((x, i) => i !== a.luecke && x !== 1000) || a.menge[0];
      const basisPreis = a.preise[a.menge.indexOf(basis)];
      const schritte = [];
      if (basis !== 100) schritte.push(`${betrag(basisPreis)} : ${basis / 100} = ${betrag(a.pro100)} für 100 g`);
      if (g % 100) schritte.push(`${betrag(a.pro100)} : 2 = ${betrag(a.pro100 / 2)} für 50 g`, `${g / 50} × ${betrag(a.pro100 / 2)} = ${betrag(a.loesung)}`);
      else schritte.push(`${g / 100} × ${betrag(a.pro100)} = ${betrag(a.loesung)}`);
      loesungText = schritte.join("; ");
    } else {
      const [bild, einzahl, mehrzahl] = ARTIKEL[a.ding];
      const stueck = n => (n === 1 ? `1 ${einzahl}` : `${n} ${mehrzahl}`);
      f.append(el("div", { class: "titel", text: `${bild} ${mehrzahl}` }));
      f.append(wertetabelle(["Anzahl", "Preis"], a.anzahl, (i, s) => {
        if (i !== a.luecke) return s === 0 ? String(a.anzahl[i]) : betrag(a.preise[i]);
        if (a.nach === "anzahl") return s === 0 ? (zelle = luecke()) : betrag(a.preise[i]);
        return s === 0 ? String(a.anzahl[i]) : (zelle = luecke());
      }));
      const n = a.anzahl[a.luecke];
      const andere = a.anzahl.findIndex((x, i) => i !== a.luecke);
      const n0 = a.anzahl[andere], p0 = a.preise[andere];
      const hatEins = a.anzahl[0] === 1 && a.luecke !== 0;
      if (a.nach === "anzahl") {
        frage = `Wie viele ${mehrzahl} bekommst du für ${betrag(a.preise[a.luecke])}?`;
        hinweis = hatEins ? "Schau, was 1 Stück kostet. Wie oft passt dieser Preis in den Betrag?"
          : "Rechne zuerst aus, was 1 Stück kostet. Wie oft passt dieser Preis in den Betrag?";
        loesungText = hatEins ? `${betrag(a.preise[a.luecke])} : ${betrag(a.e)} = ${n}`
          : `${betrag(p0)} : ${n0} = ${betrag(a.e)}; ${betrag(a.preise[a.luecke])} : ${betrag(a.e)} = ${n}`;
      } else {
        frage = n === 1 ? `Was kostet ${stueck(1)}?` : `Was kosten ${stueck(n)}?`;
        hinweis = hatEins ? "Schau in der Zeile mit 1 Stück: Was kostet eines? Dann mal die Anzahl."
          : n === 1 ? "Teile einen Preis durch seine Anzahl."
          : "Rechne zuerst aus, was 1 Stück kostet: Preis geteilt durch Anzahl. Dann mal die neue Anzahl.";
        loesungText = hatEins ? `${n} × ${betrag(a.e)} = ${betrag(a.loesung)}`
          : n === 1 ? `${betrag(p0)} : ${n0} = ${betrag(a.e)}`
          : `${betrag(p0)} : ${n0} = ${betrag(a.e)}; ${n} × ${betrag(a.e)} = ${betrag(a.loesung)}`;
      }
    }
    f.append(el("div", { class: "frage", text: satz(frage) }));
    loesungText = satz(loesungText);
    ctx.loesung?.(loesungText);

    // Eingabe: Betrag (Franken oder Rappen) oder Anzahl
    const istGeld = a.art === "folge" ? FOLGEN[a.f][3] : a.nach !== "anzahl";
    const inRappen = istGeld && mitRappen;
    const zeige = v => (istGeld ? betrag(inRappen ? v : v * 100) : zahlText(v));
    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Antwort" });
    f.append(anzeige);
    const tasten = LS.tastatur({
      anzeige, maxStellen: inRappen ? 6 : 4,
      onAenderung: z => { if (z !== null && istGeld) anzeige.textContent = zeige(z); },
      onOk(z) {
        const wert = istGeld && !inRappen ? z * 100 : z;
        if (wert === a.loesung) {
          tasten.gesperrt = true;
          anzeige.classList.add("richtig");
          zelle.replaceWith(el("span", { class: "gefuellt", text: istGeld ? betrag(a.loesung) : zahlText(a.loesung) }));
          ctx.richtig();
          return;
        }
        anzeige.classList.add("falsch");
        ctx.falsch(`${wert > a.loesung ? "Das ist zu viel." : "Das ist zu wenig."} ${hinweis}`, loesungText);
        if (ctx.vorbei()) tasten.gesperrt = true;
      },
    });
    f.append(tasten.element);
    if (ctx.nr === 0) ctx.sag(inRappen ? "Tipp Franken und Rappen zusammen: 1 3 6 0 heisst 13 Fr. 60 Rp." : istGeld ? "Tipp die Franken ein." : "Tipp die Zahl ein.");
  },
});
</script>
</body>
</html>
