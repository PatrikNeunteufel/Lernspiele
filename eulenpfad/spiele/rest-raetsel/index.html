<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rest-Rätsel</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .rechnung { text-align: center; font-size: clamp(34px, 8vw, 60px); font-weight: 900; font-variant-numeric: tabular-nums; margin: 4px 0 10px; }
  .rechnung .feld { display: inline-block; min-width: 1.4em; border-bottom: 6px solid #c5c9de; color: #b6bccf; }
  .rechnung .feld.aktiv { border-color: var(--knopf); color: var(--knopf); }
  .rechnung .feld.fertig { border-color: var(--gut); color: var(--gut); }
  .rechnung .rest-wort { font-size: .55em; color: var(--text-leise); margin: 0 .2em; }
  .bilder { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: clamp(26px, 6vw, 36px); max-width: 560px; margin: 0 auto 6px; }
  .sachtext { text-align: center; font-size: clamp(20px, 4vw, 26px); font-weight: 700; margin-bottom: 8px; }
  .umkehr { text-align: center; font-size: 22px; font-weight: 800; color: var(--gut); min-height: 30px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🍪 Rest-Rätsel</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.1.B.2.e: Divisionen mit Rest mit der Umkehroperation begründen
// (z.B. 32 : 6 gibt Rest, weil 32 keine Zahl aus der 6er-Reihe ist).
// Erst das Ergebnis, dann der Rest; zum Schluss zeigt die Umkehraufgabe, warum es stimmt.

const { zahlText, zufall, waehle, el } = LS;
const DINGE = ["🍎", "🍪", "⚽", "🧸", "🖍️", "🍓"];

// Je Stufe: Teiler, grösster Quotient, Bilder zum Verteilen, Rückwärts-Rätsel.
const STUFE = {
  s1: { teiler: [2, 3, 5], qMax: 5, bilder: true, rueckwaerts: 0 },
  s2: { teiler: [2, 5, 10], qMax: 9, bilder: false, rueckwaerts: 0 },
  s3: { teiler: [2, 3, 4, 5, 6, 7, 8, 9], qMax: 10, bilder: false, rueckwaerts: 0 },
  s4: { teiler: [3, 4, 6, 7, 8, 9], qMax: 99, bilder: false, rueckwaerts: 0 },
  s5: { teiler: [4, 6, 7, 8, 9], qMax: 99, bilder: false, rueckwaerts: 0.4 },
  // Königsstufe: einstellige Teiler mit dreistelligem Ergebnis (5000 : 7) oder zweistellige
  // Teiler (950 : 12), auch rückwärts.
  s6: { teiler: [6, 7, 8, 9, 11, 12, 15, 25], qMax: 999, bilder: false, rueckwaerts: 0.3 },
};

// Grösste zu teilende Zahl je Stufe (für pruefeAufgabe).
const MAX_ZAHL = { s1: 29, s2: 99, s3: 99, s4: 1000, s5: 1000, s6: 9999 };

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const d = waehle(p.teiler);
  let q;
  if (stufe === "s6") q = d > 10 ? zufall(11, 99) : zufall(101, p.qMax);
  else q = zufall(stufe === "s4" || stufe === "s5" ? 11 : 1, p.qMax);
  const r = Math.random() < 0.15 ? 0 : zufall(1, d - 1); // manchmal geht es auf
  return { d, q, r, a: q * d + r, rueckwaerts: Math.random() < p.rueckwaerts, ding: waehle(DINGE) };
}

/** Mängel: a = q · d + r mit 0 ≤ r < d, Zahlenraum der Stufe, Felder gross genug. */
function pruefeAufgabe(x, stufe) {
  const m = [];
  if (x.a !== x.q * x.d + x.r) m.push("Umkehraufgabe stimmt nicht");
  if (!(x.r >= 0 && x.r < x.d)) m.push("Rest nicht kleiner als der Teiler");
  if (!(x.q >= 1)) m.push("Ergebnis kleiner als 1");
  if (!STUFE[stufe].teiler.includes(x.d)) m.push("Teiler nicht aus der Stufe");
  if (x.a > MAX_ZAHL[stufe]) m.push("Zahlenraum überschritten");
  if (String(x.q).length > 3 || String(x.a).length > 5) m.push("Zahl passt nicht in die Tastatur");
  if (x.rueckwaerts && !STUFE[stufe].rueckwaerts) m.push("Rückwärts-Rätsel in falscher Stufe");
  return m;
}

/** Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Malreihe, grobe Schritte, Regel zum Rest — nie Ergebnis oder Rest. */
function tippsFuer(x, p) {
  if (x.rueckwaerts) return ["Rechne rückwärts mit der Umkehraufgabe: mal statt durch.", "Nimm zuerst das Ergebnis mal den Teiler. Dann zählst du den Rest dazu."];
  const t = [];
  if (p.bilder) t.push("Verteile die Bilder eins nach dem anderen an die Kinder, bis es nicht mehr für alle reicht.");
  if (x.q > 100) t.push(`Rechne zuerst mit Hundertern: 100 × ${x.d}, 200 × ${x.d} … Wie weit kommst du?`);
  else if (x.q > 10) t.push(`Rechne zuerst mit Zehnern: 10 × ${x.d}, 20 × ${x.d} … Wie weit kommst du?`);
  t.push(`Welche Zahl aus der ${x.d}er-Reihe ist am nächsten bei ${zahlText(x.a)}, aber nicht grösser?`);
  t.push(`Der Rest ist das, was übrig bleibt. Er ist immer kleiner als ${x.d}.`);
  return t.slice(0, 3);
}

LS.spiel({
  id: "rest-raetsel",
  einleitung: "Verteilen und teilen! Wie viel bekommt jeder — und bleibt ein Rest übrig? Die Umkehraufgabe zeigt, ob es stimmt.",
  hilfe: "Tippe zuerst ein, wie oft der Teiler hineinpasst, dann den Rest. Bei „? :“ tippst du die gesuchte Zahl ein. Zum Schluss zeigt die Umkehraufgabe, dass es stimmt.",
  anzahl: 8,
  stufen: {
    s1: "Mit Bildern: 7 Äpfel für 2 Kinder.",
    s2: "Teilen durch 2, 5 und 10: 23 : 5.",
    s3: "Alle Einmaleins-Reihen: 32 : 6 = 5 Rest 2.",
    s4: "Grössere Zahlen: 250 : 7.",
    s5: "Auch rückwärts: Welche Zahl gibt durch 7 genau 8 Rest 3?",
    s6: "Endgegner: 5000 : 7 und 950 : 12 — auch rückwärts.",
  },

  aufgabe(ctx) {
    const x = aufgabeErzeugen(ctx.stufe);
    if (STUFE[ctx.stufe].rueckwaerts) ctx.serie("richtung", x.rueckwaerts);
    ctx.tipp(tippsFuer(x, STUFE[ctx.stufe]));
    const umkehr = `${zahlText(x.q)} × ${x.d}${x.r ? ` + ${x.r}` : ""} = ${zahlText(x.a)}`;
    const umkehrZeile = el("div", { class: "umkehr" });

    // Rückwärts die gesuchte Zahl eintippen, sonst Ergebnis und Rest.
    ctx.schritte(x.rueckwaerts ? LS.tippSchritte(x.a) : LS.tippSchritte(x.q) + LS.tippSchritte(x.r));
    if (x.rueckwaerts) {
      ctx.loesung(umkehr);
      ctx.flaeche.append(
        el("div", { class: "auftrag", text: "Welche Zahl ist gesucht?" }),
        el("div", { class: "rechnung", html: `? : ${x.d} = ${zahlText(x.q)} <span class="rest-wort">Rest</span> ${x.r}` }));
      const anzeige = el("div", { class: "anzeige leer", "aria-label": "Gesuchte Zahl" });
      ctx.flaeche.append(anzeige, umkehrZeile);
      const tasten = LS.tastatur({
        anzeige, maxStellen: 5,
        onOk(w) {
          if (w === x.a) { tasten.gesperrt = true; anzeige.classList.add("richtig"); umkehrZeile.textContent = umkehr; ctx.richtig(); return; }
          anzeige.classList.add("falsch");
          ctx.falsch(`Rechne rückwärts: ${zahlText(x.q)} × ${x.d}, dann den Rest dazu.`, umkehr);
          if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
        },
      });
      ctx.flaeche.append(tasten.element);
      return;
    }

    const loesung = `${zahlText(x.a)} : ${x.d} = ${zahlText(x.q)} Rest ${x.r}, denn ${umkehr}`;
    ctx.loesung(loesung);
    if (STUFE[ctx.stufe].bilder) {
      ctx.flaeche.append(
        el("div", { class: "sachtext", text: `${x.a} ${x.ding} werden an ${x.d} Kinder verteilt. Jedes Kind bekommt gleich viel.` }),
        el("div", { class: "bilder", "aria-hidden": "true", text: x.ding.repeat(x.a) }));
    }
    const feldQ = el("span", { class: "feld aktiv", text: "?" });
    const feldR = el("span", { class: "feld", text: "?" });
    ctx.flaeche.append(el("div", { class: "rechnung" }, `${zahlText(x.a)} : ${x.d} = `, feldQ, el("span", { class: "rest-wort", text: " Rest " }), feldR));
    const halter = el("div");
    ctx.flaeche.append(halter, umkehrZeile);

    // Schritt 1: Ergebnis, Schritt 2: Rest — je eine Tastatur, die in ihr Feld schreibt.
    const schritt = (feld, soll, hinweis, weiter) => {
      halter.innerHTML = "";
      const tasten = LS.tastatur({
        anzeige: feld, maxStellen: 3,
        onAenderung: w => { if (w === null) feld.textContent = "?"; },
        onOk(w) {
          if (w === soll) { tasten.gesperrt = true; feld.classList.remove("aktiv"); feld.classList.add("fertig"); weiter(); return; }
          ctx.falsch(hinweis(w), loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
        },
      });
      halter.append(tasten.element);
    };

    schritt(feldQ, x.q,
      w => w * x.d > x.a ? `${zahlText(w)} × ${x.d} = ${zahlText(w * x.d)} — das ist schon mehr als ${zahlText(x.a)}.`
        : `Geht noch mehr? ${zahlText(w + 1)} × ${x.d} = ${zahlText((w + 1) * x.d)}. Ist das noch höchstens ${zahlText(x.a)}?`,
      () => {
        feldR.classList.add("aktiv");
        ctx.sag(`Gut! ${zahlText(x.q)} × ${x.d} = ${zahlText(x.q * x.d)}. Wie viel bleibt übrig?`, "gut");
        schritt(feldR, x.r,
          w => w >= x.d ? `Der Rest muss kleiner als ${x.d} sein — sonst bekäme jeder noch eins mehr.` : `Wie viel fehlt von ${zahlText(x.q * x.d)} bis ${zahlText(x.a)}?`,
          () => { umkehrZeile.textContent = `Probe: ${umkehr} ✓`; ctx.richtig(); });
      });
    if (ctx.nr === 0) ctx.sag("Zuerst: Wie oft passt der Teiler hinein?");
  },
});
</script>
</body>
</html>
