<style>
  .zs .frage { text-align: center; font-size: clamp(19px, 4.4vw, 26px); font-weight: 800; margin: 0 0 12px; line-height: 1.3; }
  .zs .rechnung { text-align: center; font-size: clamp(26px, 6.5vw, 42px); font-weight: 900; font-variant-numeric: tabular-nums; margin: 6px 0 12px; line-height: 1.3; }
  .zs .rechnung .zs-gesucht { color: var(--knopf); }
  .zs-karte {
    max-width: 560px; margin: 0 auto 14px; background: var(--karte); border: 3px solid var(--rand); border-radius: 18px;
    padding: 12px 16px; text-align: center; font-size: clamp(21px, 5vw, 30px); font-weight: 800; box-shadow: var(--schatten);
  }
  .zs-karte .zs-bild { display: block; font-size: clamp(56px, 13vw, 84px); line-height: 1.1; }
  .zs-zeile { text-align: center; font-size: clamp(22px, 5.5vw, 34px); font-weight: 900; margin: 0 0 10px; line-height: 1.4; }
  .zs-zeile b { color: var(--deko-2); font-variant-numeric: tabular-nums; }
  .zs-schritt { text-align: center; font-size: 15px; font-weight: 800; color: var(--text-leise); margin: 0 0 4px; }
  .zs-beispiel { text-align: center; font-size: 15px; font-weight: 700; color: var(--text-leise); margin: 6px 0 4px; }
  .zs-ergebnis { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 520px; margin: 0 auto; }
  .zs-ergebnis .anzeige { flex: 1; min-width: 0; }
  .zs-ergebnis .zs-einheit { font-size: clamp(22px, 5.5vw, 36px); font-weight: 900; color: var(--knopf); min-width: 1.6em; white-space: nowrap; }
  /* Notizen (NZ1 a): Zeitstrahl Anfang → Zwischenzeit → Ende, das Feld für den Sprung über dem Pfeil */
  .nz-strahl { display: flex; align-items: flex-end; justify-content: center; gap: 4px; margin: -4px 0 10px;
    font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }

  .nz-sprung { display: inline-flex; flex-direction: column; align-items: center; color: var(--text-leise); line-height: 1; }
  .nz-strahl .zw-notiz { font-size: 16px; min-height: 32px; padding: 1px 3px; }
  .zs-fertig { text-align: center; font-size: clamp(20px, 4.8vw, 28px); font-weight: 900; color: var(--gut); margin: 0 0 8px; }
  /* Grosse Bild-Knöpfe in Stufe 1 (Klasse an die Wahl-Box des Bausteins gehängt) */
  .wahl.zs-gross .wahl-knopf { min-height: 150px; font-size: clamp(18px, 4.4vw, 24px); }
  .wahl.zs-gross .wahl-knopf .bild { font-size: clamp(52px, 12vw, 72px); }
  .wahl.zs-mittel .wahl-knopf { font-size: clamp(17px, 4vw, 22px); }
  .wahl.zs-mittel .wahl-knopf .bild { font-size: clamp(36px, 8vw, 48px); }
  /* Satz als Karte über den Körben: kleiner als ein einzelnes Wort */
  .korb-karte.zs-satzkarte { padding: 12px 18px; max-width: 560px; }
  .korb-karte.zs-satzkarte b { font-size: clamp(19px, 4.4vw, 26px); line-height: 1.35; }
</style>

  <h1>⏱️ Zeit-Schätzer</h1>

<script src="../gemeinsam/avatare.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/notizblock.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>

<script src="../gemeinsam/entwicklung.js"></script>
<script src="taetigkeiten.js"></script>
<script>
"use strict";
// Lehrplan SG MA.3.A.1 (Grössen: Zeit) und NMG.9.1 (Zeit und Zeitdauer), Basisklasse 3.
// Wortlaut (sg.lehrplan.ch): MA.3.A.1.e (2. Zyklus) „verstehen und verwenden die Begriffe Gewicht, Inhalt,
// Zeitpunkt, Zeitdauer, Sekunde … Referenzgrössen 1 h, 1 min … Zeit (h, min)“; MA.3.A.1.f (Orientierungspunkt)
// „Zeit (h, min, s) … Referenzgrössen 1 s, 1 min“; MA.3.A.1.h (Grundanspruch) „Zeit (d, h, min, s)“.
// NMG.9.1.c (Grundanspruch 1. Zyklus) „Zeitdauer erleben und deren Dauer schätzen“; NMG.9.1.e (2. Zyklus)
// „Zeitdauer von Handlungen schätzen, messen und grafisch darstellen“.
//   s1 2. Klasse (NMG.9.1.c, Vorstufe), lesearm: Was dauert länger — Bild-Knöpfe; Sekunden oder Stunden? Nur Extreme.
//   s2 3. Klasse, leichter (MA.3.A.1.e, NMG.9.1.e): Zeitpunkt oder Zeitdauer (klare Sätze); Sekunden, Minuten
//      oder Stunden? — drei Körbe, klare Fälle.
//   s3 Klassenziel (MA.3.A.1.e, NMG.9.1.e): Wie lange dauert … ungefähr? (10 Sekunden / 10 Minuten / 10 Stunden);
//      Zeitpunkt oder Dauer mit kniffligen Sätzen („In 5 Minuten geht es los.“ = Dauer).
//   s4 3. Klasse, schwerer (MA.3.A.1.e, NMG.9.1.e): Zahl und Einheit zusammen wählen (3 Minuten / 30 Minuten /
//      3 Stunden / 30 Sekunden); drei bis vier Tätigkeiten nach Dauer ordnen. Ab hier stehen h, min, s neben
//      den ausgeschriebenen Wörtern.
//   s5 4. Klasse (MA.3.A.1.f/h): Dauer aus Anfang und Ende (von 9:45 bis 10:20 → Minuten; von Montag bis Freitag
//      → Nächte oder Tage); Umwandeln 1 h 30 min = ? min, 2 min = ? s, 120 s = ? min.
//   s6 Königsstufe: fünf Dauern in gemischten Einheiten ordnen (90 s, 2 min, eine halbe Stunde, 1 h, 100 min);
//      Dauer über Mitternacht (23:30 bis 1:15); Minuten in Stunden und Minuten zerlegen (135 min = 2 h 15 min).
// Abgrenzung: Die Uhr-Werkstatt (Basisklasse 2) liest die Uhr und rechnet Dauern erst ab Stufe 5; die
// Schätz-Waage (Basisklasse 2) stellt einzelne Schätzfragen zu Länge, Gewicht, Hohlmass und Zeit; der
// Masse-Umwandler (Basisklasse 3) wandelt alle Grössen um; der Fahrplan-Rechner (Basisklasse 6) rechnet mit
// Fahrplänen und Dezimalstunden. Hier: Zeitpunkt oder Dauer, passende Einheit, Dauern einordnen, vergleichen
// und ordnen. Tätigkeiten und Sätze in taetigkeiten.js (Liste „taetigkeiten“).

const { waehle, mische, zufall, el } = LS;
const ID = "zeit-schaetzer";

const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : ["taetigkeiten"]);
const SEK = { s: 1, min: 60, h: 3600, d: 86400, w: 604800 };
const EINHEIT = {
  s: { ein: "Sekunde", viele: "Sekunden", kurz: "s", bild: "⏱️" },
  min: { ein: "Minute", viele: "Minuten", kurz: "min", bild: "⏰" },
  h: { ein: "Stunde", viele: "Stunden", kurz: "h", bild: "🕐" },
  d: { ein: "Tag", viele: "Tage", kurz: "d", bild: "📅" },
  w: { ein: "Woche", viele: "Wochen", kurz: "Wochen", bild: "🗓️" },
};
const TAETIGKEITEN = FREI.has("taetigkeiten")
  ? ZS_TAETIGKEITEN.map(([bild, name, zahl, einheit, min, max]) => ({ bild, name, zahl, einheit, min, max, sek: zahl * SEK[einheit] }))
  : [];
const SAETZE = FREI.has("taetigkeiten")
  ? [...ZS_ZEITPUNKTE.map(([gruppe, satz]) => ({ gruppe, satz, art: "zeitpunkt" })), ...ZS_DAUERN.map(([gruppe, satz]) => ({ gruppe, satz, art: "dauer" }))]
  : [];

/** „3 Minuten“, „1 Stunde“. */
const dauerWort = (zahl, einheit) => `${zahl} ${zahl === 1 ? EINHEIT[einheit].ein : EINHEIT[einheit].viele}`;
/** Dauer einer Tätigkeit als Wort, „etwa 3 Minuten“. */
const typisch = t => dauerWort(t.zahl, t.einheit);
const zwei = n => String(n).padStart(2, "0");
/** Uhrzeit aus Minuten seit Mitternacht (über Mitternacht: ab 1440 wieder von 0): „8:10“, nie „08:10“. */
const uhr = m => `${Math.floor((m % 1440) / 60)}:${zwei(m % 60)}`;
/** „1 h 30 min“, „45 min“, „2 h“. */
const hminText = m => (m >= 60 && m % 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : m >= 60 ? `${m / 60} h` : `${m} min`);

const TAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];

// Nur Sekunden, Minuten, Stunden (für Einheitenfragen); Tage und Wochen kommen beim Vergleichen und Ordnen vor.
const SMH = TAETIGKEITEN.filter(t => ["s", "min", "h"].includes(t.einheit));
/** Klare Fälle für „Sekunden, Minuten oder Stunden?“: weit weg von der Grenze zur Nachbareinheit. */
const klar = t => (t.einheit === "s" ? t.max <= 40 : t.einheit === "min" ? t.min >= 2 * 60 && t.max <= 45 * 60 : t.min >= 90 * 60);
const KLAR = SMH.filter(klar);
/** Extreme für Stufe 1: nur Sekunden und Stunden, klare Fälle. */
const EXTREM = KLAR.filter(t => t.einheit !== "min");
/** Faktor, um den sich zwei verglichene Tätigkeiten mindestens unterscheiden (Spannen überlappen nicht). */
const FAKTOR = 3;
const FAKTOR_S1 = 30;
/** Dauert b sicher mindestens faktor-mal so lange wie a? */
const laengerUm = (a, b, faktor) => b.min >= a.max * faktor;
/** Alle Paare (kurz, lang) für Stufe 1, deutlich verschieden. */
const PAARE_S1 = TAETIGKEITEN.flatMap(a => TAETIGKEITEN.filter(b => laengerUm(a, b, FAKTOR_S1)).map(b => [a, b]));

/** Dauern in gemischten Einheiten für die Königsstufe (Text, Sekunden). */
const GEMISCHT = [
  ["30 s", 30], ["45 s", 45], ["60 s", 60], ["90 s", 90], ["100 s", 100], ["120 s", 120], ["2 min", 120], ["3 min", 180],
  ["5 min", 300], ["10 min", 600], ["eine Viertelstunde", 900], ["15 min", 900], ["20 min", 1200],
  ["eine halbe Stunde", 1800], ["30 min", 1800], ["45 min", 2700], ["eine Dreiviertelstunde", 2700],
  ["1 h", 3600], ["60 min", 3600], ["90 min", 5400], ["1 h 30 min", 5400], ["anderthalb Stunden", 5400],
  ["100 min", 6000], ["2 h", 7200], ["120 min", 7200], ["3 h", 10800], ["ein halber Tag", 43200], ["24 h", 86400], ["1 Tag", 86400],
].map(([text, sek]) => ({ text, sek }));

const STUFE = {
  s1: { arten: ["laenger", "extrem"], gruppen: [], liste: true },
  s2: { arten: ["zeitpunkt", "einheit"], gruppen: [1], liste: true },
  s3: { arten: ["ungefaehr", "zeitpunkt"], gruppen: [1, 2], liste: true },
  s4: { arten: ["zahlEinheit", "ordnen"], gruppen: [], liste: true },
  s5: { arten: ["anfangEnde", "umwandeln"], gruppen: [], liste: false },
  s6: { arten: ["ordnenGemischt", "mitternacht", "zerlegen"], gruppen: [], liste: false },
};

// ---------- Aufgaben erzeugen (Daten ohne DOM) ----------

/** Ist zahl einheit sicher falsch für t: ausserhalb der Spanne, mindestens um den Faktor 3? */
const klarFalsch = (t, zahl, einheit) => { const s = zahl * SEK[einheit]; return s < t.min / FAKTOR || s > t.max * FAKTOR; };

/** Vier Antworten für „Zahl und Einheit“: richtig, zehnmal so viel in derselben Einheit, dieselbe Zahl in der
    nächsten Einheit, zehnmal so viel (oder dieselbe Zahl) in der übernächsten — alle falschen klar falsch. */
function optionenZahlEinheit(t) {
  const z = t.zahl, e = t.einheit;
  const [e1, e2] = { s: ["min", "h"], min: ["h", "s"], h: ["min", "s"] }[e];
  const gleich = [z * 10, z / 10, z * 100].find(n => Number.isInteger(n) && n >= 1 && klarFalsch(t, n, e));
  const o1 = [z, z * 10, z * 100].find(n => klarFalsch(t, n, e1));
  const o2 = [z * 10, z, z * 100].find(n => klarFalsch(t, n, e2));
  if (gleich === undefined || o1 === undefined || o2 === undefined) return null;
  return mische([{ zahl: z, einheit: e }, { zahl: gleich, einheit: e }, { zahl: o1, einheit: e1 }, { zahl: o2, einheit: e2 }]);
}

/** n Tätigkeiten, die sich der Reihe nach je um den Faktor 3 unterscheiden, kurz → lang. */
function kette(n) {
  for (let versuch = 0; versuch < 300; versuch++) {
    const wahl = mische(TAETIGKEITEN).slice(0, n).sort((a, b) => a.sek - b.sek);
    if (wahl.every((t, i) => i === 0 || laengerUm(wahl[i - 1], t, FAKTOR))) return wahl;
  }
  return null;
}

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  if (p.liste && !TAETIGKEITEN.length) return null;
  const art = waehle(p.arten);
  switch (art) {
    case "laenger": {
      const [kurz, lang] = waehle(PAARE_S1);
      const frage = waehle(["laenger", "schneller"]);
      return { art, frage, kurz, lang, optionen: mische([kurz, lang]), richtig: frage === "laenger" ? lang : kurz };
    }
    case "extrem": {
      const t = waehle(EXTREM);
      return { art, t, koerbe: ["s", "h"], richtig: t.einheit };
    }
    case "zeitpunkt": {
      const s = waehle(SAETZE.filter(x => p.gruppen.includes(x.gruppe)));
      return { art, satz: s.satz, gruppe: s.gruppe, richtig: s.art };
    }
    case "einheit": {
      const t = waehle(KLAR);
      return { art, t, koerbe: ["s", "min", "h"], richtig: t.einheit };
    }
    case "ungefaehr": {
      const t = waehle(SMH);
      const optionen = ["s", "min", "h"].map(einheit => ({ zahl: t.zahl, einheit }));
      return { art, t, optionen, richtig: optionen.find(o => o.einheit === t.einheit) };
    }
    case "zahlEinheit": {
      const t = waehle(SMH);
      const optionen = optionenZahlEinheit(t);
      if (!optionen) return aufgabeErzeugen(stufe);
      return { art, t, optionen, richtig: optionen.find(o => o.zahl === t.zahl && o.einheit === t.einheit) };
    }
    case "ordnen": {
      const reihe = kette(zufall(3, 4));
      return reihe ? { art, reihe } : aufgabeErzeugen(stufe);
    }
    case "anfangEnde": {
      if (Math.random() < 0.3) {
        const von = zufall(0, 4), bis = zufall(von + 1, 6);
        const typ = waehle(["naechte", "tage"]);
        return { art, typ, von, bis, loesung: typ === "naechte" ? bis - von : bis - von + 1 };
      }
      const von = zufall(7, 16) * 60 + zufall(0, 11) * 5;
      const dauer = zufall(2, 18) * 5;
      return { art, typ: "uhr", von, bis: von + dauer, loesung: dauer };
    }
    case "umwandeln": {
      const typ = waehle(["hminMin", "hMin", "minS", "sMin", "minH"]);
      if (typ === "hminMin") { const h = zufall(1, 3), m = waehle([10, 15, 20, 30, 40, 45, 50]); return { art, typ, h, m, ziel: "min", loesung: h * 60 + m }; }
      if (typ === "hMin") { const h = zufall(1, 5); return { art, typ, h, m: 0, ziel: "min", loesung: h * 60 }; }
      if (typ === "minS") { const m = zufall(1, 5); return { art, typ, m, ziel: "s", loesung: m * 60 }; }
      if (typ === "sMin") { const s = zufall(1, 5) * 60; return { art, typ, s, ziel: "min", loesung: s / 60 }; }
      const m = zufall(1, 5) * 60;
      return { art, typ, m, ziel: "h", loesung: m / 60 };
    }
    case "ordnenGemischt": {
      const reihe = [];
      for (const d of mische(GEMISCHT)) if (reihe.length < 5 && !reihe.some(x => x.sek === d.sek)) reihe.push(d);
      reihe.sort((a, b) => a.sek - b.sek);
      return { art, reihe };
    }
    case "mitternacht": {
      const von = zufall(21 * 12, 23 * 12 + 11) * 5; // 21:00 … 23:55
      const bis = zufall(1, 24) * 5;                // 0:05 … 2:00
      return { art, von, bis, loesung: bis + 1440 - von };
    }
    case "zerlegen": {
      let min = zufall(61, 299);
      if (min % 60 === 0) min += zufall(1, 59);
      return { art, min, h: Math.floor(min / 60), m: min % 60 };
    }
  }
  return null;
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  const p = STUFE[stufe];
  if (!p.arten.includes(a.art)) m.push(`Art ${a.art} nicht in ${stufe}`);
  const ausListe = t => TAETIGKEITEN.includes(t);
  const spanneOk = t => t.min > 0 && t.min <= t.sek && t.sek <= t.max;
  const pruefeT = t => { if (!ausListe(t)) m.push("Tätigkeit nicht aus der Liste"); if (!spanneOk(t)) m.push(`Dauer ${t.name} ausserhalb der Spanne oder 0`); };
  switch (a.art) {
    case "laenger":
      pruefeT(a.kurz); pruefeT(a.lang);
      if (a.kurz === a.lang) m.push("zweimal dieselbe Tätigkeit");
      if (!laengerUm(a.kurz, a.lang, FAKTOR_S1)) m.push("Stufe 1: Dauern nicht deutlich verschieden (Faktor 30)");
      if (a.optionen.length !== 2 || !a.optionen.includes(a.kurz) || !a.optionen.includes(a.lang)) m.push("Optionen falsch");
      if (a.richtig !== (a.frage === "laenger" ? a.lang : a.kurz)) m.push("richtige Antwort passt nicht zur Frage");
      break;
    case "extrem": case "einheit":
      pruefeT(a.t);
      if (!a.koerbe.includes(a.richtig) || a.richtig !== a.t.einheit) m.push("Einheit nicht unter den Körben");
      if (!klar(a.t)) m.push(`${a.t.name}: kein klarer Fall`);
      if (a.art === "extrem" && a.t.einheit === "min") m.push("Stufe 1: Minuten statt Extreme");
      break;
    case "zeitpunkt":
      if (!SAETZE.some(s => s.satz === a.satz && s.art === a.richtig)) m.push("Satz nicht aus der Liste oder Art falsch");
      if (!p.gruppen.includes(a.gruppe)) m.push(`Satz der Gruppe ${a.gruppe} in ${stufe}`);
      if (/ß/.test(a.satz)) m.push("ß im Satz");
      if (/\b0\d:/.test(a.satz)) m.push("Uhrzeit mit führender Null");
      break;
    case "ungefaehr": case "zahlEinheit": {
      pruefeT(a.t);
      if (!["s", "min", "h"].includes(a.t.einheit)) m.push("Tage oder Wochen in einer Einheitenfrage");
      const texte = a.optionen.map(o => dauerWort(o.zahl, o.einheit));
      if (new Set(texte).size !== texte.length) m.push("doppelte Optionen");
      const richtige = a.optionen.filter(o => !klarFalsch(a.t, o.zahl, o.einheit));
      if (richtige.length !== 1 || richtige[0] !== a.richtig) m.push("nicht genau eine richtige Antwort (Faktor 3)");
      if (a.richtig.zahl !== a.t.zahl || a.richtig.einheit !== a.t.einheit) m.push("richtige Antwort ist nicht die typische Dauer");
      if (a.art === "zahlEinheit" && a.optionen.length !== 4) m.push("nicht vier Optionen");
      if (a.art === "ungefaehr" && a.optionen.some(o => o.zahl !== a.t.zahl)) m.push("Zahl der Optionen verschieden");
      break;
    }
    case "ordnen":
      if (a.reihe.length < 3 || a.reihe.length > 4) m.push("nicht 3 bis 4 Teile");
      a.reihe.forEach(pruefeT);
      if (new Set(a.reihe).size !== a.reihe.length) m.push("doppelte Tätigkeit");
      a.reihe.forEach((t, i) => { if (i && !laengerUm(a.reihe[i - 1], t, FAKTOR)) m.push(`${a.reihe[i - 1].name} und ${t.name} nicht um Faktor 3 verschieden`); });
      break;
    case "anfangEnde":
      if (a.typ === "uhr") {
        if (!(a.von >= 7 * 60 && a.bis <= 18 * 60 + 30 && a.von % 5 === 0 && a.bis % 5 === 0)) m.push("Uhrzeiten ausserhalb 7:00–18:30 oder nicht auf 5 min");
        if (a.bis - a.von !== a.loesung || !(a.loesung >= 10 && a.loesung <= 90)) m.push("Dauer falsch oder nicht 10–90 min");
      } else {
        if (!(a.von >= 0 && a.bis <= 6 && a.von < a.bis)) m.push("Tage ausserhalb der Woche");
        if (a.loesung !== (a.typ === "naechte" ? a.bis - a.von : a.bis - a.von + 1)) m.push("Nächte oder Tage falsch gezählt");
      }
      if (!(a.loesung > 0)) m.push("Dauer 0");
      break;
    case "umwandeln": {
      const soll = { hminMin: () => a.h * 60 + a.m, hMin: () => a.h * 60, minS: () => a.m * 60, sMin: () => a.s / 60, minH: () => a.m / 60 }[a.typ]?.();
      if (soll !== a.loesung || !Number.isInteger(a.loesung) || a.loesung <= 0) m.push("Umwandlung falsch oder keine ganze Zahl");
      if (a.typ === "hminMin" && !(a.m > 0 && a.m < 60)) m.push("Minutenrest nicht 1–59");
      break;
    }
    case "ordnenGemischt":
      if (a.reihe.length !== 5) m.push("nicht fünf Dauern");
      if (new Set(a.reihe.map(d => d.sek)).size !== 5) m.push("zwei gleich lange Dauern");
      if (a.reihe.some((d, i) => i && d.sek <= a.reihe[i - 1].sek)) m.push("nicht aufsteigend");
      if (a.reihe.some(d => !GEMISCHT.includes(d))) m.push("Dauer nicht aus dem Vorrat");
      break;
    case "mitternacht":
      if (!(a.von >= 21 * 60 && a.von < 1440 && a.bis > 0 && a.bis <= 120)) m.push("nicht über Mitternacht (Anfang 21:00–23:55, Ende 0:05–2:00)");
      if (a.bis + 1440 - a.von !== a.loesung || !(a.loesung >= 5 && a.loesung <= 300)) m.push("Dauer über Mitternacht falsch");
      break;
    case "zerlegen":
      if (!(a.min > 60 && a.min < 300) || a.min % 60 === 0) m.push("Minuten nicht zwischen 61 und 299 oder volle Stunden");
      if (a.h * 60 + a.m !== a.min || !(a.m >= 1 && a.m <= 59) || a.h < 1) m.push("Zerlegung falsch");
      break;
    default: m.push(`unbekannte Art ${a.art}`);
  }
  return m;
}

const STUFEN_TEXT = {
  s1: "Was dauert länger? Sekunden oder Stunden? Mit Bildern.",
  s2: "Zeitpunkt oder Zeitdauer? Sekunden, Minuten oder Stunden?",
  s3: "Wie lange dauert … ungefähr? 10 Sekunden, 10 Minuten oder 10 Stunden? Knifflige Sätze.",
  s4: "Zahl und Einheit zusammen wählen, Tätigkeiten nach Dauer ordnen.",
  s5: "Von 9:45 bis 10:20 — wie viele Minuten? Umwandeln: 1 h 30 min = ? min.",
  s6: "Endgegner: 90 s, 2 min, 1 h und 100 min ordnen, über Mitternacht rechnen, 135 min = ? h ? min.",
};
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => !STUFE[s].liste || TAETIGKEITEN.length));

/** Referenzgrössen je Einheit (Lehrplan MA.3.A.1.e): zwei je Einheit, damit der Tipp nie die Lösung nennt. */
const REFERENZ = {
  s: [["Die Schuhe binden", 20, "s"], ["Einmal niesen", 1, "s"]],
  min: [["Die grosse Pause", 20, "min"], ["Zähne putzen", 3, "min"]],
  h: [["Eine Nacht schlafen", 10, "h"], ["Ein Kinofilm", 2, "h"]],
};
/** Tipp mit einer bekannten Dauer je Einheit — keine davon darf eine Antwort der Aufgabe sein. */
function referenzTipp(verboten) {
  const teile = Object.values(REFERENZ).map(liste => {
    const [name, zahl, einheit] = liste.find(([, z, e]) => !verboten.includes(dauerWort(z, e))) || liste[0];
    return `${name} dauert etwa ${dauerWort(zahl, einheit)}.`;
  });
  return teile.join(" ");
}

function tippsFuer(a) {

      referenzTipp([]),

    ];
    case "zeitpunkt": return [

    case "ungefaehr": case "zahlEinheit": return [
      "Stell dir vor, du machst das jetzt. Ist es in Sekunden vorbei, braucht es Minuten, oder dauert es Stunden?",
      referenzTipp(a.optionen.map(o => dauerWort(o.zahl, o.einheit))),

        : "Die Zahl ist überall gleich. Nur die Einheit entscheidet: Sekunden sind ganz kurz, Stunden sehr lang.",
    ];
    case "ordnen": return [
      "Such zuerst das, was am schnellsten vorbei ist. Das kommt zuerst.",
      "Tippe immer das Kürzeste von dem an, was noch übrig ist.",

    case "anfangEnde": return a.typ === "uhr" ? [

      a.typ === "naechte" ? "Es gibt eine Nacht weniger als Tage, wenn du den ersten und den letzten Tag mitzählst." : "Der erste und der letzte Tag zählen mit.",
    ];
    case "umwandeln": return [

      a.ziel === "min" && a.typ === "hminMin" ? "Rechne zuerst die ganzen Stunden in Minuten um. Dann zähle die Minuten dazu."
        : a.typ === "sMin" || a.typ === "minH" ? "Wie oft passt 60 hinein?" : "Jede ganze Einheit gibt 60 kleine.",
      "1 h = 60 min, 2 h = 120 min, 1 min = 60 s, 2 min = 120 s.",
    ];
    case "ordnenGemischt": return [

      "1 h = 60 min, 1 min = 60 s, eine halbe Stunde = 30 min, eine Viertelstunde = 15 min.",

    ];
    case "mitternacht": return [

    ];

const H_SECHZIG = "Eine Stunde hat 60 Minuten, nicht 100. Rechne zuerst bis zur vollen Stunde, dann weiter.";
/** Wie hätte ein Kind gerechnet, das Uhrzeiten wie gewöhnliche Zahlen abzieht? 9:45 → 10:20: 1020 − 945 = 75. */
const hundertFehler = (von, bis) => (Math.floor((bis % 1440) / 60) * 100 + (bis % 60)) - (Math.floor(von / 60) * 100 + (von % 60));

/** Hinweis zu einer falschen Zahl z bei Tastatur-Aufgaben — nie die Lösung. */
function hinweisFuer(a, z) {
  if (a.art === "anfangEnde" && a.typ === "uhr") {
    if (z === hundertFehler(a.von, a.bis)) return H_SECHZIG;
    if (z === a.bis % 60 || z === a.von % 60) return "Das sind nur die Minuten einer Uhrzeit. Gesucht ist, wie viel Zeit dazwischen vergeht.";
    return z > a.loesung ? "Das ist zu viel. Zähle in Fünferschritten von der Anfangszeit bis zur Endzeit." : "Das ist zu wenig. Zähle in Fünferschritten von der Anfangszeit bis zur Endzeit.";
  }
  if (a.art === "anfangEnde") {
    if (a.typ === "naechte" && z === a.loesung + 1) return "Du hast die Tage gezählt. Nächte sind es eine weniger: zwischen zwei Tagen liegt eine Nacht.";
    if (a.typ === "tage" && z === a.loesung - 1) return "Zähle den ersten und den letzten Tag mit.";
    return "Zähle an den Fingern ab, Tag für Tag — vom ersten bis zum letzten.";
  }
  if (a.art === "umwandeln") {
    if (a.typ === "hminMin" && (z === a.h * 100 + a.m || z === a.h + a.m)) return "Eine Stunde hat 60 Minuten, nicht 100 und nicht 1. Rechne die Stunden zuerst in Minuten um.";
    if ((a.typ === "hMin" || a.typ === "minS") && z === (a.typ === "hMin" ? a.h : a.m) * 100) return "Nicht 100 — eine ganze Einheit hat 60 kleine.";
    if ((a.typ === "sMin" || a.typ === "minH") && z === (a.typ === "sMin" ? a.s : a.m) / 100) return "Nicht durch 100 teilen — 60 kleine Einheiten sind eine grosse.";
    return z > a.loesung ? "Das ist zu viel. Denk an die 60." : "Das ist zu wenig. Denk an die 60.";
  }
  if (a.art === "mitternacht") {
    if (z === 1440 - a.von) return "Das ist nur die Zeit bis Mitternacht. Danach geht es noch weiter.";
    if (z === a.bis) return "Das ist nur die Zeit nach Mitternacht. Die Zeit vor Mitternacht fehlt noch.";
    if (z === hundertFehler(a.von, a.bis + 1440) || z === Math.abs(hundertFehler(a.von, a.bis))) return H_SECHZIG;
    return "Rechne in zwei Schritten: erst bis 0:00, dann weiter.";
  }
  return "Rechne noch einmal Schritt für Schritt.";
}

/** Karte mit Bild und Name einer Tätigkeit. */
const taetigkeitKarte = t => el("div", { class: "zs-karte" }, el("span", { class: "zs-bild", text: t.bild }), t.name);

/**
 * Notizen (NZ1 a): Zeitstrahl von → mitte → bis mit einem Feld je Sprung. mitte: feste Zwischenzeit (0:00) oder
 * null — dann ist auch sie ein Feld (die volle Stunde nennt der Strahl nicht, sonst wäre er ein Tipp).
 */
function zeitstrahl(ctx, zs, von, mitte, bis, empfohlen) {
  if (!ctx.notizen(empfohlen)) return;
  const sprung = label => el("span", { class: "nz-sprung" }, LS.notizFeld({ breite: 4, label }), el("span", { text: "→" }));
  zs.append(el("div", { class: "nz-strahl" }, el("b", { text: von }),
    sprung(mitte ? `bis ${mitte}` : "Sprung 1"), mitte ? el("b", { text: mitte }) : LS.notizFeld({ breite: 5, label: "Zwischenzeit" }),
    sprung(mitte ? `nach ${mitte}` : "Sprung 2"), el("b", { text: bis })));
}

/** Zifferntastatur mit Anzeige und Einheit daneben; prüft gegen soll. */
function eingabe(ctx, zs, { soll, einheit, label, loesung, hinweis, maxStellen = 3, danach = null }) {
  const anzeige = el("div", { class: "anzeige leer", "aria-label": label });
  zs.append(el("div", { class: "zs-ergebnis" }, anzeige, el("span", { class: "zs-einheit", text: einheit })));
  const tasten = LS.tastatur({
    anzeige, maxStellen,
    onOk(w) {
      if (w === soll) {
        tasten.gesperrt = true;
        anzeige.classList.add("richtig");
        if (danach) danach(tasten); else ctx.richtig();
        return;
      }
      anzeige.classList.add("falsch");
      ctx.falsch(hinweis(w), loesung);
      if (ctx.vorbei()) tasten.gesperrt = true;
    },
  });
  zs.append(tasten.element);
  return tasten;
}

        ctx.loesung(loesung);
        ctx.schritte(LS.tippSchritte(a.h) + LS.tippSchritte(a.m));
        const schritt = el("p", { class: "zs-schritt", text: "1. Wie viele ganze Stunden?" });
        const teil = el("div");
        zs.append(schritt, teil);
        eingabe(ctx, teil, {
          soll: a.h, einheit: "h", label: "Stunden", loesung, maxStellen: 1,
          hinweis: z => (z === a.min ? "Nur die ganzen Stunden: Wie oft passen 60 Minuten hinein?"
            : z * 60 > a.min ? "So viele Minuten hast du nicht. Es sind weniger ganze Stunden." : "Es passen noch mehr ganze Stunden hinein."),
          danach(tasten) {
            tasten.element.remove();
            teil.querySelector(".zs-ergebnis")?.remove();
            zs.append(el("p", { class: "zs-fertig", text: `✓ ${a.h} h` }));
            schritt.textContent = "2. Wie viele Minuten bleiben übrig?";
            LS.ton("tipp");
            const teil2 = el("div");
            zs.append(teil2);
            eingabe(ctx, teil2, {
              soll: a.m, einheit: "min", label: "Minuten", loesung, maxStellen: 2,
              hinweis: z => (z >= 60 ? "Bei den Minuten höchstens 59 — 60 Minuten sind schon eine Stunde." : z === a.min % 100 ? "Zieh die ganzen Stunden ab: Jede Stunde sind 60 Minuten." : `Zieh die ganzen Stunden ab: ${a.h} h sind ${a.h * 60} min.`),
            });
          },
        });
        break;
      }
    }
  },
});
</script>
</body>
</html>
