<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jahreskreis-Ordner</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(22px, 4.6vw, 30px); font-weight: 800; margin: 4px 0 16px; line-height: 1.35; }
  .frage b { color: var(--knopf); }

  .wahl { display: grid; gap: 10px; max-width: 760px; margin: 0 auto; }
  .wahl.tage { grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); }
  .wahl.monate { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }
  .wahl.zeiten { grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); }

  .antwort {
    border: none; border-radius: 16px; min-height: 58px; padding: 8px;
    font-family: inherit; font-size: clamp(18px, 3.6vw, 22px); font-weight: 900;
    color: var(--text); background: #fff; box-shadow: 0 5px 0 var(--rand); cursor: pointer;
    border-left: 8px solid var(--j, var(--knopf));
  }
  .antwort.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .antwort.richtig { background: var(--gut-hell); }
  .antwort.gewaehlt { opacity: .35; }
  .antwort .nr { display: block; font-size: 13px; color: var(--text-leise); }
  .antwort .zeichen { margin-right: 6px; }

  /* Jahreszeit-Farben: Frühling, Sommer, Herbst, Winter (Deko, keine Stellenfarben) */
  .jz-fruehling { --j: #7ccf6b; }
  .jz-sommer { --j: #f5b301; }
  .jz-herbst { --j: #e07a3f; }
  .jz-winter { --j: #74a7e0; }

  .reihe-gelegt { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 52px; margin: 0 0 14px; }
  .reihe-gelegt span { background: var(--gut-hell); border-radius: 12px; padding: 8px 14px; font-weight: 900; font-size: 20px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>📅 Jahreskreis-Ordner</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.9.1: a Zeitbegriffe (morgen, heute, gestern), zeitliche Reihen: Wochentage, Monate;
// b Jahreskreis, Frühling, Sommer, Herbst, Winter.
// Jahreszeiten werden nur zu eindeutigen Monaten gefragt (nicht März, Juni, September, Dezember,
// in denen die Jahreszeit mitten im Monat wechselt).

const { zufall, waehle, mische, el } = LS;

const TAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const JAHRESZEIT = { 0: "Winter", 1: "Winter", 3: "Frühling", 4: "Frühling", 6: "Sommer", 7: "Sommer", 9: "Herbst", 10: "Herbst" };
const ZEITEN = ["Frühling", "Sommer", "Herbst", "Winter"];
const ZEIT_KLASSE = { Frühling: "jz-fruehling", Sommer: "jz-sommer", Herbst: "jz-herbst", Winter: "jz-winter" };
// Bild zur Jahreszeit: Kinder bis zur 1. Klasse erkennen die Knöpfe ohne Lesen (rahmen.md Abschnitt 12).
const ZEIT_BILD = { Frühling: "🌷", Sommer: "☀️", Herbst: "🍂", Winter: "❄️" };
const mod = (n, m) => ((n % m) + m) % m;

/* Aufgabenarten: jede liefert { frage (HTML), liste, loesung (Index in liste) } oder eine Reihen-Aufgabe. */
const ARTEN = {
  tagMorgen() {
    const h = zufall(0, 6);
    const [wort, d] = waehle([["morgen", 1], ["gestern", -1]]);
    return { frage: `Heute ist <b>${TAGE[h]}</b>. Welcher Tag ist ${wort}?`, liste: "tage", loesung: mod(h + d, 7), zurueck: d < 0 };
  },
  tagWeit() {
    const h = zufall(0, 6);
    const [wort, d] = waehle([["übermorgen", 2], ["vorgestern", -2], ["in einer Woche", 7]]);
    return { frage: `Heute ist <b>${TAGE[h]}</b>. Welcher Tag ist ${wort}?`, liste: "tage", loesung: mod(h + d, 7), zurueck: d < 0 };
  },
  tagRechnen() {
    const h = zufall(0, 6), d = zufall(3, 12) * waehle([1, -1]);
    return { frage: `Heute ist <b>${TAGE[h]}</b>. Welcher Tag ist ${d > 0 ? `in ${d}` : `vor ${-d}`} Tagen?`, liste: "tage", loesung: mod(h + d, 7), zurueck: d < 0 };
  },
  monatNach() {
    const m = zufall(0, 11);
    const vor = Math.random() < 0.5;
    return { frage: `Welcher Monat kommt ${vor ? "vor" : "nach"} dem <b>${MONATE[m]}</b>?`, liste: "monate", loesung: mod(m + (vor ? -1 : 1), 12), zurueck: vor };
  },
  monatRechnen() {
    const m = zufall(0, 11), d = zufall(2, 7) * waehle([1, -1]);
    return { frage: `Welcher Monat ist ${Math.abs(d)} Monate ${d > 0 ? "nach" : "vor"} dem <b>${MONATE[m]}</b>?`, liste: "monate", loesung: mod(m + d, 12), zurueck: d < 0 };
  },
  jahreszeit() {
    const m = Number(waehle(Object.keys(JAHRESZEIT)));
    return { frage: `In welcher Jahreszeit liegt der <b>${MONATE[m]}</b>?`, liste: "zeiten", loesung: ZEITEN.indexOf(JAHRESZEIT[m]) };
  },
  ordnen(art) {
    const liste = art === "tage" ? TAGE : MONATE;
    const n = art === "tage" ? 4 : 5;
    const start = zufall(0, liste.length - 1);
    const folge = Array.from({ length: n }, (_, i) => mod(start + i, liste.length));
    return { reihe: true, frage: `Tipp die ${art === "tage" ? "Tage" : "Monate"} in der richtigen Reihenfolge an — beginne beim <b>${liste[folge[0]]}</b>.`, liste: art, folge };
  },

  // ---- Königsstufe ----
  tagWochen() {
    const h = zufall(0, 6), w = zufall(1, 4), r = zufall(1, 6), vor = Math.random() < 0.4;
    const d = (7 * w + r) * (vor ? -1 : 1);
    const text = Math.random() < 0.5 ? `${7 * w + r} Tagen` : `${w === 1 ? "einer Woche" : `${w} Wochen`} und ${r === 1 ? "einem Tag" : `${r} Tagen`}`;
    return { typ: "tag", h, d, zurueck: vor, frage: `Heute ist <b>${TAGE[h]}</b>. Welcher Tag ${vor ? "war vor" : "ist in"} ${text}?`, liste: "tage", loesung: mod(h + d, 7),
      hinweis: "Nach einer ganzen Woche ist wieder derselbe Tag. Zähl zuerst die Wochen weg, dann die übrigen Tage." };
  },
  monatWeit() {
    const m = zufall(0, 11), d = zufall(13, 30) * waehle([1, -1]);
    return { typ: "monat", m, d, zurueck: d < 0, frage: `Welcher Monat ist ${Math.abs(d)} Monate ${d > 0 ? "nach" : "vor"} dem <b>${MONATE[m]}</b>?`, liste: "monate", loesung: mod(m + d, 12),
      hinweis: "Nach 12 Monaten ist wieder derselbe Monat. Zähl zuerst ein ganzes Jahr weg." };
  },
  datumTag() {
    // Im Februar nur ohne Monatswechsel — die Länge hängt dort vom Schaltjahr ab.
    const m = zufall(0, 11), h = zufall(0, 6), d = zufall(5, 20);
    const t1 = m === 1 ? zufall(1, 28 - d) : zufall(1, TAGE_IM_MONAT[m]);
    let t2 = t1 + d, m2 = m;
    if (t2 > TAGE_IM_MONAT[m]) { t2 -= TAGE_IM_MONAT[m]; m2 = (m + 1) % 12; }
    return { typ: "datum", m, t1, m2, t2, h, frage: `Der <b>${t1}. ${MONATE[m]}</b> ist ein ${TAGE[h]}. Welcher Wochentag ist der <b>${t2}. ${MONATE[m2]}</b>?`,
      liste: "tage", loesung: mod(h + d, 7),
      hinweis: m2 !== m ? `Wie viele Tage hat der ${MONATE[m]}? Zähl die Tage bis zum Datum und dann die Wochen weg.` : "Zähl die Tage bis zum Datum und dann die Wochen weg." };
  },
  monatsLaenge() {
    // Genau ein Monat mit 30 Tagen unter drei Monaten mit 31 Tagen (Februar nicht dabei).
    const kurz = waehle([3, 5, 8, 10]);
    const lang = mische([0, 2, 4, 6, 7, 9, 11]).slice(0, 3);
    const optionen = mische([kurz, ...lang]);
    return { typ: "laenge", frage: "Welcher dieser Monate hat nur <b>30</b> Tage?", liste: "auswahl", namen: optionen.map(i => MONATE[i]), monate: optionen,
      loesung: optionen.indexOf(kurz), hinweis: "Knöchelregel: Zähl die Monate auf den Knöcheln und in den Lücken deiner Faust ab. Lücke = kürzerer Monat." };
  },
  jahreszeitRechnen() {
    const ziele = Object.keys(JAHRESZEIT).map(Number);
    const ziel = waehle(ziele), d = zufall(2, 8);
    const m = mod(ziel - d, 12);
    return { typ: "zeit", m, d, frage: `Welche Jahreszeit ist <b>${d} Monate</b> nach dem <b>${MONATE[m]}</b>?`, liste: "zeiten", loesung: ZEITEN.indexOf(JAHRESZEIT[ziel]),
      hinweis: "Rechne zuerst den Monat aus. Dann denk an das Wetter in diesem Monat." };
  },
};

// Tage je Monat in einem gewöhnlichen Jahr (Februar nur ohne Monatswechsel gebraucht).
const TAGE_IM_MONAT = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];

// Je Stufe: Aufgabenarten
const STUFE = {
  s1: ["tagMorgen", "tagMorgen", "ordnenTage"],
  s2: ["tagWeit", "monatNach", "ordnenTage", "jahreszeit"],
  s3: ["monatNach", "jahreszeit", "ordnenMonate", "tagWeit"],
  s4: ["monatRechnen", "tagRechnen", "ordnenMonate", "jahreszeit"],
  s5: ["monatRechnen", "tagRechnen", "tagRechnen", "monatRechnen"],
  // Königsstufe: Wochen und Tage, mehr als ein Jahr, Datum über den Monatswechsel, Monatslängen.
  s6: ["tagWochen", "monatWeit", "datumTag", "datumTag", "monatsLaenge", "jahreszeitRechnen"],
};

function aufgabeErzeugen(stufe) {
  const art = waehle(STUFE[stufe]);
  const a = art === "ordnenTage" ? ARTEN.ordnen("tage") : art === "ordnenMonate" ? ARTEN.ordnen("monate") : ARTEN[art]();
  return { art, ...a };
}

/** Mängel der Königsstufe, unabhängig nachgerechnet (Datum über Date in einem Nicht-Schaltjahr). */
function pruefeAufgabe(a, stufe) {
  const m = [];
  if (a.reihe) {
    if (new Set(a.folge).size !== a.folge.length) m.push("Reihe mit doppeltem Teil");
    return m;
  }
  const namen = a.namen || NAMEN[a.liste];
  if (!(a.loesung >= 0 && a.loesung < namen.length)) m.push("Lösung nicht unter den Möglichkeiten");
  if (a.typ === "datum") {
    const tage = Math.round((new Date(2025 + (a.m2 < a.m ? 1 : 0), a.m2, a.t2) - new Date(2025, a.m, a.t1)) / 86400000);
    if (TAGE[mod(a.h + tage, 7)] !== namen[a.loesung]) m.push("Wochentag stimmt nicht");
    if (a.t2 > new Date(2025, a.m2 + 1, 0).getDate() || a.t2 < 1) m.push("Datum gibt es nicht");
    if ((a.m === 1 && a.m2 !== 1) || a.m2 - a.m > 1) m.push("Monatswechsel nach Februar oder zu weit");
  }
  if (a.typ === "laenge") {
    const dreissig = a.monate.filter(i => new Date(2025, i + 1, 0).getDate() === 30);
    if (dreissig.length !== 1 || MONATE[dreissig[0]] !== namen[a.loesung] || a.monate.includes(1)) m.push("nicht genau ein Monat mit 30 Tagen");
  }
  if (a.typ === "zeit" && JAHRESZEIT[mod(a.m + a.d, 12)] !== namen[a.loesung]) m.push("Jahreszeit stimmt nicht oder Monat nicht eindeutig");
  if (a.typ === "tag" && TAGE[mod(a.h + a.d, 7)] !== namen[a.loesung]) m.push("Wochentag stimmt nicht");
  if (a.typ === "monat" && MONATE[mod(a.m + a.d, 12)] !== namen[a.loesung]) m.push("Monat stimmt nicht");
  if (stufe === "s6" && !a.typ) m.push("Königsstufe mit leichter Aufgabe");
  if (a.hinweis && a.hinweis.includes(namen[a.loesung])) m.push("Hinweis verrät die Lösung");
  return m;
}

const NAMEN = { tage: TAGE, monate: MONATE, zeiten: ZEITEN };

function knopfFuer(art, i, text) {
  // Nur die Jahreszeiten-Knöpfe sind gefärbt; Monate nicht, sonst verrät die Farbe die Jahreszeit.
  const k = el("button", { type: "button", class: "antwort" + (art === "zeiten" ? ` ${ZEIT_KLASSE[text]}` : "") });
  if (art === "monate") k.append(el("span", { class: "nr", text: `${i + 1}. Monat` }));
  if (art === "zeiten") k.append(el("span", { class: "zeichen", "aria-hidden": "true", text: ZEIT_BILD[text] }));
  k.append(text);
  return k;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Zählweise und Kalenderregeln — nie der gesuchte
 * Tag, Monat oder die Jahreszeit.
 */
function tippsFuer(a) {
  const richtung = a.zurueck ? "zurück" : "weiter";
  const rund = "Nach dem letzten fängt es wieder von vorne an.";
  switch (a.art) {
    case "tagMorgen": return [`${a.zurueck ? "Gestern" : "Morgen"} heisst: ein Tag ${richtung}.`, "Sag die Wochentage leise auf und hör beim heutigen Tag genau hin."];
    case "tagWeit": return ["Übermorgen heisst zwei Tage weiter, vorgestern zwei Tage zurück, in einer Woche sieben Tage weiter.",
      "Zähl mit den Fingern Tag für Tag. Nach dem letzten Tag der Woche fängt sie wieder von vorne an."];
    case "tagRechnen": return [`Zähl Tag für Tag mit den Fingern ${richtung}.`, "Sieben Tage später ist wieder derselbe Wochentag. Nimm zuerst eine ganze Woche weg, dann zähl den Rest."];
    case "monatNach": return ["Sag die Monate leise auf, vom Januar an.", `Die Nummern auf den Knöpfen helfen: Welcher Monat hat eine Nummer ${a.zurueck ? "weniger" : "mehr"}? ${rund}`];
    case "monatRechnen": return [`Die Nummern auf den Knöpfen helfen: Zähl so viele Monate ${richtung}.`, "Nach dem 12. Monat geht es wieder beim 1. weiter."];
    case "jahreszeit": return ["Denk daran, wie das Wetter in diesem Monat meistens ist.", "Was machst du in diesem Monat draussen: schlitteln, baden, Blätter sammeln oder Blumen pflücken?"];
    case "ordnenTage": case "ordnenMonate": return ["Sag die Reihe leise auf und fang beim genannten an.", rund];
    case "tagWochen": return ["Wie viele ganze Wochen stecken darin?", a.hinweis];
    case "monatWeit": return ["Wie viele ganze Jahre stecken darin?", a.hinweis];
    case "datumTag": return ["Wie viele Tage liegen zwischen den beiden Daten?", a.hinweis];
    case "monatsLaenge": return ["Lange Monate haben 31 Tage, kurze 30 — und der Februar ist besonders kurz.", a.hinweis];
    default: return [a.hinweis, "Winter: Dezember bis Februar. Frühling: März bis Mai. Sommer: Juni bis August. Herbst: September bis November."];
  }
}

LS.spiel({
  id: "jahreskreis",
  hilfe: "Lies die Frage und tipp auf den richtigen Tag, Monat oder die Jahreszeit. Bei einer Reihe tippst du der Reihe nach an.",
  einleitung: "Gestern, heute, morgen — Wochentage, Monate und Jahreszeiten. Kennst du dich im Jahreskreis aus?",
  anzahl: 8,
  stufen: {
    s1: "Gestern und morgen, Wochentage ordnen.",
    s2: "Übermorgen und vorgestern, Monate, Jahreszeiten.",
    s3: "Monate ordnen und Jahreszeiten zuordnen.",
    s4: "Rechnen im Kalender: 3 Monate nach Oktober?",
    s5: "Profi: Heute ist Freitag — welcher Tag ist in 10 Tagen?",
    s6: "Endgegner: in 3 Wochen und 2 Tagen, 15 Monate später, vom 28. April zum 6. Mai.",
  },

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    ctx.serie("art", a.art); // jede Stufe hat mehrere Arten
    if (a.zurueck !== undefined) ctx.serie("richtung", a.zurueck); // vorwärts oder zurück im Kalender
    const namen = NAMEN[a.liste];
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    ctx.flaeche.append(el("div", { class: "frage", html: a.frage }));
    let fertig = false;

    const loesung = a.reihe ? a.folge.map(j => namen[j]).join(" → ") : `Richtig ist: ${(a.namen || namen)[a.loesung]}.`;
    ctx.loesung(loesung);
    ctx.schritte(a.reihe ? a.folge.length : 1); // die Reihe der Reihe nach antippen, sonst eine Antwort

    if (a.reihe) {
      const gelegt = el("div", { class: "reihe-gelegt" });
      const wahl = el("div", { class: `wahl ${a.liste}` });
      let pos = 0;
      for (const i of mische(a.folge)) {
        const k = knopfFuer(a.liste, i, namen[i]);
        k.addEventListener("click", () => {
          if (fertig || k.classList.contains("gewaehlt")) return;
          if (i === a.folge[pos]) {
            pos++;
            k.classList.add("gewaehlt");
            gelegt.append(el("span", { text: namen[i] }));
            LS.ton("tipp");
            if (pos === a.folge.length) { fertig = true; ctx.richtig(); }
            return;
          }
          k.classList.remove("falsch");
          void k.offsetWidth;
          k.classList.add("falsch");
          ctx.falsch(pos === 0 ? `Beginne beim ${namen[a.folge[0]]}.` : `Was kommt nach dem ${namen[a.folge[pos - 1]]}? Sag die Reihe leise auf.`, loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
        });
        wahl.append(k);
      }
      ctx.flaeche.append(gelegt, wahl);
      LS.kurztasten(wahl);
      return;
    }

    const wahl = el("div", { class: `wahl ${a.liste}` });
    (a.namen || namen).forEach((text, i) => {
      const k = knopfFuer(a.liste, i, text);
      k.addEventListener("click", () => {
        if (fertig) return;
        if (i === a.loesung) { fertig = true; k.classList.add("richtig"); ctx.richtig(); return; }
        k.classList.remove("falsch");
        void k.offsetWidth;
        k.classList.add("falsch");
        ctx.falsch(a.hinweis || (a.liste === "zeiten" ? "Denk daran, wie das Wetter in diesem Monat meistens ist." : "Zähl Schritt für Schritt weiter — nach dem letzten kommt wieder der erste."),
          loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      wahl.append(k);
    });
    ctx.flaeche.append(wahl);
    LS.kurztasten(wahl);
    if (ctx.nr === 0) ctx.sag("Tipp auf die richtige Antwort.");
  },
});
</script>
</body>
</html>
