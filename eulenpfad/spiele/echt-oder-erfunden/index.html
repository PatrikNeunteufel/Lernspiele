<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echt oder erfunden?</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(19px, 4.2vw, 25px); font-weight: 800; margin: 0 0 10px; }
  .sachtext { background: #fffaf0; border: 3px solid var(--rand); border-radius: 16px; padding: 12px 16px; margin: 0 auto 14px;
    max-width: 620px; font-size: clamp(18px, 4vw, 22px); line-height: 1.45; font-weight: 600; }
  .echt-bild { display: block; text-align: center; font-size: 64px; line-height: 1.1; margin-bottom: 4px; }
  .echt-saetze .wahl-knopf { text-align: left; font-size: clamp(17px, 3.8vw, 20px); }
  .echt-lang .wahl-knopf { font-size: clamp(16px, 3.6vw, 19px); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🦄 Echt oder erfunden?</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="texte.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.9.4 (Geschichte und Geschichten unterscheiden): a fiktive und reale Geschichten
// unterscheiden (Grundanspruch 1. Zyklus, Ende 2. Klasse); c Merkmale dafür nennen (2. Zyklus);
// Textsorten Märchen, Sage, Fabel, Sachtext (vgl. D.6.C.1.c Märchenmerkmale).
// Basisklasse 2: s1 1. Klasse (Satz mit Bild), s3 2. Klasse (kurze Geschichte), s5 3. Klasse
// (erfundenen Satz finden, Merkmal nennen), s6 Königsstufe (Textsorten, erstaunliche Fakten).
// Alle Texte in texte.js, selbst geschrieben.

const { waehle, mische, el } = LS;
const ID = "echt-oder-erfunden";

// ---------- Freigabe (Entscheid L4 a) ----------
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : ECHT_LISTEN);
const AUS = FREI.has("aussagen") ? AUSSAGEN.map((x, i) => i) : [];
const GES = FREI.has("geschichten") ? GESCHICHTEN.map((x, i) => i) : [];
const STA = FREI.has("staunen") ? STAUNEN.map((x, i) => i) : [];
const TXT = FREI.has("textsorten") ? TEXTSORTEN_TEXTE.map((x, i) => i) : [];

// ---------- Aufgabenarten (null, wenn die freien Listen nichts hergeben) ----------

/** Ja/Nein etwa gleich oft: erst die Seite wählen, dann ein Stück daraus. */
function ausgewogen(liste, istEcht) {
  const ja = liste.filter(istEcht), nein = liste.filter(i => !istEcht(i));
  return waehle(ja.length && nein.length ? (Math.random() < 0.5 ? ja : nein) : liste);
}

const ARTEN = {
  aussage(nurEinfach) {
    const liste = AUS.filter(i => !nurEinfach || AUSSAGEN[i][3]);
    if (!liste.length) return null;
    const i = ausgewogen(liste, i => AUSSAGEN[i][2]);
    return { art: "aussage", nr: i, richtig: AUSSAGEN[i][2] ? "echt" : "erfunden", optionen: ["echt", "erfunden"] };
  },
  geschichte() {
    if (!GES.length) return null;
    const i = ausgewogen(GES, i => GESCHICHTEN[i][1] < 0);
    return { art: "geschichte", nr: i, richtig: GESCHICHTEN[i][1] < 0 ? "echt" : "erfunden", optionen: ["echt", "erfunden"] };
  },
  welcherSatz() {
    const liste = GES.filter(i => GESCHICHTEN[i][1] >= 0);
    if (!liste.length) return null;
    const i = waehle(liste);
    const [saetze, k] = GESCHICHTEN[i];
    return { art: "welcherSatz", nr: i, richtig: saetze[k], optionen: saetze.slice() };
  },
  merkmal() {
    const liste = GES.filter(i => GESCHICHTEN[i][1] >= 0);
    if (!liste.length) return null;
    const i = waehle(liste);
    const richtig = GESCHICHTEN[i][2];
    const andere = mische(Object.keys(MERKMALE).filter(k => k !== richtig)).slice(0, 2);
    return { art: "merkmal", nr: i, richtig, optionen: mische([richtig, ...andere]) };
  },
  staunen() {
    if (!STA.length) return null;
    const i = ausgewogen(STA, i => STAUNEN[i][1]);
    return { art: "staunen", nr: i, richtig: STAUNEN[i][1] ? "stimmt" : "erfunden", optionen: ["stimmt", "erfunden"] };
  },
  textsorte() {
    if (!TXT.length) return null;
    const i = waehle(TXT);
    return { art: "textsorte", nr: i, richtig: TEXTSORTEN_TEXTE[i][0], optionen: mische(Object.keys(TEXTSORTEN)) };
  },
  textmerkmal() {
    if (!TXT.length) return null;
    const i = waehle(TXT);
    const richtig = TEXTSORTEN_TEXTE[i][0];
    const andere = mische(Object.keys(TEXTSORTEN).filter(k => k !== richtig)).slice(0, 2);
    return { art: "textmerkmal", nr: i, richtig, optionen: mische([richtig, ...andere]) };
  },
};

const STUFE = {
  s1: [() => ARTEN.aussage(true)],
  s2: [() => ARTEN.aussage(false)],
  s3: [() => ARTEN.geschichte()],
  s4: [() => ARTEN.staunen(), () => ARTEN.staunen(), () => ARTEN.geschichte()],
  s5: [() => ARTEN.welcherSatz(), () => ARTEN.merkmal()],
  // Königsstufe: Textsorten erkennen und begründen, dazu erstaunliche Fakten
  s6: [() => ARTEN.textsorte(), () => ARTEN.textmerkmal(), () => ARTEN.staunen()],
};

function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Ein Bild, ein Satz: Kann es das geben?",
  s2: "Mehr Sätze: Kann es das geben, oder ist es erfunden?",
  s3: "Kurze Geschichten: echt oder erfunden?",
  s4: "Erstaunlich, aber wahr? Fakten über Tiere und Natur.",
  s5: "Welcher Satz ist erfunden? Woran erkennst du es?",
  s6: "Märchen, Sage, Fabel oder Sachtext?",
};
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
// Stufen, in denen die freien Listen mehr als eine Aufgabenart hergeben (nur dort ctx.serie("art")).
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));

// ---------- Prüfung (tools/pruefe_spiele.js) ----------

const LISTE_DER_ART = { aussage: "aussagen", geschichte: "geschichten", welcherSatz: "geschichten", merkmal: "geschichten", staunen: "staunen", textsorte: "textsorten", textmerkmal: "textsorten" };
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (!FREI.has(LISTE_DER_ART[a.art])) m.push(`Inhalt nicht aus einer freien Liste (${LISTE_DER_ART[a.art]})`);
  if (new Set(a.optionen).size !== a.optionen.length || a.optionen.filter(o => o === a.richtig).length !== 1) m.push("Antworten doppelt oder richtige fehlt");
  const g = GESCHICHTEN[a.nr];
  if (a.art === "aussage" && a.richtig !== (AUSSAGEN[a.nr][2] ? "echt" : "erfunden")) m.push("Lösung falsch");
  if (a.art === "aussage" && stufe === "s1" && !AUSSAGEN[a.nr][3]) m.push("Stufe 1 nur eindeutige Sätze");
  if (a.art === "geschichte" && a.richtig !== (g[1] < 0 ? "echt" : "erfunden")) m.push("Lösung falsch");
  if (a.art === "welcherSatz" && (g[1] < 0 || g[0][g[1]] !== a.richtig || new Set(g[0]).size !== 3)) m.push("erfundener Satz falsch");
  if (a.art === "merkmal" && (g[1] < 0 || g[2] !== a.richtig || !MERKMALE[a.richtig])) m.push("Merkmal falsch");
  if (a.art === "staunen" && a.richtig !== (STAUNEN[a.nr][1] ? "stimmt" : "erfunden")) m.push("Lösung falsch");
  if ((a.art === "textsorte" || a.art === "textmerkmal") && TEXTSORTEN_TEXTE[a.nr][0] !== a.richtig) m.push("Textsorte falsch");
  // Inhalt der Aufgabe ohne ß
  const inhalt = { aussage: AUSSAGEN, geschichte: GESCHICHTEN, welcherSatz: GESCHICHTEN, merkmal: GESCHICHTEN, staunen: STAUNEN, textsorte: TEXTSORTEN_TEXTE, textmerkmal: TEXTSORTEN_TEXTE }[a.art][a.nr];
  if (JSON.stringify([a, inhalt, MERKMALE, TEXTSORTEN]).includes("ß")) m.push("ß");
  return m;
}

// ---------- Spiel ----------

const KORB = {
  echt: { bild: "🌍", text: "Kann es geben" },
  erfunden: { bild: "🦄", text: "Erfunden" },
  stimmt: { bild: "✅", text: "Das stimmt" },
};
const HINWEIS = {
  aussage: "Hast du so etwas schon einmal gesehen? Könnte es wirklich so passieren?",
  geschichte: "Lies jeden Satz einzeln: Kann das alles wirklich passieren?",
  welcherSatz: "Welcher Satz kann in Wirklichkeit nicht passieren?",
  merkmal: "Schau den Satz genau an, der nicht passieren kann: Wer tut dort etwas?",
  staunen: "Denk an das, was du über Tiere und die Natur weisst. Manches Wahre ist erstaunlich!",
  textsorte: "Wie beginnt der Text? Spielt er an einem echten Ort? Sprechen Tiere? Erklärt er etwas?",
  textmerkmal: "Überlege zuerst, was für ein Text das ist.",
};

LS.spiel({
  id: ID,
  einleitung: "Manche Geschichten könnten wirklich passieren, andere sind erfunden. Findest du heraus, was echt ist?",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
    if (a.optionen.length === 2) ctx.serie("antwort", a.richtig); // echt/erfunden, stimmt/erfunden
    const f = ctx.flaeche;
    const text =(t, klasse = "sachtext") => f.append(el("div", { class: klasse, text: t }));
    if (ctx.nr === 0) ctx.sag(`${a.art === "aussage" ? "Hör oder lies genau." : "Lies genau."} Könnte das wirklich so passieren?`);
    if (a.art === "aussage") {
      const [bild, satz] = AUSSAGEN[a.nr];
      text("Kann es das geben?", "frage");
      const { karte } = LS.koerbe(ctx, {
        karte: { bild, text: satz }, koerbe: a.optionen, richtig: a.richtig, korbInhalt: k => KORB[k],
        hinweis: HINWEIS.aussage, loesung: `${satz} ${a.richtig === "echt" ? "Das kann es wirklich geben." : "Das ist erfunden."}`,
      });
      // NMG, kein Lesespiel: Die Eule liest den Satz mit vor (rahmen.md Abschnitt 12).
      karte.querySelector("b").classList.add("frage");
      return;
    }
    if (a.art === "geschichte" || a.art === "staunen") {
      const echt = a.art === "geschichte" ? GESCHICHTEN[a.nr][0].join(" ") : STAUNEN[a.nr][0];
      text(a.art === "geschichte" ? "Kann diese Geschichte wirklich passieren?" : "Stimmt das, oder ist es erfunden?", "frage");
      text(echt);
      const g = GESCHICHTEN[a.nr];
      const loesung = a.art === "geschichte"
        ? (a.richtig === "echt" ? "Das kann alles wirklich passieren." : `Erfunden: ${g[0][g[1]]}`)
        : (a.richtig === "stimmt" ? "Das stimmt wirklich!" : "Das ist erfunden.");
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, inhalt: k => KORB[k], hinweis: HINWEIS[a.art], loesung, breite: 170 });
      return;
    }
    if (a.art === "welcherSatz") {
      text("Welcher Satz ist erfunden?", "frage");
      const box = LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, hinweis: HINWEIS.welcherSatz, loesung: `Erfunden ist: ${a.richtig}`, breite: 320 });
      box.classList.add("echt-saetze");
      return;
    }
    if (a.art === "merkmal") {
      const [saetze, k] = GESCHICHTEN[a.nr];
      text("Diese Geschichte ist erfunden. Woran erkennst du das?", "frage");
      text(saetze.join(" "));
      const box = LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, inhalt: x => MERKMALE[x], hinweis: HINWEIS.merkmal,
        loesung: `${MERKMALE[a.richtig]} (${saetze[k]})`, breite: 280 });
      box.classList.add("echt-lang");
      return;
    }
    // Textsorten
    const [sorte, t] = TEXTSORTEN_TEXTE[a.nr];
    if (a.art === "textsorte") {
      text("Was für ein Text ist das?", "frage");
      text(t);
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, inhalt: x => TEXTSORTEN[x].name, hinweis: HINWEIS.textsorte,
        loesung: `Das ist ein${sorte === "sage" ? "e" : ""} ${TEXTSORTEN[sorte].name}: ${TEXTSORTEN[sorte].merkmal}`, breite: 150 });
    } else {
      text(`Das ist ein${sorte === "sage" ? "e" : ""} ${TEXTSORTEN[sorte].name}. Woran erkennst du das?`, "frage");
      text(t);
      const box = LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, inhalt: x => TEXTSORTEN[x].merkmal, hinweis: HINWEIS.textmerkmal,
        loesung: TEXTSORTEN[sorte].merkmal, breite: 300 });
      box.classList.add("echt-lang");
    }
  },
});
</script>
</body>
</html>
