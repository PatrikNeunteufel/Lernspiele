<!doctype html>
<html lang="de-CH">

<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(18px, 4vw, 24px); font-weight: 800; margin: 0 0 12px; }
  .frage b { color: var(--knopf); }

  /* Schema der direkten Rede: Begleitsatz und Rede als farbige Kästchen, die Zeichen dazwischen gross. */
  .rz-schema { background: var(--regel); border: 3px dashed var(--regel-rand); border-radius: 16px; padding: 8px 12px; margin: 0 auto 14px; max-width: 700px; }
  .rz-schema > b { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; color: var(--regel-titel); }
  .rz-zeile { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: clamp(15px, 3.6vw, 19px); font-weight: 800; margin: 4px 0; }
  .rz-zeile .rz-z { font-size: 1.35em; color: var(--text); padding: 0 1px; }
  .rz-zeile .rz-b, .rz-zeile .rz-r { border-radius: 8px; padding: 2px 8px; color: var(--text); }
  .rz-zeile .rz-b { background: var(--aktiv); border: 2px solid var(--deko-6); }
  .rz-zeile .rz-r { background: var(--k-feld); border: 2px solid var(--deko-2); }

  /* Satz: Wörter mit Lücken dazwischen; jede Lücke nimmt ein oder mehrere Zeichen auf. */
  .satz { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; row-gap: 12px; max-width: 760px; margin: 0 auto 16px;
    font-size: clamp(20px, 4.8vw, 30px); font-weight: 800; line-height: 1.2; }
  .satz .rz-wort { padding: 0 1px; }
  .satz .rz-luecke { font: inherit; color: var(--knopf); cursor: pointer; min-width: 24px; height: 1.8em; margin: 0 1px; padding: 0 3px;
    border: 2px dashed var(--rand); border-radius: 8px; background: transparent; display: inline-flex; align-items: center; justify-content: center; }
  .satz .rz-luecke.aktiv { border: 3px solid var(--knopf); background: var(--aktiv); }
  .satz .rz-luecke.voll { border-style: solid; border-color: transparent; font-size: 1.15em; }
  .satz .rz-luecke.voll.aktiv { border-color: var(--knopf); }
  .satz .rz-luecke.richtig { color: var(--gut); border-color: transparent; background: transparent; }
  .satz .rz-luecke:focus-visible { outline: 3px solid var(--knopf); }

  /* Stufe 1: gesprochene Wörter antippen */
  .satz .rz-tipp { font: inherit; color: var(--text); cursor: pointer; margin: 0 3px; padding: 2px 6px; border: 2px solid var(--rand); border-radius: 10px;
    background: var(--k-feld); box-shadow: 0 3px 0 var(--rand); }
  .satz .rz-tipp.gewaehlt { background: var(--hinweis-hell); border-color: var(--deko-2); }
  .satz .rz-tipp.richtig { background: var(--gut-hell); border-color: var(--gut); }

  .rz-tasten { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 0 auto 14px; max-width: 560px; }
  .rz-taste { font: inherit; font-size: 34px; font-weight: 900; min-width: 58px; min-height: 58px; padding: 0 8px; border: none; border-radius: 14px;
    background: var(--k-feld); color: var(--text); box-shadow: 0 5px 0 var(--rand), 0 7px 14px rgba(45, 48, 71, .1); cursor: pointer; }
  .rz-taste.weg { font-size: 26px; background: var(--hinweis-hell); }
  .rz-pruefen { display: flex; justify-content: center; }
</style>
</head>
<body>
<header class="kopf">

  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>

<script src="../gemeinsam/entwicklung.js"></script>

<script>
"use strict";
// Lehrplan SG D.4.F.1.d (Grundanspruch 2. Zyklus): Zeichen der direkten Rede mit Schema setzen.
// Basisklasse 5. s1 4. Klasse (D.4.F.1.c sinngemäss: direkte Rede im Text erkennen — die gesprochenen
// Wörter antippen), s2 Begleitsatz vorne, s3 Begleitsatz hinten (Komma, kein Punkt am Ende der Rede),
// s4 beides gemischt, s5 6. Klasse: Frage- und Ausrufesätze in der Rede (? und ! bleiben), s6 Königsstufe:
// Begleitsatz in der Mitte („Morgen“, sagt sie, „gehen wir baden.“), ohne Schema, knappe Hinweise.
// Bezug: Die Satz-Reparatur übt Satzanfang und Satzzeichen am Ende, die Fehler-Lupe einzelne falsch
// geschriebene Wörter, die Komma-Jagd Kommas bei Aufzählungen und Verbgruppen. Hier geht es nur um die
// Zeichen der direkten Rede; das Komma kommt nur als Teil des Schemas vor.
// Annahme: Anführungszeichen nach Schweizer Schulschrift „…“ (unten 99, oben 66), mit dem Lehrmittel abzugleichen.
// Inhalte nur aus woerter.js und nur aus freien Listen (LS.freieListen).

const { waehle, el } = LS;
const ID = "rede-zeichen";

const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : Object.keys(REDE_SAETZE));

const RZ_ZEICHEN = ":„“,.?!";
const VOR_RE = /^[:„“,.?!]*/;
const NACH_RE = /[:„“,.?!]*$/;

/** „Ich komme“, sagt Lea, „gleich mit.“ → { woerter: ["Ich", …], luecken: ["„", "", "“,", …] } — luecken[i] steht vor woerter[i]. */
function zerlegeSatz(satz) {
  const woerter = [];
  const luecken = [""];
  for (const t of satz.split(" ")) {
    const vor = t.match(VOR_RE)[0];
    const rest = t.slice(vor.length);
    const nach = rest.match(NACH_RE)[0];
    luecken[luecken.length - 1] += vor;
    woerter.push(rest.slice(0, rest.length - nach.length));
    luecken.push(nach);
  }
  return { woerter, luecken };
}

/** Indizes der gesprochenen Wörter (zwischen „ und “). */
function redeIndizes(luecken, n) {
  const r = [];
  let drin = false;
  for (let i = 0; i < n; i++) {
    if (luecken[i].includes("“")) drin = false;
    if (luecken[i].includes("„")) drin = true;
    if (drin) r.push(i);
  }
  return r;
}

/** Satz aus der Liste hinten mit „|“ → Begleitsatz in der Mitte. */
function inDieMitte(roh) {
  const m = roh.match(/^„(.+?) \| (.+?)([?!]?)“, (.+)\.$/);
  return m ? `„${m[1]}“, ${m[4]}, „${m[2]}${m[3] || "."}“` : null;
}
const ohneStrich = roh => roh.replace(" | ", " ");

/** Satzart der Rede: aussage, frage oder ausruf. */
function typVon(satz) {
  const vorZu = satz.match(/([.?!])“/g) || [];
  const z = vorZu.length ? vorZu[vorZu.length - 1][0] : ".";
  return z === "?" ? "frage" : z === "!" ? "ausruf" : "aussage";
}

/** Alle Sätze mit Art: vorne, hinten, mitte (nur aus hinten mit „|“). */
function saetzeAus(liste) {
  if (!FREI.has(liste)) return [];
  return REDE_SAETZE[liste].flatMap(roh => {
    const r = [{ art: liste, liste, roh, satz: liste === "hinten" ? ohneStrich(roh) : roh }];
    if (liste === "hinten" && roh.includes(" | ")) r.push({ art: "mitte", liste, roh, satz: inDieMitte(roh) });
    return r;
  }).map(s => ({ ...s, typ: typVon(s.satz) }));
}

const GRUND = ":„“,.";
// Je Stufe: Arten, Satztypen, Zeichen auf den Tasten, Schema und Hinweise.
const STUFE = {
  s1: { modus: "erkennen", arten: ["vorne", "hinten"], typen: ["aussage", "frage", "ausruf"] },
  s2: { arten: ["vorne"], typen: ["aussage"], tasten: GRUND, schema: ["vorne"] },
  s3: { arten: ["hinten"], typen: ["aussage"], tasten: GRUND, schema: ["hinten"] },
  s4: { arten: ["vorne", "hinten"], typen: ["aussage"], tasten: GRUND, schema: ["vorne", "hinten"] },
  s5: { arten: ["vorne", "hinten"], typen: ["aussage", "frage", "ausruf"], tasten: RZ_ZEICHEN, schema: ["vorne", "hinten", "frage"], gewicht: { frage: 0.6 } },
  s6: { arten: ["vorne", "hinten", "mitte"], typen: ["aussage", "frage", "ausruf"], tasten: RZ_ZEICHEN, gewicht: { mitte: 0.5 }, knapp: true },
};

/** Freie Sätze einer Stufe, nach Gruppe: { mitte: [...], frage: [...], rest: [...] } je nach Gewicht. */
function kandidaten(stufe) {
  const p = STUFE[stufe];
  return [...saetzeAus("vorne"), ...saetzeAus("hinten")].filter(s => p.arten.includes(s.art) && p.typen.includes(s.typ));
}
const angeboten = stufe => kandidaten(stufe).length > 0 && (stufe !== "s6" || FREI.has("hinten"));

// ---------- Aufgaben als Daten ----------

function aufgabeErzeugen(stufe) {
  if (!angeboten(stufe)) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  const p = STUFE[stufe];
  let pool = kandidaten(stufe);
  const g = p.gewicht || {};
  if (g.mitte) {
    const mitte = pool.filter(s => s.art === "mitte");
    pool = mitte.length && Math.random() < g.mitte ? mitte : pool.filter(s => s.art !== "mitte");
  } else if (g.frage) {
    const fa = pool.filter(s => s.typ !== "aussage");
    if (fa.length && Math.random() < g.frage) pool = fa;
    else if (pool.length > fa.length) pool = pool.filter(s => s.typ === "aussage");
  }
  const s = waehle(pool);
  return { ...s, ...zerlegeSatz(s.satz) };
}

function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!angeboten(stufe)) m.push("Stufe mit den freien Listen nicht angeboten");
  if (!FREI.has(a.liste)) m.push(`Satz aus der Liste ${a.liste}, die nicht frei ist`);
  if (!REDE_SAETZE[a.liste]?.includes(a.roh)) m.push("Satz nicht in der Liste");
  if (!p.arten.includes(a.art)) m.push(`Art ${a.art} nicht in der Stufe`);
  if (!p.typen.includes(a.typ)) m.push(`Satztyp ${a.typ} nicht in der Stufe`);
  if (/ß/.test(a.satz)) m.push("ß im Satz");
  if (/["']/.test(a.satz)) m.push("gerade Anführungszeichen im Satz");
  const form = {
    vorne: /^[A-ZÄÖÜ][^„“:,|]*: „[A-ZÄÖÜ][^„“:,|]*[.?!]“$/,
    hinten: /^„[A-ZÄÖÜ][^„“:,.|]*[?!]?“, [a-zäöü][^„“:,.|]*\.$/,
    mitte: /^„[A-ZÄÖÜ][^„“:,.|]*“, [a-zäöü][^„“:,.|]*, „[^„“:,.|]+[.?!]“$/,
  }[a.art];
  if (!form || !form.test(a.satz)) m.push(`Satz passt nicht zum Schema ${a.art}: ${a.satz}`);
  if (a.woerter.length + 1 !== a.luecken.length) m.push("Lücken passen nicht zu den Wörtern");
  if (a.woerter.some(w => !w || /[:„“,.?!|]/.test(w))) m.push("leeres Wort oder Zeichen im Wort");
  if (a.woerter.join("") !== a.satz.replace(/[ :„“,.?!]/g, "")) m.push("Wörter ergeben den Satz nicht");
  const alle = a.luecken.join("");
  const anz = z => [...alle].filter(c => c === z).length;
  const paare = a.art === "mitte" ? 2 : 1;
  if (anz("„") !== paare || anz("“") !== paare) m.push("Anführungszeichen nicht paarweise");
  if (a.art === "vorne" && (anz(":") !== 1 || anz(",") !== 0)) m.push("Begleitsatz vorne: Doppelpunkt fehlt oder Komma zu viel");
  if (a.art === "hinten" && (anz(":") !== 0 || anz(",") !== 1)) m.push("Begleitsatz hinten: genau ein Komma, kein Doppelpunkt");
  if (a.art === "mitte" && (anz(":") !== 0 || anz(",") !== 2)) m.push("Begleitsatz in der Mitte: zwei Kommas");
  if (p.tasten && [...alle].some(c => !p.tasten.includes(c))) m.push("Zeichen gebraucht, das auf keiner Taste steht");
  if (a.luecken.some(l => l.length > 3)) m.push("mehr als drei Zeichen in einer Lücke");
  if (p.modus === "erkennen" && !redeIndizes(a.luecken, a.woerter.length).length) m.push("keine gesprochenen Wörter");
  return m;
}

// ---------- Darstellung ----------

const SCHEMA = {
  vorne: [["b", "Begleitsatz"], ["z", ":"], ["z", "„"], ["r", "Rede"], ["z", ".“"]],
  hinten: [["z", "„"], ["r", "Rede"], ["z", "“,"], ["b", "Begleitsatz"], ["z", "."]],
  frage: [["z", "„"], ["r", "Frage"], ["z", "?“,"], ["b", "Begleitsatz"], ["z", "."]],
};
const REGEL = {
  vorne: "Begleitsatz vorne: Nach dem Begleitsatz steht ein Doppelpunkt. Die Rede steht zwischen „ unten und “ oben; ihr Satzzeichen kommt vor das “.",
  hinten: "Begleitsatz hinten: Die Rede steht zwischen „ und “, danach ein Komma. Der Punkt am Ende der Rede fällt weg; ? und ! bleiben. Der Punkt kommt ans Ende des Begleitsatzes.",
  mitte: "Begleitsatz in der Mitte: Er steht zwischen zwei Kommas. Beide Teile der Rede bekommen ihr eigenes „ und “.",
};

function schemaKarte(arten) {
  const karte = el("div", { class: "rz-schema" }, el("b", { text: "Schema" }));
  for (const art of arten) {
    const zeile = el("div", { class: "rz-zeile" });
    for (const [k, t] of SCHEMA[art]) zeile.append(el("span", { class: `rz-${k}`, text: t }));
    karte.append(zeile);
  }
  return karte;
}

/** Stufe 1: Welche Wörter werden gesprochen? Satz ohne Anführungszeichen, Wörter zum Antippen. */
function erkennen(ctx, a) {
  const f = ctx.flaeche;
  const rede = redeIndizes(a.luecken, a.woerter.length);
  const loesung = a.satz;
  ctx.loesung(loesung);
  ctx.schritte(rede.length + 1);
  f.append(el("div", { class: "frage", html: "Was sagt die Person? <b>Tippe alle gesprochenen Wörter an.</b>" }));
  const ohne = a.satz.replace(/[„“]/g, "").split(" ");
  const satz = el("div", { class: "satz", "aria-label": "Satz ohne Anführungszeichen" });
  const knoepfe = ohne.map(t => {
    const k = el("button", { type: "button", class: "rz-tipp", text: t, "aria-pressed": "false" });
    k.addEventListener("click", () => {
      if (ctx.vorbei()) return;
      const an = !k.classList.contains("gewaehlt");
      k.classList.toggle("gewaehlt", an);
      k.setAttribute("aria-pressed", String(an));
      LS.ton("tipp");
    });
    satz.append(k);
    return k;
  });
  f.append(satz);
  const pruefen = el("button", { type: "button", class: "knopf gruen", text: "Prüfen ✓" });
  pruefen.addEventListener("click", () => {
    if (ctx.vorbei()) return;
    const gewaehlt = knoepfe.map((k, i) => (k.classList.contains("gewaehlt") ? i : -1)).filter(i => i >= 0);
    const fehlen = rede.filter(i => !gewaehlt.includes(i)).length;
    const zuviel = gewaehlt.filter(i => !rede.includes(i)).length;
    if (!fehlen && !zuviel) {
      knoepfe.forEach((k, i) => k.classList.toggle("richtig", rede.includes(i)));
      ctx.richtig(`Richtig: ${loesung}`);
      return;
    }
    const teile = [];
    if (zuviel) teile.push(zuviel === 1 ? "Ein Wort gehört zum Begleitsatz, nicht zur Rede." : `${zuviel} Wörter gehören zum Begleitsatz, nicht zur Rede.`);
    if (fehlen) teile.push(fehlen === 1 ? "Ein gesprochenes Wort fehlt noch." : `Es fehlen noch ${fehlen} gesprochene Wörter.`);
    teile.push("Der Begleitsatz sagt, wer spricht (sagt Lea, fragt Tim). Alles andere sagt die Person selbst.");
    ctx.falsch(teile.join(" "), loesung);
  });
  f.append(el("div", { class: "rz-pruefen" }, pruefen));
}

/** Stufen 2–6: Zeichen in die Lücken setzen. Erst eine Lücke antippen, dann die Zeichen. */
function zeichenSetzen(ctx, a, p) {
  const f = ctx.flaeche;
  const loesung = a.satz;
  ctx.loesung(loesung);
  const voll = a.luecken.map((l, i) => (l ? i : -1)).filter(i => i >= 0);
  ctx.schritte(voll.length + a.luecken.join("").length + 1 - (a.luecken[0] ? 1 : 0));
  if (p.schema) f.append(schemaKarte(p.schema));
  f.append(el("div", { class: "frage", text: "Setze die Zeichen der direkten Rede: erst eine Lücke antippen, dann die Zeichen." }));

  const inhalt = a.luecken.map(() => "");
  let aktiv = 0;
  const satz = el("div", { class: "satz", "aria-label": "Satz ohne Zeichen" });
  const luecken = a.luecken.map((_, i) => {
    const l = el("button", { type: "button", class: "rz-luecke", "aria-label": i === 0 ? "Lücke am Anfang" : `Lücke nach „${a.woerter[i - 1]}“` });
    l.addEventListener("click", () => { if (!ctx.vorbei()) { aktiv = i; zeige(); LS.ton("tipp"); } });
    return l;
  });
  a.woerter.forEach((w, i) => satz.append(luecken[i], el("span", { class: "rz-wort", text: w })));
  satz.append(luecken[a.woerter.length]);
  f.append(satz);

  function zeige() {
    luecken.forEach((l, i) => {
      l.textContent = inhalt[i];
      l.classList.toggle("voll", !!inhalt[i]);
      l.classList.toggle("aktiv", i === aktiv && !ctx.vorbei());
    });
  }

  const tasten = el("div", { class: "rz-tasten" });
  for (const z of p.tasten) {
    const t = el("button", { type: "button", class: "rz-taste", text: z, "aria-label": `Zeichen ${z}` });
    t.addEventListener("click", () => {
      if (ctx.vorbei() || inhalt[aktiv].length >= 3) return;
      inhalt[aktiv] += z;
      LS.ton("tipp");
      zeige();
    });
    tasten.append(t);
  }
  const weg = el("button", { type: "button", class: "rz-taste weg", text: "⌫", "aria-label": "Letztes Zeichen der Lücke löschen" });
  weg.addEventListener("click", () => { if (!ctx.vorbei()) { inhalt[aktiv] = inhalt[aktiv].slice(0, -1); zeige(); } });
  tasten.append(weg);
  f.append(tasten);
  LS.kurztasten(tasten); // die Zeichen auf ihren festen Tasten, ⌫ auf der Rücktaste; die Lücken bleiben zum Antippen

  const regel = REGEL[a.art];
  const pruefen = el("button", { type: "button", class: "knopf gruen", text: "Prüfen ✓" });
  pruefen.addEventListener("click", () => {
    if (ctx.vorbei()) return;
    const falsch = a.luecken.filter((l, i) => inhalt[i] !== l).length;
    if (!falsch) {
      ctx.richtig(`Richtig: ${loesung}`);
      luecken.forEach(l => { l.classList.remove("aktiv"); l.classList.add("richtig"); });
      return;
    }
    const teile = [];
    if (p.knapp) teile.push("Noch nicht ganz.");
    else {
      teile.push(falsch === 1 ? "An einer Stelle stimmt es noch nicht." : `An ${falsch} Stellen stimmt es noch nicht.`);
      const sortiert = s => [...s].sort().join("");
      if (a.luecken.some((l, i) => inhalt[i] !== l && sortiert(inhalt[i]) === sortiert(l))) teile.push("Achte auch auf die Reihenfolge der Zeichen.");
    }
    teile.push(regel);
    ctx.falsch(teile.join(" "), loesung);
    if (ctx.vorbei()) zeige();
  });
  f.append(el("div", { class: "rz-pruefen" }, pruefen));
  zeige();
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): woran man Begleitsatz und Rede erkennt, dann die
 * Regel — nie welche Wörter gesprochen werden und nie die Zeichen an einer bestimmten Lücke.
 */
function tippsFuer(a, p) {
  if (p.modus === "erkennen") return ["Der Begleitsatz sagt, wer spricht: sagt Lea, fragt Tim, ruft Mama.",
    `Schau ${a.art === "vorne" ? "den Doppelpunkt" : "das Komma"} an: Was steht davor, was danach? Was sagt die Person selbst?`];
  const t = ["Such zuerst den Begleitsatz: Er sagt, wer spricht. Steht er vorne, hinten oder in der Mitte?", REGEL[a.art]];
  if (p.typen.includes("frage")) t.push("Ist die Rede eine Frage oder ein Ausruf, bleiben ? und ! stehen — auch wenn der Begleitsatz hinten kommt.");
  return t;
}

// ---------- Spiel ----------

const nurAngebotene = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => angeboten(s)));

LS.spiel({
  id: ID,
  einleitung: "Wenn jemand spricht, braucht der Satz besondere Zeichen: Lea sagt: „Ich komme mit.“ Setz sie richtig — das Schema hilft dir!",
  hilfe: stufe => (STUFE[stufe]?.modus === "erkennen"
    ? "Tippe alle Wörter an, die die Person selbst sagt, dann auf „Prüfen ✓“. Nochmals antippen nimmt ein Wort wieder weg."
    : "Tippe zuerst auf eine Lücke zwischen den Wörtern, dann unten auf die Zeichen. Eine Lücke kann zwei Zeichen brauchen; ⌫ löscht das letzte Zeichen der Lücke. Am Schluss „Prüfen ✓“."
      + (STUFE[stufe]?.schema ? " Das Schema oben zeigt dir, wie es geht." : "")),
  anzahl: 8,
  stufen: nurAngebotene({
    s1: "Was wird gesprochen? Die Wörter der Rede antippen.",
    s2: "Begleitsatz vorne: Lea sagt: „Ich komme mit.“",
    s3: "Begleitsatz hinten: „Ich komme mit“, sagt Lea. (Lehrplan 5. Klasse)",
    s4: "Begleitsatz vorne oder hinten — gemischt.",
    s5: "Fragen und Ausrufe in der Rede: „Kommst du mit?“, fragt Tim.",
    s6: "Endgegner: Begleitsatz in der Mitte — „Morgen“, sagt sie, „gehen wir baden.“",
  }),

  aufgabe(ctx) {
    const p = STUFE[ctx.stufe];
    if (ctx.nr === 0) ctx.sag(p.modus === "erkennen"
      ? "Der Begleitsatz sagt, wer spricht. Die Rede ist das, was die Person sagt."
      : "Tippe auf eine Lücke zwischen den Wörtern und dann auf die Zeichen. Eine Lücke kann auch zwei Zeichen brauchen.");
    const a = aufgabeErzeugen(ctx.stufe);
    const arten = new Set(kandidaten(ctx.stufe).map(s => s.art));
    if (arten.size > 1) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a, p));
    if (p.modus === "erkennen") erkennen(ctx, a);
    else zeichenSetzen(ctx, a, p);
  },
});
</script>
