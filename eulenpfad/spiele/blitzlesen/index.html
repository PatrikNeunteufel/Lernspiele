<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blitzlesen</title>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .tafel { min-height: 120px; display: grid; place-items: center; background: #2d3047; color: #fff; border-radius: 20px; margin: 4px 0 12px; padding: 12px; }
  .tafel .blitz { font-size: clamp(38px, 9vw, 60px); font-weight: 900; letter-spacing: 2px; }
  .tafel .leer { font-size: 54px; opacity: .5; }
  .wahl-knopf .reihe { font-size: clamp(22px, 5vw, 30px); letter-spacing: -2px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>⚡ Blitzlesen</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="../anlaut-angel/woerter.js"></script>
<script src="../buchstaben-zwillinge/woerter.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.2.A.1: b Buchstaben zu kurzen Wörtern verbinden, c (Grundanspruch 1. Zyklus)
// „vertraute Wörter auf einen Blick erkennen (Sichtwortschatz)“, f vertraute Wortbilder schnell
// erkennen. Das Wort blitzt kurz auf — nochmal zeigen geht immer.

const { zufall, waehle, mische, el } = LS;

const WOERTER = ANLAUT_WOERTER.map(([wort, bild]) => ({ wort, bild }));
const mitLaenge = (min, max) => WOERTER.filter(w => w.wort.length >= min && w.wort.length <= max);

// Freigabe (Entscheid L4 a): Inhalte nur aus Listen, die der Spieler üben darf (Aufsicht: alle).
// Kennt der Katalog die Listen nicht, gilt alles als frei — dann entscheidet die Freigabe des Spiels.
const LISTEN = ["einzelwoerter", "aehnliche-woerter", "wortgruppen"];
const FREI = new Set(LS.spielListen("blitzlesen").length ? LS.freieListen("blitzlesen") : LISTEN);

const ARTEN = {
  bild(min, max, n) {
    const w = waehle(mitLaenge(min, max));
    // Ablenker mit anderem Bild und anderem Anfang, damit nur das Lesen entscheidet
    const andere = mische(WOERTER.filter(x => x.bild !== w.bild && x.wort[0] !== w.wort[0])).slice(0, n - 1);
    return { art: "bild", liste: "einzelwoerter", text: w.wort, richtig: w, optionen: mische([w, ...andere]) };
  },
  aehnlich() {
    const paar = waehle(WORTPAARE);
    const [[wort], ...andere] = paar;
    const gezeigt = waehle([wort, ...andere]);
    return { art: "wort", liste: "aehnliche-woerter", paar, text: gezeigt, richtig: gezeigt, optionen: mische([wort, ...andere]) };
  },
  gruppe() {
    const ding = waehle(ZAEHLDINGE);
    const [einz, mehr, ein, bild] = ding;
    const n = zufall(1, 5);
    const text = n === 1 ? `${ein} ${einz}` : `${ZAHLWOERTER[n]} ${mehr}`;
    const anders = waehle(ZAEHLDINGE.filter(d => d[0] !== einz));
    const m = waehle([1, 2, 3, 4, 5].filter(x => x !== n));
    const richtig = bild.repeat(n);
    return { art: "gruppe", liste: "wortgruppen", dinge: [ding, anders], text, richtig, optionen: mische([richtig, anders[3].repeat(n), bild.repeat(m)]) };
  },
};

// Je Stufe: Aufgabenarten mit ihrer Liste und wie lange das Wort sichtbar bleibt (ms)
const STUFE = {
  s1: { arten: [["einzelwoerter", () => ARTEN.bild(2, 4, 3)]], zeit: 3000 },
  s2: { arten: [["einzelwoerter", () => ARTEN.bild(3, 5, 4)]], zeit: 1800 },
  s3: { arten: [["einzelwoerter", () => ARTEN.bild(4, 8, 4)]], zeit: 1200 },
  s4: { arten: [["aehnliche-woerter", ARTEN.aehnlich], ["einzelwoerter", () => ARTEN.bild(5, 8, 4)]], zeit: 1000 },
  s5: { arten: [["wortgruppen", ARTEN.gruppe], ["aehnliche-woerter", ARTEN.aehnlich]], zeit: 1500 },
  // Königsstufe: sehr kurz sichtbar, lange und ähnliche Wörter und Wortgruppen gemischt
  s6: { arten: [["einzelwoerter", () => ARTEN.bild(6, 8, 5)], ["aehnliche-woerter", ARTEN.aehnlich], ["wortgruppen", ARTEN.gruppe]], zeit: 700 },
};

/** Aufgabenarten der Stufe, deren Liste frei ist; leer = Stufe wird nicht angeboten. */
const moeglich = stufe => STUFE[stufe].arten.filter(([l]) => FREI.has(l)).map(([, neu]) => neu);
const nurMoegliche = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => moeglich(s).length));

function aufgabeErzeugen(stufe) {
  const arten = moeglich(stufe);
  if (!arten.length) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  return waehle(arten)();
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a) {
  const m = [];
  const ausListe = a.art === "bild" ? a.optionen.every(o => WOERTER.includes(o))
    : a.art === "wort" ? WORTPAARE.includes(a.paar) : a.dinge.every(d => ZAEHLDINGE.includes(d));
  if (!FREI.has(a.liste) || !ausListe) m.push("Inhalt nicht aus einer freien Liste");
  if (!a.optionen.includes(a.richtig)) m.push("richtige Antwort fehlt");
  const schluessel = a.optionen.map(o => (typeof o === "string" ? o : o.wort));
  if (new Set(schluessel).size !== schluessel.length) m.push("Auswahl doppelt");
  if (a.art === "bild" && new Set(a.optionen.map(o => o.bild)).size !== a.optionen.length) m.push("zwei gleiche Bilder");
  return m;
}

/** Tipps vor dem Antworten (ctx.tipp, LERN_Session9): wie man liest — nie das Wort selbst. */
const BLITZ_TIPP = "Tipp auf «⚡ Nochmal blitzen» und schau genau hin.";
function tippsFuer(a) {
  if (a.art === "bild") return [BLITZ_TIPP, "Merk dir den ersten Buchstaben. Welches Bild beginnt so?"];
  if (a.art === "wort") return [BLITZ_TIPP, "Die Wörter sehen fast gleich aus. Achte auf jeden Buchstaben, auch in der Mitte."];
  return [BLITZ_TIPP, "Lies zuerst die Zahl, dann das Ding: Wie viele, und was?"];
}

LS.spiel({
  id: "blitzlesen",
  hilfe: "Ein Wort blitzt kurz auf der Tafel auf. Lies es und tippe das passende Bild oder Wort an. Mit «⚡ Nochmal blitzen» siehst du es noch einmal.",
  einleitung: "Ein Wort blitzt auf — und ist gleich wieder weg! Lies schnell und tipp auf das passende Bild.",
  anzahl: 10,
  stufen: nurMoegliche({
    s1: "Kurze Wörter, drei Sekunden: Maus, Bus, Hut.",
    s2: "Etwas längere Wörter, kürzer sichtbar.",
    s3: "Lange Wörter, ganz kurz: Pinguin, Zitrone.",
    s4: "Genau lesen: Hund, Hand oder Mund?",
    s5: "Wortgruppen: drei Birnen, ein Stern.",
    s6: "Blitzschnell: lange Wörter, ähnliche Wörter und Wortgruppen.",
  }),

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (moeglich(ctx.stufe).length > 1) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    const zeit = STUFE[ctx.stufe].zeit;
    const tafel = el("div", { class: "tafel", "aria-live": "polite" });
    // vorbei (aus LS.losGehts): Antworten erst nach dem ersten Blitz zeigen (Bemerkung 7, LERN_Session11)
    const zeige = (_, vorbei) => {
      tafel.replaceChildren(el("div", { class: "blitz", text: a.text }));
      clearTimeout(uhr);
      uhr = setTimeout(() => { tafel.replaceChildren(el("div", { class: "leer", text: "👀" })); if (typeof vorbei === "function") vorbei(); }, zeit);
    };
    let uhr = null;
    ctx.flaeche.append(tafel, el("div", { class: "hoer-zeile" }, el("button", { type: "button", class: "knopf hell", text: "⚡ Nochmal blitzen", onclick: zeige })));
    // Erst wenn das Kind bereit ist: ▶ Los, 3-2-1, dann blitzt das Wort (LS.losGehts, Wunsch Patrik LERN_Session8)
    tafel.replaceChildren(el("div", { class: "leer", text: "👀" }));
    LS.losGehts(ctx, tafel, zeige, { antwortenNachBlitz: true });

    const frage = a.art === "wort" ? "Welches Wort hast du gelesen?" : "Welches Bild passt?";
    ctx.flaeche.append(el("div", { class: "auftrag", text: frage }));
    LS.auswahl(ctx, {
      optionen: a.optionen, richtig: a.richtig, breite: a.art === "gruppe" ? 160 : 120,
      inhalt: o => (a.art === "bild" ? { bild: o.bild } : a.art === "gruppe" ? el("span", { class: "reihe", text: o }) : o),
      hinweis: "Lass es nochmal blitzen und lies ganz genau — Buchstabe für Buchstabe.",
      loesung: `Da stand: «${a.text}».`,
      lob: `Richtig: «${a.text}» ⚡`,
    });
    if (ctx.nr === 0) ctx.sag("Schau genau auf die Tafel — gleich blitzt es!");
  },
});
</script>
</body>
</html>
