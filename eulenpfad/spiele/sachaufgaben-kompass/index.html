<style>
  .kompass-text { background: var(--k-feld); border: 2px solid var(--rand); border-radius: 16px; padding: 12px 14px; margin: 0 0 10px;
    font-size: clamp(17px, 4vw, 22px); line-height: 1.7; }
  .frage { text-align: center; font-size: clamp(18px, 4.2vw, 24px); font-weight: 800; margin: 4px 0 10px; line-height: 1.6; }
  .angabe { display: inline-block; font: inherit; font-weight: 900; color: var(--text); background: var(--karte);
    border: 2px solid var(--rand); border-radius: 10px; padding: 0 8px; margin: 2px 1px; line-height: 1.5; text-align: left; }
  /* Angaben mit Bedeutung (SK1 a) sind länger und dürfen umbrechen; Zahl und Einheit hält ein festes Leerzeichen zusammen (zeigeText) */
  .angabe-mit-zeichen { white-space: nowrap; }
  .angabe-mit-zeichen .angabe { white-space: normal; }
  button.angabe { cursor: pointer; min-height: 40px; border-color: var(--deko-4); }
  button.angabe.gewaehlt { background: var(--deko-4-grund); color: var(--auf-deko-4); }
  button.angabe.richtig { background: var(--gut-hell); border-color: var(--gut); color: var(--text); }
  button.angabe.unnoetig { opacity: .45; }
  button.angabe:disabled { cursor: default; }
  .kompass-tabelle-rahmen { overflow-x: auto; max-width: 100%; margin: 0 0 10px; }
  .kompass-tabelle { margin: 0 auto; border-collapse: collapse; font-size: clamp(15px, 3.6vw, 20px); }
  .kompass-tabelle caption { font-weight: 800; color: var(--text-leise); padding-bottom: 4px; }
  .kompass-tabelle th, .kompass-tabelle td { border: 2px solid var(--rand); padding: 4px clamp(4px, 1.5vw, 10px); text-align: center; background: var(--k-feld); }
  .kompass-tabelle th { color: var(--text-leise); background: var(--karte); }
  .kompass-tabelle td.name { text-align: left; font-weight: 700; }
  .kompass-diagramm { margin: 0 auto 10px; max-width: 520px; }
  .kompass-diagramm .titel { text-align: center; font-weight: 800; color: var(--text-leise); margin-bottom: 4px; }
  .kompass-saeulen { display: flex; align-items: flex-end; justify-content: space-around; gap: 6px; height: 190px;
    border-bottom: 3px solid var(--text-leise); padding: 0 4px; }
  .kompass-saeule { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .kompass-saeule .balken { width: min(56px, 80%); background: var(--deko-2); border-radius: 8px 8px 0 0; }
  .kompass-saeule .angabe { font-size: clamp(13px, 3.4vw, 18px); padding: 0 4px; margin-bottom: 4px; }
  .kompass-namen { display: flex; justify-content: space-around; gap: 6px; padding: 4px 4px 0; font-weight: 800; }
  .kompass-namen span { flex: 1; text-align: center; min-width: 0; overflow-wrap: anywhere; }
  .kompass-schritt { text-align: center; font-weight: 800; color: var(--text-leise); margin: 10px 0 6px; }
  .kompass-pruefen { display: flex; justify-content: center; margin: 6px 0; }
  .kompass-antwort { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin: 6px 0; }
  .kompass-antwort .anzeige { margin: 0; }
  .kompass-einheiten { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .kompass-einheit { font: inherit; font-weight: 900; font-size: clamp(17px, 4vw, 22px); min-width: 64px; min-height: 52px;
    border: 3px solid var(--rand); border-radius: 12px; background: var(--k-feld); color: var(--text); cursor: pointer; padding: 0 10px; }
  .kompass-einheit.gewaehlt { border-color: var(--deko-4); background: var(--deko-4-grund); color: var(--auf-deko-4); }
  .kompass-weg { --wahl-breite: 210px; }
  .kompass-weg .wahl-knopf { font-size: clamp(18px, 4.2vw, 24px); font-weight: 900; font-variant-numeric: tabular-nums; }
  .kompass-zusammenhang { --wahl-breite: 220px; }
  /* Notizen (NZ1 a): vor der Antwort, je Teilrechnung ein Feld, Beschriftung über dem Feld */
  .nz-zeile { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 4px 10px;
    font-size: 13px; font-weight: 800; color: var(--text-leise); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .nz-zeile label { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
  .nz-zeile > span { align-self: center; }
  .nz-zeile .zw-notiz { font-size: 16px; min-height: 32px; padding: 1px 3px; }
  @media (min-width: 561px) { .kompass-antwort:has(> .nz-zeile) .anzeige { min-width: 180px; } }
  /* Handy: eine eigene Zeile über der Antwort, so niedrig wie möglich */
  @media (max-width: 560px) {
    .kompass-antwort > .nz-zeile { flex-basis: 100%; font-size: 12px; }
    .nz-zeile .zw-notiz { min-height: 30px; }
  }
</style>

<script>
"use strict";
// Lehrplan 21 MA.3.C.2 (Sachsituationen mathematisieren, berechnen, Ergebnisse überprüfen):
//   d (Orientierungspunkt 2. Zyklus) zu Texten, Tabellen und Diagrammen Berechnungen ausführen und
//     Ergebnisse überprüfen → Stufe 1 und 2 (eine Rechnung, zwei Schritte; Rechenweg wählen);
//   e (Grundanspruch Ende 6. Klasse) Proportionalitäten in Sachsituationen erkennen, Informationen aus
//     Sachtexten, Tabellen und Diagrammen verarbeiten → Stufe 3 (wichtige Angaben antippen, Dreisatz)
//     und Stufe 4 (Angaben aus Tabelle oder Säulendiagramm);
//   f (3. Zyklus) proportionale und lineare Zusammenhänge erkennen (Taxipreis aus Grundtaxe und festem
//     Preis je km), Grössen identifizieren und Masseinheiten wählen → Stufe 5 und Königsstufe 6
//     (mehrschrittig, Grundtaxe aus zwei Fahrten).
// Basisklasse 6: s1 5. Klasse, s3 Klassenziel, s5 7. Klasse. Die Sachtexte entstehen im Code aus
// Vorlagen (Rechenstoff, kein Lesestoff zum Prüfen); Zahlen und Preise sind plausible Annahmen, keine
// echten Tarife, und es kommen keine echten Orte mit Distanzen vor.
// Abgrenzung: Rechengeschichten (Basisklasse 2) stellt eine Rechnung aus einer Geschichte, die
// Preis-Tabelle (4) und die Velo-Tabelle (6) üben Wertetabellen, der Taschengeld-Planer (5) ein Budget —
// hier geht es um das Auswählen der Angaben, den Rechenweg und die Einheit.
// Geld nur über LS.geldText, Dezimalzahlen nur über LS.dezimalText; gerechnet wird in Rappen.

const { zahlText, dezimalText, geldText, zufall, waehle, mische, el } = LS;

const fr = rp => geldText(rp, 6);
/** Geldbetrag als Zahl im Term: „12.50“ oder „12“. */
const g = rp => (rp % 100 ? (rp / 100).toFixed(2) : String(rp / 100));
const ORDNUNG = ["ersten", "zweiten", "dritten", "vierten"];
const NAMEN = [["Mia", "Ihre"], ["Noah", "Sein"], ["Lea", "Ihre"], ["Luca", "Sein"], ["Elena", "Ihre"], ["Jonas", "Sein"], ["Sara", "Ihre"], ["Leon", "Sein"]];

// ---------- Bausteine einer Aufgabe ----------

function neu(vorlage) { return { vorlage, saetze: [], frage: [], angaben: [], tabelle: null, diagramm: null, konstanten: [] }; }
/**
 * Eine Angabe im Text: text wie gezeigt, wert wie im Term, noetig: wird für die Rechnung gebraucht.
 * Eine Angabe ist die Zahl **mit dem, wofür sie steht** (Entscheid SK1 a, LERN_Session14, nach einer Meldung: „am
 * letzten Tag gehört doch auch dazu“): Zahl, Einheit und die Wörter, die ihre Rolle tragen — je, pro, am letzten Tag,
 * schon, dazu, für alle. Wer nur die Zahl antippt, weiss nicht, ob sie einmal oder je Tag gilt. In Tabelle und
 * Diagramm nennen Zeile, Spalte und Säule die Bedeutung, dort bleibt die Zahl allein.
 */
function ang(a, text, wert, noetig = true) { a.angaben.push({ text, wert: String(wert), noetig }); return { a: a.angaben.length - 1 }; }

// Überflüssige Angaben je Umfeld: Sätze mit Zahlen, die für die Frage nicht gebraucht werden.
const EXTRA = {
  dauer: a => { const d = 5 * zufall(7, 19); return [ang(a, `Die Fahrt dauert ${d} min`, d, false), "."]; },
  abfahrt: a => { const h = zufall(7, 10); return ["Der Zug ", ang(a, `fährt um ${h} Uhr ab`, h, false), "."]; },
  hoehe: a => { const h = 50 * zufall(18, 32); return ["Das Lagerhaus ", ang(a, `liegt auf ${zahlText(h)} m ü. M.`, h, false), "."]; },
  car: a => { const d = 5 * zufall(9, 30); return [ang(a, `Die Carfahrt dauert ${d} min`, d, false), "."]; },
  zimmer: a => { const z = zufall(4, 9); return ["Im Lagerhaus gibt es ", ang(a, `${z} Schlafräume`, z, false), "."]; },
  start: a => { const h = zufall(8, 10); return ["Die Gruppe ", ang(a, `startet um ${h} Uhr`, h, false), "."]; },
  gaenge: a => { const n = waehle([7, 21, 24, 27]); return ["Jedes Velo hat ", ang(a, `${n} Gänge`, n, false), "."]; },
  pass: a => { const h = 50 * zufall(14, 30); return ["Der höchste Punkt ", ang(a, `liegt auf ${zahlText(h)} m ü. M.`, h, false), "."]; },
  laden: a => { const m = 50 * zufall(4, 18); return ["Der Laden ist ", ang(a, `${m} m vom Lagerhaus entfernt`, m, false), "."]; },
  schluss: a => { const h = zufall(18, 20); return ["Der Laden ", ang(a, `schliesst um ${h} Uhr`, h, false), "."]; },
  einkaufen: a => { const d = 5 * zufall(3, 9); return [ang(a, `Der Einkauf dauert ${d} min`, d, false), "."]; },
  beginn: a => { const h = zufall(8, 9); return ["Der Sporttag ", ang(a, `beginnt um ${h} Uhr`, h, false), "."]; },
  rundbahn: a => { const m = waehle([200, 250, 300, 400]); return [ang(a, `Die Rundbahn ist ${m} m lang`, m, false), "."]; },
  wasser: a => { const p = 10 * zufall(12, 25); return ["Am Stand ", ang(a, `kostet ein Mineralwasser ${fr(p)}`, g(p), false), "."]; },
  taxidauer: a => { const d = zufall(6, 25); return [ang(a, `Die Fahrt dauert ${d} min`, d, false), "."]; },
  plaetze: a => { const n = waehle([4, 6, 8]); return ["Im Taxi ", ang(a, `haben ${n} Personen Platz`, n, false), "."]; },
  tour: a => { const d = zufall(18, 45); return [ang(a, `Die Tour ist ${d} km lang`, d, false), "."]; },
  verleih: a => { const h = zufall(8, 10); return ["Der Verleih ", ang(a, `öffnet um ${h} Uhr`, h, false), "."]; },
  laenge: a => { const m = zufall(2, 4); return [ang(a, `Das Becken ist ${m} m lang`, m, false), "."]; },
  waerme: a => { const t = zufall(24, 33); return ["Draussen ist es ", ang(a, `${t} °C warm`, t, false), "."]; },
  kochen: a => { const d = zufall(8, 12); return ["Die Teigwaren ", ang(a, `kochen ${d} min`, d, false), "."]; },
  paket: a => { const kg = zufall(2, 9); return [ang(a, `Das Paket wiegt ${kg} kg`, kg, false), "."]; },
  lauf: a => { const d = 5 * zufall(6, 12); return [ang(a, `Der Lauf dauert ${d} min`, d, false), "."]; },
};

/** n überflüssige Sätze aus den genannten Arten, an zufälligen Stellen nach dem ersten Satz. */
function extras(a, arten, n) {
  for (const art of mische(arten).slice(0, n)) {
    a.saetze.splice(zufall(1, a.saetze.length), 0, EXTRA[art](a));
  }
}

const name = () => waehle(NAMEN);

// ---------- Vorlagen ----------
// Jede Vorlage füllt: saetze, frage, angaben, term (ASCII: * / + - und Klammern), wege (term zuerst,
// dann typische falsche Wege), ergebnis (ganzzahlig, Geld in Rappen), einheit, einheiten, tipp,
// bei Bedarf plan (zweiter Hinweis), loesung (eigener Lösungstext), zusammenhang (Stufe 5).

const VORLAGEN = {
  // --- eine Rechnung (Stufe 1) ---
  billette1(x) {
    const a = neu("billette1"), n = zufall(16, 26), p = zufall(6, 15) * 100;
    a.saetze = [["Die Klasse fährt mit dem Zug ins Klassenlager."], ["Es fahren ", ang(a, `${n} Kinder`, n), " mit."],
      [ang(a, `Ein Kinderbillett kostet ${fr(p)}`, g(p)), "."]];
    a.frage = ["Wie viel kosten alle Kinderbillette zusammen?"];
    a.term = `${n}*${g(p)}`;
    a.wege = [a.term, `${n}+${g(p)}`, `${n}-${g(p)}`];
    return geld(a, n * p, ["Kinder", "min"], "Jedes Kind braucht ein Billett. Wie oft musst du den Preis zählen?");
  },
  velo1summe(x) {
    const a = neu("velo1summe"); let v = zufall(14, 32), n = zufall(10, 28);
    if (v === n) n++;
    a.saetze = [["Die Klasse macht eine Velotour."], ["Sie fährt ", ang(a, `am Vormittag ${v} km`, v), " und ", ang(a, `am Nachmittag ${n} km`, n), "."]];
    a.frage = ["Wie weit fährt sie an diesem Tag?"];
    a.term = `${v}+${n}`;
    a.wege = [a.term, v > n ? `${v}-${n}` : `${n}-${v}`, `${v}*${n}`];
    return menge(a, v + n, "km", ["m", "min"], "Gesucht ist die ganze Strecke des Tages.");
  },
  velo1mal(x) {
    const a = neu("velo1mal"), t = zufall(3, 5), d = 2 * zufall(12, 24);
    a.saetze = [["Die Klasse macht eine Velotour."], ["Sie fährt ", ang(a, `${t} Tage lang`, t), " ", ang(a, `jeden Tag ${d} km`, d), "."]];
    a.frage = ["Wie weit fährt sie insgesamt?"];
    a.term = `${t}*${d}`;
    a.wege = [a.term, `${t}+${d}`, `${d}-${t}`];
    return menge(a, t * d, "km", ["m", "Tage"], "Jeden Tag kommt dieselbe Strecke dazu.");
  },
  rueckgeld1(x) {
    const a = neu("rueckgeld1"), s = waehle([50, 100]), k = zufall(12, s - 8);
    a.saetze = [["Die Klasse kauft für den Wandertag ein."], [ang(a, `Der Einkauf kostet ${fr(k * 100)}`, k), "."],
      ["Die Lehrerin ", ang(a, `bezahlt mit ${fr(s * 100)}`, s), "."]];
    a.frage = ["Wie viel Rückgeld bekommt sie?"];
    a.term = `${s}-${k}`;
    a.wege = [a.term, `${s}+${k}`, `${s}*${k}`];
    return geld(a, (s - k) * 100, ["kg", "min"], "Rückgeld ist das, was vom bezahlten Geld übrig bleibt.");
  },
  znueni1(x) {
    const a = neu("znueni1"), n = zufall(4, 9), p = 10 * zufall(18, 39);
    a.saetze = [["Für das Znüni kauft die Klasse ein."], ["Sie nimmt ", ang(a, `${n} Packungen Knäckebrot`, n), "."],
      [ang(a, `Eine Packung kostet ${fr(p)}`, g(p)), "."]];
    a.frage = ["Wie viel kostet das Knäckebrot zusammen?"];
    a.term = `${n}*${g(p)}`;
    a.wege = [a.term, `${n}+${g(p)}`, `${g(p)}/${n}`];
    return geld(a, n * p, ["Packungen", "kg"], "Jede Packung kostet gleich viel. Wie oft kommt der Preis vor?");
  },
  teams1(x) {
    const a = neu("teams1"), k = zufall(4, 8), t = zufall(6, 14), n = k * t;
    a.saetze = [["Am Sporttag machen ", ang(a, `${n} Kinder`, n), " mit."], ["Sie bilden ", ang(a, `Teams mit je ${k} Kindern`, k), "."]];
    a.frage = ["Wie viele Teams gibt es?"];
    a.term = `${n}/${k}`;
    a.wege = [a.term, `${n}*${k}`, `${n}-${k}`];
    return menge(a, t, "Teams", ["Kinder", "min"], "Die Kinder werden in gleich grosse Gruppen aufgeteilt.");
  },
  staffel1(x) {
    const a = neu("staffel1"), k = zufall(4, 8), m = waehle([50, 60, 80, 100]);
    a.saetze = [["Am Sporttag läuft jedes Team eine Staffel."], ["Im Team laufen ", ang(a, `${k} Kinder nacheinander`, k), " ", ang(a, `je ${m} m`, m), "."]];
    a.frage = ["Wie lang ist die ganze Staffel?"];
    a.term = `${k}*${m}`;
    a.wege = [a.term, `${k}+${m}`, `${m}-${k}`];
    return menge(a, k * m, "m", ["km", "min"], "Jedes Kind läuft gleich weit. Wie viele Teilstücke sind es?");
  },

  // --- zwei Schritte (Stufe 2; mit überflüssigen Angaben Stufe 3) ---
  billette2(x) {
    const a = neu("billette2"), n = zufall(16, 26), l = zufall(2, 3), p = 20 * zufall(32, 74), q = 2 * p;
    a.saetze = [["Die Klasse fährt mit dem Zug ins Klassenlager."], ["Es fahren ", ang(a, `${n} Kinder`, n), " und ", ang(a, `${l} Begleitpersonen`, l), " mit."],
      [ang(a, `Ein Kinderbillett kostet ${fr(p)}`, g(p)), ", ", ang(a, `ein Billett für Erwachsene ${fr(q)}`, g(q)), "."]];
    a.frage = ["Wie viel kosten alle Billette zusammen?"];
    a.term = `${n}*${g(p)}+${l}*${g(q)}`;
    a.wege = [a.term, `(${n}+${l})*${g(p)}`, `(${n}+${l})*${g(q)}`, `${n}*${g(p)}+${g(q)}`];
    extras(a, ["dauer", "abfahrt", "hoehe"], x.extra);
    return geld(a, n * p + l * q, ["Personen", "min"], "Kinder und Erwachsene bezahlen verschieden viel. Rechne für jede Gruppe einzeln.");
  },
  lagerkosten(x) {
    const a = neu("lagerkosten"), n = zufall(18, 25), h = 5 * zufall(14, 28), c = 5 * zufall(4, 9);
    const haus = n * h, car = n * c;
    a.saetze = [["Die Klasse plant ein Klassenlager."], [ang(a, `Das Lagerhaus kostet für die ganze Woche ${fr(haus * 100)}`, haus), "."],
      [ang(a, `Der Car für Hin- und Rückfahrt kostet ${fr(car * 100)}`, car), "."],
      ["Die Kosten werden ", ang(a, `gleichmässig auf die ${n} Kinder verteilt`, n), "."]];
    a.frage = ["Wie viel bezahlt jedes Kind?"];
    a.term = `(${haus}+${car})/${n}`;
    a.wege = [a.term, `${haus}+${car}/${n}`, `(${haus}+${car})*${n}`, `${haus}/${n}+${car}`];
    extras(a, ["car", "hoehe", "zimmer"], x.extra);
    return geld(a, (h + c) * 100, ["Kinder", "Tage"], "Was kostet das Lager alles zusammen? Und wie viele teilen sich das?");
  },
  velo2(x) {
    const a = neu("velo2"), t = zufall(2, 4), d = 2 * zufall(14, 24); let e = 2 * zufall(6, 14);
    if (e === d) e += 2;
    a.saetze = [["Die Klasse macht eine Velotour."], [ang(a, `An den ersten ${t} Tagen`, t), " fährt sie ", ang(a, `je ${d} km`, d), "."],
      [ang(a, `Am letzten Tag fährt sie noch ${e} km`, e), " bis zum Bahnhof."]];
    a.frage = ["Wie lang ist die ganze Velotour?"];
    a.term = `${t}*${d}+${e}`;
    a.wege = [a.term, `(${t}+1)*${d}`, `${t}*(${d}+${e})`, `${t}+${d}+${e}`];
    extras(a, ["start", "gaenge", "pass"], x.extra);
    return menge(a, t * d + e, "km", ["m", "Tage"], "Die ersten Tage sind gleich lang, der letzte Tag ist anders.");
  },
  einkauf2(x) {
    const a = neu("einkauf2"), n1 = zufall(4, 8), p1 = 10 * zufall(26, 42), n2 = zufall(6, 12), p2 = 5 * zufall(30, 39);
    a.saetze = [["Für das Lagerfrühstück kauft die Köchin ein."], ["Sie nimmt ", ang(a, `${n1} Brote`, n1), " ", ang(a, `zu je ${fr(p1)}`, g(p1)),
      " und ", ang(a, `${n2} Liter Milch`, n2), " ", ang(a, `zu je ${fr(p2)}`, g(p2)), "."]];
    a.frage = ["Wie viel bezahlt sie?"];
    a.term = `${n1}*${g(p1)}+${n2}*${g(p2)}`;
    a.wege = [a.term, `(${n1}+${n2})*${g(p1)}`, `${n1}*${g(p1)}+${g(p2)}`, `(${n1}+${n2})*(${g(p1)}+${g(p2)})`];
    extras(a, ["laden", "schluss", "einkaufen"], x.extra);
    return geld(a, n1 * p1 + n2 * p2, ["Liter", "kg"], "Brot und Milch kosten verschieden viel. Rechne beides einzeln.");
  },
  glace2(x) {
    const a = neu("glace2"); let n, p, s;
    do { n = zufall(3, 6); p = 10 * zufall(15, 35); s = waehle([20, 50]); } while (n * p >= s * 100 - 100);
    a.saetze = [["Nach dem Sporttag kauft Frau Huber Glace für ihr Team."], ["Sie kauft ", ang(a, `${n} Glace`, n), " ", ang(a, `zu je ${fr(p)}`, g(p)), "."],
      ["Sie ", ang(a, `bezahlt mit ${fr(s * 100)}`, s), "."]];

/** Ergebnis in Franken (ganzzahlig in Rappen). */
function geld(a, rp, andere, tipp) { return Object.assign(a, { ergebnis: rp, einheit: "Fr.", einheiten: ["Fr.", ...andere], tipp }); }
/** Ergebnis als ganze Zahl mit Einheit. */

// Je Stufe: Ablauf (Phasen) und Vorlagen; extra = Anzahl überflüssiger Sätze [von, bis].
const STUFE = {

const PROPORTIONAL = ["kurier", "becken0", "billettProp"];

// ---------- Rechnen mit Termen ----------

/** Wert eines Terms aus Zahlen, + - * / und Klammern; NaN, wenn er nicht lesbar ist. */
function rechne(term) {
  const t = term.match(/\d+(?:\.\d+)?|[-+*/()]/g) || [];
  let i = 0;
  const faktor = () => { if (t[i] === "(") { i++; const v = summe(); if (t[i++] !== ")") return NaN; return v; } return Number(t[i++]); };
  const produkt = () => { let v = faktor(); while (t[i] === "*" || t[i] === "/") { const op = t[i++], w = faktor(); v = op === "*" ? v * w : v / w; } return v; };
  const summe = () => { let v = produkt(); while (t[i] === "+" || t[i] === "-") { const op = t[i++], w = produkt(); v = op === "+" ? v + w : v - w; } return v; };
  const v = summe();
  return i === t.length ? v : NaN;
}
/**
 * Teilrechnungen eines Terms in der Reihenfolge, in der man sie ausrechnet, ohne die letzte (sie gibt das Ergebnis):
 * „20*6.4+3*12.8“ → ["20*6.4", "3*12.8"]. Für die Notizfelder (NZ1 a).
 */
function teilterme(term) {
  const t = term.match(/\d+(?:\.\d+)?|[-+*/()]/g) || [];
  const teile = [];
  let i = 0;
  const faktor = () => { if (t[i] === "(") { i++; summe(); i++; } else i++; };
  const kette = (unter, ops) => { const s = i; unter(); while (ops.includes(t[i])) { i++; unter(); teile.push(t.slice(s, i).join("")); } };
  const produkt = () => kette(faktor, "*/");
  const summe = () => kette(produkt, "+-");
  summe();
  return teile.slice(0, -1);
}
const ZEICHEN = { "*": " × ", "/": " : ", "+": " + ", "-": " − " };
/** Term so, wie die Schule ihn schreibt: × und :, Dezimalzahlen mit dem eingestellten Zeichen. */
const termText = term => term.replace(/\d+(?:\.\d+)?|[-+*/]/g, s => ZEICHEN[s] ?? (s.includes(".") ? dezimalText(Number(s), s.split(".")[1].length) : zahlText(Number(s))));
const zahlenIm = term => term.match(/\d+(?:\.\d+)?/g) || [];
const ergebnisText = a => (a.einheit === "Fr." ? fr(a.ergebnis) : `${zahlText(a.ergebnis)} ${a.einheit}`);
const loesungVon = a => a.loesung || `${termText(a.term)} = ${ergebnisText(a)}`;
/** Alle Textteile der Aufgabe (für die Kennung gegen Wiederholungen). */
const teileText = teile => teile.map(t => (typeof t === "string" ? t : `[${t.a}]`)).join("");

function aufgabeErzeugen(stufe) {

    let vorlagen = p.vorlagen, zusammenhang = null;

function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p.vorlagen.includes(a.vorlage)) m.push(`Vorlage ${a.vorlage} nicht in der Stufe`);
  // Jede Angabe kommt genau einmal vor, mit eigenem Wert und eigenem Text.
  const verweise = [];
  const sammle = teile => { for (const t of teile) if (typeof t === "object" && t) verweise.push(t.a); };
  a.saetze.forEach(sammle); sammle(a.frage);
  if (a.tabelle) a.tabelle.zeilen.forEach(sammle);
  if (a.diagramm) sammle(a.diagramm.balken);
  if (verweise.length !== a.angaben.length || new Set(verweise).size !== a.angaben.length) m.push("Angabe fehlt oder kommt doppelt vor");
  if (new Set(a.angaben.map(x => x.wert)).size !== a.angaben.length) m.push("zwei Angaben mit derselben Zahl");
  if (new Set(a.angaben.map(x => x.text)).size !== a.angaben.length) m.push("zwei Angaben mit demselben Text");
  // SK1 a: Die Angabe zeigt ihre Zahl selbst (sonst tippte das Kind Wörter ohne Wert an)
  for (const x of a.angaben) if (!/\d/.test(x.text)) m.push(`Angabe „${x.text}“ ohne Zahl`);
  const noetig = a.angaben.filter(x => x.noetig), unnoetig = a.angaben.filter(x => !x.noetig);
  if (noetig.length < 2) m.push("weniger als zwei wichtige Angaben");
  // Der Term braucht genau die wichtigen Angaben (und feste Umrechnungszahlen wie 60 oder 1000).
  const imTerm = zahlenIm(a.term);
  for (const x of noetig) if (!imTerm.includes(x.wert)) m.push(`wichtige Angabe ${x.text} fehlt im Term`);
  for (const x of unnoetig) if (imTerm.includes(x.wert)) m.push(`überflüssige Angabe ${x.text} steht im Term`);
  for (const z of imTerm) if (!noetig.some(x => x.wert === z) && !a.konstanten.includes(z) && !(a.vorlage === "velo2" && z === "1")) m.push(`Zahl ${z} im Term ohne Angabe`);
  // Term und Ergebnis sind getrennt gerechnet; sie müssen übereinstimmen.
  const faktor = a.einheit === "Fr." ? 100 : 1;
  const wert = rechne(a.term);
  if (!Number.isInteger(a.ergebnis) || a.ergebnis <= 0) m.push("Ergebnis keine positive ganze Zahl");
  if (!(Math.abs(wert * faktor - a.ergebnis) < 1e-6)) m.push(`Term ${a.term} ergibt ${wert}, nicht ${a.ergebnis / faktor}`);
  if (a.ergebnis / faktor >= 100000) m.push("Ergebnis ausserhalb des Zahlenraums");

  else if (!unnoetig.length) m.push("keine überflüssige Angabe");

    else {

    } else m.push("Frage ohne Angabe");

  if (new Set(a.einheiten).size !== 3 || a.einheiten.filter(e => e === a.einheit).length !== 1) m.push("Einheiten nicht drei verschiedene");
  return m;
}

/** Text mit Angaben: als Knöpfe zum Antippen oder fest hervorgehoben. */
function teileEl(a, teile, knoepfe) {

    let nach = typeof teile[i + 1] === "string" ? teile[i + 1] : "";

        if (ctx.vorbei()) knoepfe.forEach(k => { k.disabled = true; });
      } });
      bereich.append(el("div", { class: "kompass-pruefen" }, pruefen));
    }

    /** Auswahl in einem Zwischenschritt: richtig führt weiter, falsch zählt als Fehlversuch. */
    function wahl(optionen, richtig, inhalt, hinweis, klasse) {
      const box = el("div", { class: `wahl ${klasse}` });
      let fertig = false;
      for (const o of optionen) {
        const k = el("button", { type: "button", class: "wahl-knopf" });
        const i = inhalt(o);
        if (typeof i === "string") k.textContent = i;
        else { k.append(el("span", { text: i.text })); if (i.klein) k.append(el("small", { text: i.klein })); }
        k.addEventListener("click", () => {
          if (fertig || ctx.vorbei() || k.classList.contains("gewaehlt")) return;
          if (o === richtig) { fertig = true; k.classList.add("richtig"); LS.ton("tipp"); setTimeout(weiter, 400); return; }
          k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch", "gewaehlt");
          ctx.falsch(hinweis, loesungText);
          if (ctx.vorbei()) fertig = true;
        });
        box.append(k);
      }
      bereich.append(box);
    }

    function phaseWeg() {
      wahl(mische(a.wege), a.term, termText, a.tipp, "kompass-weg");
    }

    function phaseZusammenhang() {
      wahl(["proportional", "linear"], a.zusammenhang,
        o => (o === "proportional" ? { text: "📈 proportional", klein: "doppelt so viel → doppeltes Ergebnis" } : { text: "➕ linear, nicht proportional", klein: "ein fester Teil ist immer dabei" }),
        "Mach die Probe mit dem Doppelten: Wird das Ergebnis auch genau doppelt so gross?", "kompass-zusammenhang");
    }

    function phaseErgebnis() {
      let einheit = null, versuche = 0;
      const anzeige = el("div", { class: "anzeige leer", "aria-label": "Dein Ergebnis" });
      const einheiten = el("div", { class: "kompass-einheiten", role: "group", "aria-label": "Einheit" });
      for (const e of mische(a.einheiten)) {
        const k = el("button", { type: "button", class: "kompass-einheit", text: e, "aria-pressed": "false", onclick() {
          if (ctx.vorbei() || tasten.gesperrt) return;
          einheit = e;
          einheiten.querySelectorAll(".kompass-einheit").forEach(b => { const an = b === k; b.classList.toggle("gewaehlt", an); b.setAttribute("aria-pressed", String(an)); });
          LS.ton("tipp");
        } });
        einheiten.append(k);
      }
      const ganz = String(Math.floor(a.ergebnis / 10 ** st)).length;
      const tasten = LS.tastatur({
        anzeige, maxStellen: Math.max(3, ganz + 1), dezimal: st > 0, nachkomma: st,
        onOk(w) {
          if (!einheit) { ctx.sag("Wähle noch die Einheit.", "hinweis"); return; }
          const zahlStimmt = Math.abs(w * 10 ** st - a.ergebnis) < 1e-6;
          if (zahlStimmt && einheit === a.einheit) {
            tasten.gesperrt = true;
            anzeige.classList.add("richtig");
            ctx.richtig(`Richtig: ${ergebnisText(a)}`);
            return;
          }
          anzeige.classList.add("falsch");
          versuche++;
          ctx.falsch(zahlStimmt ? "Die Zahl stimmt. Welche Einheit passt zur Frage?"
            : versuche === 1 ? a.tipp : a.plan || `Rechenweg: ${termText(a.term)}. Rechne Schritt für Schritt.`, loesungText);
          if (ctx.vorbei()) tasten.gesperrt = true;
        },
      });
      // Notizen vor der Antwort in derselben Zeile; wo der Platz nicht reicht, brechen sie darüber um
      bereich.append(el("div", { class: "kompass-antwort" }, ...(notizen ? [notizZeile()] : []), anzeige, einheiten), tasten.element);
    }

    weiter();
    if (ctx.nr === 0) ctx.sag(tippen ? "Tipp: Lies zuerst die Frage. Tippe dann nur die Angaben an, die du dafür brauchst." : "Tipp: Lies zuerst die Frage. Was ist gesucht? Dann wähle den Rechenweg.");
  },
});
</script>
</body>
</html>
