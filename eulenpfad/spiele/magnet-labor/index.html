<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnet-Labor</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
  .magnete { display: flex; justify-content: center; gap: 28px; margin: 6px 0 16px; }
  .stab { /* Gleich in beiden Modi: Pole des Magneten rot und grün mit weisser Schrift */  display: flex; border-radius: 8px; overflow: hidden; border: 3px solid var(--text); font-weight: 900; color: #fff; font-size: 24px; }
  .stab span { width: 58px; height: 42px; display: grid; place-items: center; }
  /* Nordpol rot, Südpol grün — wie oft im Schulmaterial (Deko-Farben, keine Stellenfarben) */
  .stab .N { /* Gleich in beiden Modi: Pol des Magneten */  background: #e5484d; }
  .stab .S { /* Gleich in beiden Modi: Pol des Magneten */  background: #2fbf71; color: #10132a; }
  .stab .frei { /* Gleich in beiden Modi: Mitte des Magneten */  background: #c9ccd6; color: var(--text); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧲 Magnet-Labor</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="versuche.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.5.2: 2a Magnete untersuchen (ziehen sich an, stossen sich ab, nichts passiert);
// 2b (Grundanspruch 1. Zyklus) Magnete haben zwei Pole, gleiche stossen sich ab, ungleiche ziehen
// sich an; 2c Wirkung auf Materialien, Abstand; 2d Elektromagnet; 1a/1b Batterie und Stromkreis.
// NMG.3.3.d Verhalten gegenüber Magnet. Inhalte in versuche.js.

const { waehle, mische, el } = LS;
// „ab Stufe“ in versuche.js = Nummer der Spielstufe (s1–s6).
const STUFE_NR = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 };
const ANDERER_POL = { N: "S", S: "N" };
const KOERBE = { ja: { bild: "🧲", text: "zieht an" }, nein: { bild: "🚫", text: "zieht nicht an" } };
const ID = "magnet-labor";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Die Pol-Aufgaben
// erzeugt das Spiel selbst; sie hängen an der Liste kompass-pole (gleiche Pole stossen sich ab).
// Kennt der Katalog die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : MAGNET_LISTEN);
const DINGE = FREI.has("dinge") ? MAGNET_DINGE : [];
const FRAGEN = MAGNET_FRAGEN.filter(f => FREI.has(f[5]));
const POLE = FREI.has("kompass-pole");

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  ding() {
    if (!DINGE.length) return null;
    const [bild, name, zieht] = waehle(DINGE);
    return { art: "ding", bild, name, richtig: zieht ? "ja" : "nein" };
  },
  pole() {
    // zwei Stabmagnete, die einander zugewandten Pole entscheiden
    if (!POLE) return null;
    const links = waehle([["N", "S"], ["S", "N"]]);
    const rechts = waehle([["N", "S"], ["S", "N"]]);
    const gleich = links[1] === rechts[0];
    return { art: "pole", links, rechts, richtig: gleich ? "abstossen" : "anziehen", optionen: ["anziehen", "abstossen"] };
  },
  poleWahl() {
    // Pole schwer: Welcher Pol muss rechts in der Mitte stehen, damit sie sich anziehen / abstossen?
    if (!POLE) return null;
    const links = waehle([["N", "S"], ["S", "N"]]);
    const ziel = waehle(["anziehen", "abstossen"]);
    const richtig = ziel === "abstossen" ? links[1] : ANDERER_POL[links[1]];
    return { art: "poleWahl", links, ziel, richtig, optionen: ["N", "S"] };
  },
  frage(n) {
    // Fragen dieser Stufe, ab und zu eine der Stufe davor; ohne freie Frage dieser Stufe keine Aufgabe.
    if (!FRAGEN.some(f => f[0] === n)) return null;
    const liste = FRAGEN.filter(f => f[0] === n || (f[0] === n - 1 && Math.random() < 0.3));
    const [, frage, richtig, f1, f2] = waehle(liste);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [ARTEN.ding],
  s2: [ARTEN.pole, ARTEN.ding],
  s3: [() => ARTEN.frage(3), ARTEN.pole, ARTEN.ding],
  s4: [() => ARTEN.frage(4), ARTEN.pole],
  // Kompass und Pole, schwer
  s5: [() => ARTEN.frage(5), () => ARTEN.frage(5), ARTEN.poleWahl],
  // Königsstufe: Strom — Stromkreis, Leiter, Elektromagnet, Sicherheit
  s6: [() => ARTEN.frage(6)],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Zieht der Magnet das an?",
  s2: "Nordpol und Südpol: anziehen oder abstossen?",
  s3: "Wirkt der Magnet durch Papier und Wasser?",
  s4: "Kompass und die Erde als Magnet.",
  s5: "Kompass und Pole für Profis: Welcher Pol muss hin?",
  s6: "Strom: Batterie, Stromkreis, Elektromagnet.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
/** Stufen, in denen die freien Listen mehr als eine Art hergeben (für ctx.serie). */
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (versuche.js). */
function herkunft(a) {
  if (a.art === "ding") return [MAGNET_DINGE.some(d => d[1] === a.name && (d[2] ? "ja" : "nein") === a.richtig) ? "dinge" : "?"];
  if (a.art === "frage") return [MAGNET_FRAGEN.find(f => f[1] === a.frage)?.[5] || "?"];
  return ["kompass-pole"]; // Pol-Aufgaben: vom Spiel erzeugt, an der Liste kompass-pole
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.art === "pole" && a.richtig !== (a.links[1] === a.rechts[0] ? "abstossen" : "anziehen")) m.push("Pole falsch beurteilt");
  if (a.art === "poleWahl" && (a.richtig === a.links[1]) !== (a.ziel === "abstossen")) m.push("Pol falsch gewählt");
  if (a.art === "frage") {
    if (new Set(a.optionen).size !== 3) m.push("Antworten doppelt");
    if (MAGNET_FRAGEN.find(f => f[1] === a.frage)[0] > STUFE_NR[stufe]) m.push("Frage aus einer höheren Stufe");
  }
  return m;
}

/** Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Regel oder Versuch zum Nachdenken, nie die Antwort. */
const FRAGE_TIPPS = {
  wirkung: ["Stell dir den Versuch mit Magnet und Büroklammer vor.", "Überleg: Was ändert sich, wenn etwas zwischen Magnet und Büroklammer ist — oder wenn sie weiter weg ist?"],
  "kompass-pole": ["Eine Kompassnadel ist selbst ein kleiner Magnet.", "Denk daran: Jeder Magnet hat einen Nordpol und einen Südpol."],
  strom: ["Stell dir den Versuch mit Batterie, Kabel und Lämpchen vor.", "Lies jede Antwort und frag dich: Kann das bei einem echten Versuch so sein?"],
};
function tippsFuer(a) {
  if (a.art === "ding") return ["Ein Magnet zieht nur Dinge aus Eisen an.", "Woraus ist das Ding gemacht: aus Eisen, Holz, Papier, Glas oder Stoff?"];
  if (a.art === "pole" || a.art === "poleWahl") return ["Schau nur auf die zwei Pole in der Mitte, wo sich die Magnete treffen.", "Gleiche Pole stossen sich ab, verschiedene ziehen sich an."];
  return FRAGE_TIPPS[herkunft(a)[0]] || ["Denk an deine Versuche mit Magneten und Batterien."];
}

const stab = pole => el("div", { class: "stab" }, ...pole.map(p => el("span", { class: p, text: p })));

LS.spiel({
  id: "magnet-labor",
  einleitung: "Willkommen im Labor! Was zieht der Magnet an? Und was passiert, wenn zwei Magnete sich treffen?",
  hilfe: "Überleg, was der Magnet mit dem Ding oder mit dem anderen Magneten macht, und gib deine Antwort.",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
    if (a.art !== "frage") ctx.serie("antwort", a.richtig); // ja/nein, anziehen/abstossen, N/S
    if (a.art === "poleWahl") ctx.serie("ziel", a.ziel);
    ctx.tipp(tippsFuer(a));
    if (a.art === "ding") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Zieht der Magnet das an?" }));
      const { karte } = LS.koerbe(ctx, {
        karte: { bild: a.bild, text: a.name }, koerbe: ["ja", "nein"], richtig: a.richtig, korbInhalt: k => KOERBE[k],
        farbe: k => (k === "ja" ? "var(--deko-6)" : "var(--deko-7)"),
        hinweis: "Ein Magnet zieht Dinge aus Eisen an — nicht Holz, Papier, Glas oder Stoff.",
        loesung: `${a.name}: ${KOERBE[a.richtig].text}.`, lob: `Richtig: ${a.name} — ${KOERBE[a.richtig].text}.`,
      });
      karte.querySelector("b").classList.add("frage"); // Name des Dings vorlesen (rahmen.md Abschnitt 12)
    } else if (a.art === "pole") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Ziehen sich die Magnete an oder stossen sie sich ab?" }),
        el("div", { class: "magnete" }, stab(a.links), stab(a.rechts)));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 140,
        inhalt: o => ({ bild: o === "anziehen" ? "🤝" : "↔️", text: o === "anziehen" ? "ziehen sich an" : "stossen sich ab" }),
        hinweis: "Schau auf die beiden Pole in der Mitte: Gleiche Pole stossen sich ab, verschiedene ziehen sich an.",
        loesung: `In der Mitte treffen ${a.links[1]} und ${a.rechts[0]} aufeinander: ${a.richtig === "anziehen" ? "verschieden — sie ziehen sich an" : "gleich — sie stossen sich ab"}.`,
      });
    } else if (a.art === "poleWahl") {
      const ziehen = a.ziel === "anziehen";
      ctx.flaeche.append(el("div", { class: "frage", text: `Welcher Pol muss rechts in der Mitte sein, damit sich die Magnete ${ziehen ? "anziehen" : "abstossen"}?` }),
        el("div", { class: "magnete" }, stab(a.links), el("div", { class: "stab" }, el("span", { class: "frei", text: "?" }), el("span", { class: "frei", text: "" }))));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 140,
        inhalt: o => ({ text: o, klein: o === "N" ? "Nordpol" : "Südpol" }),
        hinweis: "Schau, welcher Pol links in der Mitte ist. Gleiche Pole stossen sich ab, verschiedene ziehen sich an.",
        loesung: `Links in der Mitte ist ${a.links[1]}. ${ziehen ? `Verschiedene Pole ziehen sich an: rechts muss ${a.richtig} sein.` : `Gleiche Pole stossen sich ab: rechts muss auch ${a.richtig} sein.`}`,
      });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 200, hinweis: "Denk an deine Versuche mit Magneten und Batterien.", loesung: `${a.frage} ${a.richtig}` });
    }
    if (ctx.nr === 0) ctx.sag("Überleg zuerst, dann tipp auf deine Antwort.");
  },
});
</script>
</body>
</html>
