<!doctype html>

<head>
<meta charset="utf-8">

<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .theke { display: flex; justify-content: center; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin: 0 0 12px; }
  .artikel { text-align: center; }
  .artikel .bild { font-size: clamp(44px, 10vw, 64px); line-height: 1; }
  .preis { display: inline-block; background: var(--regel); border: 3px solid var(--regel-rand); border-radius: 10px; padding: 2px 10px; font-weight: 900; font-size: 18px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .frage { text-align: center; font-size: clamp(20px, 4.2vw, 28px); font-weight: 800; margin: 0 0 12px; }
  .frage b { color: var(--knopf); }

  .geld { /* Gleich in beiden Modi: Geld */  border: none; cursor: pointer; font-family: inherit; font-weight: 900; color: #3b3b3b; display: inline-flex; align-items: center; justify-content: center; flex: none; padding: 0; }
  .geld.muenze { /* Gleich in beiden Modi: Münze */  border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fbfbfb, #b9bec6 70%); box-shadow: inset 0 0 0 3px #9aa1ab, 0 3px 0 rgba(0, 0, 0, .15); }
  .geld.muenze.gelb { /* Gleich in beiden Modi: Münze */  background: radial-gradient(circle at 35% 30%, #fff3b0, #d7b23c 70%); box-shadow: inset 0 0 0 3px #b8962a, 0 3px 0 rgba(0, 0, 0, .15); }
  .geld.note { border-radius: 8px; width: 92px; height: 50px; font-size: 17px; box-shadow: 0 3px 0 rgba(0, 0, 0, .18); border: 2px solid rgba(0, 0, 0, .15); }
  .note-10 { /* Gleich in beiden Modi: Banknote */  background: #f7d64a; } .note-20 { /* Gleich in beiden Modi: Banknote */  background: #f47c7c; color: #2d3047; } .note-50 { /* Gleich in beiden Modi: Banknote */  background: #6cc77c; }
  .note-100 { /* Gleich in beiden Modi: Banknote */  background: #6aa4e6; color: #2d3047; }

  .kasse { min-height: 96px; border-radius: 18px; background: var(--feld-leise); border: 3px dashed var(--rand); padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; margin-bottom: 10px; }
  .kasse:empty::before { content: "Tipp auf Geld, um es hierher zu legen"; color: var(--leer); font-weight: 700; }
  .kasse .geld { transform: scale(.9); }
  .vorrat { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-bottom: 10px; }
  .geld:active { transform: translateY(2px); }
  .haufen { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .haufen .geld { cursor: default; }
  /* Notizen (NZ1 a): in der Theke neben den Preisen, Beschriftung über dem Feld */
  .nz-zeile { display: flex; gap: 10px; align-items: flex-end; }
  .nz-zeile label { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 800;
    color: var(--text-leise); line-height: 1.1; text-align: center; max-width: 4.8em; }
  .nz-zeile .zw-notiz { font-size: 16px; min-height: 32px; padding: 1px 3px; }
  /* Mit Notizen rückt die Theke enger zusammen, damit die Felder neben die Preise passen */
  .theke:has(> .nz-zeile) { gap: 8px 14px; }
  @media (max-width: 560px) {
    .theke:has(> .nz-zeile) { gap: 4px 10px; }
    .theke:has(> .nz-zeile) .artikel .bild { font-size: 32px; }
    .theke:has(> .nz-zeile) .preis { font-size: 15px; padding: 1px 6px; border-width: 2px; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🏪 Kiosk-Kasse</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/notizblock.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG MA.3.A.2: b ganze Frankenbeträge bis 20 Fr. legen, addieren, subtrahieren;
// c bis 100 Fr. mit Münzen und Noten legen; d Beträge mit Fr. und Rp. bilden, addieren und
// subtrahieren (z.B. 25 Fr. 60 Rp. + 14 Fr. 30 Rp.). MA.3.A.1.d Abkürzungen Fr., Rp.
// Alle Beträge intern in Rappen.

const { zufall, waehle, mische, el } = LS;

const GELD = [
  // Grössen-Reihenfolge wie die echten Münzen, aber mindestens 40 px als Tippziel
  { rp: 5, text: "5 Rp.", art: "muenze", gr: 42, gelb: true }, { rp: 10, text: "10 Rp.", art: "muenze", gr: 46 },
  { rp: 20, text: "20 Rp.", art: "muenze", gr: 50 }, { rp: 50, text: "50 Rp.", art: "muenze", gr: 44 },
  { rp: 100, text: "1 Fr.", art: "muenze", gr: 54 }, { rp: 200, text: "2 Fr.", art: "muenze", gr: 60 },
  { rp: 500, text: "5 Fr.", art: "muenze", gr: 66 },
  { rp: 1000, text: "10 Fr.", art: "note" }, { rp: 2000, text: "20 Fr.", art: "note" },
  { rp: 5000, text: "50 Fr.", art: "note" }, { rp: 10000, text: "100 Fr.", art: "note" },
];
const ARTIKEL = ["🍦", "🥨", "🍫", "🧃", "🍎", "📒", "✏️", "🎈", "🧸", "🍌", "🥤", "🍪", "⚽", "🖍️"];

/** Satzende nach „Fr.“ oder „Rp.“: kein doppelter Punkt. */
const satz = s => s.replace(/\.\./g, ".");

/** Betrag wie die Klasse der Stufe ihn schreibt (LS.geldText, Entscheid C1 a): bis 3. Klasse 25 Fr. 60 Rp., ab 4. Klasse 25.60 Fr. */
const betrag = rp => LS.geldText(rp);
/** Verb passend zum Betrag: Einzahl bei genau 1 Fr. oder 1 Rp. („Das ist 1 Fr.“), sonst Mehrzahl. */
const verb = (rp, eins, mehr) => (rp === 100 || rp === 1 ? eins : mehr);

function geldKnopf(g) {
  const k = el("button", { type: "button", class: `geld ${g.art}${g.gelb ? " gelb" : ""}${g.art === "note" ? ` note-${g.rp / 100}` : ""}`, text: g.text, "aria-label": g.text });
  if (g.art === "muenze") { k.style.width = k.style.height = `${g.gr}px`; k.style.fontSize = `${Math.max(10, g.gr / 4)}px`; }
  return k;
}

/** Betrag mit möglichst wenigen Stücken (für „zählen“-Aufgaben und Lösungstexte). */
function zerlegen(rp, erlaubt) {
  const stuecke = [];
  for (const g of [...erlaubt].sort((a, b) => b.rp - a.rp)) while (rp >= g.rp) { stuecke.push(g); rp -= g.rp; }
  return stuecke;
}

// Je Stufe: erlaubtes Geld (bis Rappenwert), Preisraster, Höchstbetrag, Aufgabenarten.
const STUFE = {
  s1: { geld: [100, 200, 500, 1000, 2000], raster: 100, max: 2000, arten: ["legen", "legen", "addieren"] },
  s2: { geld: [100, 200, 500, 1000, 2000, 5000, 10000], raster: 100, max: 10000, arten: ["legen", "zaehlen", "addieren"] },
  s3: { geld: [10, 20, 50, 100, 200, 500, 1000, 2000], raster: 10, max: 5000, arten: ["legen", "addieren", "zaehlen"] },
  s4: { geld: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000], raster: 5, max: 5000, arten: ["rueckgeld", "addieren", "legen"] },
  s5: { geld: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000], raster: 5, max: 10000, arten: ["einkauf", "rueckgeld"] },
  // Königsstufe: Rückgeld mit möglichst wenigen Stücken legen, mehrere gleiche Sachen mit Rückgeld,
  // „Wie viele kannst du kaufen?“ und grosse Einkäufe mit einer grossen Note.
  s6: { geld: [5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000], raster: 5, max: 10000, arten: ["rueckgeldLegen", "mengeRueckgeld", "wieViele", "grossEinkauf"] },
};

const preis = (p, max) => zufall(1, Math.floor(max / p.raster) - 1) * p.raster;
const naechsteNote = summe => [1000, 2000, 5000, 10000].find(n => n > summe);

/** Königsstufe: Zahlen der Aufgabe (alles in Rappen). Die übrigen Stufen ziehen nur die Art. */
function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  const art = waehle(p.arten);
  if (art === "rueckgeldLegen") {
    const pr = preis(p, 4500), bezahlt = naechsteNote(pr);
    return { art, preise: [pr], bezahlt, loesung: bezahlt - pr };
  }
  if (art === "mengeRueckgeld") {
    const n = zufall(2, 5), stueck = zufall(21, 190) * 5, bezahlt = naechsteNote(n * stueck);
    return { art, n, stueck, preise: [n * stueck], bezahlt, loesung: bezahlt - n * stueck };
  }
  if (art === "wieViele") {
    const budget = waehle([1000, 2000, 5000]);
    const stueck = zufall(Math.ceil(budget / 20 / 5), Math.floor(budget / 2 / 5)) * 5; // 2 bis 20 Stück
    return { art, budget, stueck, loesung: Math.floor(budget / stueck) };
  }
  if (art === "grossEinkauf") {
    const preise = Array.from({ length: zufall(3, 4) }, () => preis(p, 2500));
    const summe = preise.reduce((s, x) => s + x, 0);
    const bezahlt = summe < 5000 && Math.random() < 0.5 ? 5000 : 10000;
    return { art, preise, bezahlt, loesung: bezahlt - summe };
  }
  return { art };
}

/** Kleinste Zahl von Stücken für einen Betrag, unabhängig vom Generator gerechnet. */
function wenigsteStuecke(rp, werte) {
  const best = new Array(rp / 5 + 1).fill(Infinity);
  best[0] = 0;
  for (let i = 1; i < best.length; i++) for (const w of werte) if (w / 5 <= i) best[i] = Math.min(best[i], best[i - w / 5] + 1);
  return best[rp / 5];
}

/** Mängel: Rückgeld positiv und richtig, Preise im 5-Rappen-Raster, Stückzahl eindeutig. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  if (!a.preise && a.art !== "wieViele") return m; // Stufen 1–5 erzeugen ihre Zahlen im Spiel
  if (a.preise) {
    const summe = a.preise.reduce((s, x) => s + x, 0);
    if (a.preise.some(x => x <= 0 || x % 5)) m.push("Preis nicht im 5-Rappen-Raster");
    if (a.loesung !== a.bezahlt - summe || a.loesung <= 0) m.push("Rückgeld stimmt nicht");
    if (a.art === "mengeRueckgeld" && a.n * a.stueck !== summe) m.push("Menge × Preis stimmt nicht");
    if (String(a.loesung).length > 6) m.push("Betrag passt nicht in die Tastatur");
    if (a.art === "rueckgeldLegen" && wenigsteStuecke(a.loesung, STUFE[stufe].geld) !== zerlegen(a.loesung, GELD.filter(g => STUFE[stufe].geld.includes(g.rp))).length) m.push("Zerlegung nicht die kürzeste");
  } else {
    if (!(a.loesung * a.stueck <= a.budget && (a.loesung + 1) * a.stueck > a.budget)) m.push("Stückzahl stimmt nicht");
    if (a.loesung < 2 || a.loesung > 20 || a.stueck % 5) m.push("Stückzahl oder Preis ausserhalb des Rahmens");
  }
  return m;
}

/** Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Rechenweg in Worten — kein Betrag, keine Anzahl. */
function tippsFuer(art, mitRappen) {
  switch (art) {
    case "legen": return ["Fang mit der grössten Note oder Münze an, die noch passt.", "Zähl nach jedem Stück mit: Wie viel fehlt noch bis zum Preis?"];
    case "zaehlen": return ["Beginne mit den Noten und den grössten Münzen.", "Zähl Stück für Stück weiter und merk dir, wie viel du schon hast."];
    case "addieren": return mitRappen ? ["Zähl zuerst die Franken zusammen, dann die Rappen.", "Hundert Rappen sind ein Franken."]
      : ["Zähl die beiden Preise zusammen.", "Rechne zuerst bis zum nächsten Zehner, dann weiter."];
    case "rueckgeld": return ["Zähl vom Preis aus hoch bis zur Note.", "Zuerst bis zum nächsten ganzen Franken, dann bis zur Note."];
    case "einkauf": return ["Rechne zuerst zusammen, was alles kostet.", "Dann zähl vom Preis aus hoch bis zur Note."];
    case "rueckgeldLegen": return ["Rechne zuerst: Wie viel fehlt vom Preis bis zur Note?", "Leg dann immer das grösste Stück, das noch passt — so brauchst du am wenigsten Stücke."];
    case "mengeRueckgeld": return ["Rechne zuerst aus, was alles zusammen kostet: Anzahl mal Preis.", "Dann: Wie viel fehlt bis zur Note?"];
    case "wieViele": return ["Zähl den Preis immer wieder dazu, bis das Geld nicht mehr reicht.", "Oder rechne geteilt: Wie oft passt der Preis ganz in dein Geld?"];
    default: return ["Rechne zuerst alles zusammen — Franken und Rappen getrennt.", "Dann ergänze bis zur Note."];
  }
}

LS.spiel({
  id: "kiosk-kasse",
  hilfe: stufe => (stufe === "s5" ? "Rechne und tipp den Betrag ein." : "Beim Legen tippst du auf Münzen und Noten, sie kommen in die Kasse; tipp ein Stück in der Kasse nochmal an, um es zurückzunehmen.")
    + (STUFE[stufe].raster < 100 ? ` Beträge tippst du ohne Komma ein: 1 3 6 0 heisst ${LS.geldText(1360)}` : " Beträge tippst du in Franken ein."),
  einleitung: "Willkommen im Kiosk! Lege Geld in die Kasse, zähl zusammen und gib das Rückgeld richtig heraus.",
  anzahl: 8,
  stufen: {
    s1: "Ganze Franken bis 20 Fr. legen.",
    s2: "Bis 100 Fr. mit Münzen und Noten, Geld zählen.",
    s3: "Franken und Rappen: 7 Fr. 40 Rp.",
    s4: "Rückgeld: Bezahlt mit 20 Fr., kostet 13 Fr. 60 Rp.",
    s5: "Einkauf mit mehreren Sachen und Rückgeld.",
    s6: "Endgegner: Rückgeld mit wenigen Stücken legen, 4 × 2 Fr. 35 Rp., wie viele für 20 Fr.?",
  },

  aufgabe(ctx) {
    const p = STUFE[ctx.stufe];
    const erlaubt = GELD.filter(g => p.geld.includes(g.rp));
    const auf = aufgabeErzeugen(ctx.stufe);
    const art = auf.art;
    ctx.serie("art", art); // jede Stufe hat mehrere Arten
    ctx.tipp(tippsFuer(art, p.raster < 100)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)

    // Notizen (NZ1 a): beim Rückgeld „zusammen“ (mehrere Sachen) und „bis zum Franken“ (Preis mit Rappen) in der Theke
    // neben den Preisen — so braucht die Aufgabe keine Zeile mehr. Nach Stufe ab s5; in s4 (eine Sache) ist das
    // Hochzählen im Kopf das Lernziel.
    const notizen = (summe, zusammen, ...weitere) => {
      const namen = [...(zusammen ? ["zusammen"] : []), ...(summe % 100 ? ["bis zum Franken"] : []), ...weitere];
      if (!namen.length || !ctx.notizen(Number(ctx.stufe.slice(1)) >= 5)) return;
      ctx.flaeche.querySelector(".theke").append(el("div", { class: "nz-zeile" }, ...namen.map(n => el("label", {}, el("span", { text: n }),
        Object.assign(LS.notizFeld({ breite: 5, label: n }), { inputMode: "decimal" })))));
    };

    // Tastatur für Beträge: Ab Stufe 3 in Rappen getippt (1 3 6 0 → 13 Fr. 60 Rp.), sonst ganze Franken.
    const mitRappen = p.raster < 100;
    const betragEingabe = (soll, hinweis, loesungText) => {
      const loesung = satz(loesungText);
      ctx.loesung(loesung);
      ctx.schritte(LS.tippSchritte(mitRappen ? soll : soll / 100));
      const anzeige = el("div", { class: "anzeige leer", "aria-label": "Betrag" });
      ctx.flaeche.append(anzeige);
      const tasten = LS.tastatur({
        anzeige, maxStellen: mitRappen ? 6 : 4,
        onAenderung: z => { if (z !== null) anzeige.textContent = betrag(mitRappen ? z : z * 100); },
        onOk(z) {
          const rp = mitRappen ? z : z * 100;
          if (rp === soll) { tasten.gesperrt = true; anzeige.classList.add("richtig"); ctx.richtig(); return; }
          anzeige.classList.add("falsch");
          ctx.falsch(satz(hinweis(rp)), loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
        },
      });
      ctx.flaeche.append(tasten.element);
      if (mitRappen && ctx.nr === 0) ctx.sag(`Tipp Franken und Rappen zusammen: 1 3 6 0 heisst ${LS.geldText(1360)}`);
    };

    if (art === "legen") {
      const soll = preis(p, p.max);
      const loesung = `Zum Beispiel: ${zerlegen(soll, erlaubt).map(g => g.text).join(" + ")}`;
      ctx.loesung(loesung);
      ctx.schritte(zerlegen(soll, erlaubt).length + 1); // möglichst wenige Stücke legen, dazu «Bezahlen»
      const ding = waehle(ARTIKEL);
      ctx.flaeche.append(el("div", { class: "theke" }, el("div", { class: "artikel" }, el("div", { class: "bild", text: ding }), el("div", { class: "preis", text: betrag(soll) }))),
        el("div", { class: "frage", html: `Lege genau <b>${betrag(soll)}</b> in die Kasse.` }));
      const kasse = el("div", { class: "kasse", "aria-label": "Kasse" });
      const vorrat = el("div", { class: "vorrat" });
      const gelegt = [];
      let fertig = false;
      for (const g of erlaubt) {
        const k = geldKnopf(g);
        k.addEventListener("click", () => {
          if (fertig) return;
          const stueck = geldKnopf(g);
          gelegt.push(g.rp);
          stueck.addEventListener("click", () => { if (fertig) return; gelegt.splice(gelegt.indexOf(g.rp), 1); stueck.remove(); });
          kasse.append(stueck);
          LS.ton("tipp");
        });
        vorrat.append(k);
      }
      const ok = el("button", { class: "knopf gruen", type: "button", text: "Bezahlen ✓" });
      ok.addEventListener("click", () => {
        if (fertig) return;
        const summe = gelegt.reduce((s, x) => s + x, 0);
        if (summe === soll) { fertig = true; ctx.richtig(); return; }
        ctx.falsch(satz(`In der Kasse ${verb(summe, "liegt", "liegen")} ${betrag(summe)}. ${summe < soll
          ? `Es ${verb(soll - summe, "fehlt", "fehlen")} noch ${betrag(soll - summe)}.`
          : `Das ${verb(summe - soll, "ist", "sind")} ${betrag(summe - soll)} zu viel.`} Tipp auf ein Stück in der Kasse, um es zurückzunehmen.`),
          loesung);
        if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)")) fertig = true;
      });
      ctx.flaeche.append(kasse, vorrat, el("div", { class: "knopfzeile" }, ok));
      if (ctx.nr === 0) ctx.sag("Tipp auf Münzen und Noten. Nochmal tippen in der Kasse nimmt sie zurück.");
      return;
    }

    if (art === "zaehlen") {
      const soll = preis(p, p.max);
      const stuecke = mische(zerlegen(soll, erlaubt));
      const haufen = el("div", { class: "haufen", "aria-label": "Geld" });
      for (const g of stuecke) { const k = geldKnopf(g); k.disabled = true; haufen.append(k); }
      ctx.flaeche.append(el("div", { class: "frage", text: "Wie viel Geld ist das?" }), haufen);
      betragEingabe(soll, rp => rp < soll ? "Zu wenig. Beginne mit den Noten und den grössten Münzen." : "Zu viel. Zähl jedes Stück nur einmal.",
        `Das ${verb(soll, "ist", "sind")} ${betrag(soll)}.`);
      return;
    }

    if (art === "addieren") {
      const a = preis(p, p.max / 2), b = preis(p, p.max / 2);
      const [d1, d2] = mische(ARTIKEL).slice(0, 2);
      ctx.flaeche.append(el("div", { class: "theke" },
        el("div", { class: "artikel" }, el("div", { class: "bild", text: d1 }), el("div", { class: "preis", text: betrag(a) })),
        el("div", { class: "artikel" }, el("div", { class: "bild", text: d2 }), el("div", { class: "preis", text: betrag(b) }))),
        el("div", { class: "frage", text: "Wie viel kostet beides zusammen?" }));
      betragEingabe(a + b, () => mitRappen ? "Zähle zuerst die Franken zusammen, dann die Rappen. 100 Rp. sind 1 Fr." : "Zähl die beiden Preise zusammen.",
        `${betrag(a)} + ${betrag(b)} = ${betrag(a + b)}`);
      return;
    }

    // ---- Königsstufe ----
    const theke = (preise, dinge, text = betrag) => el("div", { class: "theke" },
      ...preise.map((pr, i) => el("div", { class: "artikel" }, el("div", { class: "bild", text: dinge[i] }), el("div", { class: "preis", text: text(pr, i) }))));
    const noteZeile = (rp, nachher) => {
      const note = geldKnopf(GELD.find(g => g.rp === rp)); note.disabled = true;
      return el("div", { class: "frage" }, "Bezahlt wird mit ", note, el("span", { html: nachher }));
    };

    if (art === "rueckgeldLegen") {
      // Rückgeld in die Kasse legen — richtig ist es erst mit möglichst wenigen Stücken.
      const soll = auf.loesung;
      const kuerzest = zerlegen(soll, erlaubt);
      const loesung = `${betrag(auf.bezahlt)} − ${betrag(auf.preise[0])} = ${betrag(soll)}: ${kuerzest.map(g => g.text).join(" + ")}`;
      ctx.loesung(loesung);
      ctx.schritte(kuerzest.length + 1); // die Stücke legen, dazu «Herausgeben»
      ctx.flaeche.append(theke(auf.preise, [waehle(ARTIKEL)]),
        noteZeile(auf.bezahlt, " — lege das <b>Rückgeld</b> mit möglichst <b>wenigen Stücken</b>."));
      notizen(auf.preise[0], false, "Rückgeld");
      const kasse = el("div", { class: "kasse", "aria-label": "Rückgeld" });
      const vorrat = el("div", { class: "vorrat" });
      const gelegt = [];
      let fertig = false;
      for (const g of erlaubt.filter(x => x.rp < auf.bezahlt)) {
        const k = geldKnopf(g);
        k.addEventListener("click", () => {
          if (fertig) return;
          const stueck = geldKnopf(g);
          gelegt.push(g.rp);
          stueck.addEventListener("click", () => { if (fertig) return; gelegt.splice(gelegt.indexOf(g.rp), 1); stueck.remove(); });
          kasse.append(stueck);
          LS.ton("tipp");
        });
        vorrat.append(k);
      }
      const ok = el("button", { class: "knopf gruen", type: "button", text: "Herausgeben ✓" });
      ok.addEventListener("click", () => {
        if (fertig) return;
        const summe = gelegt.reduce((s, x) => s + x, 0);
        if (summe === soll && gelegt.length === kuerzest.length) { fertig = true; ctx.richtig(); return; }
        ctx.falsch(summe !== soll
          ? satz(`Das ${verb(summe, "ist", "sind")} ${betrag(summe)}. ${summe < soll ? "Das ist zu wenig." : "Das ist zu viel."} Rechne: Wie viel fehlt vom Preis bis zur Note?`)
          : "Der Betrag stimmt! Aber es geht mit weniger Stücken: Tausche kleine Münzen gegen grössere.",
          loesung);
        if (ctx.flaeche.querySelector(".knopfzeile .knopf:not(.gruen)")) fertig = true;
      });
      ctx.flaeche.append(kasse, vorrat, el("div", { class: "knopfzeile" }, ok));
      if (ctx.nr === 0) ctx.sag("Nochmal tippen in der Kasse nimmt ein Stück zurück.");
      return;
    }

    if (art === "mengeRueckgeld") {
      const ding = waehle(ARTIKEL);
      ctx.flaeche.append(theke([auf.stueck], [ding], pr => `${auf.n} × ${betrag(pr)}`),
        // Beträge enden auf „Fr.“ oder „Rp.“ — dieser Punkt schliesst auch den Satz.
        el("div", { class: "frage", html: `Du kaufst <b>${auf.n}</b> Stück, jedes kostet <b>${betrag(auf.stueck)}</b>` }),
        noteZeile(auf.bezahlt, " — <b>wie viel Rückgeld</b> gibt es?"));
      notizen(auf.preise[0], true);
      betragEingabe(auf.loesung, () => "Rechne zuerst aus, was alles zusammen kostet. Dann: Wie viel fehlt bis zur Note?",
        `${auf.n} × ${betrag(auf.stueck)} = ${betrag(auf.preise[0])}; ${betrag(auf.bezahlt)} − ${betrag(auf.preise[0])} = ${betrag(auf.loesung)}`);
      return;
    }

    if (art === "wieViele") {
      const ding = waehle(ARTIKEL);
      const loesung = satz(`${auf.loesung} Stück: ${auf.loesung} × ${betrag(auf.stueck)} = ${betrag(auf.loesung * auf.stueck)}`);
      ctx.loesung(loesung);
      ctx.schritte(LS.tippSchritte(auf.loesung));
      ctx.flaeche.append(theke([auf.stueck], [ding]),
        el("div", { class: "frage", html: `Du hast <b>${betrag(auf.budget)}</b> Wie viele Stück kannst du <b>höchstens</b> kaufen?` }));
      const anzeige = el("div", { class: "anzeige leer", "aria-label": "Anzahl" });
      ctx.flaeche.append(anzeige);
      const tasten = LS.tastatur({
        anzeige, maxStellen: 2,
        onOk(z) {
          if (z === auf.loesung) { tasten.gesperrt = true; anzeige.classList.add("richtig"); ctx.richtig(); return; }
          anzeige.classList.add("falsch");
          const kosten = z === 1 ? "kostet" : "kosten";
          ctx.falsch(z * auf.stueck > auf.budget ? satz(`${z} Stück ${kosten} ${betrag(z * auf.stueck)} — das reicht nicht.`)
            : satz(`${z} Stück ${kosten} ${betrag(z * auf.stueck)}. Reicht das Geld noch für eines mehr?`),
            loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) tasten.gesperrt = true;
        },
      });
      ctx.flaeche.append(tasten.element);
      return;
    }

    if (art === "grossEinkauf") {
      const summe = auf.preise.reduce((s, x) => s + x, 0);
      ctx.flaeche.append(theke(auf.preise, mische(ARTIKEL).slice(0, auf.preise.length)),
        noteZeile(auf.bezahlt, " — <b>wie viel Rückgeld</b> gibt es?"));
      notizen(summe, true);
      betragEingabe(auf.loesung, () => "Rechne zuerst alles zusammen — Franken und Rappen getrennt. Dann ergänze bis zur Note.",
        `${auf.preise.map(betrag).join(" + ")} = ${betrag(summe)}; ${betrag(auf.bezahlt)} − ${betrag(summe)} = ${betrag(auf.loesung)}`);
      return;
    }

    // Rückgeld: ein Artikel (s4) oder mehrere (s5), bezahlt mit der nächstgrösseren Note
    const anzahl = art === "einkauf" ? zufall(2, 3) : 1;
    const preise = Array.from({ length: anzahl }, () => preis(p, art === "einkauf" ? 2500 : 4500));
    const summe = preise.reduce((s, x) => s + x, 0);
    const bezahlt = [1000, 2000, 5000, 10000].find(n => n > summe);
    const dinge = mische(ARTIKEL).slice(0, anzahl);
    ctx.flaeche.append(el("div", { class: "theke" }, ...preise.map((pr, i) => el("div", { class: "artikel" }, el("div", { class: "bild", text: dinge[i] }), el("div", { class: "preis", text: betrag(pr) })))));
    const note = geldKnopf(GELD.find(g => g.rp === bezahlt)); note.disabled = true;
    ctx.flaeche.append(el("div", { class: "frage" }, `Bezahlt wird mit `, note, el("span", { html: ` — <b>wie viel Rückgeld</b> gibt es?` })));
    notizen(summe, anzahl > 1);
    betragEingabe(bezahlt - summe,
      () => anzahl > 1 ? `Rechne zuerst zusammen: Alles kostet ${betrag(summe)}. Dann: Wie viel fehlt bis ${betrag(bezahlt)}?` : `Zähl vom Preis aus hoch bis ${betrag(bezahlt)}: zuerst bis zum nächsten ganzen Franken.`,
      `${betrag(bezahlt)} − ${betrag(summe)} = ${betrag(bezahlt - summe)}`);
  },
});
</script>
</body>
</html>
