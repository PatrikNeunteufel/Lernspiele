<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schätz-Waage</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 14px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>📏 Schätz-Waage</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="groessen.js"></script>
<script>
"use strict";
// Lehrplan SG MA.3.A.1: a lang/kurz, schwer/leicht, gross/klein beschreiben; b Steigerungsformen
// („B ist schwerer als A“); c (Grundanspruch 1. Zyklus) Referenzgrössen 1 cm, 1 m; e 1 km, 1 mm,
// 1 kg, 100 g, 1 l, 1 dl, 1 h, 1 min; f (Orientierungspunkt 2. Zyklus) t, ml, s. Inhalte in groessen.js.

const { waehle, mische, el } = LS;
const STUFE_NR = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 };

// ---------- Freigabe (Entscheid L4 a) ----------
// Kinder üben nur Inhalte aus freien Listen (LS.freieListen; die Aufsicht sieht alle). Kennt der
// Katalog die Listen dieses Spiels noch nicht, gilt alles als frei — wie bei einem Spiel ohne Listen.
const SPIEL_ID = "schaetz-waage";
const FREI = new Set(LS.spielListen(SPIEL_ID).length ? LS.freieListen(SPIEL_ID) : ["vergleiche", "reihen", ...Object.keys(SCHAETZ_LISTEN)]);
/** Liste einer Schätzfrage nach der Einheit der richtigen Antwort („1.5 t“ → gewicht). */
const frageListe = f => Object.keys(SCHAETZ_LISTEN).find(l => SCHAETZ_LISTEN[l].includes(f[2].split(" ")[1]));
const FREIE_VERGLEICHE = FREI.has("vergleiche") ? VERGLEICHE : [];
const FREIE_REIHEN = FREI.has("reihen") ? REIHEN : [];
const FREIE_FRAGEN = SCHAETZFRAGEN.filter(f => FREI.has(frageListe(f)));
const reihenMit = anzahl => FREIE_REIHEN.filter(r => r[1].length === anzahl);
const fragenDerStufe = n => FREIE_FRAGEN.filter(f => f[0] === n);

const ARTEN = {
  vergleich() {
    const [eigenschaft, gross, klein] = waehle(FREIE_VERGLEICHE);
    return { art: "vergleich", eigenschaft, richtig: gross, optionen: mische([gross, klein]) };
  },
  /** Dinge ordnen; 'anzahl' Dinge je Reihe (3 in Stufe 2, 4 in Stufe 4). */
  ordnen(anzahl) {
    const [richtung, dinge] = waehle(reihenMit(anzahl));
    return { art: "ordnen", richtung, reihe: dinge };
  },
  schaetzen(n) {
    // vor allem Fragen dieser Stufe, ab und zu eine aus der Stufe davor
    const liste = FREIE_FRAGEN.filter(f => f[0] === n || (f[0] === n - 1 && Math.random() < 0.3));
    const [, frage, richtig, f1, f2] = waehle(liste.length ? liste : fragenDerStufe(n));
    return { art: "schaetzen", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Basisklasse 2: s1 1. Klasse, s2–s4 2. Klasse, s5 3. Klasse, s6 Königsstufe.
// Je Stufe die Aufgabenarten (mit Wiederholung = häufiger): Art, Erzeuger und ob sie mit den freien Listen gehen.
// Stufe 2 braucht die Reihen (Vergleiche kommen dazu, wenn frei), die Schätzstufen Fragen ihrer Stufe.
const VARIANTEN = {
  s1: [["vergleich", () => ARTEN.vergleich(), FREIE_VERGLEICHE.length]],
  s2: [["ordnen", () => ARTEN.ordnen(3), reihenMit(3).length], ["ordnen", () => ARTEN.ordnen(3), reihenMit(3).length],
       ["vergleich", () => ARTEN.vergleich(), reihenMit(3).length && FREIE_VERGLEICHE.length]],
  s3: [["schaetzen", () => ARTEN.schaetzen(3), fragenDerStufe(3).length]],
  s4: [["schaetzen", () => ARTEN.schaetzen(4), fragenDerStufe(4).length], ["schaetzen", () => ARTEN.schaetzen(4), fragenDerStufe(4).length],
       ["ordnen", () => ARTEN.ordnen(4), reihenMit(4).length]],
  s5: [["schaetzen", () => ARTEN.schaetzen(5), fragenDerStufe(5).length]],
  s6: [["schaetzen", () => ARTEN.schaetzen(6), fragenDerStufe(6).length]],
};
const STUFE = {
  s1: { arten: ["vergleich"] },
  s2: { arten: ["ordnen", "vergleich"], ordnen: 3 },
  s3: { arten: ["schaetzen"] },
  s4: { arten: ["schaetzen", "ordnen"], ordnen: 4 },
  s5: { arten: ["schaetzen"] },
  s6: { arten: ["schaetzen"], knapp: true },
};
for (const [s, v] of Object.entries(VARIANTEN)) {
  const moeglich = v.filter(([, , geht]) => geht);
  if (!moeglich.length) { delete STUFE[s]; continue; }
  STUFE[s].neu = () => waehle(moeglich)[1]();
  STUFE[s].artWechselt = new Set(moeglich.map(([art]) => art)).size > 1; // für ctx.serie
}

function aufgabeErzeugen(stufe) { return STUFE[stufe].neu(); }

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const s = STUFE[stufe];
  if (!s) return ["Stufe wird mit den freien Listen nicht angeboten"];
  if (!s.arten.includes(a.art)) m.push("Aufgabentyp gehört nicht in diese Stufe");
  // Inhalt aus einer freien Liste
  const frei = a.art === "vergleich" ? FREIE_VERGLEICHE.some(v => v[1] === a.richtig)
    : a.art === "ordnen" ? FREIE_REIHEN.some(r => r[1] === a.reihe)
    : FREIE_FRAGEN.some(f => f[1] === a.frage);
  if (!frei) m.push("Inhalt stammt nicht aus einer freien Liste");
  for (const f of SCHAETZFRAGEN) if (!frageListe(f)) m.push(`Schätzfrage «${f[1]}»: Einheit gehört zu keiner Liste`);
  if (a.optionen && (!a.optionen.includes(a.richtig) || new Set(a.optionen.map(String)).size !== a.optionen.length)) m.push("Auswahl doppelt oder ohne Lösung");
  if (a.art === "schaetzen") {
    const f = SCHAETZFRAGEN.find(x => x[1] === a.frage);
    if (!f) m.push("Frage nicht in der Liste");
    else if (f[0] > STUFE_NR[stufe] || f[0] < STUFE_NR[stufe] - 1) m.push("Frage aus einer anderen Stufe");
    else if (f[2] !== a.richtig) m.push("Lösung passt nicht zur Liste");
  }
  if (a.art === "ordnen") {
    if (a.reihe.length !== s.ordnen) m.push("falsche Zahl von Dingen zum Ordnen");
    if (new Set(a.reihe.map(d => d[1])).size !== a.reihe.length) m.push("Ding doppelt in der Reihe");
  }
  return m;
}

const HINWEIS = {
  schwerer: "Stell dir vor, du müsstest beide hochheben. Was wäre schwerer?",
  länger: "Stell dir beide nebeneinander vor. Was reicht weiter?",
  grösser: "Stell dir beide nebeneinander vor. Was ist höher?",
};

// Hinweis beim Schätzen nach der Einheit der Lösung: zwei Referenzgrössen, ohne die Antwort zu
// nennen. Je Referenz ein Stichwort: Kommt es in der Frage vor, wäre die Referenz die Antwort
// selbst (Frage „Tafel Schokolade“, Referenz „100 g eine Tafel Schokolade“) und wird übersprungen,
// ebenso eine Referenz mit genau dem gesuchten Wert („1 l Wasser wiegt 1 kg“ bei der Lösung 1 kg).
const MASS_HINWEIS = [
  [["cm", "m"], [["Fingernagel", "1 cm ist so breit wie ein Fingernagel"], ["Schritt", "1 m ist ein grosser Schritt"],
    ["Lineal", "ein langes Lineal ist 30 cm lang"]]],
  [["kg", "g"], [["Mehl", "1 kg wiegt eine Packung Mehl"], ["Schokolade", "100 g wiegt eine Tafel Schokolade"],
    ["Wasser", "1 l Wasser wiegt 1 kg"], ["Zucker", "ein Würfelzucker wiegt etwa 3 g"]]],
  [["l", "dl"], [["Milch", "1 l passt in eine Milchpackung"], ["Glas", "1 dl ist ein halbes Glas"],
    ["Flasche", "in eine kleine Wasserflasche passen 5 dl"]]],
];
function schaetzHinweis(a, knapp) {
  if (knapp) return "Nicht ganz. Vergleiche mit etwas, das du kennst.";
  const einheit = a.richtig.split(" ")[1];
  const eintrag = MASS_HINWEIS.find(([e]) => e.includes(einheit));
  if (!eintrag) return "Denk an etwas, das du kennst, und vergleiche.";
  const saetze = eintrag[1].filter(([stichwort, satz]) => !a.frage.toLowerCase().includes(stichwort.toLowerCase()) && !new RegExp(`(^|\\D)${a.richtig}\\b`).test(satz)).slice(0, 2).map(([, satz]) => satz);
  return `Denk an etwas, das du kennst: ${saetze.join(", ")}.`;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): sich die Dinge vorstellen, Referenzgrössen
 * (schaetzHinweis lässt eine Referenz mit dem gesuchten Wert schon weg), Unmögliches ausschliessen.
 */
function tippsFuer(a) {
  if (a.art === "vergleich") return [HINWEIS[a.eigenschaft], "Denk an die echten Dinge, nicht an die Bilder: Die Bilder sind alle gleich gross."];
  if (a.art === "ordnen") {
    const wort = a.richtung.startsWith("leicht") ? "Leichteste" : a.richtung.startsWith("kurz") ? "Kürzeste" : "Kleinste";
    return [`Fang mit dem ${wort}n an.`, `Dann suchst du von den übrigen Dingen wieder das ${wort}.`];
  }
  return ["Stell dir das Ding gut vor und vergleiche mit etwas, das du kennst.", schaetzHinweis(a, false),
    "Zwei Antworten sind viel zu gross oder viel zu klein. Welche wären unmöglich?"].filter((t, i, l) => l.indexOf(t) === i);
}

LS.spiel({
  id: "schaetz-waage",
  einleitung: "Was ist schwerer, was ist länger? Und wie lang ist eigentlich ein Bleistift? Schätz mal!",
  hilfe: "Tippe die passende Antwort an. Sollst du ordnen, tippst du die Dinge der Reihe nach an — zuerst das, was vorne in die Reihe gehört.",
  anzahl: 8,
  stufen: Object.fromEntries(Object.entries({
    s1: "Vergleichen: Was ist schwerer, länger, grösser?",
    s2: "Drei Dinge ordnen: leicht → schwer.",
    s3: "Zentimeter und Meter schätzen.",
    s4: "Zentimeter und Meter, schwieriger — und vier Dinge ordnen.",
    s5: "Kilogramm, Gramm, Liter und Deziliter schätzen.",
    s6: "Kilometer, Millimeter, Tonnen, Milliliter, Stunden, Minuten, Sekunden.",
  }).filter(([s]) => STUFE[s])),

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (STUFE[ctx.stufe].artWechselt) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a));
    if (a.art === "vergleich") {
      ctx.flaeche.append(el("div", { class: "frage", text: `Was ist ${a.eigenschaft}?` }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 140,
        inhalt: ([bild, name]) => ({ bild, text: name.split(" ")[1] }),
        hinweis: HINWEIS[a.eigenschaft],
        loesung: `${a.richtig[1][0].toUpperCase()}${a.richtig[1].slice(1)} ist ${a.eigenschaft}.`,
        lob: `Richtig: ${a.richtig[1][0].toUpperCase()}${a.richtig[1].slice(1)} ist ${a.eigenschaft}! 💪`,
      });
    } else if (a.art === "ordnen") {
      // Ohne Pfeil, damit die Eule den Auftrag vorlesen kann: „leicht → schwer“ wird „von leicht nach schwer“.
      const [von, bis] = a.richtung.split(/\s*→\s*/);
      ctx.flaeche.append(el("div", { class: "frage", text: `Ordne von ${von} nach ${bis}.` }));
      LS.reihenfolge(ctx, {
        reihe: a.reihe, breite: 120, pfeile: true,
        inhalt: ([bild, name]) => ({ bild, text: name }), ablage: ([bild, name]) => `${bild} ${name}`,
        // Verrät nicht, welches Ding an der Reihe ist.
        hinweis: () => {
          const wort = a.richtung.startsWith("leicht") ? "Leichteste" : a.richtung.startsWith("kurz") ? "Kürzeste" : "Kleinste";
          return `Fang mit dem ${wort}n an. Welches ist von den übrigen Dingen das ${wort}?`;
        },
        loesung: a.reihe.map(d => d[1]).join(" → "),
      });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 110,
        hinweis: schaetzHinweis(a, STUFE[ctx.stufe].knapp),
        loesung: `${a.frage} — ungefähr ${a.richtig}.`,
        lob: `Gut geschätzt: ungefähr ${a.richtig}! 📏`,
      });
    }
    if (ctx.nr === 0) ctx.sag("Stell es dir gut vor und tipp auf deine Antwort.");
  },
});
</script>
</body>
</html>
