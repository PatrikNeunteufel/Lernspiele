<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound-Sorter</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(17px, 3.8vw, 22px); font-weight: 800; margin: 2px 0 10px; color: var(--text-leise); }
  .ss-hoer { display: block; margin: 0 auto 12px; border: none; border-radius: 999px; padding: 12px 26px; font-family: inherit;
    font-size: clamp(20px, 4.4vw, 26px); font-weight: 900; background: var(--deko-1); color: #fff; box-shadow: 0 5px 0 var(--deko-7); cursor: pointer; }
  .ss-hoer:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--deko-7); }
  .ss-wahl .wahl-knopf { min-height: 96px; }
  .ss-wahl .wahl-knopf .bild { font-size: clamp(40px, 9vw, 54px); }
  .ss-woerter .wahl-knopf { font-size: clamp(24px, 5.6vw, 34px); min-height: 80px; }
  .korb-knopf small { font-size: 15px; font-weight: 700; opacity: .9; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🔊 Sound-Sorter</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG FS1E.5.C.2.c (Grundanspruch 2. Zyklus): Schrift und Laut vergleichen (Beispiele im
// Lehrplan: my, live, life). Basisklasse 5: s1 4. Klasse (Wort hören, Bild und Wort zuordnen), s2 die
// zwei Laute von i hören, s3 dazu a und o, s4 stummes e nach der Schrift (bit/bite, hop/hope), s5
// 6. Klasse gleicher Laut, andere Schreibung (sea wie tree, my wie bike) mit drei Körben, s6 Königsstufe:
// welches Wort klingt anders — nur nach der Schrift, mit Ausnahmen (give, have, great).
// Gehört wird über die Stimme des Geräts (britisch zuerst, wie Listen & Tap und Spelling Bee); ohne
// englische Stimme erklärt die Eule es und bietet keine Runde an. Abgrenzung: Word-Match übt Wortschatz,
// Spelling Bee das Schreiben, Listen & Tap das Hörverstehen — hier zählt nur der Laut eines Buchstabens.

const { waehle, mische, el } = LS;
const ID = "sound-sorter";

const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : ["woerter"]);
const WOERTER = FREI.has("woerter") ? SOUND_WOERTER : [];
const laut = w => WOERTER.find(x => x[0] === w)?.[1];
const mitLaut = l => WOERTER.filter(x => x[1] === l).map(x => x[0]);

// Stummes e: Vokal + ein Konsonant + e am Ende. Lang mit stummem e nur, wenn der Laut auch lang ist
// (give und have folgen dem Muster und sind trotzdem kurz — sie bleiben für die Königsstufe).
const MIT_E = /[aio][^aeiou]e$/;
const kurzOhneE = ([w, l]) => /^[aio]-kurz$/.test(l) && !w.endsWith("e") && (w.match(/[aeiou]/g) || []).length === 1;
const langMitE = ([w, l]) => /^[aio]-lang$/.test(l) && MIT_E.test(w) && (w.match(/[aeiou]/g) || []).length === 2;

// Stufe 5: lange Laute mit dem Beispielwort des Korbs; die Karte ist anders geschrieben als das Beispiel.
const S5_LAUTE = {
  "ee": { beispiel: "tree", muster: /ee/ },
  "i-lang": { beispiel: "bike", muster: MIT_E },
  "a-lang": { beispiel: "cake", muster: MIT_E },
  "o-lang": { beispiel: "home", muster: MIT_E },
  "oo-lang": { beispiel: "moon", muster: /oo/ },
};
const s5Woerter = () => WOERTER.filter(([w, l]) => S5_LAUTE[l] && !S5_LAUTE[l].muster.test(w));
// Paare für die Beschriftung der Körbe in Stufe 4 (nur Wörter aus der freien Liste).
const STUMM_PAARE = [["bit", "bite"], ["kit", "kite"], ["pin", "pine"], ["hop", "hope"], ["not", "note"], ["cap", "cape"], ["tap", "tape"], ["mad", "made"], ["plan", "plane"]]
  .filter(p => p.every(laut));

// Königsstufe: Familien gleicher Schreibung mit zwei Lauten; drei Wörter mit dem einen, eines mit dem anderen.
const FAMILIEN = {
  i: { laute: ["i-kurz", "i-lang"], passt: w => w.includes("i") },
  a: { laute: ["a-kurz", "a-lang"], passt: w => w.includes("a") && !w.includes("ea") },
  o: { laute: ["o-kurz", "o-lang"], passt: w => w.includes("o") && !w.includes("oo") },
  oo: { laute: ["oo-kurz", "oo-lang"], passt: w => w.includes("oo") },
  ea: { laute: ["ee", "a-lang"], passt: w => w.includes("ea") },
};
const familienWoerter = (f, l) => mitLaut(l).filter(FAMILIEN[f].passt);

/** Beispielwort für einen Korb, nicht das Wort der Karte. */
const beispielFuer = (l, ausser) => SOUND_LAUTE[l].beispiele.find(b => b !== ausser);

const ARTEN = {
  /** Stufe 1: Wort hören, unter drei Bildern mit Wort das richtige antippen. */
  bild() {
    const mitBild = WOERTER.filter(x => x[2]);
    if (mitBild.length < 3) return null;
    const [wort, , bild] = waehle(mitBild);
    // ähnliche zuerst: gleicher Anfangsbuchstabe oder gleicher Vokalbuchstabe
    const aehnlich = mitBild.filter(x => x[0] !== wort && (x[0][0] === wort[0] || laut(x[0])?.[0] === laut(wort)?.[0]));
    const rest = mitBild.filter(x => x[0] !== wort && !aehnlich.includes(x));
    const andere = [...mische(aehnlich), ...mische(rest)].slice(0, 2);
    return { art: "bild", wort, optionen: mische([wort, ...andere.map(x => x[0])]), bilder: Object.fromEntries([[wort, bild], ...andere.map(x => [x[0], x[2]])]) };
  },
  /** Stufe 2–3: Wort hören (nicht sehen) und in den Korb mit seinem Laut legen. */
  hoeren(vokale) {
    const frei = vokale.filter(v => mitLaut(`${v}-kurz`).length && mitLaut(`${v}-lang`).length);
    if (!frei.length) return null;
    const v = waehle(frei);
    const wort = waehle([...mitLaut(`${v}-kurz`), ...mitLaut(`${v}-lang`)]);
    return { art: "hoeren", vokal: v, wort, richtig: laut(wort), koerbe: [`${v}-kurz`, `${v}-lang`] };
  },
  /** Stufe 4: Wort lesen (ohne Ton) — kurz ohne e oder lang mit stummem e? */
  stummesE() {
    const kurz = WOERTER.filter(kurzOhneE), lang = WOERTER.filter(langMitE);
    if (!kurz.length || !lang.length) return null;
    const istLang = Math.random() < 0.5;
    const [wort] = waehle(istLang ? lang : kurz);
    const paar = waehle(STUMM_PAARE.filter(p => !p.includes(wort))) || ["hat", "hate"];
    return { art: "stummesE", wort, paar, richtig: istLang ? "lang" : "kurz", koerbe: ["kurz", "lang"] };
  },
  /** Stufe 5: gleicher Laut, andere Schreibung — drei Körbe. */
  gleicherLaut() {
    const kand = s5Woerter();
    const laute = Object.keys(S5_LAUTE).filter(l => mitLaut(l).length);
    if (!kand.length || laute.length < 3) return null;
    const [wort, l] = waehle(kand);
    const koerbe = mische([l, ...mische(laute.filter(x => x !== l)).slice(0, 2)]);
    return { art: "gleicherLaut", wort, richtig: l, koerbe };
  },
  /** Königsstufe: Welches Wort klingt anders? Nur nach der Schrift. */
  anders() {
    const moeglich = [];
    for (const [f, fam] of Object.entries(FAMILIEN)) {
      for (const [mehr, eins] of [fam.laute, [...fam.laute].reverse()]) {
        if (familienWoerter(f, mehr).length >= 3 && familienWoerter(f, eins).length >= 1) moeglich.push([f, mehr, eins]);
      }
    }
    if (!moeglich.length) return null;
    const [f, mehr, eins] = waehle(moeglich);
    const gleiche = mische(familienWoerter(f, mehr)).slice(0, 3);
    const wort = waehle(familienWoerter(f, eins));
    return { art: "anders", familie: f, wort, gleiche, optionen: mische([wort, ...gleiche]) };
  },
};

const STUFE = {
  s1: [() => ARTEN.bild()],
  s2: [() => ARTEN.hoeren(["i"])],
  s3: [() => ARTEN.hoeren(["i", "a", "o"])],
  s4: [() => ARTEN.stummesE()],
  s5: [() => ARTEN.gleicherLaut()],
  s6: [() => ARTEN.anders()],
};

function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Hör das Wort und tipp auf das richtige Bild.",
  s2: "Hör genau: i wie in sit oder wie in bike?",
  s3: "Dazu a (cat oder cake) und o (dog oder home).",
  s4: "Ohne Ton: Macht das stumme e den Laut lang? bit oder bite?",
  s5: "Gleicher Laut, andere Schrift: sea klingt wie tree. Drei Körbe.",
  s6: "Endgegner: Welches Wort klingt anders? five, kite, give, bike",
};
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  const erwartet = { s1: "bild", s2: "hoeren", s3: "hoeren", s4: "stummesE", s5: "gleicherLaut", s6: "anders" }[stufe];
  if (a.art !== erwartet) m.push(`Art ${a.art} in ${stufe}`);
  if (!laut(a.wort)) m.push("Wort nicht aus einer freien Liste");
  if (!/^[a-z]+$/.test(a.wort)) m.push("Wort mit anderen Zeichen als Kleinbuchstaben");
  if (a.art === "bild") {
    if (a.optionen.length !== 3 || new Set(a.optionen).size !== 3) m.push("nicht drei verschiedene Wörter");
    if (a.optionen.filter(o => o === a.wort).length !== 1) m.push("Wort nicht genau einmal");
    if (new Set(a.optionen.map(o => a.bilder[o])).size !== 3 || a.optionen.some(o => !a.bilder[o])) m.push("Bilder fehlen oder doppelt");
  }
  if (a.art === "hoeren") {
    if (stufe === "s2" && a.vokal !== "i") m.push("Stufe 2: nur i");
    if (a.koerbe.length !== 2 || !a.koerbe.includes(a.richtig) || a.richtig !== laut(a.wort)) m.push("Körbe passen nicht zum Wort");
    if (!a.koerbe.every(k => SOUND_LAUTE[k].buchstabe === a.vokal)) m.push("Körbe nicht für denselben Buchstaben");
  }
  if (a.art === "stummesE") {
    const eintrag = WOERTER.find(x => x[0] === a.wort);
    const soll = langMitE(eintrag) ? "lang" : kurzOhneE(eintrag) ? "kurz" : null;
    if (soll !== a.richtig) m.push("Wort passt nicht zur Regel vom stummen e");
  }
  if (a.art === "gleicherLaut") {
    if (a.koerbe.length !== 3 || new Set(a.koerbe).size !== 3 || a.koerbe.filter(k => k === a.richtig).length !== 1) m.push("nicht drei verschiedene Körbe mit genau einem richtigen");
    if (laut(a.wort) !== a.richtig) m.push("Korb passt nicht zum Laut");
    if (S5_LAUTE[a.richtig]?.muster.test(a.wort)) m.push("Wort geschrieben wie das Beispiel");
    if (a.koerbe.some(k => S5_LAUTE[k]?.beispiel === a.wort)) m.push("Karte gleich wie ein Beispielwort");
  }
  if (a.art === "anders") {
    if (a.optionen.length !== 4 || new Set(a.optionen).size !== 4) m.push("nicht vier verschiedene Wörter");
    const laute = a.optionen.map(laut);
    const anders = a.optionen.filter((o, i) => laute.filter(x => x === laute[i]).length === 1);
    if (anders.length !== 1 || anders[0] !== a.wort) m.push("nicht genau ein Wort mit anderem Laut");
    if (!a.optionen.every(FAMILIEN[a.familie].passt)) m.push("Wörter nicht aus derselben Schreibfamilie");
  }
  return m;
}

/** Korb-Inhalt: Laut mit Beispielwort. */
function korbInhalt(a, k) {
  if (a.art === "stummesE") {
    return k === "kurz" ? { text: "kurz", klein: `wie in ${a.paar[0]}` } : { text: "lang", klein: `stummes e: ${a.paar[1]}` };
  }
  if (a.art === "gleicherLaut") return { text: `wie in ${S5_LAUTE[k].beispiel}` };
  return { text: `${SOUND_LAUTE[k].buchstabe} wie in ${beispielFuer(k, a.wort)}` };
}

const hoerKnopf = wort => el("button", { type: "button", class: "ss-hoer", text: "🔊 nochmal", "aria-label": "Nochmal anhören", onclick: () => LS.sprich(wort, "en") });

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): hören, nachsprechen, mit Beispielwörtern
 * vergleichen, auf das stumme e schauen — nie Wort oder Laut als Antwort.
 */
const TIPPS = {
  bild: ["Hör das Wort nochmal (🔊).", "Sprich es leise nach. Mit welchem Laut fängt es an?"],
  hoeren: ["Hör das Wort nochmal (🔊) und sprich es leise nach.", "Sprich auch die Beispielwörter an den Körben: Welches klingt gleich wie dein Wort?"],
  stummesE: ["Schau aufs Ende des Wortes.", "Ein e am Ende, das man nicht spricht, macht den Vokal davor lang. Ohne dieses e bleibt er kurz."],
  gleicherLaut: ["Hör das Wort nochmal (🔊).", "Sprich die Beispielwörter an den Körben leise: Welches klingt gleich — auch wenn es anders geschrieben ist?"],
  anders: ["Sprich jedes Wort leise vor dich hin.", "Achte nur auf den Laut beim gleichen Buchstaben. Drei klingen gleich, eines anders."],
};

const SPIEL = {
  id: ID,
  // Lob auf Anhieb in der Fremdsprache (LB2 a); Bestätigungen mit dem Lösungswort kommen nur nach einem Fehlversuch
  lob: ["Great!", "Well done!", "Yes!"],
  einleitung: "Sound-Sorter! Gleicher Buchstabe, anderer Laut: i in sit klingt anders als i in bike. Hör genau hin und sortiere!",
  hilfe: stufe => ({
    s1: "Hör das englische Wort (🔊 nochmal) und tippe das passende Bild an.",
    s4: "Lies das Wort — hier gibt es erst nach der Antwort Ton. Lege die Karte in den Korb: kurz oder lang?",
    s6: "Lies die vier Wörter — erst nach der Antwort gibt es Ton. Tippe das Wort an, das anders klingt.",
  })[stufe] || "Hör das Wort (🔊 nochmal) und lege die Karte in den Korb mit dem gleichen Laut.",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    ctx.tipp(TIPPS[a.art]);
    if (ctx.nr === 0) ctx.sag(a.art === "stummesE" || a.art === "anders"
      ? "Hier hörst du erst nach der Antwort etwas. Lies genau!"
      : "Hör zu und sortiere. Mit 🔊 hörst du das Wort nochmal.");
    ctx.kennung(a.wort + (a.gleiche ? ":" + a.gleiche.join(",") : ""));
    const f = ctx.flaeche;

    if (a.art === "bild") {
      f.append(el("div", { class: "frage", text: "Hör zu: Welches Wort hörst du?" }), hoerKnopf(a.wort));
      const box = LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.wort, breite: 110, inhalt: w => ({ bild: a.bilder[w], text: w }),
        hinweis: "Hör nochmal genau hin! Tipp auf 🔊.", loesung: `${a.bilder[a.wort]} ${a.wort}`, lob: waehle(["Great!", "Well done!", "Yes!"]),
      });
      box.classList.add("ss-wahl");
      LS.sprich(a.wort, "en", "", ctx.uhrWarten());
      return;
    }

    if (a.art === "hoeren") {
      ctx.serie("antwort", a.richtig.endsWith("kurz") ? "kurz" : "lang");
      if (ctx.stufe === "s3") ctx.serie("vokal", a.vokal);
      f.append(el("div", { class: "frage", text: `Hör zu: Wie klingt das ${a.vokal}?` }), hoerKnopf(a.wort));
      LS.koerbe(ctx, {
        karte: { bild: "👂", text: "?" }, koerbe: a.koerbe, richtig: a.richtig, korbInhalt: k => korbInhalt(a, k),
        hinweis: "Hör nochmal genau hin und sprich das Wort leise nach. Tipp auf 🔊.",
        loesung: `${a.wort}: ${korbInhalt(a, a.richtig).text}`, lob: `Richtig: ${a.wort}`,
      });
      LS.sprich(a.wort, "en", "", ctx.uhrWarten());
      return;
    }

    if (a.art === "stummesE") {
      ctx.serie("antwort", a.richtig);
      f.append(el("div", { class: "frage", text: "Lies das Wort: Klingt der Vokal kurz oder lang?" }));
      const loesung = a.richtig === "lang" ? `${a.wort}: lang, am Ende steht ein stummes e` : `${a.wort}: kurz, am Ende steht kein stummes e`;
      LS.koerbe(ctx, {
        karte: { text: a.wort }, koerbe: a.koerbe, richtig: a.richtig, korbInhalt: k => korbInhalt(a, k),
        hinweis: "Schau aufs Ende: Steht nach einem Konsonanten noch ein e, das man nicht spricht?",
        loesung, lob: `Richtig: ${a.wort}`,
      });
      // Erst nach der Antwort vorsprechen.
      f.addEventListener("click", () => { if (ctx.vorbei() && !f.dataset.gesprochen) { f.dataset.gesprochen = "1"; LS.sprich(a.wort, "en"); } });
      return;
    }

    if (a.art === "gleicherLaut") {
      ctx.serie("antwort", a.richtig);
      f.append(el("div", { class: "frage", text: "Gleicher Laut, andere Schrift: In welchen Korb gehört das Wort?" }), hoerKnopf(a.wort));
      LS.koerbe(ctx, {
        karte: { text: a.wort }, koerbe: a.koerbe, richtig: a.richtig, korbInhalt: k => korbInhalt(a, k),
        hinweis: "Hör nochmal genau hin und sprich die Wörter auf den Körben leise nach.",
        loesung: `${a.wort} klingt wie ${S5_LAUTE[a.richtig].beispiel}`, lob: `Richtig: ${a.wort} klingt wie ${S5_LAUTE[a.richtig].beispiel}`,
      });
      LS.sprich(a.wort, "en", "", ctx.uhrWarten());
      return;
    }

    // Königsstufe: Welches Wort klingt anders?
    f.append(el("div", { class: "frage", text: "Welches Wort klingt anders? Sprich alle leise vor dich hin." }));
    const loesung = `${a.wort} klingt anders als ${a.gleiche.join(", ")}`;
    const box = LS.auswahl(ctx, {
      optionen: a.optionen, richtig: a.wort, breite: 120, loesung,
      hinweis: "Sprich jedes Wort leise. Achte nur auf den Laut beim gleichen Buchstaben.",
      lob: `Richtig! ${a.wort} klingt anders.`, beiRichtig: () => LS.sprich(a.wort, "en"),
    });
    box.classList.add("ss-woerter");
    box.addEventListener("click", () => { if (ctx.vorbei() && !box.dataset.gesprochen) { box.dataset.gesprochen = "1"; LS.sprich(a.wort, "en"); } });
  },
};

// Startet sofort, wenn eine englische Stimme da ist; sonst wartet es kurz oder erklärt, dass sie fehlt.
LS.spielMitStimme(SPIEL, "en");
</script>
</body>
</html>
