<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlenrätsel-Tresor</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .tresor-zeile {
    display: flex;
    gap: 18px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .tresor {
    position: relative;
    width: 128px;
    height: 128px;
    flex: none;
    perspective: 400px;
  }

  .tresor .innen {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: radial-gradient(circle, #fff6c9, #f5c451);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
  }

  .tresor .tuer {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(145deg, #7b8496, #4b5263);
    box-shadow: inset 0 0 0 6px #5c6475, 0 8px 16px rgba(0, 0, 0, .2);
    transform-origin: left center;
    transition: transform .8s cubic-bezier(.3, 1.4, .5, 1);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tresor .rad {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 6px solid #d7dbe6;
    background: repeating-conic-gradient(#aab1c2 0 10deg, #8d95a8 10deg 20deg);
    transition: transform .8s;
  }

  .tresor.offen .tuer { transform: rotateY(-105deg); }
  .tresor.offen .rad { transform: rotate(270deg); }
  .tresor.ruckeln .tuer { animation: wackeln .4s; }

  .raetsel {
    flex: 1;
    min-width: 260px;
    max-width: 620px;
    background: #fdf8ef;
    border-radius: 18px;
    border: 3px solid #e9dcc4;
    padding: 14px 18px;
    font-size: clamp(19px, 3.4vw, 24px);
    font-weight: 700;
    line-height: 1.45;
  }

  .raetsel .titel { font-weight: 900; color: #a0703d; font-size: .8em; text-transform: uppercase; letter-spacing: 1px; }
  .raetsel ul { margin: 6px 0 0; padding-left: 1.1em; }
  .raetsel .wk { display: inline-block; color: #fff; background: var(--f); border-radius: 8px; padding: 0 8px; font-weight: 900; }
  /* Notizen (NZ1 a): je Bündel „13 T = ✏️“ unter dem Rätsel */
  .tr-notizen { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
  .tr-notizen label { display: inline-flex; align-items: center; gap: 6px; font-size: .85em; }
  .tr-notizen .zw-notiz { font-size: 17px; min-height: 34px; width: calc(7ch + 14px); }
  /* Handy: mit Notizen ein kleinerer Tresor und zwei Notizen je Zeile, damit die Tastatur im Bild bleibt */
  @media (max-width: 560px) {
    .tresor-zeile:has(.tr-notizen) { gap: 8px; margin-bottom: 8px; }
    .tresor-zeile:has(.tr-notizen) .tresor { width: 64px; height: 64px; }
    .tresor-zeile:has(.tr-notizen) .innen { font-size: 30px; }
    .tresor-zeile:has(.tr-notizen) .rad { width: 34px; height: 34px; border-width: 4px; }
    .tresor-zeile:has(.tr-notizen) .raetsel { padding: 10px 12px; }
    .tr-notizen { gap: 4px 10px; margin-top: 4px; }
    .tr-notizen label { gap: 4px; }
    .tr-notizen .zw-notiz { width: calc(6ch + 12px); font-size: 15px; min-height: 32px; padding: 2px 4px; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🔐 Zahlenrätsel-Tresor</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>

<script src="../gemeinsam/notizblock.js"></script>
<script src="../gemeinsam/abgleich.js"></script>

<script>
"use strict";
// Lernziel 4.2-E1: Mit den Wertziffern sicher sein und schwierige Zahlenrätsel lösen.
// Rätselarten: Bündeln (13 T = 1 ZT 3 T), Nachbarzahl (3 ZT grösser als …),
// Ziffernrätsel mit Hinweisen, „Wie viele H stecken in …?“.

const { STELLEN, zahlText, zufall, waehle, mische, el } = LS;
const ST = Object.fromEntries(STELLEN.map(s => [s.k, s]));
const wk = (anzahl, k) => `<span class="wk st st-${k}">${anzahl} ${k}</span>`;
const LAENGEN_WORT = { 2: "zwei", 3: "drei", 4: "vier", 5: "fünf", 6: "sechs", 7: "sieben" };
/** Teile nach Stelle ordnen: grösste Stelle links (Einstellung „geordnet“ im Profil). */
const groesseZuerst = (a, b) => ST[b.k].wert - ST[a.k].wert;
const summeTeile = teile => teile.reduce((s, t) => s + t.n * ST[t.k].wert, 0);
const VERSUCHE = 200; // Zufallssuche je Rätsel; danach ein sicher gültiger Notausgang

/** Bündeln: Zahl aus Teilen; einige Teile haben mehr als 9 Einheiten (13 T = 1 ZT 3 T). */
function buendeln(p, geordnet) {
  let teile = null;
  for (let v = 0; v < VERSUCHE && !teile; v++) {
    const versuch = mische(p.stellen).slice(0, p.teile).map(k => ({ k, n: zufall(1, 9) }));
    // Die höchste erlaubte Stelle bekommt kein Bündel, sonst wird der Zahlenraum gesprengt.
    versuch.filter(t => t.k !== p.stellen[0]).slice(0, zufall(...p.gross)).forEach(t => { t.n = zufall(...p.bereich); });
    if (summeTeile(versuch) < p.max) teile = versuch;
  }
  // Notausgang: ohne Bündel bleibt jede Zahl im Zahlenraum (lauter Ziffern 1–9 an verschiedenen Stellen).
  if (!teile) teile = mische(p.stellen).slice(0, p.teile).map(k => ({ k, n: zufall(1, 9) }));
  const loesung = summeTeile(teile);
  if (geordnet) teile.sort(groesseZuerst);
  const gebuendelt = teile.some(t => t.n > 9);
  return {
    art: "buendeln", teile,
    html: `<div class="titel">Wer bin ich?</div>Ich bestehe aus ${teile.map(t => wk(t.n, t.k)).join(" + ")}.`,
    loesung,
    hinweis: p.knapp ? "Bündle, wo es nötig ist!" : gebuendelt ? "Bündle! 10 Einer sind 1 Zehner, 10 Zehner sind 1 Hunderter, …" : "Jeder Baustein gehört an seine Stelle. Leere Stellen bekommen eine 0.",
    erklaerung: teile.map(t => `${t.n} ${t.k} = ${zahlText(t.n * ST[t.k].wert)}`).join(", "),
  };
}

/** Nachbarzahl: um einige Wertziffern grösser oder kleiner als eine gegebene Zahl. */
function nachbar(p, geordnet) {
  let basis, teile, plus, loesung;
  for (let v = 0; v < VERSUCHE; v++) {
    basis = zufall(...p.basis);
    teile = mische(p.nStellen).slice(0, p.nTeile).map(k => ({ k, n: zufall(1, p.nMax) }));
    plus = Math.random() < 0.5;
    loesung = plus ? basis + summeTeile(teile) : basis - summeTeile(teile);
    if (loesung > 0 && loesung < p.max) break;
  }
  if (!(loesung > 0 && loesung < p.max)) {
    // Notausgang: 1 E grösser als die kleinste Basis — liegt immer im Zahlenraum.
    basis = p.basis[0]; teile = [{ k: "E", n: 1 }]; plus = true; loesung = basis + 1;
  }
  if (geordnet) teile.sort(groesseZuerst);
  const diff = summeTeile(teile);
  return {
    art: "nachbar", basis, teile, plus,
    html: `<div class="titel">Wer bin ich?</div>Ich bin ${teile.map(t => wk(t.n, t.k)).join(" und ")} ${plus ? "grösser" : "kleiner"} als <b>${zahlText(basis)}</b>.`,
    loesung,
    hinweis: p.knapp ? (plus ? "Dazuzählen — und an den Übertrag denken!" : "Wegnehmen — und ans Entbündeln denken!")
      : plus ? "Zähle die Teile dazu. Achtung beim Übertrag in die nächste Stelle!" : "Nimm die Teile weg. Achtung, wenn eine Stelle nicht reicht!",
    erklaerung: `${zahlText(basis)} ${plus ? "+" : "−"} ${zahlText(diff)}`,
  };
}

/** Ziffernrätsel: Zahl aus Hinweisen über ihre Ziffern bestimmen. */
function ziffernraetsel(p) {
  const laenge = p.laenge;
  const stellen = STELLEN.slice(7 - laenge);
  for (let v = 0; ; v++) {
    const z = {};
    // Nach vielen Fehlversuchen ohne Nullen würfeln: dann gibt es sicher genug Ziffern über 0.
    stellen.forEach((st, i) => { z[st.k] = i === 0 || v >= VERSUCHE ? zufall(1, 9) : (Math.random() < 0.3 ? 0 : zufall(1, 9)); });
    const [a, b, c] = mische(stellen.filter(st => z[st.k] > 0)).slice(0, 3);
    if (!b || (laenge >= 3 && !c)) continue;
    const hinweise = [`Ich bin ${LAENGEN_WORT[laenge]}stellig.`];
    hinweise.push(`Meine ${a.k}-Ziffer ist ${z[a.k]}.`);
    const diff = z[b.k] - z[a.k];
    if (z[b.k] === 2 * z[a.k]) hinweise.push(`Meine ${b.k}-Ziffer ist doppelt so gross wie meine ${a.k}-Ziffer.`);
    else if (diff !== 0) hinweise.push(`Meine ${b.k}-Ziffer ist um ${Math.abs(diff)} ${diff > 0 ? "grösser" : "kleiner"} als meine ${a.k}-Ziffer.`);
    else hinweise.push(`Meine ${b.k}-Ziffer ist gleich wie meine ${a.k}-Ziffer.`);
    if (c && p.summe) {
      hinweise.push(`Wenn du meine ${a.k}-, ${b.k}- und ${c.k}-Ziffer zusammenzählst, erhältst du ${z[a.k] + z[b.k] + z[c.k]}.`);
    } else if (c) {
      hinweise.push(`Meine ${c.k}-Ziffer ist ${z[c.k]}.`);
    }
    const rest = stellen.filter(st => ![a, b, c].includes(st));
    const nullen = rest.filter(st => z[st.k] === 0);
    const andere = rest.filter(st => z[st.k] !== 0);
    andere.forEach(st => hinweise.push(`Bei den ${LS.dativ(st)} steht eine ${z[st.k]}.`));
    if (nullen.length) hinweise.push(nullen.length === 1 ? `Meine ${nullen[0].k}-Ziffer ist 0.` : `Bei ${nullen.map(s => s.k).join(", ")} steht jeweils eine 0.`);
    const loesung = stellen.reduce((s, st) => s + z[st.k] * st.wert, 0);
    return {
      // Für die Prüfung: welche Stellen ein Hinweis festlegt (a direkt, b über a, c direkt oder über die Summe, Rest direkt).
      art: "ziffernraetsel", z, laenge, bestimmt: [a, b, c, ...rest].filter(Boolean).map(st => st.k), anzahlHinweise: hinweise.length,
      html: `<div class="titel">Wer bin ich?</div><ul>${mische(hinweise.slice(1)).reduce((h, x) => h + `<li>${x}</li>`, `<li>${hinweise[0]}</li>`)}</ul>`,
      loesung,
      hinweis: "Mach dir eine Stellenwerttabelle und trag jede Ziffer ein, die du schon weisst.",
      erklaerung: stellen.map(st => `${z[st.k]} ${st.k}`).join(", "),
    };
  }
}

/** „Wie viele H stecken in …?“ — Anzahl ganzer Einheiten einer Stelle. */
function wieViele(p) {
  const k = waehle(p.wieViele);
  const zahl = zufall(...(p.wZahl || [10000, 999999]));
  const loesung = Math.floor(zahl / ST[k].wert);
  return {
    art: "wieViele", k, zahl,
    html: `<div class="titel">Knacknuss</div>Wie viele <span class="wk st st-${k}">${k}</span> (${ST[k].name}) stecken insgesamt in <b>${zahlText(zahl)}</b>?`,
    loesung,
    hinweis: p.knapp ? "Nicht nur die eine Ziffer zählt!" : `Nicht nur die ${k}-Ziffer zählt! Alles links davon sind auch ${ST[k].name}.`,
    erklaerung: `${zahlText(zahl)} hat ${zahlText(loesung)} ganze ${ST[k].name}`,
  };
}

const OHNE_M = ["HT", "ZT", "T", "H", "Z", "E"];

// Je Stufe: Bündeln (Stellen, Teile, Anzahl Bündel, Bündelgrösse), Nachbarzahl (Basis, Stellen,
// Teile, grösste Ziffer), Ziffernrätsel (Länge, Summenhinweis), Knacknuss-Stellen, Rätselarten.
const P = {
  s1: { stellen: ["H", "Z", "E"], teile: 3, gross: [1, 1], bereich: [10, 19], max: 1000,
        basis: [100, 899], nStellen: ["H", "Z", "E"], nTeile: 1, nMax: 9,
        laenge: 3, summe: false, arten: [buendeln, nachbar, ziffernraetsel] },
  s2: { stellen: ["T", "H", "Z", "E"], teile: 3, gross: [1, 1], bereich: [10, 19], max: 10000,
        basis: [1000, 8999], nStellen: ["T", "H", "Z"], nTeile: 1, nMax: 5,
        laenge: 4, summe: false, arten: [buendeln, nachbar, ziffernraetsel] },
  s3: { stellen: OHNE_M, teile: 3, gross: [1, 1], bereich: [10, 19], max: 1000000,
        basis: [10000, 899999], nStellen: ["HT", "ZT", "T", "H", "Z"], nTeile: 1, nMax: 5,
        laenge: 5, summe: false, arten: [buendeln, nachbar, ziffernraetsel] },
  s4: { stellen: OHNE_M, teile: 4, gross: [1, 2], bereich: [11, 45], max: 1000000,
        basis: [10000, 899999], nStellen: ["HT", "ZT", "T", "H", "Z"], nTeile: 2, nMax: 9,
        laenge: 6, summe: true, wieViele: ["Z", "H", "T"], arten: [buendeln, nachbar, ziffernraetsel, wieViele] },
  s5: { stellen: OHNE_M, teile: 4, gross: [2, 3], bereich: [11, 99], max: 1000000,
        basis: [10000, 899999], nStellen: ["HT", "ZT", "T", "H", "Z", "E"], nTeile: 3, nMax: 9,
        laenge: 6, summe: true, wieViele: ["H", "T", "ZT"], arten: [buendeln, nachbar, ziffernraetsel, wieViele] },
  // Königsstufe: bis knapp 10 Millionen (sieben Ziffern auf der Tastatur), knappe Hinweise.
  s6: { stellen: ["M", ...OHNE_M], teile: 5, gross: [2, 3], bereich: [11, 99], max: 10000000,
        basis: [1000000, 8999999], nStellen: ["M", ...OHNE_M], nTeile: 3, nMax: 9,
        laenge: 7, summe: true, wieViele: ["Z", "H", "T", "ZT"], wZahl: [1000000, 9999999], knapp: true,
        arten: [buendeln, nachbar, ziffernraetsel, wieViele] },
};

/** Für das Testskript: ein zufälliges Rätsel der Stufe. */
function aufgabeErzeugen(stufe) {
  return waehle(P[stufe].arten)(P[stufe], Math.random() < 0.5);
}

function pruefeAufgabe(r, stufe) {
  const m = [];
  const p = P[stufe];
  if (!Number.isInteger(r.loesung) || r.loesung <= 0 || r.loesung >= p.max) m.push(`Lösung ${r.loesung} ausserhalb 1–${p.max - 1}`);
  if (String(r.loesung).length > 7) m.push("passt nicht in die Tastatur");
  if (r.art === "buendeln") {
    if (summeTeile(r.teile) !== r.loesung) m.push("Summe stimmt nicht");
    if (r.teile.some(t => !p.stellen.includes(t.k))) m.push("Stelle nicht erlaubt");
    if (new Set(r.teile.map(t => t.k)).size !== r.teile.length) m.push("Stelle doppelt");
    if (r.teile.some(t => t.n > 9 && t.k === p.stellen[0])) m.push("Bündel an der höchsten Stelle");
  } else if (r.art === "nachbar") {
    if (r.basis + (r.plus ? 1 : -1) * summeTeile(r.teile) !== r.loesung) m.push("Nachbarzahl stimmt nicht");
  } else if (r.art === "ziffernraetsel") {
    const stellen = STELLEN.slice(7 - r.laenge);
    if (stellen.reduce((s, st) => s + r.z[st.k] * st.wert, 0) !== r.loesung) m.push("Ziffern ergeben die Lösung nicht");
    if (String(r.loesung).length !== r.laenge) m.push("Länge stimmt nicht");
    // Eindeutig: jede Stelle ist durch genau einen Hinweis festgelegt.
    if (r.bestimmt.length !== r.laenge || new Set(r.bestimmt).size !== r.laenge) m.push("nicht jede Stelle bestimmt");
  } else if (r.art === "wieViele") {
    if (r.loesung !== Math.floor(r.zahl / ST[r.k].wert)) m.push("Anzahl stimmt nicht");
  } else m.push("unbekannte Rätselart");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Vorgehen je Rätselart, ausführlicher als die knappen
 * Hinweise der Königsstufe (ein Tipp kostet einen halben Fehler) — nie der Code oder eine Zwischenzahl.
 * Das Beispiel bei der Knacknuss ist viel kleiner als jede Rätselzahl, also nie die Lösung.
 */
const WIEVIELE_BSP = Object.fromEntries([["Z", 560], ["H", 3400], ["T", 72000], ["ZT", 830000]]
  .map(([k, z]) => [k, `In ${zahlText(z)} stecken ${zahlText(z / ST[k].wert)} ${k}.`]));
function tippsFuer(r, p) {
  if (r.art === "buendeln") return ["Schreib jeden Teil an seine Stelle in einer Stellenwerttabelle.",
    "Hat ein Teil mehr als 9, bündelst du: 10 Einer sind 1 Zehner, 10 Zehner sind 1 Hunderter, …",
    "Stellen ohne Teil bekommen eine 0."];
  if (r.art === "nachbar") return ["Schreib die Zahl ab und schau, an welchen Stellen sich etwas ändert.",
    r.plus ? "Zähl die Teile an ihrer Stelle dazu. Wird eine Stelle grösser als 9, gibt es einen Übertrag nach links."
      : "Nimm die Teile an ihrer Stelle weg. Reicht eine Stelle nicht, entbündelst du einen von der Stelle links davon."];
  if (r.art === "ziffernraetsel") return ["Mach dir eine Stellenwerttabelle und trag jede Ziffer ein, die du schon weisst.",
    "Fang mit den Hinweisen an, die eine Ziffer direkt nennen. Dann kommen die, die zwei Ziffern vergleichen.",
    ...(p.summe ? ["Beim Zusammenzählen-Hinweis: Zähl die Ziffern, die du schon kennst, zusammen. Wie viel fehlt noch?"] : [])];
  return [`Nicht nur die ${r.k}-Ziffer zählt! Alles links davon sind auch ${ST[r.k].name}.`,
    `${WIEVIELE_BSP[r.k]} Deck die Ziffern rechts von der ${r.k}-Stelle ab.`];
}

LS.spiel({
  id: "zahlenraetsel-tresor",
  // Abschluss-Animation (Block M1, AR1 a; docs/konzept_abschluss_animationen.md 8): der Tresor geht auf, je Stufe liegt mehr darin
  feier: { muster: "sammeln", bilder: "tresor", ziele: { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 } },
  einleitung: "Im Tresor liegt ein Schatz! Jedes Rätsel verrät dir den Code. Rechne gut — die Zahl ist der Schlüssel.",
  hilfe: "Lies das Rätsel neben dem Tresor. Die gesuchte Zahl ist der Code: Tipp sie ein und drück OK. Stimmt der Code, geht der Tresor auf.",
  anzahl: 6,
  stufen: {
    s1: "Bis 1000, mit einem Bündel wie 13 Z.",
    s2: "Bis 10 000: ein Bündel wie 14 H, „3 H grösser als 4520“.",
    s3: "Bündeln mit 10–19 Teilen, Nachbarzahlen, Rätsel mit klaren Hinweisen.",
    s4: "Grosse Bündel, zwei Teile auf einmal, Summen-Hinweise und Knacknüsse.",
    s5: "Mehrere grosse Bündel, drei Teile auf einmal — für echte Profis.",
    s6: "Millionen-Rätsel mit vielen Bündeln — und die Eule hilft kaum.",
  },

  aufgabe(ctx) {
    // Jede Rätselart kommt in einer Runde vor, danach zufällig.
    const arten = P[ctx.stufe].arten;
    const art = ctx.nr < arten.length ? arten[ctx.nr] : waehle(arten);
    const r = art(P[ctx.stufe], ctx.geordnet);
    ctx.serie("art", r.art);
    if (r.art === "nachbar") ctx.serie("richtung", r.plus);
    const loesung = `${r.erklaerung} → Code ${zahlText(r.loesung)}`;
    ctx.loesung(loesung);
    ctx.schritte(LS.tippSchritte(r.loesung));
    ctx.tipp(tippsFuer(r, P[ctx.stufe]));

    const tresor = el("div", { class: "tresor", "aria-hidden": "true",
      html: `<div class="innen">${waehle(["💎", "👑", "🏆", "💰", "🪙", "🎁"])}</div><div class="tuer"><div class="rad"></div></div>` });
    const raetsel = el("div", { class: "raetsel", html: r.html });
    // Notizen (NZ1 a): ab Stufe 4 (zwei und mehr Bündel) je Bündel ein Feld „13 T = …“ im Rätsel, dort wo der Teil steht.
    const buendel = r.art === "buendeln" ? r.teile.filter(t => t.n > 9) : [];
    if (buendel.length && ctx.notizen(Number(ctx.stufe.slice(1)) >= 4))
      raetsel.append(el("div", { class: "tr-notizen" }, ...buendel.map(t =>
        el("label", {}, el("span", { class: `wk st st-${t.k}`, text: `${t.n} ${t.k}` }), el("span", { text: "=" }),
          LS.notizFeld({ breite: 8, label: `Notiz: ${t.n} ${t.k} als Zahl` })))));
    ctx.flaeche.append(el("div", { class: "tresor-zeile" }, tresor, raetsel));

    const anzeige = el("div", { class: "anzeige leer", "aria-label": "Code" });
    ctx.flaeche.append(anzeige);
    const tasten = LS.tastatur({
      anzeige,
      maxStellen: 7,
      onOk(w) {
        if (w === r.loesung) {
          tasten.gesperrt = true;
          anzeige.classList.add("richtig");
          tresor.classList.add("offen");
          ctx.richtig("Klack — der Tresor ist offen! 🎉");
          return;
        }
        anzeige.classList.add("falsch");
        tresor.classList.remove("ruckeln");
        void tresor.offsetWidth;
        tresor.classList.add("ruckeln");
        ctx.falsch(r.hinweis, loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) { tasten.gesperrt = true; tresor.classList.add("offen"); }
      },
    });
    ctx.flaeche.append(tasten.element);
    if (ctx.nr === 0) ctx.sag("Lies das Rätsel genau und tipp den Code ein.");
  },
});
</script>
