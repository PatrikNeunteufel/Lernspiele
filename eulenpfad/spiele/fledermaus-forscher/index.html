<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fledermaus-Forscher</title>
<script src="../../kern/kern-kopf.js" data-speicher="lernspiele:"></script>
<link rel="stylesheet" href="../../kern/kern.css">
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .nacht { /* Gleich in beiden Modi: Nachthimmel mit weisser Schrift */  background: linear-gradient(180deg, #1e1b4b, #3b3486); border-radius: 20px; padding: 14px; color: #fff; margin-bottom: 14px; text-align: center; }
  .nacht .bild { font-size: clamp(54px, 12vw, 80px); line-height: 1.1; }
  .nacht .aussage { font-size: clamp(20px, 4.6vw, 30px); font-weight: 800; margin-top: 6px; }
  .wahl-knopf.ja { background: var(--gut-hell); }
  .wahl-knopf.nein { background: var(--taste-loeschen); }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🦇 Fledermaus-Forscher</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="fakten.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.2.3.e: Informationen zu Wachstum, Entwicklung und Fortpflanzung von Säugetieren
// erschliessen und festhalten (z.B. in Steckbriefen); NMG.2.4.d (Orientierungspunkt): Merkmale
// beschreiben, die einem Tier das Leben in einem Lebensraum erlauben. Fakten in fakten.js.

const { waehle, mische, el } = LS;
const ID = "fledermaus-forscher";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : FLEDERMAUS_LISTEN);
const nurFrei = (liste, daten) => (FREI.has(liste) ? daten : []);

const AUSSAGEN = nurFrei("aussagen", FLEDERMAUS_AUSSAGEN).map(([ab, text, stimmt, erklaerung]) => ({ ab, text, stimmt, erklaerung }));
const FRAGEN = nurFrei("fragen", FLEDERMAUS_FRAGEN).map(([ab, frage, richtig, f1, f2, erklaerung]) => ({ ab, frage, richtig, falsch: [f1, f2], erklaerung }));
const JAHR = nurFrei("jahr", FLEDERMAUS_JAHR);
const ANPASSUNGEN = nurFrei("anpassungen", FLEDERMAUS_ANPASSUNGEN);
// Die Fakten tragen „ab Stufe“ 1–5 (fakten.js). Basisklasse 2: Stufe 1 = 1. Klasse, 2–4 = 2. Klasse,
// 5 = 3. Klasse. Die Königsstufe (6) nimmt nur die schweren Inhalte (ab 4 und 5).
const STUFE_NR = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 };
const SCHWER_AB = 4;

/** Vor allem neue Inhalte dieser Stufe, dazu etwas aus der Stufe davor; Königsstufe: alles Schwere. */
const passend = (liste, n) => liste.filter(x => (n === 6 ? x.ab >= SCHWER_AB : x.ab === n || x.ab === n - 1));

// In einer Runde jede Aussage und Frage höchstens einmal.
let gebraucht = new Set();
function frisch(liste) {
  const neu = liste.filter(x => !gebraucht.has(x));
  const x = waehle(neu.length ? neu : liste);
  gebraucht.add(x);
  return x;
}

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  aussage: n => {
    const liste = passend(AUSSAGEN, n);
    return liste.length ? { art: "aussage", a: frisch(liste) } : null;
  },
  frage: n => {
    const liste = passend(FRAGEN, n).length ? passend(FRAGEN, n) : FRAGEN.filter(x => x.ab <= n);
    if (!liste.length) return null;
    const f = frisch(liste);
    return { art: "frage", f, optionen: mische([f.richtig, ...f.falsch]) };
  },
  jahr: () => (JAHR.length ? { art: "jahr", reihe: JAHR.map(([zeit, was]) => `${zeit}: ${was}`) } : null),
  anpassung: () => {
    if (ANPASSUNGEN.length < 3) return null;
    const [merkmal, nutzen] = waehle(ANPASSUNGEN);
    const andere = mische(ANPASSUNGEN.filter(x => x[0] !== merkmal)).slice(0, 2).map(x => x[1]);
    return { art: "anpassung", merkmal, richtig: nutzen, optionen: mische([nutzen, ...andere]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [() => ARTEN.aussage(1), () => ARTEN.aussage(1), () => ARTEN.frage(1)],
  s2: [() => ARTEN.aussage(2), () => ARTEN.frage(2)],
  s3: [() => ARTEN.aussage(3), () => ARTEN.frage(3)],
  s4: [() => ARTEN.aussage(4), () => ARTEN.frage(4), ARTEN.jahr],
  s5: [() => ARTEN.aussage(5), () => ARTEN.frage(5), ARTEN.anpassung, ARTEN.jahr],
  s6: [() => ARTEN.aussage(6), () => ARTEN.frage(6), ARTEN.anpassung, ARTEN.jahr],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Stimmt das? Schlafen, fliegen, kopfüber hängen.",
  s2: "Der Körper: Fell, Flughaut, Milch für die Jungen.",
  s3: "Echo, Insekten und Winterschlaf.",
  s4: "Das Jahr einer Fledermaus und die Wochenstube.",
  s5: "Wozu helfen die grossen Ohren? Fledermäuse schützen.",
  s6: "Endgegner: das Jahr ohne Jahreszeiten, Merkmale und schwere Fragen gemischt.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
// Stufen, in denen die freien Listen mehr als eine Aufgabenart hergeben (nur dort ctx.serie("art")).
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (fakten.js). */
function herkunft(a) {
  if (a.art === "aussage") return FLEDERMAUS_AUSSAGEN.some(x => x[1] === a.a.text) ? ["aussagen"] : ["?"];
  if (a.art === "frage") return FLEDERMAUS_FRAGEN.some(x => x[1] === a.f.frage) ? ["fragen"] : ["?"];
  if (a.art === "jahr") return a.reihe.every(r => FLEDERMAUS_JAHR.some(([zeit, was]) => r === `${zeit}: ${was}`)) ? ["jahr"] : ["?"];
  return [a.merkmal, ...a.optionen].every(t => FLEDERMAUS_ANPASSUNGEN.some(x => x.includes(t))) ? ["anpassungen"] : ["?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  const n = STUFE_NR[stufe];
  if (a.art === "aussage" && a.a.ab > n) m.push("Aussage aus einer höheren Stufe");
  if (a.art === "frage" && (a.f.ab > n || new Set(a.optionen).size !== 3)) m.push("Frage zu schwer oder Auswahl doppelt");
  if (n === 6 && (a.art === "aussage" ? a.a.ab : a.art === "frage" ? a.f.ab : SCHWER_AB) < SCHWER_AB) m.push("leichter Inhalt in der Königsstufe");
  if (a.art === "jahr" && n < 4) m.push("Jahr der Fledermaus vor Stufe 4");
  if (a.art === "anpassung" && n < 5) m.push("Merkmal/Nutzen vor Stufe 5");
  if (a.art === "anpassung" && FLEDERMAUS_ANPASSUNGEN.filter(x => a.optionen.includes(x[1]) && x[0] === a.merkmal).length !== 1) m.push("Merkmal passt zu keiner oder mehreren Antworten");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Vorgehen und Steckbrief — nie die Antwort und
 * kein Wort aus den Antwortknöpfen.
 */
function tippsFuer(a) {
  if (a.art === "aussage") return ["Lies den Satz langsam — oft macht ein einziges Wort ihn falsch.",
    "Denk an den Steckbrief: Die Fledermaus ist ein Säugetier, sie ist nachts wach und findet ihre Beute mit den Ohren."];
  if (a.art === "frage") return ["Lies alle Antworten, bevor du tippst.", "Streich im Kopf zuerst die Antwort, die sicher nicht passt."];
  if (a.art === "jahr") return ["Fang beim Winter an: Was macht die Fledermaus, wenn es kalt ist?",
    "Danach geht das Jahr weiter: Frühling, Sommer, Herbst."];
  return ["Stell dir vor, die Fledermaus hätte das nicht: Was könnte sie dann nicht?",
    "Denk an ihr Leben: nachts jagen, am Tag schlafen, im Winter ruhen."];
}

LS.spiel({
  id: "fledermaus-forscher",
  einleitung: "Fledermäuse fliegen in der Nacht, hängen kopfüber und hören, wo die Mücken sind. Was weisst du über sie?",
  hilfe: stufe => "Hör zu oder lies die Aussage oder Frage und wähl deine Antwort."
    + (["s4", "s5", "s6"].includes(stufe) ? " Beim Jahr der Fledermaus tippst du die Karten der Reihe nach an, angefangen beim Winter." : ""),
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    if (ctx.nr === 0) gebraucht = new Set();
    const a = aufgabeErzeugen(ctx.stufe);
    // Stufe 1 hat weniger verschiedene Aufgaben als eine Runde — dort liefe die Serienbremse ins Leere.
    if (ctx.stufe !== "s1") {
      if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
      if (a.art === "aussage") ctx.serie("antwort", a.a.stimmt);
    }
    // Aussage und Frage sind Sachkunde, nicht Lesen: Klasse „frage“, damit die Eule sie vorliest (rahmen.md 12).
    const kopf =el("div", { class: "nacht" }, el("div", { class: "bild", text: "🦇" }));
    ctx.flaeche.append(kopf);

    if (a.art === "aussage") {
      kopf.append(el("div", { class: "aussage frage", text: a.a.text }));
      ctx.flaeche.append(el("div", { class: "auftrag", text: "Stimmt das?" }));
      const box = LS.auswahl(ctx, {
        optionen: [true, false], richtig: a.a.stimmt, breite: 150,
        inhalt: w => ({ bild: w ? "👍" : "👎", text: w ? "Stimmt" : "Stimmt nicht" }),
        hinweis: "Denk noch einmal nach — was weisst du über Fledermäuse?",
        loesung: `${a.a.stimmt ? "Das stimmt." : "Das stimmt nicht."} ${a.a.erklaerung}`,
        lob: a.a.stimmt ? "Stimmt!" : "Genau, das stimmt nicht!", erklaerung: a.a.erklaerung,
      });
      box.children[0].classList.add("ja");
      box.children[1].classList.add("nein");
    } else if (a.art === "frage") {
      kopf.append(el("div", { class: "aussage frage", text: a.f.frage }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.f.richtig, breite: 200,
        hinweis: "Hm, das passt nicht zur Fledermaus. Versuch es nochmal.",
        loesung: `${a.f.richtig}. ${a.f.erklaerung}`,
        lob: `Richtig: ${a.f.richtig}.`, erklaerung: a.f.erklaerung,
      });
    } else if (a.art === "jahr") {
      kopf.append(el("div", { class: "aussage frage", text: "Das Jahr einer Fledermaus — fang beim Winter an." }));
      // Königsstufe: Karten ohne Jahreszeit — man ordnet nach dem, was passiert.
      const ohneZeit = ctx.stufe === "s6";
      LS.reihenfolge(ctx, {
        reihe: a.reihe, breite: 220, ablage: s => s.split(": ")[0],
        inhalt: s => (ohneZeit ? s.split(": ")[1] : s),
        // Der Hinweis nennt nur, was schon liegt — nicht die nächste Karte.
        hinweis: (_, erwartet) => {
          const i = a.reihe.indexOf(erwartet);
          return i === 0 ? "Fang beim Winter an: Was macht die Fledermaus, wenn es kalt ist?"
            : `Was passiert nach «${a.reihe[i - 1].split(": ")[1]}»? Denk an die Jahreszeiten.`;
        },
        loesung: a.reihe.join(" → "),
        lob: "Super! Danach beginnt wieder der Winterschlaf. ❄️",
      });
    } else {
      kopf.append(el("div", { class: "aussage frage", text: `Wozu helfen der Fledermaus: ${a.merkmal}?` }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.richtig, breite: 200,
        hinweis: w => `«${w}» — dafür hat die Fledermaus ein anderes Merkmal. Wozu braucht sie ${a.merkmal}?`,
        loesung: `${a.merkmal}: ${a.richtig}`,
        lob: `Genau: ${a.merkmal} — ${a.richtig}.`,
      });
    }
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    if (ctx.nr === 0) ctx.sag("Hör gut zu oder lies genau und tipp auf deine Antwort.");
  },
});
</script>
</body>
</html>
