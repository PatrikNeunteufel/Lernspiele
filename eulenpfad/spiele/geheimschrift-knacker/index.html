  .frage { text-align: center; font-size: clamp(18px, 4vw, 24px); font-weight: 800; margin: 0 0 8px; }
  .frage b { color: var(--knopf); }
  .wortkarte { text-align: center; font-family: ui-monospace, Consolas, monospace; font-size: clamp(30px, 7.5vw, 48px);
    font-weight: 900; letter-spacing: .18em; margin: 2px 0 10px; color: var(--deko-1-schrift); }
  .wortkarte .gk-pfeil { color: var(--text-leise); letter-spacing: 0; margin: 0 .3em; }

    background: var(--k-feld); box-shadow: 0 4px 0 var(--rand); cursor: pointer; }
  .gk-anzeige { display: block; font-weight: 800; text-align: center; margin: 2px 0 0; }

  .gk-slots { display: flex; justify-content: center; gap: 6px; margin: 4px 0 8px; flex-wrap: wrap; }
  .gk-slots span { width: clamp(34px, 9vw, 48px); height: clamp(44px, 11vw, 58px); border-bottom: 5px solid var(--knopf);
    font-family: ui-monospace, Consolas, monospace; font-size: clamp(26px, 6.5vw, 38px); font-weight: 900;
    display: flex; align-items: center; justify-content: center; background: var(--k-feld); border-radius: 8px 8px 0 0; }
  .gk-slots span.richtig { background: var(--gut-hell); border-color: var(--gut); }
  .gk-slots span.falsch { background: var(--hinweis-hell); border-color: var(--hinweis); }
  /* 7 Spalten: A–Z, ⌫ und OK in vier Reihen (OK eine Spalte breit, BH3 a) */
  .gk-tasten { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; max-width: 460px; margin: 0 auto; }
  .gk-tasten button { font: inherit; font-size: clamp(18px, 4.6vw, 24px); font-weight: 900; min-height: 44px; border: none; border-radius: 12px;
    background: var(--k-feld); box-shadow: 0 4px 0 var(--rand); cursor: pointer; padding: 0; }
  .gk-tasten button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--rand); }

  .gk-feld .wortkarte { margin-bottom: 6px; }

  /* Breit und quer: Scheibe links, Wort, Felder und Tasten rechts */
  @media (min-width: 900px) and (orientation: landscape) {
    .gk-feld { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "hilfe wort" "hilfe slots" "hilfe tasten";
      column-gap: 24px; align-content: start; align-items: center; }
    .gk-feld .wortkarte { grid-area: wort; }
    .gk-feld .gk-hilfe { grid-area: hilfe; }
    .gk-feld .gk-slots { grid-area: slots; }
    .gk-feld .gk-tasten { grid-area: tasten; width: 100%; }
    .gk-feld:not(:has(.gk-scheibe)) { grid-template-columns: minmax(0, 1fr); grid-template-areas: "wort" "slots" "tasten"; }
    .gk-scheibe { width: clamp(190px, 100vh - 520px, 300px); }

  }

<script>
"use strict";
// Lehrplan SG MI.2.1.c (Medien und Informatik, 2. Zyklus): Geheimschriften ver- und entschlüsseln —
// hier die Verschiebe-Schrift nach Caesar mit einer Schlüsselscheibe.
// Basisklasse 5: s1 4. Klasse (ein Buchstabe 1 oder 2 Schritte), s2 entschlüsseln mit eingestellter
// Scheibe, s3 verschlüsseln (Scheibe selbst drehen), s4 grosse Schlüssel über das Alphabet-Ende hinaus,
// s5 6. Klasse: den Schlüssel knacken (welcher macht ein echtes Wort?), s6 Königsstufe: knacken und das
// Wort aufschreiben, ohne Scheibe bis zum ersten Fehler.
// Kein anderes Spiel übt Geheimschriften; der Roboter-Pfad (Abläufe) ist ein anderes Informatik-Thema.
// Wörter nur aus woerter.js (Liste „woerter“), freigegeben über LS.freieListen.

const { zufall, waehle, mische, el } = LS;

const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
/** Jeden Buchstaben um k Schritte im Alphabet weiter (k negativ: zurück), nach dem Ende wieder vorne. */
const verschiebe = (text, k) => [...text].map(c => ABC[(((ABC.indexOf(c) + k) % 26) + 26) % 26]).join("");
/** Läuft eine Verschiebung um k (≥ 0) über das Alphabet-Ende hinaus? */
const ueberlauf = (wort, k) => [...wort].some(c => ABC.indexOf(c) + k > 25);

// Freigabe (Entscheid L4 a): Kennt der Katalog die Liste nicht, gilt sie als frei.
const LISTE_FREI = LS.spielListen("geheimschrift-knacker").length ? LS.freieListen("geheimschrift-knacker").includes("woerter") : true;
const WOERTER = LISTE_FREI ? GEHEIM_WOERTER : [];
const ALLE = new Set(GEHEIM_WOERTER);

// hilfe: "kreis" (nur das Alphabet im Kreis), "fest" (Scheibe auf den Schlüssel gestellt),
// "drehen" (Scheibe zum Selbst-Drehen), "spaet" (drehbare Scheibe erst nach dem ersten Fehler)
const STUFE = {
  s1: { arten: ["buchstabe"], richtungen: ["ver", "ent"], schluessel: [1, 2], hilfe: "kreis" },
  s2: { arten: ["wort"], richtungen: ["ent"], schluessel: [1, 2, 3], hilfe: "fest", ueberlauf: false },
  s3: { arten: ["wort"], richtungen: ["ver"], schluessel: [1, 2, 3, 4, 5], hilfe: "drehen", ueberlauf: false },
  s4: { arten: ["wort"], richtungen: ["ver", "ent"], schluessel: [4, 5, 6, 7, 8, 9, 10, 11, 12], hilfe: "kreis", ueberlauf: true },
  s5: { arten: ["knacken"], schluessel: Array.from({ length: 25 }, (_, i) => i + 1), hilfe: "drehen", minLaenge: 4 },
  s6: { arten: ["knackenWort"], schluessel: Array.from({ length: 25 }, (_, i) => i + 1), hilfe: "spaet", minLaenge: 5 },
};
const brauchtWoerter = stufe => STUFE[stufe].arten[0] !== "buchstabe";
const nurMoegliche = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => !brauchtWoerter(s) || WOERTER.length));

/** Schlüssel (1–25), die aus dem Geheimwort ein Wort der Liste machen. */
const passendeSchluessel = geheim => STUFE.s5.schluessel.filter(j => ALLE.has(verschiebe(geheim, -j)));

// ---------- Aufgaben als Daten ----------

function aufgabeErzeugen(stufe) {
  const p = STUFE[stufe];
  for (let versuch = 0; versuch < 500; versuch++) {
    const a = erzeuge(p);
    if (a && pruefeAufgabe(a, stufe).length === 0) return a;
  }
  throw new Error(`Stufe ${stufe}: keine Aufgabe gefunden`);
}

function erzeuge(p) {
  const art = waehle(p.arten), k = waehle(p.schluessel);
  if (art === "buchstabe") {
    // ohne Überlauf; die Nachbarn für die Auswahl liegen auch noch im Alphabet
    const i = zufall(k + 1, 24 - k);
    const richtung = waehle(p.richtungen);
    const von = ABC[i], loesung = verschiebe(von, richtung === "ver" ? k : -k);
    const falsch = verschiebe(von, richtung === "ver" ? -k : k);
    const optionen = mische([...new Set([loesung, falsch, verschiebe(loesung, richtung === "ver" ? 1 : -1), von])]);
    return { art, k, richtung, von, loesung, falsch, optionen };
  }
  const wort = waehle(WOERTER);
  if (!wort || wort.length < (p.minLaenge || 0)) return null;
  if (art === "wort") {
    const richtung = waehle(p.richtungen);
    if (ueberlauf(wort, k) !== p.ueberlauf) return null;
    const geheim = verschiebe(wort, k);
    return richtung === "ver"
      ? { art, k, richtung, gegeben: wort, loesung: geheim }
      : { art, k, richtung, gegeben: geheim, loesung: wort };
  }
  const geheim = verschiebe(wort, k);
  if (art === "knacken") {
    const andere = mische(p.schluessel.filter(j => j !== k)).slice(0, 3);
    return { art, k, gegeben: geheim, wort, optionen: mische([k, ...andere]) };
  }
  return { art, k, gegeben: geheim, wort, loesung: wort };
}

/** Mängel: Verschiebung nachgerechnet, Überlauf wie in der Stufe, Schlüssel eindeutig, Wort aus der Liste. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const p = STUFE[stufe];
  if (!p.arten.includes(a.art)) m.push(`Aufgabenart ${a.art} nicht in der Stufe`);
  if (!p.schluessel.includes(a.k)) m.push("Schlüssel nicht in der Stufe");
  if (a.art === "buchstabe") {
    if (verschiebe(a.von, a.richtung === "ver" ? a.k : -a.k) !== a.loesung) m.push("Buchstabe falsch verschoben");
    if (Math.abs(ABC.indexOf(a.loesung) - ABC.indexOf(a.von)) !== a.k) m.push("Überlauf in Stufe 1");
    if (a.optionen.filter(o => o === a.loesung).length !== 1) m.push("Lösung nicht genau einmal unter den Antworten");
    if (new Set(a.optionen).size !== a.optionen.length || a.optionen.length < 3) m.push("doppelte oder zu wenige Antworten");
    return m;
  }
  const klar = a.art === "wort" ? (a.richtung === "ver" ? a.gegeben : a.loesung) : a.wort;
  if (!WOERTER.includes(klar)) m.push("Wort nicht aus der freien Liste");
  if (!/^[A-Z]{3,7}$/.test(klar)) m.push("Wort nicht nur A–Z oder falsche Länge");
  if (a.art === "wort") {
    const geheim = a.richtung === "ver" ? a.loesung : a.gegeben;
    if (verschiebe(klar, a.k) !== geheim) m.push("Verschiebung falsch");
    if (ueberlauf(klar, a.k) !== p.ueberlauf) m.push(p.ueberlauf ? "kein Überlauf, obwohl die Stufe ihn übt" : "Überlauf in einer Stufe ohne");
    return m;
  }
  if (verschiebe(a.wort, a.k) !== a.gegeben) m.push("Geheimwort falsch");
  const passend = passendeSchluessel(a.gegeben);
  if (passend.length !== 1 || passend[0] !== a.k) m.push(`Schlüssel nicht eindeutig (${passend.join(", ")})`);
  if (a.art === "knacken") {
    if (a.optionen.filter(o => o === a.k).length !== 1) m.push("Schlüssel nicht genau einmal unter den Antworten");
    if (new Set(a.optionen).size !== a.optionen.length) m.push("doppelte Antworten");
  }
  if (a.wort.length < (p.minLaenge || 0)) m.push("Wort zu kurz für die Stufe");
  return m;
}

// ---------- Darstellung ----------

const SVG = "http://www.w3.org/2000/svg";
const svgEl = (tag, attr = {}) => { const e = document.createElementNS(SVG, tag); for (const [n, v] of Object.entries(attr)) e.setAttribute(n, v); return e; };

/**
 * Schlüsselscheibe: aussen das Alphabet (Klartext), innen die Geheimbuchstaben bei Schlüssel k.
 * innen: false = nur das Alphabet im Kreis. drehbar: Knöpfe ◀ ▶ stellen den Schlüssel.
 */
function scheibe(k, { innen = true, drehbar = false } = {}) {
  const box = el("div", { class: "gk-scheibe-box" });
  const svg = svgEl("svg", { viewBox: "0 0 300 300", class: "gk-scheibe", role: "img",
    "aria-label": innen ? "Schlüsselscheibe: aussen Klartext, innen Geheimschrift" : "Alphabet im Kreis" });
  svg.append(svgEl("circle", { cx: 150, cy: 150, r: 146, class: "ring-aussen" }));
  if (innen) svg.append(svgEl("circle", { cx: 150, cy: 150, r: 112, class: "ring-innen" }));
  const geheim = [];
  for (let i = 0; i < 26; i++) {
    const w = (i * 2 * Math.PI) / 26 - Math.PI / 2;
    const pos = r => ({ x: (150 + r * Math.cos(w)).toFixed(1), y: (150 + r * Math.sin(w)).toFixed(1) });
    const t = svgEl("text", { ...pos(129), class: "klar" });
    t.textContent = ABC[i];
    svg.append(t);
    if (innen) {
      const g = svgEl("text", { ...pos(96), class: "geheim" });
      svg.append(g);
      geheim.push(g);
    }
  }
  const mitte = svgEl("text", { x: 150, y: 150, class: "mitte-text" });
  svg.append(mitte);
  let schluessel = k;
  const stelle = () => {
    geheim.forEach((g, i) => { g.textContent = ABC[(i + schluessel) % 26]; });
    mitte.textContent = innen ? `🔑 ${schluessel}` : "🔄";
    if (anzeige) anzeige.textContent = `Schlüssel ${schluessel}`;
  };
  let anzeige = null;
  if (!drehbar) box.append(svg);
  if (drehbar) {
    // ◀ und ▶ stehen links und rechts der Scheibe, der Schlüssel darunter: so braucht die Scheibe keine eigene Zeile für die Knöpfe (BH3 a)
    anzeige = el("span", { class: "gk-anzeige" });
    const dreh = d => () => { schluessel = (schluessel + d + 26) % 26; stelle(); };
    box.append(el("div", { class: "gk-dreh" },
      el("button", { type: "button", text: "◀", "aria-label": "Scheibe zurückdrehen", onclick: dreh(-1) }), svg,
      el("button", { type: "button", text: "▶", "aria-label": "Scheibe weiterdrehen", onclick: dreh(1) })), anzeige);
  }
  if (innen) box.append(el("div", { class: "gk-legende", text: "aussen: Klartext · innen: Geheimschrift" }));
  stelle();
  return box;
}

// Eingabe über Buchstabentasten; die echte Tastatur geht auch (A–Z, Rücktaste, Enter).
let aktiveEingabe = null;
document.addEventListener("keydown", e => {
  if (!aktiveEingabe || !document.body.contains(aktiveEingabe.element)) return;
  if (/^[a-zA-Z]$/.test(e.key)) aktiveEingabe.tippe(e.key.toUpperCase());
  else if (e.key === "Backspace") aktiveEingabe.loesche();
  else if (e.key === "Enter") aktiveEingabe.ok();
  else return;
  e.preventDefault();
});

/** Felder für laenge Buchstaben und Tasten A–Z; onOk(text) prüft das Spiel. */
function buchstabenEingabe(laenge, onOk) {
  let text = "";
  const slots = el("div", { class: "gk-slots", "aria-label": "Deine Antwort", "aria-live": "polite" },
    ...Array.from({ length: laenge }, () => el("span")));
  const tasten = el("div", { class: "gk-tasten" });
  let okKnopf;
  const api = {
    element: tasten, slots, gesperrt: false,
    zeige() {
      [...slots.children].forEach((s, i) => { s.textContent = text[i] || ""; s.classList.remove("richtig", "falsch"); });
      okKnopf.disabled = text.length !== laenge;
    },
    tippe(c) { if (api.gesperrt || text.length >= laenge) return; text += c; LS.ton("tipp"); api.zeige(); },
    loesche() { if (api.gesperrt) return; text = text.slice(0, -1); api.zeige(); },
    ok() { if (api.gesperrt || text.length !== laenge) return; onOk(text); },
    /** Nach einem Fehlversuch: richtige Stellen grün, falsche orange. */
    markiere(loesung) { [...slots.children].forEach((s, i) => s.classList.add(text[i] === loesung[i] ? "richtig" : "falsch")); },
  };
  for (const c of ABC) tasten.append(el("button", { type: "button", text: c, onclick: () => api.tippe(c) }));
  tasten.append(el("button", { type: "button", class: "gk-weg", text: "⌫", "aria-label": "Löschen", onclick: () => api.loesche() }));
  okKnopf = el("button", { type: "button", class: "gk-ok", text: "OK ✓", onclick: () => api.ok() });
  tasten.append(okKnopf);
  aktiveEingabe = api;
  api.zeige();
  return api;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Richtung, Umgang mit Scheibe oder Kreis,
 * Strategie beim Knacken — nie ein Buchstabe der Lösung, nie der Schlüssel.
 */
function tippsFuer(a, p) {
  const schritte = `${a.k} Schritt${a.k > 1 ? "e" : ""}`;
  if (a.art === "buchstabe") return [`Such ${a.von} auf dem Kreis und leg den Finger darauf.`,
    `${a.richtung === "ver" ? "Weiter heisst: im Alphabet Richtung Z." : "Zurück heisst: im Alphabet Richtung A."} Zähl ${schritte}.`];
  if (a.art === "knacken") return ["Ein echtes Wort hat Selbstlaute wie A, E, I, O, U.",
    "Dreh die Scheibe Schritt für Schritt und lies zuerst nur den ersten Buchstaben. Passt der Anfang zu einem Wort, lies weiter."];
  if (a.art === "knackenWort") return ["Probier zuerst nur den ersten Buchstaben mit verschiedenen Schlüsseln.",
    "Ein echtes Wort hat Selbstlaute (A, E, I, O, U). Kommt im Geheimwort ein Buchstabe doppelt vor, ist er auch im Wort doppelt."];
  const zurueck = a.richtung === "ent";
  const ende = p.ueberlauf ? (zurueck ? " Vor A geht es hinten mit Z weiter." : " Nach Z geht es vorne mit A weiter.") : "";
  const wie = p.hilfe === "fest" ? "Such jeden Buchstaben innen auf der Scheibe und lies aussen ab."
    : p.hilfe === "drehen" ? `Dreh die Scheibe auf Schlüssel ${a.k}. Dann such jeden Buchstaben aussen und lies innen ab.`
      : `Such jeden Buchstaben auf dem Kreis und geh ${schritte} ${zurueck ? "zurück" : "weiter"}.`;
  return [zurueck ? "Entschlüsseln heisst: jeden Buchstaben zurück im Alphabet." : "Verschlüsseln heisst: jeden Buchstaben weiter im Alphabet.", wie + ende];
}

const EINGABE_HILFE = "Tipp die Buchstaben deiner Antwort auf den Buchstabentasten, ⌫ löscht, „OK ✓“ prüft.";

LS.spiel({
  id: "geheimschrift-knacker",
  hilfe: stufe => ({
    s1: "Schau auf den Buchstabenkreis und geh die Schritte. Dann tipp auf den Buchstaben, bei dem du landest.",
    s2: `${EINGABE_HILFE} Die Schlüsselscheibe ist schon eingestellt: aussen Klartext, innen Geheimschrift.`,
    s3: `${EINGABE_HILFE} Mit ◀ ▶ drehst du die Schlüsselscheibe auf den Schlüssel: aussen Klartext, innen Geheimschrift.`,
    s4: `${EINGABE_HILFE} Der Buchstabenkreis hilft dir beim Zählen.`,
    s5: "Dreh die Scheibe mit ◀ ▶ und lies das Geheimwort innen → aussen. Dann tipp auf den Schlüssel, der ein echtes Wort macht.",
    s6: `${EINGABE_HILFE} Die Schlüsselscheibe kommt erst nach dem ersten Fehler dazu.`,
  })[stufe],
  einleitung: "Schon Julius Caesar schrieb geheime Briefe: Jeder Buchstabe wird im Alphabet ein paar Schritte verschoben. Der Schlüssel sagt, wie viele. Kannst du die Geheimschrift knacken?",
  anzahl: 8,
  stufen: nurMoegliche({
    s1: "Ein Buchstabe: 1 oder 2 Schritte weiter oder zurück — C → E.",
    s2: "Entschlüsseln mit Schlüssel 1–3, die Scheibe ist eingestellt.",
    s3: "Verschlüsseln mit Schlüssel 1–5: Dreh die Scheibe selbst.",
    s4: "Grosse Schlüssel bis 12: Nach Z geht es mit A weiter.",
    s5: "Schlüssel knacken (6. Klasse): Welcher macht ein echtes Wort?",
    s6: "Endgegner: Schlüssel unbekannt — knack das Wort, ohne Scheibe bis zum ersten Fehler.",
  }),

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const p = STUFE[ctx.stufe];
    const f = ctx.flaeche;
    if (p.richtungen && p.richtungen.length > 1) ctx.serie("richtung", a.richtung);
    ctx.tipp(tippsFuer(a, p)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)

    if (a.art === "buchstabe") {
      const weiter = a.richtung === "ver";
      const loesung = `${a.von} ${weiter ? "+" : "−"} ${a.k} Schritt${a.k > 1 ? "e" : ""} → ${a.loesung}`;
      f.append(el("div", { class: "frage", html: `Geh <b>${a.k} Schritt${a.k > 1 ? "e" : ""} ${weiter ? "weiter" : "zurück"}</b> im Alphabet.` }),
        el("div", { class: "wortkarte" }, a.von, el("span", { class: "gk-pfeil", text: "→" }), "?"),
        scheibe(0, { innen: false }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.loesung, breite: 80,
        hinweis: w => (w === a.falsch ? "Du bist in die andere Richtung gegangen."
          : `Zähle die Schritte auf dem Kreis genau: ${a.k} ${a.k > 1 ? "Schritte" : "Schritt"} ${weiter ? "weiter" : "zurück"}.`),
        loesung,
      });
      f.querySelectorAll(".wahl-knopf").forEach(k => k.classList.add("gk-buchstabe"));
      if (ctx.nr === 0) ctx.sag("Weiter heisst: im Alphabet nach hinten, zurück heisst: nach vorne.");
      return;
    }

    if (a.art === "knacken") {
      f.append(el("div", { class: "frage", html: "Welcher <b>Schlüssel</b> macht aus dem Geheimwort ein echtes Wort?" }),
        el("div", { class: "wortkarte", text: a.gegeben }),
        scheibe(0, { drehbar: true }));
      LS.auswahl(ctx, {
        optionen: a.optionen, richtig: a.k, breite: 110,
        inhalt: j => ({ bild: "🔑", text: String(j) }),
        hinweis: j => `Mit Schlüssel ${j} heisst es ${verschiebe(a.gegeben, -j)} — das ist kein Wort. Dreh die Scheibe und probier weiter.`,
        loesung: `Schlüssel ${a.k}: ${a.gegeben} → ${a.wort}`,
        lob: `Geknackt: ${a.gegeben} heisst ${a.wort}!`,
      });
      if (ctx.nr === 0) ctx.sag("Dreh die Scheibe und lies das Geheimwort innen → aussen.");
      return;
    }

    // Wort eintippen: ent-/verschlüsseln oder knacken
    const knacken = a.art === "knackenWort";
    const loesung = knacken ? `Schlüssel ${a.k}: ${a.gegeben} → ${a.wort}`
      : `Schlüssel ${a.k}: ${a.gegeben} → ${a.loesung}`;
    const auftrag = knacken ? "Der Schlüssel ist geheim. <b>Was heisst das Wort?</b>"
      : a.richtung === "ver" ? `<b>Verschlüssle</b> das Wort mit Schlüssel ${a.k}.`
      : `<b>Entschlüssle</b> das Geheimwort. Schlüssel ${a.k}.`;
    // Breit und quer steht die Scheibe links, Wort, Felder und Tasten rechts daneben (gk-feld, BH3 a)
    const wortkarte = el("div", { class: "wortkarte", text: a.gegeben });
    const hilfeOrt = el("div", { class: "gk-hilfe" });
    f.append(el("div", { class: "frage", html: auftrag }));
    if (p.hilfe === "fest") hilfeOrt.append(scheibe(a.k));
    else if (p.hilfe === "drehen") hilfeOrt.append(scheibe(0, { drehbar: true }));
    else if (p.hilfe === "kreis") hilfeOrt.append(scheibe(0, { innen: false }));
    ctx.loesung(loesung);
    ctx.schritte(a.loesung.length + 1);
    const zurueck = a.richtung === "ent" || knacken;
    const verkehrt = knacken ? null : verschiebe(a.gegeben, a.richtung === "ver" ? -a.k : a.k);
    const eingabe = buchstabenEingabe(a.loesung.length, text => {
      if (text === a.loesung) { eingabe.gesperrt = true; [...eingabe.slots.children].forEach(s => s.classList.add("richtig")); ctx.richtig(knacken ? `Geknackt! Schlüssel ${a.k}.` : undefined); return; }
      eingabe.markiere(a.loesung);
      if (p.hilfe === "spaet" && !hilfeOrt.firstChild) hilfeOrt.append(scheibe(0, { drehbar: true }));
      const hinweis = text === verkehrt ? "Du bist in die andere Richtung gegangen."
        : knacken ? "Probier die Schlüssel durch: Dreh die Scheibe, bis der Anfang nach einem Wort aussieht. Die grünen Buchstaben stimmen schon."
        : `Geh bei jedem Buchstaben ${a.k} Schritte ${zurueck ? "zurück" : "weiter"}.${p.ueberlauf ? " Nach dem Ende des Alphabets geht es vorne weiter." : ""} Die grünen stimmen schon.`;
      ctx.falsch(hinweis, loesung);
      if (ctx.vorbei()) eingabe.gesperrt = true;
    });
    f.append(el("div", { class: "gk-feld" }, wortkarte, hilfeOrt, eingabe.slots, eingabe.element));
    if (ctx.nr === 0) ctx.sag(knacken ? "Tipp: Probier zuerst den ersten Buchstaben mit verschiedenen Schlüsseln."
      : zurueck ? "Entschlüsseln heisst: zurück im Alphabet." : "Verschlüsseln heisst: weiter im Alphabet.");
  },
});
</script>
</body>
</html>
