<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence-Builder</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .sb-auf { text-align: center; font-size: clamp(16px, 3.6vw, 20px); font-weight: 700; color: var(--text-leise); margin: 2px 0 4px; }
  .frage { text-align: center; font-size: clamp(22px, 5vw, 30px); font-weight: 900; margin: 0 0 12px; color: var(--deko-1); }
  .sb-karten { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px; margin: 0 auto; }
  .sb-karten .wahl-knopf { min-width: 72px; padding: 8px 16px; }
  .sb-karten .wahl-knopf.gelegt { visibility: hidden; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧱 Sentence-Builder</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="saetze.js"></script>
<script>
"use strict";
// Lehrplan SG FS1E.5.D.1: a sehr einfache grammatische Strukturen mit Unterstützung erkennen und
// anwenden, b einfache Strukturen (Fragen, Verneinung). Wortkarten zum englischen Satz ordnen.
// Basisklasse 4 (Orientierungspunkt 2. Zyklus). Inhalte in saetze.js.

const { waehle, mische, el } = LS;
const ID = "sentence-builder";

// Freigabe (Entscheid L4 a): nur Sätze aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : SATZ_LISTEN);

/** Wortkarten eines Satzes: getrennt an Leerzeichen, das Satzzeichen bleibt am letzten Wort. */
const woerterVon = satz => satz.split(" ");
const nackt = wort => wort.replace(/[.?!]$/, "");
/** Falsche Form für die überzählige Karte (erstes Wort mit Eintrag in VERWECHSLER) oder null. */
function verwechsler(woerter) {
  const w = woerter.find(x => VERWECHSLER[nackt(x)]);
  return w ? VERWECHSLER[nackt(w)] + w.slice(nackt(w).length) : null;
}

// Je Stufe: Listen, höchstens so viele Wörter, mit überzähliger Karte. Basisklasse 4: s1 = 3. Klasse, s5 = 5. Klasse.
const STUFE = {
  s1: { listen: ["ich-saetze"], max: 3 },
  s2: { listen: ["ich-saetze"] },
  s3: { listen: ["ich-saetze", "er-sie-saetze"] },
  s4: { listen: ["er-sie-saetze"], verwechsler: true },
  s5: { listen: ["fragen", "verneinung"] },
  s6: { listen: ["fragen", "verneinung", "er-sie-saetze", "ich-saetze"], verwechsler: true, min: 4 },
};

/** Sätze, die in der Stufe mit den freien Listen gehen. */
function vorrat(stufe) {
  const st = STUFE[stufe];
  return SAETZE.filter(([en, , liste]) => FREI.has(liste) && st.listen.includes(liste)
    && (!st.max || woerterVon(en).length <= st.max) && (!st.min || woerterVon(en).length >= st.min)
    && (!st.verwechsler || verwechsler(woerterVon(en))));
}

/** Eine Aufgabe: Satz, Übersetzung, Wörter in richtiger Reihenfolge, Karten gemischt (mit überzähliger Karte); null ohne Vorrat. */
function aufgabeErzeugen(stufe) {
  const saetze = vorrat(stufe);
  if (!saetze.length) return null;
  const [en, de, liste] = waehle(saetze);
  const woerter = woerterVon(en);
  const extra = STUFE[stufe].verwechsler ? verwechsler(woerter) : null;
  return { en, de, liste, woerter, extra, karten: mische(extra ? [...woerter, extra] : woerter) };
}

const STUFEN_TEXT = {
  s1: "Kurze Sätze mit drei Karten: I like cats.",
  s2: "Längere Ich-Sätze: I have got a dog.",
  s3: "Ich, er und sie: She has got a cat.",
  s4: "Er und sie — mit einer falschen Karte: has oder have?",
  s5: "Fragen und Verneinung: Can you swim? I don't like spiders.",
  s6: "Endgegner: Fragen, Verneinung und Er-Sätze mit falscher Karte.",
};
// Angeboten werden nur Stufen, für die die freien Listen Sätze hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => vorrat(s).length));

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  const st = STUFE[stufe];
  const eintrag = SAETZE.find(s => s[0] === a.en);
  if (!eintrag || eintrag[1] !== a.de || !FREI.has(eintrag[2])) m.push("Satz nicht aus einer freien Liste");
  if (!st.listen.includes(a.liste)) m.push("Liste gehört nicht in die Stufe");
  if (a.woerter.join(" ") !== a.en) m.push("Karten ergeben den Satz nicht");
  if (new Set(a.woerter.map(w => nackt(w).toLowerCase())).size !== a.woerter.length) m.push("Wort kommt im Satz zweimal vor");
  if (st.max && a.woerter.length > st.max) m.push("Satz zu lang für die Stufe");
  if (st.verwechsler && !a.extra) m.push("überzählige Karte fehlt");
  if (a.extra && a.woerter.includes(a.extra)) m.push("überzählige Karte kommt im Satz vor");
  const erwartet = [...a.woerter, ...(a.extra ? [a.extra] : [])].sort().join("|");
  if ([...a.karten].sort().join("|") !== erwartet) m.push("Karten stimmen nicht mit dem Satz überein");
  if (!/^[A-Z]/.test(a.en) || !/[.?!]$/.test(a.en)) m.push("Satz ohne grossen Anfang oder Satzzeichen");
  if (JSON.stringify(a).includes("ß")) m.push("ß im Text");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Satzbau-Regel je Liste — kein englisches Wort des
 * Satzes nennen (sonst wäre die nächste Karte verraten).
 */
const SATZBAU = {
  "ich-saetze": "Im Englischen kommt zuerst, wer etwas tut. Gleich danach kommt das Tun-Wort, dann der Rest.",
  "er-sie-saetze": "Zuerst kommt, wer etwas tut (er, sie oder ein Name). Gleich danach kommt das Tun-Wort, dann der Rest.",
  fragen: "Bei einer Frage steht das kleine Hilfswort ganz vorne, noch vor der Person. Das Fragezeichen kommt ans Ende.",
  verneinung: "Das Wort mit n’t (nicht) steht gleich nach dem, der etwas tut.",
};
function tippsFuer(a) {
  const t = ["Such zuerst die Karte mit dem grossen Anfangsbuchstaben — und die mit dem Satzzeichen fürs Ende.", SATZBAU[a.liste]];
  if (a.extra) t.push("Eine Karte ist zu viel: Zwei Karten sehen fast gleich aus. Welche Form passt zur Person im Satz — ich, du, er, sie oder mehrere?");
  return t;
}

LS.spiel({
  // Abschluss-Animation (feier.js, Block D, docs/konzept_abschluss_animationen.md 7)
  feier: { muster: "bauen", bilder: "wortzug", ziele: { s1: [{ woerter: 3, zeichen: "." }], s2: [{ woerter: 5, zeichen: "." }], s3: [{ woerter: 3, zeichen: "." }, { woerter: 5, zeichen: "." }], s4: [{ woerter: 4, zeichen: ".", falsch: true }], s5: [{ woerter: 3, zeichen: "?" }, { woerter: 4, zeichen: ".", nicht: 1 }], s6: [{ woerter: 4, zeichen: "?", falsch: true }, { woerter: 5, zeichen: ".", nicht: 1 }] } },
  id: ID,
  // Lob auf Anhieb in der Fremdsprache (LB2 a); Bestätigungen mit dem Lösungswort kommen nur nach einem Fehlversuch
  lob: ["Great!", "Well done!", "Super!", "Perfect!"],
  einleitung: "Let's build sentences! Tipp die englischen Wortkarten in der richtigen Reihenfolge an.",
  hilfe: "Lies den deutschen Satz. Tippe die englischen Wortkarten in der richtigen Reihenfolge an — jede richtige Karte wandert nach oben in den Satz.",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    const loesung = a.en;
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(a));
    ctx.flaeche.append(el("div", { class: "sb-auf", text: "Sag es auf Englisch:" }), el("div", { class: "frage", text: a.de }));
    const ablage = el("div", { class: "ablage", "aria-live": "polite" });
    const box = el("div", { class: "sb-karten" });
    let pos = 0;
    let fertig = false;
    const zeigeLoesung = () => { ablage.innerHTML = ""; for (const w of a.woerter) ablage.append(el("span", { text: w })); };
    for (const wort of a.karten) {
      const k = el("button", { type: "button", class: "wahl-knopf", text: wort });
      k.addEventListener("click", () => {
        if (fertig || k.classList.contains("gelegt")) return;
        if (wort === a.woerter[pos]) {
          pos++;
          k.classList.add("gelegt");
          k.disabled = true;
          LS.ton("tipp");
          ablage.append(el("span", { text: wort }));
          if (pos === a.woerter.length) {
            fertig = true;
            LS.sprich(a.en, "en");
            ctx.richtig(waehle(["Great!", "Well done!", "Super!", "Perfect!"]));
          }
          return;
        }
        k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch");
        const hinweis = wort === a.extra ? "Diese Karte hat die falsche Form. Sie gehört nicht in den Satz."
          : pos === 0 ? "Womit fängt der Satz an? Schau auf den grossen Anfangsbuchstaben."
          : "Noch nicht diese Karte. Was kommt im Englischen als Nächstes?";
        ctx.falsch(hinweis, loesung);
        if (ctx.vorbei()) { fertig = true; zeigeLoesung(); }
      });
      box.append(k);
    }
    ctx.flaeche.append(ablage, box);
    LS.kurztasten(box);
    if (ctx.nr === 0) ctx.sag(a.extra ? "Achtung: Eine Karte ist zu viel!" : "Tipp die Karten der Reihe nach an.");
  },
});
</script>
</body>
</html>
