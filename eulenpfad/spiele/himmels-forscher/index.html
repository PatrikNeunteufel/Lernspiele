<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Himmels-Forscher</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .nacht { background: linear-gradient(180deg, #1e1b4b, #312e81); border-radius: 20px; padding: 14px; color: #fff; margin-bottom: 14px; }
  .frage { text-align: center; font-size: clamp(20px, 4.2vw, 28px); font-weight: 800; margin: 0 0 12px; }
  .mond-gross { text-align: center; font-size: clamp(80px, 18vw, 120px); line-height: 1.1; }
  .optionen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(140px, 100%), 1fr)); gap: 10px; max-width: 700px; margin: 0 auto; }
  .option { border: none; border-radius: 16px; min-height: 64px; padding: 8px; font-family: inherit; font-size: clamp(18px, 3.8vw, 24px); font-weight: 900; background: #fff; color: var(--text); box-shadow: 0 5px 0 var(--rand); cursor: pointer; }
  .option.mond { font-size: clamp(40px, 9vw, 56px); background: #312e81; }
  .option.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .option.richtig { background: var(--gut-hell); }
  .option.gewaehlt { opacity: .3; }
  .reihe { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 64px; margin-bottom: 12px; }
  .reihe span { font-size: 40px; }
  .reihe .planet { font-size: 16px; font-weight: 900; background: #fff; color: var(--text); border-radius: 999px; padding: 8px 12px; }
  .sonne { font-size: 40px; }
  .planet-knopf { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .planet-knopf i { display: block; border-radius: 50%; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🔭 Himmels-Forscher</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.4.5: b Erscheinungen am Tag- und Nachthimmel beobachten (Sonnenlauf, Mond, Sterne);
// d Beobachtungen ordnen (z.B. Mondphasen); e Phänomene zu Erde, Mond, Planeten, Sonne und Sternen
// auf einfache Modelle übertragen. Mondbilder gelten für die Nordhalbkugel (also auch für die Schweiz):
// Ist die rechte Seite hell, nimmt der Mond zu.

const { waehle, mische, el } = LS;

// Mondzyklus in Reihenfolge, beginnend beim Neumond
const PHASEN = [
  { bild: "🌑", name: "Neumond" }, { bild: "🌒", name: "zunehmende Sichel", zu: true },
  { bild: "🌓", name: "zunehmender Halbmond", zu: true }, { bild: "🌔", name: "fast Vollmond (zunehmend)", zu: true },
  { bild: "🌕", name: "Vollmond" }, { bild: "🌖", name: "abnehmend nach Vollmond", zu: false },
  { bild: "🌗", name: "abnehmender Halbmond", zu: false }, { bild: "🌘", name: "abnehmende Sichel", zu: false },
];

// Planeten von der Sonne aus, mit Farbe fürs Bild
const PLANETEN = [
  { name: "Merkur", farbe: "#a8a29e" }, { name: "Venus", farbe: "#e7c27d" },
  { name: "Erde", farbe: "#3b82f6" }, { name: "Mars", farbe: "#dc6b47" },
  { name: "Jupiter", farbe: "#d6a77a" }, { name: "Saturn", farbe: "#e9d29a" },
  { name: "Uranus", farbe: "#7dd3fc" }, { name: "Neptun", farbe: "#3b5bdb" },
];

const ARTEN = {
  vollNeu() {
    const ziel = waehle([0, 4]);
    return { frage: `Welches Bild zeigt den <b>${PHASEN[ziel].name}</b>?`, optionen: mische([0, 2, 4, 6]).map(i => PHASEN[i].bild), richtig: PHASEN[ziel].bild, mond: true,
      hinweis: "Beim Vollmond ist der ganze Mond hell, beim Neumond sieht man ihn fast gar nicht.", loesung: `${PHASEN[ziel].bild} ist der ${PHASEN[ziel].name}.` };
  },
  zuOderAb() {
    const p = waehle(PHASEN.filter(x => x.zu !== undefined));
    return { gross: p.bild, frage: "Nimmt der Mond zu oder ab?", optionen: ["zunehmend", "abnehmend"], richtig: p.zu ? "zunehmend" : "abnehmend",
      hinweis: "Ist die rechte Seite hell, wird der Mond grösser (zunehmend). Ist die linke Seite hell, wird er kleiner (abnehmend).", loesung: `${p.bild}: ${p.zu ? "zunehmend" : "abnehmend"}` };
  },
  naechste() {
    const i = Math.floor(Math.random() * 8);
    const n = (i + 1) % 8;
    return { gross: PHASEN[i].bild, frage: "Wie sieht der Mond ein paar Tage später aus?", optionen: mische([n, (i + 7) % 8, (i + 4) % 8, (i + 2) % 8]).map(k => PHASEN[k].bild), richtig: PHASEN[n].bild, mond: true,
      hinweis: "Der Mond wird von rechts her hell bis zum Vollmond, danach wird er von rechts her wieder dunkel.", loesung: `Nach ${PHASEN[i].bild} kommt ${PHASEN[n].bild}.` };
  },
  ordnen(anzahl) {
    const start = Math.floor(Math.random() * 8);
    const schritt = anzahl === 4 ? 2 : 1;
    return { reihe: Array.from({ length: anzahl }, (_, k) => PHASEN[(start + k * schritt) % 8].bild), frage: `Lege die Mondbilder in die richtige Reihenfolge — beginne mit ${PHASEN[start].bild}.`,
      hinweis: "Rechte Seite hell = zunehmend bis zum Vollmond, danach nimmt er ab.", mond: true };
  },
  planetenOrdnen() {
    return { reihe: PLANETEN.map(p => p.name), planeten: true, frage: "Ordne die Planeten: Welcher ist der Sonne am nächsten? Tipp sie der Reihe nach an.",
      // Nur der Merksatz — die Namen dazu wären die Lösung.
      hinweis: "Merksatz: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel. Jedes Wort beginnt wie ein Planet." };
  },
  // ---- Königsstufe ----
  vorher() {
    const i = Math.floor(Math.random() * 8);
    const v = (i + 7) % 8;
    return { gross: PHASEN[i].bild, frage: "Wie sah der Mond ein paar Tage <b>vorher</b> aus?", optionen: mische([v, (i + 1) % 8, (i + 4) % 8, (i + 6) % 8]).map(k => PHASEN[k].bild), richtig: PHASEN[v].bild, mond: true,
      hinweis: "Denk rückwärts: Was kam vor diesem Bild?", loesung: `Vor ${PHASEN[i].bild} kam ${PHASEN[v].bild}.` };
  },
  planetenRueckwaerts() {
    return { reihe: PLANETEN.map(p => p.name).reverse(), planeten: true, sonneAmEnde: true,
      frage: "Von aussen nach innen: Beginne mit dem Planeten, der am weitesten von der Sonne weg ist.",
      hinweis: "Sag den Merksatz und geh ihn von hinten nach vorn." };
  },
  planetenLage() {
    const namen = PLANETEN.map(p => p.name);
    const i = Math.floor(Math.random() * 7); // es gibt einen Nachfolger
    const j = Math.min(i, 5);                // und für „zwischen“ zwei
    const art = waehle(["nach", "nach", "zwischen", "zwischen", "aussen", "klein"]);
    const f = art === "nach" ? { frage: `Welcher Planet kommt von der Sonne aus direkt nach ${namen[i]}?`, richtig: namen[i + 1] }
      : art === "zwischen" ? { frage: `Welcher Planet liegt zwischen ${namen[j]} und ${namen[j + 2]}?`, richtig: namen[j + 1] }
      : art === "aussen" ? { frage: "Welcher Planet ist am weitesten von der Sonne entfernt?", richtig: "Neptun" }
      : { frage: "Welcher Planet ist der kleinste?", richtig: "Merkur" };
    // Die genannten Planeten selbst sind keine Antwortmöglichkeit.
    const genannt = namen.filter(n => f.frage.includes(n));
    const andere = mische(namen.filter(n => n !== f.richtig && !genannt.includes(n))).slice(0, 3);
    return { frage: f.frage, optionen: mische([f.richtig, ...andere]), richtig: f.richtig, hinweis: "Denk an den Merksatz und an das Bild vom Sonnensystem.", loesung: `${f.frage} ${f.richtig}.` };
  },
  zeitdauer() {
    const f = waehle([
      { frage: "Wie lange dauert es ungefähr von einem Vollmond bis zum nächsten?", richtig: "etwa 1 Monat" },
      { frage: "Wie lange braucht die Erde für eine Runde um die Sonne?", richtig: "1 Jahr" },
      { frage: "Wie lange braucht die Erde, um sich einmal um sich selbst zu drehen?", richtig: "1 Tag" },
    ]);
    const optionen = ["1 Tag", "etwa 1 Woche", "etwa 1 Monat", "1 Jahr"];
    return { frage: f.frage, optionen, richtig: f.richtig, hinweis: "Tag und Nacht, die Mondbilder, die Jahreszeiten — was davon passt?", loesung: `${f.frage} ${f.richtig}.` };
  },
  planetenFrage() {
    const fragen = [
      { frage: "Welcher Planet ist der grösste?", richtig: "Jupiter" },
      { frage: "Auf welchem Planeten leben wir?", richtig: "Erde" },
      { frage: "Welcher Planet ist der Sonne am nächsten?", richtig: "Merkur" },
      { frage: "Welcher Planet hat die auffälligen Ringe?", richtig: "Saturn" },
      { frage: "Welcher Planet heisst auch der „rote Planet“?", richtig: "Mars" },
    ];
    const f = waehle(fragen);
    const andere = mische(PLANETEN.map(p => p.name).filter(n => n !== f.richtig)).slice(0, 3);
    return { frage: f.frage, optionen: mische([f.richtig, ...andere]), richtig: f.richtig, hinweis: "Denk an das Bild vom Sonnensystem.", loesung: `${f.frage} ${f.richtig}.` };
  },
};

// Jede Aufgabe trägt den Namen ihrer Art (für ctx.serie).
for (const [name, neu] of Object.entries(ARTEN)) ARTEN[name] = (...x) => ({ art: name, ...neu(...x) });

const STUFE = {
  s1: () => waehle([ARTEN.vollNeu, ARTEN.zuOderAb])(),
  s2: () => waehle([ARTEN.zuOderAb, ARTEN.naechste, () => ARTEN.ordnen(4)])(),
  s3: () => waehle([ARTEN.naechste, () => ARTEN.ordnen(4), () => ARTEN.ordnen(5)])(),
  s4: () => waehle([() => ARTEN.ordnen(8), ARTEN.naechste, ARTEN.planetenFrage])(),
  s5: () => waehle([ARTEN.planetenOrdnen, ARTEN.planetenFrage, () => ARTEN.ordnen(8)])(),
  s6: () => waehle([ARTEN.vorher, ARTEN.planetenRueckwaerts, ARTEN.planetenLage, ARTEN.zeitdauer, () => ARTEN.ordnen(8)])(),
};

/** Für das Testskript: eine Aufgabe der Stufe. */
function aufgabeErzeugen(stufe) { return STUFE[stufe](); }

/** Mängel: genau eine richtige Antwort unter den Möglichkeiten, Reihen ohne Doppel, Fakten stimmen. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const namen = PLANETEN.map(p => p.name);
  if (a.reihe) {
    if (new Set(a.reihe).size !== a.reihe.length) m.push("Reihe mit doppeltem Teil");
    if (a.planeten && a.reihe.join() !== (a.sonneAmEnde ? namen.slice().reverse() : namen).join()) m.push("Planetenreihe falsch");
    if (a.mond) a.reihe.forEach((b, k) => { if (k && PHASEN.findIndex(p => p.bild === b) !== (PHASEN.findIndex(p => p.bild === a.reihe[k - 1]) + (a.reihe.length === 4 ? 2 : 1)) % 8) m.push("Mondreihe falsch"); });
  } else {
    if (a.optionen.filter(o => o === a.richtig).length !== 1) m.push("richtige Antwort nicht genau einmal unter den Möglichkeiten");
    if (new Set(a.optionen).size !== a.optionen.length) m.push("doppelte Möglichkeit");
    const nach = a.frage.match(/direkt nach (\w+)\?/);
    if (nach && namen[namen.indexOf(nach[1]) + 1] !== a.richtig) m.push("Nachfolger falsch");
    const zw = a.frage.match(/zwischen (\w+) und (\w+)\?/);
    if (zw && (namen.indexOf(zw[2]) - namen.indexOf(zw[1]) !== 2 || namen[namen.indexOf(zw[1]) + 1] !== a.richtig)) m.push("Planet dazwischen falsch");
  }
  if (namen.includes(a.richtig) && a.hinweis.includes(a.richtig)) m.push("Hinweis verrät die Lösung");
  if (a.planeten && namen.some(n => a.hinweis.includes(n))) m.push("Hinweis nennt Planetennamen");
  return m;
}

function planetKnopfInhalt(name) {
  const p = PLANETEN.find(x => x.name === name);
  // Alle Kugeln gleich gross — sonst verrät die Grösse die Antwort auf „Welcher ist der grösste?“
  const kugel = el("i");
  kugel.style.cssText = `width:24px;height:24px;background:${p.farbe}`;
  return el("span", { class: "planet-knopf" }, kugel, name);
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): erst worauf schauen, dann die Regel oder der
 * Merksatz (die Hinweise der Arten passen schon vor dem Antworten) — nie ein Planetenname als Antwort.
 */
const MERKSATZ = "Sag den Merksatz: Mein Vater erklärt mir jeden Sonntag unseren Nachthimmel. Jedes Wort beginnt wie ein Planet.";
function tippsFuer(a) {
  switch (a.art) {
    case "vollNeu": return ["Schau, wie viel vom Mond hell ist.", a.hinweis];
    case "zuOderAb": return ["Schau, welche Seite des Mondes hell ist: die rechte oder die linke?", a.hinweis];
    case "naechste": return ["Wird der Mond gerade grösser oder kleiner?", a.hinweis];
    case "vorher": return [a.hinweis, "Bis zum Vollmond wird der Mond von rechts her hell, danach wird er von rechts her wieder dunkel."];
    case "ordnen": return [a.reihe.length === 4 ? "Zwischen zwei Bildern vergehen jedes Mal gleich viele Tage — es fehlt immer ein Bild dazwischen."
      : "Fang beim genannten Bild an und such dann immer das nächste.", a.hinweis];
    case "planetenOrdnen": return ["Fang bei der Sonne an: Welcher Planet ist ihr am nächsten?", MERKSATZ];
    case "planetenRueckwaerts": return [MERKSATZ, a.hinweis];
    case "zeitdauer": return ["Was passiert in dieser Zeit: Tag und Nacht, die Mondbilder oder die Jahreszeiten?",
      "Tag und Nacht: Die Erde dreht sich. Mondbilder: Der Mond kreist um die Erde. Jahreszeiten: Die Erde kreist um die Sonne."];
    default: return [MERKSATZ, "Denk an das Bild vom Sonnensystem."];
  }
}

LS.spiel({
  id: "himmels-forscher",
  // Abschluss-Animation (Pilot P3; docs/konzept_abschluss_animationen.md 6): s1–s4 zieht der Mond über den Himmel,
  // Stufe um Stufe zunehmend bis zum Vollmond (rechts hell, wie das Spiel), s5 eine Sonde an den acht Planeten vorbei (s5 übt Planeten), s6 die Eule vor dem Vollmond
  feier: { muster: "zyklus", bilder: "mond",
    ziele: { s1: "neu", s2: "sichel", s3: "halb", s4: "voll",
      s5: { muster: "reise", reisender: "sonde", ziel: { rand: true } }, s6: { muster: "szene", szene: "eule-vollmond" } } },
  hilfe: "Schau die Mondbilder genau an: Welche Seite ist hell? Bei einer Reihe tippst du die Mondbilder oder Planeten der Reihe nach an.",
  einleitung: "Schau in den Nachthimmel! Der Mond sieht jede Nacht ein bisschen anders aus. Und um die Sonne kreisen acht Planeten.",
  anzahl: 6,
  stufen: {
    s1: "Vollmond, Neumond — nimmt der Mond zu oder ab?",
    s2: "Wie sieht der Mond ein paar Tage später aus?",
    s3: "Mondbilder in die richtige Reihenfolge legen.",
    s4: "Den ganzen Mondzyklus ordnen und erste Planeten-Fragen.",
    s5: "Die acht Planeten der Reihe nach von der Sonne aus.",
    s6: "Endgegner: Mond rückwärts, Planeten von aussen nach innen, Nachbarn und Zeitdauern.",
  },

  aufgabe(ctx) {
    const a = STUFE[ctx.stufe]();
    ctx.serie("art", a.art); // jede Stufe hat mehrere Arten
    if (a.art === "vollNeu" || a.art === "zuOderAb") ctx.serie("antwort", a.richtig); // Vollmond/Neumond, zunehmend/abnehmend
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    let fertig = false;
    const nacht = el("div", { class: "nacht" }, el("div", { class: "frage", html: a.frage }));
    if (a.gross) nacht.append(el("div", { class: "mond-gross", text: a.gross }));
    ctx.flaeche.append(nacht);

    const loesung = a.reihe ? a.reihe.join(" → ") : a.loesung;
    ctx.loesung(loesung);
    if (a.reihe) {
      const gelegt = el("div", { class: "reihe" });
      const sonne = () => gelegt.append(el("span", { class: "sonne", text: "☀️" }));
      if (a.planeten && !a.sonneAmEnde) sonne();
      nacht.append(gelegt);
      const box = el("div", { class: "optionen" });
      let pos = 0;
      for (const item of mische(a.reihe)) {
        const k = el("button", { type: "button", class: "option" + (a.mond ? " mond" : "") });
        a.planeten ? k.append(planetKnopfInhalt(item)) : k.append(item);
        k.addEventListener("click", () => {
          if (fertig || k.classList.contains("gewaehlt")) return;
          if (item === a.reihe[pos]) {
            pos++; k.classList.add("gewaehlt"); LS.ton("tipp");
            gelegt.append(el("span", { class: a.planeten ? "planet" : "", text: item }));
            if (pos === a.reihe.length) { fertig = true; if (a.sonneAmEnde) sonne(); ctx.richtig(); }
            return;
          }
          k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch");
          ctx.falsch(a.hinweis, loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
        });
        box.append(k);
      }
      ctx.flaeche.append(box);
      LS.kurztasten(box);
    } else {
      const box = el("div", { class: "optionen" });
      for (const o of a.optionen) {
        const k = el("button", { type: "button", class: "option" + (a.mond ? " mond" : "") });
        PLANETEN.some(p => p.name === o) ? k.append(planetKnopfInhalt(o)) : k.append(o);
        k.addEventListener("click", () => {
          if (fertig) return;
          if (o === a.richtig) { fertig = true; k.classList.add("richtig"); ctx.richtig(); return; }
          k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch");
          ctx.falsch(a.hinweis, loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
        });
        box.append(k);
      }
      ctx.flaeche.append(box);
      LS.kurztasten(box);
    }
    if (ctx.nr === 0) ctx.sag("Tipp auf die richtige Antwort.");
  },
});
</script>
</body>
</html>
