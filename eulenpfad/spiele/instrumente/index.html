<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instrumenten-Kenner</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
  .bild-gross { text-align: center; font-size: clamp(64px, 15vw, 96px); line-height: 1.1; margin-bottom: 8px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🎺 Instrumenten-Kenner</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="../gemeinsam/bilder.js"></script>
<script src="instrumente.js"></script>
<script>
"use strict";
// Lehrplan SG MU.4.C.1: b (Grundanspruch 1. Zyklus) Schulinstrumente benennen (Klangstab, Triangel,
// Schlagholz); c Instrumente unterscheiden und beschreiben; d Klangerzeugung (Tonhöhe durch
// Saitenlänge); e Prinzipien: streichen, schlagen, blasen; f (Grundanspruch 2. Zyklus)
// Instrumentengruppen und Formationen (Quartett, Orchester). Inhalte in instrumente.js.

const { waehle, mische, el } = LS;
const ID = "instrumente";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : INSTRUMENT_LISTEN);
const I = INSTRUMENTE.map(([bild, name, gruppe, spielart, genauer]) => ({ bild, name, gruppe, spielart, genauer }))
  .filter(i => FREI.has(INSTRUMENT_LISTE_JE_GRUPPE[i.gruppe]));
const FRAGEN = INSTRUMENT_FRAGEN.filter(f => FREI.has(f[4]));

// Schulinstrumente ohne Emoji (Triangel, Klangstab, Schlagholz) stehen in der Bildersammlung (bilder.js, B1 a).

const GRUPPEN = {
  Schlaginstrument: "🥁", Saiteninstrument: "🎸", Blasinstrument: "🎺", Tasteninstrument: "🎹",
  Holzblasinstrument: "🪈", Blechblasinstrument: "🎺", Streichinstrument: "🎻", Zupfinstrument: "🎸",
};
const FALLEN = /Saxofon|Querflöte/;
const SPIELARTEN = { schlagen: "🥢", zupfen: "🤏", streichen: "🎻", blasen: "💨", schütteln: "🫨", "Tasten drücken": "🎹" };

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  name() {
    // Die Namen zur Auswahl stammen nur aus freien Listen; sind es weniger als drei, genügen zwei.
    const mitBild = I.filter(i => i.bild);
    if (mitBild.length < 2) return null;
    const x = waehle(mitBild);
    const andere = mische(mitBild.filter(i => i !== x)).slice(0, 2).map(i => i.name);
    return { art: "name", x, richtig: x.name, optionen: mische([x.name, ...andere]) };
  },
  spielart(mitBild) {
    const x = waehle(I.filter(i => !mitBild || i.bild));
    if (!x) return null;
    const andere = mische(Object.keys(SPIELARTEN).filter(s => s !== x.spielart)).slice(0, 2);
    return { art: "korb", nach: "spielart", x, richtig: x.spielart, koerbe: mische([x.spielart, ...andere]), info: SPIELARTEN };
  },
  gruppe() {
    const x = waehle(I);
    if (!x) return null;
    return { art: "korb", nach: "gruppe", x, richtig: x.gruppe, koerbe: ["Schlaginstrument", "Saiteninstrument", "Blasinstrument", "Tasteninstrument"], info: GRUPPEN };
  },
  genauer() {
    const x = waehle(I.filter(i => i.genauer));
    if (!x) return null;
    const paar = x.genauer.includes("blas") ? ["Holzblasinstrument", "Blechblasinstrument"] : ["Streichinstrument", "Zupfinstrument"];
    return { art: "korb", nach: "genauer", x, richtig: x.genauer, koerbe: paar, info: GRUPPEN };
  },
  /** Königsstufe: alle vier genaueren Gruppen; nurFallen = Instrumente aus Metall, die zu den Holzblasinstrumenten zählen. */
  genauerAlle(nurFallen) {
    const x = waehle(I.filter(i => i.genauer && (!nurFallen || FALLEN.test(i.name))));
    if (!x) return null;
    return { art: "korb", nach: "genauer", x, richtig: x.genauer, koerbe: mische(["Holzblasinstrument", "Blechblasinstrument", "Streichinstrument", "Zupfinstrument"]), info: GRUPPEN };
  },
  frage() {
    if (!FRAGEN.length) return null;
    const [frage, richtig, f1, f2] = waehle(FRAGEN);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [ARTEN.name],
  s2: [() => ARTEN.spielart(true), ARTEN.name],
  s3: [ARTEN.gruppe, () => ARTEN.spielart(false)],
  s4: [ARTEN.genauer, ARTEN.gruppe],
  s5: [ARTEN.frage, ARTEN.genauer],
  // Königsstufe: Ensembles, Klangerzeugung und Fallen gemischt, genauere Gruppen mit allen vier Körben
  s6: [ARTEN.frage, ARTEN.frage, () => ARTEN.genauerAlle(false), () => ARTEN.genauerAlle(true)],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Wie heisst das Instrument?",
  s2: "Schlagen, zupfen, streichen oder blasen?",
  s3: "Schlag-, Saiten-, Blas- oder Tasteninstrument?",
  s4: "Holz oder Blech? Streichen oder zupfen?",
  s5: "Duo, Trio, Quartett — und wie entsteht der Ton?",
  s6: "Ensembles, Klang und Fallen: alle vier genauen Gruppen.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
// Aufgabenart für ctx.serie: bei Körben, wonach sortiert wird.
const artVon = a => a.nach || a.art;
// Stufen, in denen die freien Listen mehr als eine Aufgabenart hergeben (nur dort ctx.serie("art")).
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()).filter(Boolean).map(artVon)).size > 1));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (instrumente.js). */
function herkunft(a) {
  const listeVon = name => INSTRUMENT_LISTE_JE_GRUPPE[INSTRUMENTE.find(i => i[1] === name)?.[2]] || "?";
  if (a.art === "frage") return [INSTRUMENT_FRAGEN.find(f => f[0] === a.frage)?.[4] || "?"];
  if (a.art === "name") return a.optionen.map(listeVon);
  return [listeVon(a.x.name)];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.optionen && a.optionen.length < 2) m.push("weniger als zwei Antworten");
  const wahl = a.optionen || a.koerbe;
  if (!wahl.includes(a.richtig) || new Set(wahl).size !== wahl.length) m.push("Auswahl doppelt oder ohne Lösung");
  if ((stufe === "s1" || stufe === "s2") && a.x && !a.x.bild) m.push("Instrument ohne Bild in Stufe 1–2");
  if (a.koerbe && a.koerbe.some(k => !a.info[k])) m.push("Korb ohne Bild");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Wie entsteht der Ton? — ohne Namen der Körbe
 * und ohne Zahl.
 */
function tippsFuer(a) {
  if (a.art === "name") return ["Schau genau: Hat es Saiten, Tasten, ein Mundstück — oder schlägt man darauf?",
    "Denk daran, wo du so ein Instrument schon gesehen oder gehört hast."];
  if (a.art === "frage") return INSTRUMENT_FRAGEN.find(f => f[0] === a.frage)?.[4] === "klang"
    ? ["Ein Ton entsteht immer dort, wo etwas schwingt.", "Überleg, welcher Teil des Instruments sich bewegt, wenn man es spielt."]
    : ["Denk an Musik, die du kennst: Wie viele spielen mit?", "Lies alle Antworten. Welche passt zu einer kleinen Gruppe, welche zu einem grossen Orchester?"];
  const saiten = "Bei Saiten: Fährt man mit einem Bogen darüber, oder reisst man sie mit den Fingern an?";
  const blasen = "Beim Blasen: Schwingen die Lippen im Mundstück, oder schwingt ein Rohrblatt oder die Luft an einer Kante? Das Material zählt nicht.";
  if (a.nach === "spielart") return ["Stell dir vor, du spielst es: Was machen deine Hände oder dein Mund?",
    "Hat es Saiten, Tasten oder ein Mundstück — oder schlägt oder schüttelt man es?"];
  if (a.nach === "gruppe") return ["Wie entsteht der Ton? Schlägt man, zupft man, streicht man oder bläst man?",
    "Saiten zupft oder streicht man, Luft bläst man hinein, auf Fell, Holz oder Metall schlägt man, und Tasten drückt man."];
  if (a.koerbe.length === 2) return a.koerbe.includes("Zupfinstrument") ? ["Wie bringt man die Saiten zum Klingen?", saiten]
    : ["Achte darauf, wie der Ton entsteht — nicht auf das Material.", blasen];
  return ["Hat es Saiten, oder bläst man hinein?", a.x.genauer.includes("blas") ? blasen : saiten];
}

LS.spiel({
  id: "instrumente",
  // Abschluss-Animation (Pilot P6, Muster AUFTRITT; docs/konzept_abschluss_animationen.md 7): Solo, Duo, Trio, Quartett,
  // Quintett, Orchester — wie die Ensembles, die das Spiel fragt; je Auftritt ein Ton, nur mit Ton an
  feier: { muster: "auftritt", bilder: "musik", ziele: { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: "orchester" } },
  hilfe: "Schau das Instrument genau an und überleg, wie man darauf spielt: Wie entsteht der Ton?",
  einleitung: "Trommel, Geige, Flöte — kennst du die Instrumente? Und wie macht man mit ihnen Musik?",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", artVon(a));
    // Zwei feste Körbe (Holz/Blech, Streichen/Zupfen); mit allen vier Körben (Königsstufe) nicht.
    if (a.nach === "genauer" && a.koerbe.length === 2) ctx.serie("antwort", a.richtig);
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    if (a.art === "name") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Wie heisst dieses Instrument?" }), el("div", { class: "bild-gross" }, LS.bild(a.x.bild)));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 130, hinweis: "Schau genau: Hat es Saiten, Tasten, ein Mundstück — oder schlägt man darauf?", loesung: `Das ist: ${a.x.name}.` });
    } else if (a.art === "korb") {
      const frage = a.info === SPIELARTEN ? "Wie spielt man dieses Instrument?" : "Zu welcher Gruppe gehört das Instrument?";
      ctx.flaeche.append(el("div", { class: "frage", text: frage }));
      const { karte } = LS.koerbe(ctx, {
        karte: { bild: a.x.bild, text: a.x.name }, koerbe: a.koerbe, richtig: a.richtig,
        korbInhalt: k => ({ bild: a.info[k], text: k }),
        // Der Hinweis nennt die Gruppe nicht — sonst stünde die Lösung darin.
        hinweis: FALLEN.test(a.x.name) && a.info === GRUPPEN && a.koerbe.includes("Holzblasinstrument")
          ? "Achtung, Falle! Nicht das Material zählt, sondern wie der Ton entsteht: mit einem Rohrblatt oder einer Kante — oder mit den Lippen im Mundstück?"
          : "Wie entsteht der Ton? Schlägt man, zupft man, streicht man oder bläst man?",
        loesung: `${a.x.name}: ${a.richtig}.`,
      });
      // Hier ist die Spielweise oder Gruppe gefragt, nicht der Name: Die Eule liest ihn mit vor (rahmen.md Abschnitt 12).
      karte.querySelector("b").classList.add("frage");
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 200, hinweis: "Denk an Musik, die du kennst: Wie viele spielen mit? Was schwingt?", loesung: `${a.frage} ${a.richtig.replace(/\.$/, "")}.` });
    }
    if (ctx.nr === 0) ctx.sag("Schau genau hin und tipp auf deine Antwort.");
  },
});
</script>
</body>
</html>
