<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schwimmt oder sinkt?</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🛁 Schwimmt oder sinkt?</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="stoffe.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.3.3: a Eigenschaften von Objekten und Stoffen beschreiben (z.B. schwimmt, schwer,
// weich); b (Grundanspruch 1. Zyklus) Beschaffenheit erforschen (Holz, Steine, Kunststoffe);
// c nach Material ordnen; d (Orientierungspunkt 2. Zyklus) mit Stoffen laborieren: schwimmen,
// sinken, Wärmeleitfähigkeit. Inhalte in stoffe.js. Am besten zu Hause mit einer Schüssel Wasser nachprüfen!

const { waehle, mische, el } = LS;
const STUFE_NR = { s1: 1, s2: 2, s3: 3, s4: 4, s5: 5, s6: 6 };
const WASSER = { schwimmt: { bild: "🛟", text: "schwimmt" }, sinkt: { bild: "⬇️", text: "sinkt" } };
const MATERIALIEN = { Holz: "🪵", Metall: "🔩", Glas: "🫙", Kunststoff: "🧴", Papier: "📄" };

const ID = "schwimmt-sinkt";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : STOFF_LISTEN);
const WASSER_FREI = FREI.has("wasser") ? WASSER_DINGE : [];
const MATERIAL_FREI = FREI.has("material") ? MATERIAL_DINGE : [];
const FRAGEN = STOFF_FRAGEN.filter(f => FREI.has(f[5]));

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  wasser(einfach = false) {
    const liste = einfach ? WASSER_FREI.filter(d => WASSER_EINFACH.includes(d[1])) : WASSER_FREI;
    if (!liste.length) return null;
    const [bild, name, schwimmt] = waehle(liste);
    return { art: "wasser", bild, name, richtig: schwimmt ? "schwimmt" : "sinkt" };
  },
  material(n = 3) {
    if (!MATERIAL_FREI.length) return null;
    const [bild, name, material] = waehle(MATERIAL_FREI);
    const andere = mische(Object.keys(MATERIALIEN).filter(m => m !== material)).slice(0, n - 1);
    return { art: "material", bild, name, richtig: material, koerbe: mische([material, ...andere]) };
  },
  frage(n) {
    // Fragen dieser Stufe, ab und zu eine der Stufe davor; ohne freie Frage dieser Stufe keine Aufgabe.
    if (!FRAGEN.some(f => f[0] === n)) return null;
    const liste = FRAGEN.filter(f => f[0] === n || (f[0] === n - 1 && Math.random() < 0.3));
    const [, frage, richtig, f1, f2] = waehle(liste);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
  /** Irgendeine Frage bis zu dieser Stufe (Königsstufe). */
  frageBis(n) {
    const liste = FRAGEN.filter(f => f[0] <= n);
    if (!liste.length) return null;
    const [, frage, richtig, f1, f2] = waehle(liste);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [() => ARTEN.wasser(true)],
  s2: [() => ARTEN.wasser()],
  s3: [() => ARTEN.material(), () => ARTEN.wasser()],
  s4: [() => ARTEN.frage(4), () => ARTEN.material()],
  s5: [() => ARTEN.frage(5), () => ARTEN.wasser()],
  // Königsstufe: alles gemischt — Wasser, Material mit allen Körben, alle Fragen
  s6: [() => ARTEN.wasser(), () => ARTEN.material(5), () => ARTEN.frageBis(6), () => ARTEN.frageBis(6)],
};

/** Wie viele verschiedene Arten eine Stufe mit den freien Listen hergibt — ctx.serie("art") nur bei mehreren. */
const ARTEN_JE_STUFE = Object.fromEntries(Object.entries(STUFE).map(([s, neue]) => [s, new Set(neue.map(neu => neu()?.art).filter(Boolean)).size]));

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Schwimmt oder sinkt? Holz, Stein, Apfel …",
  s2: "Mehr Dinge: Kerze, Schlüssel, Kartoffel.",
  s3: "Aus welchem Material ist das?",
  s4: "Durchsichtig, biegsam, leitet Wärme.",
  s5: "Warum schwimmt ein Schiff aus Stahl?",
  s6: "Alles gemischt: Wasser, Material, Eigenschaften, Schiff.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (stoffe.js). */
function herkunft(a) {
  if (a.art === "wasser") return [WASSER_DINGE.some(d => d[1] === a.name && (d[2] ? "schwimmt" : "sinkt") === a.richtig) ? "wasser" : "?"];
  if (a.art === "material") return [MATERIAL_DINGE.some(d => d[1] === a.name && d[2] === a.richtig) ? "material" : "?"];
  return [STOFF_FRAGEN.find(f => f[1] === a.frage)?.[5] || "?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (stufe === "s1" && a.art === "wasser" && !WASSER_EINFACH.includes(a.name)) m.push("Ding in Stufe 1 nicht eindeutig");
  if (a.koerbe && (!a.koerbe.includes(a.richtig) || new Set(a.koerbe).size !== a.koerbe.length)) m.push("Korb fehlt oder doppelt");
  if (a.art === "frage") {
    if (new Set(a.optionen).size !== 3) m.push("Antworten doppelt");
    if (STOFF_FRAGEN.find(f => f[1] === a.frage)[0] > STUFE_NR[stufe]) m.push("Frage aus einer höheren Stufe");
  }
  return m;
}

LS.spiel({
  id: "schwimmt-sinkt",
  einleitung: "Plumps! Was passiert, wenn du das ins Wasser legst? Schwimmt es oder sinkt es?",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (ARTEN_JE_STUFE[ctx.stufe] > 1) ctx.serie("art", a.art);
    if (a.art === "wasser") ctx.serie("antwort", a.richtig);
    if (a.art === "wasser") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Was passiert im Wasser?" }));
      LS.koerbe(ctx, {
        karte: { bild: a.bild, text: a.name }, koerbe: ["schwimmt", "sinkt"], richtig: a.richtig, korbInhalt: k => WASSER[k],
        farbe: k => (k === "schwimmt" ? "#2f8fe0" : "var(--deko-7)"),
        hinweis: "Ist es für seine Grösse leicht wie Holz — oder schwer wie Metall und Stein?",
        loesung: `${a.name} ${a.richtig}.`, lob: `Richtig: ${a.name} ${a.richtig}! Probier es zu Hause aus.`,
      });
    } else if (a.art === "material") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Aus welchem Material ist das?" }));
      LS.koerbe(ctx, {
        karte: { bild: a.bild, text: a.name }, koerbe: a.koerbe, richtig: a.richtig, korbInhalt: m => ({ bild: MATERIALIEN[m], text: m }),
        hinweis: "Wie fühlt es sich an? Hart und kalt, durchsichtig, leicht und biegsam?",
        loesung: `${a.name}: ${a.richtig}.`,
      });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 200, hinweis: "Denk an deine Versuche mit Wasser und verschiedenen Dingen.", loesung: `${a.frage} ${a.richtig}` });
    }
    if (ctx.nr === 0) ctx.sag("Was glaubst du? Tipp auf deine Vermutung.");
  },
});
</script>
</body>
</html>
