<script>
"use strict";
// Lehrplan SG MA.3.B.2: a (Grundanspruch 1. Zyklus) Anordnungen variieren; b (Orientierungspunkt
// 2. Zyklus, 4. Klasse) systematisch kombinieren — z. B. Glace mit zwei Kugeln aus mehreren Sorten,
// Kleider kombinieren. Das Kind legt alle Möglichkeiten (das Spiel erkennt Doppelte) oder bestimmt
// ihre Anzahl. Becher = Reihenfolge egal; Cornet = es zählt, welche Kugel unten und welche oben ist.
// Sorten und Kleider in inhalte.js.

const { zufall, waehle, mische, el } = LS;
const ID = "glace-kombinator";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : GLACE_LISTEN);
const SORTEN = FREI.has("sorten") ? GLACE_SORTEN.map(s => s[0]) : [];
const TEILE = FREI.has("kleider") ? KLEIDER : [];
const SORTE = Object.fromEntries(GLACE_SORTEN.map(s => [s[0], s]));
const TEIL = Object.fromEntries(KLEIDER.map(t => [t[2], t]));
const sortenIndex = name => GLACE_SORTEN.findIndex(s => s[0] === name);
const teilIndex = name => KLEIDER.findIndex(t => t[2] === name);
const GRUPPEN = Object.keys(KLEIDER_GRUPPEN);

// ---------- Aufgaben ----------
// glace: { typ: "glace", art: "legen" | "zaehlen", sorten, kugeln (2 oder 3), reihenfolge (Cornet), gleich (zweimal dieselbe erlaubt) }
// turm:  { typ: "turm", art, sorten } — alle Sorten übereinander, jede einmal (Anordnungen)
// kleider: { typ: "kleider", art, gruppen: [{ g, teile: [Namen] }] } — aus jeder Gruppe ein Stück

function glace(art, n, kugeln = 2, reihenfolge = false, gleich = false) {
  if (SORTEN.length < n) return null;
  const sorten = mische(SORTEN).slice(0, n).sort((a, b) => sortenIndex(a) - sortenIndex(b));
  return { typ: "glace", art, sorten, kugeln, reihenfolge, gleich };
}
function turm(art, n) {
  if (SORTEN.length < n) return null;
  return { typ: "turm", art, sorten: mische(SORTEN).slice(0, n).sort((a, b) => sortenIndex(a) - sortenIndex(b)) };
}
/** Kleider aus so vielen Gruppen, wie 'groessen' Zahlen hat; je Gruppe höchstens so viele Stücke. */
function kleider(art, groessen) {
  const moeglich = GRUPPEN.filter(g => TEILE.filter(t => t[0] === g).length >= 2);
  if (moeglich.length < groessen.length) return null;
  const gruppen = mische(moeglich).slice(0, groessen.length).sort((a, b) => GRUPPEN.indexOf(a) - GRUPPEN.indexOf(b));
  return {
    typ: "kleider", art,
    gruppen: gruppen.map((g, i) => {
      const da = TEILE.filter(t => t[0] === g);
      return { g, teile: mische(da).slice(0, Math.min(groessen[i], da.length)).map(t => t[2]).sort((a, b) => teilIndex(a) - teilIndex(b)) };
    }),
  };
}

// Je Stufe die Arten (mehrfach genannt = häufiger); jede liefert null, wenn die freien Listen nichts hergeben.
const STUFE = {
  s1: [() => kleider("legen", [2, waehle([2, 3])])],
  s2: [() => kleider("legen", [3, waehle([2, 3])]), () => glace("legen", waehle([3, 4]))],
  s3: [() => glace("legen", waehle([4, 5])), () => glace("legen", 3, 2, true), () => glace("zaehlen", waehle([4, 5])),
    () => glace("zaehlen", waehle([3, 4]), 2, true), () => kleider("zaehlen", [zufall(2, 4), zufall(2, 4)])],
  s4: [() => glace("legen", waehle([3, 4]), 2, false, true), () => glace("legen", 3, 2, true, true),
    () => glace("zaehlen", waehle([5, 6]), 2, Math.random() < 0.5), () => glace("zaehlen", waehle([4, 5]), 2, Math.random() < 0.5, true),
    () => kleider("zaehlen", [zufall(2, 3), zufall(2, 3), zufall(2, 3)])],
  s5: [() => turm("legen", 3), () => glace("zaehlen", zufall(6, 8), 2, Math.random() < 0.5, Math.random() < 0.5),
    () => kleider("zaehlen", [zufall(2, 4), zufall(2, 4), zufall(2, 4)])],
  // Königsstufe: drei Kugeln, Türme aus vier Sorten, Sets aus vier Gruppen; dazu die grösste Legeaufgabe.
  s6: [() => glace("zaehlen", zufall(4, 6), 3), () => glace("zaehlen", zufall(4, 5), 3, true), () => turm("zaehlen", 4),
    () => kleider("zaehlen", [zufall(2, 4), zufall(2, 4), zufall(2, 4), zufall(2, 3)]), () => glace("legen", 5)],
};

function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

// ---------- Kombinationen ----------
/** Schlüssel einer Kombination: im Becher ohne Reihenfolge (sortiert), sonst wie gelegt. */
function schluessel(a, kombi) {
  const k = a.typ === "glace" && !a.reihenfolge ? kombi.slice().sort((x, y) => sortenIndex(x) - sortenIndex(y)) : kombi;
  return k.join("|");
}

/** Alle Kombinationen, systematisch geordnet (durch Aufzählen, nicht mit der Formel). */
function alleKombis(a) {
  const liste = [];
  const gesehen = new Set();
  const dazu = k => { const s = schluessel(a, k); if (!gesehen.has(s)) { gesehen.add(s); liste.push(k); } };
  if (a.typ === "kleider") {
    (function weiter(i, bisher) {
      if (i === a.gruppen.length) { dazu(bisher); return; }
      for (const t of a.gruppen[i].teile) weiter(i + 1, [...bisher, t]);
    })(0, []);
    return liste;
  }
  const laenge = a.typ === "turm" ? a.sorten.length : a.kugeln;
  const gleich = a.typ === "glace" && a.gleich;
  (function weiter(bisher) {
    if (bisher.length === laenge) { dazu(bisher); return; }
    for (const s of a.sorten) if (gleich || !bisher.includes(s)) weiter([...bisher, s]);
  })([]);
  return liste;
}

// ---------- Wie systematisch hat das Kind gesucht? (Hinweis Patrik, LERN_Session7) ----------

/** Alle Reihenfolgen der Stellen 0 … n−1 (höchstens vier Stellen: 24). */
const anordnungen = n => (n <= 1 ? [Array.from({ length: n }, (_, i) => i)]
  : anordnungen(n - 1).flatMap(p => Array.from({ length: n }, (_, i) => [...p.slice(0, i), n - 1, ...p.slice(i)])));

/**
 * Systematisch heisst wie beim Zählwerk: Eine Stelle wechselt am langsamsten, alle Funde mit demselben
 * Stück dort stehen beieinander, und innerhalb davon gilt dasselbe für die nächste Stelle.
 * „streng“: zusätzlich innen jedes Mal dieselbe Reihenfolge; „geordnet“: nur beieinander.
 * Liefert ausserdem die Stücke der langsamsten Stelle in der Reihenfolge des Kindes.
 */
function systematik(folge) {
  let best = null;
  for (const pos of anordnungen(folge[0].length)) {
    const stufe = bloecke(folge, pos);
    if (stufe && (!best || (stufe === "streng" && best.stufe !== "streng"))) best = { stufe, pos };
    if (best?.stufe === "streng") break;
  }
  if (!best) return { stufe: "durcheinander" };
  return { stufe: best.stufe, werte: [...new Set(folge.map(k => k[best.pos[0]]))] };
}

/** "streng", "geordnet" oder null, wenn die Stellen in der Reihenfolge 'pos' keine Blöcke bilden. */
function bloecke(folge, pos) {
  let streng = true;
  const vorher = pos.map(() => new Set()); // je Ebene: „a kam vor b“
  function ebene(teil, i) {
    if (i >= pos.length || teil.length <= 1) return true;
    const laeufe = [];
    for (const k of teil) {
      const l = laeufe[laeufe.length - 1];
      if (l && l.wert === k[pos[i]]) l.teil.push(k); else laeufe.push({ wert: k[pos[i]], teil: [k] });
    }
    if (new Set(laeufe.map(l => l.wert)).size !== laeufe.length) return false; // ein Stück zweimal getrennt
    laeufe.forEach((l, j) => laeufe.slice(j + 1).forEach(m => {
      if (vorher[i].has(`${m.wert}→${l.wert}`)) streng = false;
      vorher[i].add(`${l.wert}→${m.wert}`);
    }));
    return laeufe.every(l => ebene(l.teil, i + 1));
  }
  return ebene(folge, 0) ? (streng ? "streng" : "geordnet") : null;
}

/** Lob am Ende des Legens, je nachdem, wie das Kind vorgegangen ist; meldet das Vorgehen für die Statistik. */
function lobFuer(ctx, a, gefundenFolge, doppelte, alle) {
  const N = gefundenFolge.length;
  if (N <= 2) return `Alle ${N} gefunden!`;
  let folge = gefundenFolge;
  if (a.typ === "glace" && !a.reihenfolge) {
    // Im Becher ist die Reihenfolge der Kugeln egal: jede Glace nach der Reihenfolge ordnen, in der das Kind die Sorten zuerst nahm
    const rang = new Map();
    for (const k of folge) for (const s of k) if (!rang.has(s)) rang.set(s, rang.size);
    folge = folge.map(k => [...k].sort((x, y) => rang.get(x) - rang.get(y)));
  }
  const s = systematik(folge);
  ctx.vorgehen("systematik", doppelte >= 2 ? "hilfe" : s.stufe);
  // Namen ungebeugt („lange Hose mit allem kombiniert“), weil die Listen sie im Nominativ führen
  const beispiel = `zuerst ${alle[0][0]} mit allem kombinieren, dann ${a.typ === "kleider" ? "das nächste Stück" : "die nächste Sorte"}`;
  if (doppelte >= 2) return `Alle ${N} gefunden — mit der geordneten Reihe hat es geklappt. Nächstes Mal gleich so: ${beispiel}.`;
  if (s.stufe === "streng") {
    const [w1, w2] = s.werte;
    return waehle([
      `Alle ${N} gefunden — und richtig systematisch: zuerst ${w1} mit allem kombiniert, dann ${w2}${s.werte.length > 2 ? " und so weiter" : ""}. So geht nichts verloren.`,
      `Stark! Erst ${w1} mit allem kombiniert, dann ${w2} — wie ein Zählwerk. Alle ${N} gefunden.`,
      `Alle ${N} gefunden, Schritt für Schritt der Reihe nach. Genau so findet man sicher alle.`,
    ]);
  }
  if (s.stufe === "geordnet") {
    return `Alle ${N} gefunden! Gut geordnet: ${s.werte[0]} hast du mit allem kombiniert, bevor du weitergegangen bist. Noch sicherer wird es, wenn du innen jedes Mal gleich vorgehst.`;
  }
  return waehle([
    `Alle ${N} gefunden — diesmal kreuz und quer. Der Reihe nach geht es leichter: ${beispiel}.`,
    `Geschafft, alle ${N}! Probier nächstes Mal ein System: ${beispiel}.`,
  ]);
}

const fak = n => (n <= 1 ? 1 : n * fak(n - 1));

/** Anzahl mit der Formel und der Rechenweg für die Lösung („… = 6“). */
function formel(a) {
  if (a.typ === "kleider") {
    const N = a.gruppen.reduce((p, g) => p * g.teile.length, 1);
    return { N, text: a.gruppen.map(g => `${g.teile.length} ${KLEIDER_GRUPPEN[g.g].name}`).join(" × ") + ` = ${N}` };
  }
  const n = a.sorten.length;
  if (a.typ === "turm") {
    const N = fak(n);
    return { N, text: `unten ${n} Möglichkeiten, dann ${[...Array(n - 1)].map((_, i) => n - 1 - i).join(", ")}: ${[...Array(n)].map((_, i) => n - i).join(" × ")} = ${N}` };
  }
  if (a.kugeln === 3) {
    const P = n * (n - 1) * (n - 2);
    if (a.reihenfolge) return { N: P, text: `${n} × ${n - 1} × ${n - 2} = ${P}` };
    return { N: P / 6, text: `${n} × ${n - 1} × ${n - 2} = ${P} Reihenfolgen; jede Glace kommt 6-mal vor: ${P} : 6 = ${P / 6}` };
  }
  if (a.reihenfolge && a.gleich) return { N: n * n, text: `${n} Sorten unten × ${n} Sorten oben = ${n * n}` };
  if (a.reihenfolge) return { N: n * (n - 1), text: `${n} Sorten unten × ${n - 1} andere oben = ${n * (n - 1)}` };
  const C = n * (n - 1) / 2;
  if (a.gleich) return { N: C + n, text: `${n} mit zwei gleichen Kugeln + ${C} mit zwei verschiedenen = ${C + n}` };
  return { N: C, text: `${n} × ${n - 1} = ${n * (n - 1)}, aber jede Glace ist doppelt gezählt: ${n * (n - 1)} : 2 = ${C}` };
}

/** Name einer Kombination für Lösung und Vorlesen. */
function kombiText(a, k) {
  if (a.typ === "kleider") return k.join(" + ");
  if (a.typ === "turm" || a.reihenfolge) return `${k.join(" / ")}`;
  return k.join(" + ");
}
function legenLoesung(a) {
  const pre = a.typ === "turm" || a.reihenfolge ? "von unten nach oben: " : "";
  return pre + alleKombis(a).map(k => kombiText(a, k)).join("; ");
}

function regelText(a) {
  if (a.typ === "kleider") return "Ein Set: aus jeder Gruppe genau ein Stück.";
  if (a.typ === "turm") return `Ein Cornet mit allen ${a.sorten.length} Sorten übereinander, jede einmal. Die Reihenfolge zählt.`;
  if (a.kugeln === 3) return a.reihenfolge ? "Cornet mit 3 verschiedenen Kugeln übereinander. Die Reihenfolge zählt."
    : "Becher mit 3 verschiedenen Kugeln. Die Reihenfolge ist egal.";
  const gleich = a.gleich ? "Auch zweimal dieselbe Sorte ist erlaubt." : "Zwei verschiedene Sorten.";
  return a.reihenfolge ? `Cornet mit 2 Kugeln: Es zählt, welche unten und welche oben ist. ${gleich}`
    : `Becher mit 2 Kugeln: Die Reihenfolge ist egal. ${gleich}`;
}

// ---------- Mängel für tools/pruefe_spiele.js ----------
const STUFEN_TEXT = {
  s1: "Kleider kombinieren: Welche Sets gibt es?",
  s2: "Alle Glace mit 2 Kugeln im Becher finden.",
  s3: "Becher oder Cornet? Alle finden und zählen.",
  s4: "Auch zweimal dieselbe Sorte — wie viele gibt es?",
  s5: "Viele Sorten zählen, Cornet-Türme bauen.",
  s6: "Endgegner: 3 Kugeln, Türme aus 4 Sorten, ganze Kleider-Sets.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));
// Stufen, in denen die freien Listen mehr als eine Aufgabenart hergeben (nur dort ctx.serie("art")).
const MEHRERE_ARTEN = new Set(Object.keys(STUFE).filter(s => new Set(STUFE[s].map(art => art()?.art).filter(Boolean)).size > 1));

function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  const N = alleKombis(a).length;
  const f = formel(a);
  if (f.N !== N) m.push(`Formel ${f.N} statt ${N} Kombinationen`);
  if (f.text.split("=").pop().trim() !== String(N)) m.push("Lösungstext endet nicht mit der Anzahl");
  if (a.art === "legen" && (N < 3 || N > 10)) m.push(`${N} Kombinationen zum Legen (erlaubt 3 bis 10)`);
  if (a.art === "zaehlen" && N < 4) m.push("zu wenige Kombinationen zum Zählen");
  if (a.typ === "kleider") {
    if (a.gruppen.some(g => !g.teile.every(t => TEILE.some(x => x[2] === t && x[0] === g.g)))) m.push("Kleidungsstück nicht aus einer freien Liste oder falscher Gruppe");
    if (new Set(a.gruppen.map(g => g.g)).size !== a.gruppen.length) m.push("Gruppe doppelt");
    if (a.gruppen.some(g => g.teile.length < 2 || new Set(g.teile).size !== g.teile.length)) m.push("Gruppe mit weniger als 2 oder doppelten Stücken");
  } else {
    if (!a.sorten.every(s => SORTEN.includes(s))) m.push("Sorte nicht aus einer freien Liste");
    if (new Set(a.sorten).size !== a.sorten.length) m.push("Sorte doppelt");
    if (new Set(a.sorten.map(s => SORTE[s][2])).size !== a.sorten.length) m.push("Buchstabe auf den Kugeln doppelt");
  }
  if (/ß/.test(JSON.stringify(a) + f.text + regelText(a) + legenLoesung(a))) m.push("ß im Text");
  return m;
}

// ---------- Zeichnen ----------
/** Helle Kugel → dunkle Schrift, dunkle Kugel → weisse Schrift. */
function schrift(hex) {
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
  return 0.299 * r + 0.587 * g + 0.114 * b > 150 ? "#2d3047" : "#fff";
}
function kugel(name) {
  if (!name) return el("span", { class: "gl-kugel gl-leer", text: "?" });
  const [, farbe, buchstabe] = SORTE[name];
  return el("span", { class: "gl-kugel", style: `background:${farbe};color:${schrift(farbe)}`, title: name, text: buchstabe });
}
/** Eine Glace: im Becher nebeneinander, im Cornet übereinander (erste Kugel unten). */
function glaceBild(a, kombi, laenge) {
  const turmArt = a.typ === "turm" || a.reihenfolge;
  const kugeln = el("span", { class: "gl-kugeln" });
  for (let i = 0; i < laenge; i++) kugeln.append(kugel(kombi[i]));
  return el("span", { class: "gl-glace " + (turmArt ? "gl-turm" : "gl-becher"), "aria-label": kombi.filter(Boolean).join(", ") || "leer" },
    kugeln, el("span", { class: "gl-unten" }));
}
function setBild(a, kombi) {
  return el("span", { class: "gl-set", "aria-label": kombi.filter(Boolean).join(", ") },
    ...a.gruppen.map((g, i) => el("span", { text: kombi[i] ? TEIL[kombi[i]][1] : "▫️" })));
}
const bild = (a, kombi) => (a.typ === "kleider" ? setBild(a, kombi) : glaceBild(a, kombi, a.typ === "turm" ? a.sorten.length : a.kugeln));

function legen(ctx, a) {
  const alle = alleKombis(a);
  const N = alle.length;
  ctx.loesung(legenLoesung(a));
  const glaceArt = a.typ !== "kleider";
  // Handgriffe: jede Kombination Stück für Stück antippen; nach jedem Fund beginnt der Bau wieder leer.
  ctx.schritte(N * (glaceArt ? (a.typ === "turm" ? a.sorten.length : a.kugeln) : a.gruppen.length));
  ctx.flaeche.append(el("div", { class: "auftrag", text: glaceArt ? "Finde alle Glace!" : "Finde alle Kleider-Sets!" }),
    el("div", { class: "frage", text: regelText(a) }));
  const zaehler = el("div", { class: "gl-zaehler", "aria-live": "polite" });
  const bau = el("div", { class: "gl-bau" });
  const wahl = el("div");
  const gefundenBox = el("div", { class: "gl-gefunden" });
  // Funde oben, damit sie auch auf dem Handy neben den Sorten sichtbar bleiben (Doppelte leuchten auf).
  ctx.flaeche.append(zaehler, gefundenBox, bau, wahl);

  const gefunden = new Map(); // Schlüssel → Kombination, in der Reihenfolge des Findens
  let aktuell = glaceArt ? [] : a.gruppen.map(() => null);
  let doppelte = 0;
  let markiert = null; // { schluessel, art: "gl-neu" | "gl-doppelt" }

  function zeichneGefunden() {
    zaehler.textContent = `${gefunden.size} von ${N} gefunden`;
    gefundenBox.innerHTML = "";
    // Hilfe nach Doppelten: ab dem zweiten der Reihe nach geordnet, ab dem dritten mit leeren Plätzen.
    const liste = doppelte >= 2 ? alle.filter(k => doppelte >= 3 || gefunden.has(schluessel(a, k))) : [...gefunden.values()];
    for (const k of liste) {
      const s = schluessel(a, k);
      if (!gefunden.has(s)) { gefundenBox.append(el("span", { class: "gl-platz", text: "?" })); continue; }
      const b = bild(a, k);
      const huelle = el("span", { class: markiert && markiert.s === s ? markiert.art : "" }, b);
      gefundenBox.append(huelle);
    }
  }
  function zeichneBau() {
    bau.innerHTML = "";
    bau.append(el("b", { text: glaceArt ? "Deine Glace:" : "Dein Set:" }), bild(a, aktuell));
    for (const k of wahl.querySelectorAll(".gl-sorte")) k.classList.toggle("gl-an", aktuell.includes(k.dataset.name));
  }

  function fertigGelegt(kombi) {
    const s = schluessel(a, kombi);
    aktuell = glaceArt ? [] : a.gruppen.map(() => null);
    if (gefunden.has(s)) {
      doppelte++;
      markiert = { s, art: "gl-doppelt" };
      zeichneBau();
      zeichneGefunden();
      const umgedreht = a.typ === "glace" && !a.reihenfolge && kombi.join("|") !== s;
      const tipp = doppelte >= 3 ? " Die leeren Plätze zeigen, was noch fehlt."
        : doppelte === 2 ? " Ich ordne deine Funde der Reihe nach — siehst du, was fehlt?"
        : glaceArt ? " Geh der Reihe nach vor: zuerst alle mit der ersten Sorte." : " Nimm ein Stück und kombiniere es der Reihe nach mit allen anderen.";
      ctx.falsch((umgedreht ? "Im Becher ist das dieselbe Glace — die Reihenfolge ist egal."
        : glaceArt ? "Diese Glace hast du schon!" : "Dieses Set hast du schon!") + tipp);
      return;
    }
    gefunden.set(s, kombi);
    markiert = { s, art: "gl-neu" };
    LS.ton("huepf");
    zeichneBau();
    zeichneGefunden();
    if (gefunden.size === N) ctx.richtig(lobFuer(ctx, a, [...gefunden.values()], doppelte, alle));
  }

  if (glaceArt) {
    const laenge = a.typ === "turm" ? a.sorten.length : a.kugeln;
    const gleich = a.typ === "glace" && a.gleich;
    const box = el("div", { class: "gl-sorten" });
    for (const name of a.sorten) {
      const k = el("button", { type: "button", class: "gl-sorte", "data-name": name }, el("span", { "aria-hidden": "true" }, kugel(name)), el("span", { text: name }));
      k.addEventListener("click", () => {
        if (ctx.vorbei()) return;
        if (!gleich && aktuell.includes(name)) { ctx.sag("Jede Sorte nur einmal! Nimm eine andere.", "hinweis"); return; }
        aktuell.push(name);
        LS.ton("tipp");
        if (aktuell.length === laenge) fertigGelegt(aktuell); else zeichneBau();
      });
      box.append(k);
    }
    wahl.append(box);
  } else {
    a.gruppen.forEach((g, i) => {
      const box = el("div", { class: "gl-sorten" });
      for (const name of g.teile) {
        const k = el("button", { type: "button", class: "gl-sorte", "data-name": name }, el("span", { class: "gl-bild", "aria-hidden": "true", text: TEIL[name][1] }), el("span", { text: name }));
        k.addEventListener("click", () => {
          if (ctx.vorbei()) return;
          aktuell[i] = name;
          LS.ton("tipp");
          if (aktuell.every(Boolean)) fertigGelegt(aktuell.slice()); else zeichneBau();
        });
        box.append(k);
      }
      wahl.append(el("div", { class: "gl-gruppe" }, el("b", { text: KLEIDER_GRUPPEN[g.g].name }), box));
    });
  }
  zeichneBau();
  zeichneGefunden();
  if (ctx.nr === 0) ctx.sag(glaceArt ? "Tipp die Sorten an — jede neue Glace kommt unten dazu." : "Tipp aus jeder Gruppe ein Stück an.");
}

function zaehlen(ctx, a) {
  const f = formel(a);
  const loesung = f.text;
  ctx.loesung(loesung);
  ctx.schritte(LS.tippSchritte(f.N));
  const glaceArt = a.typ !== "kleider";
  ctx.flaeche.append(el("div", { class: "auftrag", text: glaceArt ? "Wie viele verschiedene Glace gibt es?" : "Wie viele verschiedene Kleider-Sets gibt es?" }),
    el("div", { class: "frage", text: regelText(a) }));
  if (glaceArt) {
    ctx.flaeche.append(el("div", { class: "gl-liste vorgabe" }, ...a.sorten.map(s => el("span", {}, kugel(s), el("span", { text: s })))));
  } else {
    ctx.flaeche.append(el("div", { class: "gl-gruppen" }, ...a.gruppen.map(g => el("div", { class: "gl-gruppe" }, el("b", { text: KLEIDER_GRUPPEN[g.g].name }),
      el("div", { class: "gl-liste vorgabe" }, ...g.teile.map(t => el("span", {}, el("span", { class: "gl-bild", text: TEIL[t][1] }), el("span", { text: t }))))))));
  }
  const anzeige = el("div", { class: "anzeige leer gl-anzeige", "aria-label": "Anzahl" });
  ctx.flaeche.append(anzeige);
  const n = glaceArt ? a.sorten.length : 0;
  const tasten = LS.tastatur({
    anzeige, maxStellen: 4,
    onOk(w) {
      if (ctx.vorbei()) return;
      if (w === f.N) { tasten.gesperrt = true; anzeige.classList.add("richtig"); ctx.richtig(); return; }
      anzeige.classList.add("falsch");
      let hinweis;
      if (a.typ === "kleider") {
        hinweis = w === a.gruppen.reduce((s, g) => s + g.teile.length, 0)
          ? "Zu jedem Stück passen alle Stücke der anderen Gruppen — da muss man mal rechnen, nicht plus."
          : "Nimm das erste Stück der ersten Gruppe: Wie viele Sets gibt es damit? Und mit den anderen Stücken?";
      } else if (a.typ === "glace" && !a.reihenfolge && a.kugeln === 2 && w === n * (n - 1)) {
        hinweis = "Im Becher ist die Reihenfolge egal. Hast du jede Glace doppelt gezählt?";
      } else if (a.typ === "glace" && !a.reihenfolge && a.kugeln === 3 && w === n * (n - 1) * (n - 2)) {
        hinweis = "Im Becher ist die Reihenfolge egal. Jede Glace hast du mehrfach gezählt — wie oft lassen sich 3 Kugeln umstellen?";
      } else if (a.typ === "glace" && a.reihenfolge && 2 * w === f.N) {
        hinweis = "Beim Cornet zählt die Reihenfolge: Kugel A unten und B oben ist eine andere Glace als B unten und A oben.";
      } else if (a.typ === "glace" && a.gleich && w === f.N - n) {
        hinweis = "Auch zweimal dieselbe Sorte ist erlaubt — hast du die mitgezählt?";
      } else {
        hinweis = a.typ === "turm" ? "Wie viele Sorten können unten sein? Und wie viele dann noch darüber?"
          : "Geh der Reihe nach vor: zuerst alle Glace mit der ersten Sorte, dann mit der zweiten …";
      }
      ctx.falsch(hinweis, loesung);
      if (ctx.vorbei()) tasten.gesperrt = true;
    },
  });
  ctx.flaeche.append(tasten.element);
  if (ctx.nr === 0) ctx.sag("Du kannst sie in Gedanken legen — oder geschickt rechnen.");
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): systematisch vorgehen, Reihenfolge egal oder
 * nicht — nie die Anzahl.
 */
function tippsFuer(a) {
  if (a.typ === "kleider") return a.art === "legen"
    ? ["Nimm ein Stück und kombiniere es der Reihe nach mit allen Stücken der anderen Gruppen.", "Erst wenn das Stück mit allem kombiniert ist, nimm das nächste."]
    : ["Nimm das erste Stück der ersten Gruppe: Wie viele Sets gibt es damit?", "Mit jedem anderen Stück der ersten Gruppe gibt es gleich viele Sets — da hilft Malrechnen."];
  if (a.typ === "turm") return a.art === "legen"
    ? ["Wähl zuerst die Sorte unten und bau alle Türme damit fertig.", "Tausch dann nur die oberen Kugeln, bevor du unten eine neue Sorte nimmst."]
    : ["Wie viele Sorten können unten sein?", "Darüber bleibt jedes Mal eine Sorte weniger übrig. Rechne mal."];
  const gleich = a.gleich ? " Denk auch an die Glace mit zweimal derselben Sorte." : "";
  if (a.art === "legen") return ["Geh der Reihe nach vor: zuerst alle Glace mit der ersten Sorte, dann mit der nächsten.",
    (a.reihenfolge ? "Beim Cornet zählt, welche Kugel unten ist: A unten und B oben ist eine andere Glace als B unten und A oben."
      : "Im Becher ist die Reihenfolge egal: A + B ist dieselbe Glace wie B + A.") + gleich];
  if (a.kugeln === 3) return a.reihenfolge
    ? ["Wie viele Sorten können unten sein? Und wie viele dann in der Mitte und oben?", "Mit jeder Kugel bleibt eine Sorte weniger übrig. Rechne mal."]
    : ["Zähl zuerst so, als ob die Reihenfolge zählen würde.", "Im Becher ist die Reihenfolge egal: Wie oft lassen sich drei Kugeln umstellen? So oft hast du jede Glace gezählt."];
  if (a.reihenfolge) return ["Wie viele Sorten können unten sein?",
    a.gleich ? "Und wie viele oben, wenn auch dieselbe Sorte erlaubt ist?" : "Und wie viele andere Sorten passen dann noch oben drauf?"];
  return ["Zähl zuerst alle Glace mit der ersten Sorte. Dann die mit der zweiten, ohne die schon gezählten.",
    "Im Becher ist die Reihenfolge egal: Zählst du A + B und B + A, hast du jede Glace doppelt." + gleich];
}

LS.spiel({
  id: ID,
  einleitung: "Wie viele verschiedene Glace kannst du machen? Probier alle Möglichkeiten — aber keine doppelt!",
  hilfe: "Beim Finden tippst du Sorten oder Kleider an — jede fertige Glace und jedes Set kommt zu deinen Funden. Beim Zählen tippst du die Anzahl ein.",
  anzahl: 6,
  stufen: STUFEN,
  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (MEHRERE_ARTEN.has(ctx.stufe)) ctx.serie("art", a.art);
    ctx.tipp(tippsFuer(a)); // Tipps vor dem Antworten (ctx.tipp, LERN_Session9)
    if (a.art === "legen") legen(ctx, a); else zaehlen(ctx, a);
  },
});
</script>
</body>
