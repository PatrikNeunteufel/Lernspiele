<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Word-Match</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .thema-name { text-align: center; font-weight: 800; color: var(--text-leise); margin-bottom: 4px; }
  .bild-gross { text-align: center; font-size: clamp(64px, 15vw, 100px); line-height: 1.1; margin-bottom: 8px; }
  .wort-gross { text-align: center; font-size: clamp(32px, 7vw, 48px); font-weight: 900; margin-bottom: 14px; color: var(--knopf); }
  .optionen { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 10px; max-width: 680px; margin: 0 auto; }
  .option { border: none; border-radius: 16px; min-height: 64px; padding: 8px; font-family: inherit; font-size: clamp(20px, 4vw, 26px); font-weight: 900; background: #fff; color: var(--text); box-shadow: 0 5px 0 var(--rand); cursor: pointer; }
  .option.bild { font-size: clamp(40px, 9vw, 56px); }
  .option.falsch { background: var(--hinweis-hell); animation: wackeln .4s; }
  .option.richtig { background: var(--gut-hell); }
  .ablage { display: flex; justify-content: center; gap: 6px; min-height: 60px; margin-bottom: 14px; flex-wrap: wrap; }
  .ablage span { width: 44px; height: 54px; border-radius: 10px; border-bottom: 4px solid var(--knopf); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; }
  .kacheln { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .kachel { width: 52px; height: 58px; border: none; border-radius: 12px; font-family: inherit; font-size: 28px; font-weight: 900; background: #fff; box-shadow: 0 4px 0 var(--rand); cursor: pointer; }
  .kachel:disabled { opacity: .25; }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🇬🇧 English Word-Match</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG FS1E.5.B.1: Wortschatz zu vertrauten Themen (a begrenztes, b elementares Repertoire).
// Englisch beginnt in St. Gallen in der 3. Klasse; Stufe 1 mit Bildern taugt auch früher.

const { zufall, waehle, mische, el } = LS;

// Je Stufe: Themen und Aufgabenarten
const STUFE = {
  s1: { themen: ["farben", "tiere", "zahlen"], arten: ["bildZuEn"] },
  s2: { themen: ["farben", "tiere", "zahlen", "essen", "familie"], arten: ["bildZuEn", "enZuBild"] },
  s3: { themen: ["essen", "familie", "schule", "koerper", "wetter", "tiere"], arten: ["deZuEn", "enZuBild"] },
  s4: { themen: Object.keys(THEMEN_EN), arten: ["enZuDe", "wendung", "deZuEn"] },
  s5: { themen: Object.keys(THEMEN_EN), arten: ["buchstabieren", "wendung"] },
  // Königsstufe: Deutsch → Englisch mit ähnlichen Wörtern aus allen Themen (brother, bread, brown),
  // buchstabieren ohne Bild mit zwei überzähligen Buchstaben, Wendungen in beide Richtungen.
  s6: { themen: Object.keys(THEMEN_EN), arten: ["deZuEnAehnlich", "deZuEnAehnlich", "buchstabierenSchwer", "wendung"] },
};

const ALLE_WOERTER = Object.values(THEMEN_EN).flatMap(t => t.woerter);
const ABC = "abcdefghijklmnopqrstuvwxyz";

// Freigabe (Entscheid L4 a): je Thema eine Liste (Feld liste in woerter.js), die Wendungen eine
// eigene. Nur Inhalte aus Listen, die der Spieler üben darf (Aufsicht: alle). Kennt der Katalog die
// Listen nicht, gilt alles als frei — dann entscheidet die Freigabe des Spiels.
const LISTEN = [...new Set(Object.values(THEMEN_EN).map(t => t.liste)), "wendungen"];
const FREI = new Set(LS.spielListen("word-match").length ? LS.freieListen("word-match") : LISTEN);
const FREIE_WOERTER = Object.values(THEMEN_EN).filter(t => FREI.has(t.liste)).flatMap(t => t.woerter);
/** Englisch, Deutsch und Bild aller freien Wörter und Wendungen — für pruefeAufgabe. */
const FREIE_TEXTE = new Set([...FREIE_WOERTER, ...(FREI.has("wendungen") ? WENDUNGEN_EN : [])].flat());
/** Themen und Aufgabenarten der Stufe, die mit den freien Listen gehen; keine Art = Stufe wird nicht angeboten. */
const themenIn = stufe => STUFE[stufe].themen.filter(t => FREI.has(THEMEN_EN[t].liste));
const artenIn = stufe => STUFE[stufe].arten.filter(a => (a === "wendung" ? FREI.has("wendungen") : themenIn(stufe).length > 0));
const nurMoegliche = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => artenIn(s).length));

/** Drei freie Wörter aus allen Themen, die dem englischen Wort ähneln: gleicher Anfangsbuchstabe, ähnliche Länge. */
function aehnliche(en) {
  const nah = w => (w[0][0] === en[0] ? 0 : 10) + Math.abs(w[0].length - en.length) + Math.random();
  return FREIE_WOERTER.filter(w => w[0] !== en).sort((a, b) => nah(a) - nah(b)).slice(0, 3);
}

/** Eine Aufgabe: Art, Wort, Antwortmöglichkeiten (bei buchstabieren die Kacheln). */
function aufgabeErzeugen(stufe) {
  const arten = artenIn(stufe);
  if (!arten.length) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  const art = waehle(arten);
  if (art === "wendung") {
    const [en, de] = waehle(WENDUNGEN_EN);
    const deutschZuEnglisch = Math.random() < 0.5;
    const andere = mische(WENDUNGEN_EN.filter(w => w[0] !== en)).slice(0, 3);
    return { art, en, de, thema: "Phrases", zeige: deutschZuEnglisch ? de : en,
      optionen: deutschZuEnglisch ? [en, ...andere.map(w => w[0])] : [de, ...andere.map(w => w[1])], richtig: deutschZuEnglisch ? en : de, loesung: `${en} = ${de}` };
  }
  const themaId = waehle(themenIn(stufe));
  const thema = THEMEN_EN[themaId];
  const kandidaten = art === "buchstabierenSchwer" ? thema.woerter.filter(w => w[0].length >= 4) : thema.woerter;
  const [en, de, bild] = waehle(kandidaten.length ? kandidaten : thema.woerter);
  const andere = mische(thema.woerter.filter(w => w[0] !== en)).slice(0, 3);
  const basis = { art, themaId, en, de, bild, thema: thema.name, loesung: `${bild} ${en} = ${de}` };
  if (art === "bildZuEn") return { ...basis, optionen: [en, ...andere.map(w => w[0])], richtig: en };
  if (art === "enZuBild") return { ...basis, optionen: [bild, ...andere.map(w => w[2])], richtig: bild, alsBild: true };
  if (art === "deZuEn") return { ...basis, optionen: [en, ...andere.map(w => w[0])], richtig: en };
  if (art === "enZuDe") return { ...basis, optionen: [de, ...andere.map(w => w[1])], richtig: de };
  if (art === "deZuEnAehnlich") return { ...basis, thema: "All topics", optionen: [en, ...aehnliche(en).map(w => w[0])], richtig: en };
  // buchstabieren: Kacheln = Buchstaben des Worts (Königsstufe: plus zwei Buchstaben, die nicht vorkommen)
  const ziel = en.toLowerCase();
  const extra = art === "buchstabierenSchwer" ? mische(ABC.split("").filter(b => !ziel.includes(b))).slice(0, 2) : [];
  return { ...basis, ziel, kacheln: mische([...ziel.split(""), ...extra]), extra };
}

/** Mängel: richtige Antwort genau einmal, Möglichkeiten verschieden, Kacheln reichen genau für das Wort. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const liste = a.art === "wendung" ? "wendungen" : THEMEN_EN[a.themaId].liste;
  if (!FREI.has(liste) || ![a.en, a.de, ...(a.optionen || [])].every(t => FREIE_TEXTE.has(t))) m.push("Inhalt nicht aus einer freien Liste");
  if (a.art !== "wendung" && !STUFE[stufe].themen.includes(a.themaId)) m.push("Thema nicht in der Stufe");
  if (a.optionen) {
    if (a.optionen.filter(o => o === a.richtig).length !== 1) m.push("richtige Antwort nicht genau einmal");
    if (new Set(a.optionen).size !== a.optionen.length) m.push("doppelte Möglichkeit");
    if (a.optionen.length < 2) m.push("zu wenige Möglichkeiten");
  } else {
    const rest = a.kacheln.slice();
    for (const b of a.ziel) { const i = rest.indexOf(b); if (i < 0) m.push("Buchstabe fehlt in den Kacheln"); else rest.splice(i, 1); }
    if (rest.length !== a.extra.length || rest.some(b => a.ziel.includes(b))) m.push("überzählige Kachel kommt im Wort vor");
    if (!/^[a-z]+$/.test(a.ziel)) m.push("Wort mit Zeichen, die keine Buchstaben sind");
  }
  if (new Set(ALLE_WOERTER.map(w => w[0])).size !== ALLE_WOERTER.length) m.push("englisches Wort doppelt in den Listen");
  return m;
}

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): erst ein Anstoss, dann eine Strategie — nie das Wort.
 * Beispiele für ähnliche Wörter nur aus Paaren, die in dieser Aufgabe nicht vorkommen.
 */
const AEHNLICH = [["mouse", "Maus"], ["hand", "Hand"], ["brown", "braun"], ["father", "Vater"], ["fish", "Fisch"], ["apple", "Apfel"]];
function tippsFuer(a) {
  const bilder = new Set(a.optionen || []); // Wort → Bild: auch die Wörter hinter den gezeigten Bildern
  const belegt = new Set([a.en, a.de, ...bilder, ...ALLE_WOERTER.filter(w => bilder.has(w[2])).map(w => w[0])]);
  const [bspEn, bspDe] = AEHNLICH.find(([e, d]) => !belegt.has(e) && !belegt.has(d)) || AEHNLICH[0];
  const aehnlich = `Manche englischen Wörter klingen fast wie deutsche: ${bspEn} – ${bspDe}. Sprich das Wort laut und hör genau hin.`;
  if (a.art === "wendung") return ["Überlege, wann man diesen Satz sagt: beim Grüssen, beim Abschied, beim Danken oder beim Fragen?",
    "Lies jedes Wort einzeln. Die Wörter, die du kennst, verraten dir, worum es geht."];
  if (a.art === "bildZuEn") return ["Sprich die englischen Wörter leise aus. Welches kennst du schon?",
    `Auf Deutsch heisst das Bild: ${a.de}. Welches englische Wort bedeutet dasselbe?`];
  if (a.art === "enZuBild" || a.art === "enZuDe") return ["Sprich das englische Wort leise aus. Erinnert es dich an ein deutsches Wort?", aehnlich];
  if (a.art === "deZuEnAehnlich") return ["Die Wörter sehen sich ähnlich. Lies jedes ganz genau, Buchstabe für Buchstabe.", aehnlich];
  if (a.art === "deZuEn") return ["Sprich die englischen Wörter leise aus. Welches kennst du schon?", aehnlich];
  if (a.art === "buchstabierenSchwer") return ["Sprich das englische Wort ganz langsam und hör auf jeden Laut.",
    "Zwei Buchstaben gehören nicht ins Wort. Beginne mit denen, die du sicher brauchst."];
  return ["Sprich das englische Wort ganz langsam und hör auf jeden Laut.", `Das Wort fängt mit „${a.ziel[0]}“ an.`];
}

LS.spiel({
  // Abschluss-Animation (feier.js, Block D, docs/konzept_abschluss_animationen.md 7)
  feier: { muster: "sammeln", bilder: "themenkarten", ziele: { s1: { themen: ["🟥", "🐶", "3️⃣"] }, s2: { themen: ["🟦", "🐱", "5️⃣", "🍎", "👩"] }, s3: { themen: ["🍞", "👦", "📖", "✋", "☀️", "🐴"], richtung: "wort" }, s4: { themen: ["🟩", "🐸", "7️⃣", "🧀", "👵", "✏️", "👂", "❄️"], wendung: true }, s5: { muster: "bauen", bilder: "buchstaben", ziel: { wort: "horse", bild: "🐴", hilfe: "bild" } }, s6: { muster: "bauen", bilder: "buchstaben", ziel: { wort: "carrot", hilfe: "deutsch", extra: ["k", "e"] } } } },
  id: "word-match",
  // Lob auf Anhieb in der Fremdsprache (LB2 a); Bestätigungen mit dem Lösungswort kommen nur nach einem Fehlversuch
  lob: ["Great!", "Well done!", "Super!", "Yes!"],
  einleitung: "Hello! Let's play! Welches englische Wort passt zum Bild? Und was heisst das auf Deutsch?",
  hilfe: stufe => (stufe === "s5" || stufe === "s6"
    ? "Schau das Bild oder das Wort an und tipp die richtige Antwort. Beim Buchstabieren tippst du die Buchstaben der Reihe nach an — sie wandern in die Kästchen."
    : "Schau das Bild oder das Wort oben an und tipp unten die Antwort, die dazu passt."),
  anzahl: 8,
  stufen: nurMoegliche({
    s1: "Bild → englisches Wort: Farben, Tiere, Zahlen.",
    s2: "Dazu Essen und Familie, auch Wort → Bild.",
    s3: "Deutsch → Englisch: Schule, Körper, Wetter.",
    s4: "Englisch → Deutsch und kleine Sätze wie „How are you?“",
    s5: "Buchstabieren: das englische Wort aus Buchstaben legen.",
    s6: "Endgegner: ähnliche Wörter aus allen Themen, buchstabieren ohne Bild mit falschen Buchstaben.",
  }),

  aufgabe(ctx) {
    let fertig = false;

    const auswahl = (optionen, richtig, alsBild, loesung) => {
      const box = el("div", { class: "optionen" });
      for (const o of mische(optionen)) {
        const k = el("button", { type: "button", class: "option" + (alsBild ? " bild" : ""), text: o });
        k.addEventListener("click", () => {
          if (fertig) return;
          if (o === richtig) { fertig = true; k.classList.add("richtig"); ctx.richtig(waehle(["Great!", "Well done!", "Super!", "Yes!"])); return; }
          k.classList.remove("falsch"); void k.offsetWidth; k.classList.add("falsch");
          ctx.falsch("Try again! Schau genau hin.", loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
        });
        box.append(k);
      }
      ctx.flaeche.append(box);
      LS.kurztasten(box);
    };

    const a = aufgabeErzeugen(ctx.stufe);
    if (new Set(artenIn(ctx.stufe)).size > 1) ctx.serie("art", a.art);
    if (a.art === "wendung") ctx.serie("richtung", a.richtig === a.en ? "deZuEn" : "enZuDe");
    const { art, en, de, bild, loesung } = a;
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(a));
    // Handgriffe: eine Antwort antippen; beim Buchstabieren je Buchstabe des Worts eine Kachel
    ctx.schritte(a.optionen ? 1 : a.ziel.length);
    ctx.flaeche.append(el("div", { class: "thema-name", text: a.thema }));

    if (a.optionen) {
      // Gezeigt wird je nach Art das Bild, das englische oder das deutsche Wort.
      const zeige = a.zeige ?? (art === "bildZuEn" ? bild : art === "enZuBild" || art === "enZuDe" ? en : de);
      ctx.flaeche.append(el("div", { class: art === "bildZuEn" ? "bild-gross" : "wort-gross", text: zeige }));
      auswahl(a.optionen, a.richtig, !!a.alsBild, loesung);
    } else {
      // buchstabieren: Buchstaben-Kacheln in der richtigen Reihenfolge antippen.
      // Königsstufe: ohne Bild, mit überzähligen Buchstaben, Hilfe ohne den bisherigen Wortanfang.
      const ziel = a.ziel;
      const schwer = art === "buchstabierenSchwer";
      if (!schwer) ctx.flaeche.append(el("div", { class: "bild-gross", text: bild }));
      ctx.flaeche.append(el("div", { class: "wort-gross", style: schwer ? "" : "font-size:24px;color:var(--text-leise)", text: de }));
      const ablage = el("div", { class: "ablage" });
      const felder = ziel.split("").map(() => { const s = el("span"); ablage.append(s); return s; });
      const kacheln = el("div", { class: "kacheln" });
      let pos = 0;
      for (const b of a.kacheln) {
        const k = el("button", { type: "button", class: "kachel", text: b });
        k.addEventListener("click", () => {
          if (fertig || k.disabled) return;
          if (b === ziel[pos]) {
            felder[pos].textContent = b; pos++; k.disabled = true; LS.ton("tipp");
            if (pos === ziel.length) { fertig = true; ctx.richtig(`Great! ${en}`); }
            return;
          }
          ctx.falsch(schwer ? "Not this one. Sprich das englische Wort leise und hör auf den nächsten Laut."
            : `Der nächste Buchstabe ist nicht „${b}“. Sprich das Wort leise: ${ziel.slice(0, pos)}…`, loesung);
          if (ctx.flaeche.querySelector(".knopfzeile")) { fertig = true; felder.forEach((f, i) => { f.textContent = ziel[i]; }); }
        });
        kacheln.append(k);
      }
      ctx.flaeche.append(ablage, kacheln);
      // Buchstaben sind selbst die Taste; gelegte Kacheln sind disabled, so nimmt der zweite gleiche Buchstabe die nächste.
      LS.kurztasten(kacheln);
    }
    if (ctx.nr === 0) ctx.sag("Tipp auf die richtige Antwort. Good luck!");
  },
});
</script>
</body>
</html>
