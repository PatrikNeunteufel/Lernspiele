<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Znüni-Teller</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .frage { text-align: center; font-size: clamp(20px, 4.4vw, 28px); font-weight: 800; margin: 4px 0 12px; }
  .teller { font-size: clamp(32px, 7vw, 42px); letter-spacing: 4px; background: radial-gradient(circle, #fff 60%, #eef0fa 61%); border-radius: 50%; padding: 18px 10px; }
  /* Ganze Aufgabe im Bild (BH3 a): Körbe in zwei Reihen brauchen auf niedrigen Bildschirmen engere Abstände.
     Die Karte umschliesst 💡 (steht im Namen, b.frage); sonst ragt der Knopf unter ihr hervor und drückt die Körbe
     auf eine schmale Spalte zusammen. */
  @media (max-height: 820px) {
    .korb-karte { margin-bottom: 8px; display: flow-root; }
    .korb-knopf { padding: 8px 8px 6px; }
  }
</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🍎 Znüni-Teller</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../version.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/feier.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="lebensmittel.js"></script>
<script>
"use strict";
// Lehrplan SG NMG.1.3: a Lebensmittel nach Kriterien ordnen; c (Grundanspruch 1. Zyklus) eine
// Mahlzeit zubereiten (Znüni, Zvieri); d (Orientierungspunkt 2. Zyklus) Bedeutung von Wasser und
// Nährstoffen für eine ausgewogene Ernährung; e Modelle (Ernährungsscheibe, -pyramide);
// f lokale, saisonale Produkte. Inhalte in lebensmittel.js.

const { waehle, mische, el } = LS;
// Bilder für „wie oft“, nicht für ein Lebensmittel: sonst passte die Karte „🍎 Apfel“ schon dem Bild nach in den Korb.
const ALLTAG = { jeden: { bild: "☀️", text: "jeden Tag" }, selten: { bild: "🎉", text: "nur ab und zu" } };
// Frage je Art; die Eule liest sie vor (rahmen.md Abschnitt 12) und nennt dabei die Körbe.
const KORB_FRAGE = { alltag: "Jeden Tag oder nur ab und zu?", fruchtGemuese: "Frucht oder Gemüse?", gruppe: "Wohin gehört das?" };
const ID = "znueni-teller";

// Freigabe (Entscheid L4 a): nur Inhalte aus Listen, die der Spieler üben darf. Kennt der Katalog
// die Listen des Spiels noch nicht, gilt der ganze Inhalt mit dem Spiel als frei.
const FREI = new Set(LS.spielListen(ID).length ? LS.freieListen(ID) : ZNUENI_LISTEN);
const L = (FREI.has("lebensmittel") ? LEBENSMITTEL : []).map(([bild, name, gruppe]) => ({ bild, name, gruppe }));
const ZNUENIS_FREI = FREI.has("znuenis") ? ZNUENIS : [];
const FRAGEN = ZNUENI_FRAGEN.filter(f => FREI.has(f[4]));

// Jede Art liefert null, wenn die freien Listen für sie nichts hergeben.
const ARTEN = {
  alltag() {
    const x = waehle(L.filter(l => ["Frucht", "Gemüse", "Getränk", "Getreide", "Süsses"].includes(l.gruppe)));
    if (!x) return null;
    return { art: "korb", typ: "alltag", x, koerbe: ["jeden", "selten"], richtig: x.gruppe === "Süsses" ? "selten" : "jeden" };
  },
  fruchtGemuese() {
    const x = waehle(L.filter(l => l.gruppe === "Frucht" || l.gruppe === "Gemüse"));
    if (!x) return null;
    return { art: "korb", typ: "fruchtGemuese", x, koerbe: ["Frucht", "Gemüse"], richtig: x.gruppe };
  },
  gruppe(n = 4) {
    const x = waehle(L);
    if (!x) return null;
    const andere = mische(Object.keys(GRUPPEN_ZNUENI).filter(g => g !== x.gruppe)).slice(0, n - 1);
    return { art: "korb", typ: "gruppe", x, koerbe: mische([x.gruppe, ...andere]), richtig: x.gruppe };
  },
  znueni() {
    if (!ZNUENIS_FREI.length) return null;
    const [gut, ...schlecht] = waehle(ZNUENIS_FREI);
    const optionen = mische([gut, ...schlecht].map(t => t.join("")));
    return { art: "znueni", richtig: gut.join(""), optionen };
  },
  frage() {
    if (!FRAGEN.length) return null;
    const [frage, richtig, f1, f2] = waehle(FRAGEN);
    return { art: "frage", frage, richtig, optionen: mische([richtig, f1, f2]) };
  },
};

// Je Stufe die Arten (mehrfach genannt = häufiger).
const STUFE = {
  s1: [ARTEN.alltag],
  s2: [ARTEN.fruchtGemuese, ARTEN.alltag],
  s3: [() => ARTEN.gruppe()],
  s4: [ARTEN.znueni, () => ARTEN.gruppe()],
  s5: [ARTEN.frage, ARTEN.znueni],
  // Königsstufe: alles gemischt, Gruppen mit allen sechs Körben
  s6: [() => ARTEN.gruppe(6), () => ARTEN.gruppe(6), ARTEN.znueni, ARTEN.frage, ARTEN.alltag],
};

/** Zufällige Art der Stufe, die mit den freien Listen etwas hergibt; null, wenn keine. */
function aufgabeErzeugen(stufe) {
  for (const art of mische(STUFE[stufe])) {
    const a = art();
    if (a) return a;
  }
  return null;
}

const STUFEN_TEXT = {
  s1: "Jeden Tag oder nur ab und zu?",
  s2: "Frucht oder Gemüse?",
  s3: "In welche Gruppe gehört das Lebensmittel?",
  s4: "Welches Znüni ist ausgewogen?",
  s5: "Vitamine, Kraft, Wasser — und was wächst bei uns?",
  s6: "Alles gemischt — und alle sechs Gruppen auf einmal.",
};
// Angeboten werden nur Stufen, für die die freien Listen etwas hergeben.
const STUFEN = Object.fromEntries(Object.entries(STUFEN_TEXT).filter(([s]) => aufgabeErzeugen(s)));

/** Listen, aus denen der Inhalt einer Aufgabe stammt — nachgeschlagen in den Rohdaten (lebensmittel.js). */
function herkunft(a) {
  if (a.art === "korb") return [LEBENSMITTEL.some(l => l[1] === a.x.name && l[2] === a.x.gruppe) ? "lebensmittel" : "?"];
  if (a.art === "znueni") return [ZNUENIS.some(z => z[0].join("") === a.richtig && z.every(t => a.optionen.includes(t.join("")))) ? "znuenis" : "?"];
  return [ZNUENI_FRAGEN.find(f => f[0] === a.frage)?.[4] || "?"];
}

/** Mängel einer Aufgabe — für tools/pruefe_spiele.js. */
function pruefeAufgabe(a, stufe) {
  if (!a) return STUFEN[stufe] ? ["keine Aufgabe in einer angebotenen Stufe"] : [];
  const m = [];
  if (!STUFEN[stufe]) m.push("Aufgabe in einer Stufe, die nicht angeboten wird");
  if (herkunft(a).some(l => !FREI.has(l))) m.push(`Inhalt nicht aus einer freien Liste (${herkunft(a).join(", ")})`);
  if (a.koerbe && (!a.koerbe.includes(a.richtig) || new Set(a.koerbe).size !== a.koerbe.length)) m.push("Korb fehlt oder doppelt");
  if (a.optionen && (!a.optionen.includes(a.richtig) || new Set(a.optionen).size !== a.optionen.length)) m.push("Auswahl doppelt oder ohne Lösung");
  return m;
}

const korbInfo = k => (ALLTAG[k] ? ALLTAG[k] : { bild: GRUPPEN_ZNUENI[k].bild, text: GRUPPEN_ZNUENI[k].name });

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): Fragen, die die Gruppen unterscheiden, und die Regel
 * für alle Körbe zugleich — nie die Erklärung nur des richtigen Korbs.
 */
function tippsFuer(a) {
  if (a.typ === "alltag") return ["Ist viel Zucker, Fett oder Salz darin?",
    "Wasser, Früchte, Gemüse, Brot, Milch und Ei: jeden Tag. Viel Zucker, Fett oder Salz: nur ab und zu."];
  if (a.typ === "fruchtGemuese") return ["Wo wächst es: an einem Baum oder Strauch? Oder sind es Blätter, Wurzeln oder Knollen?",
    "Früchte wachsen an Bäumen und Sträuchern. Gemüse sind Blätter, Wurzeln oder Knollen von Pflanzen."];
  if (a.art === "korb") return ["Wofür braucht dein Körper das? Für Vitamine, für Kraft, zum Wachsen — oder ist es nur zum Schlecken?",
    "Frag dich: Wächst es an einer Pflanze? Kommt es von einem Tier? Ist viel Zucker oder Salz darin? Trinkt man es?"];
  if (a.art === "znueni") return ["Schau jeden Teller genau an: Was liegt alles darauf?",
    "Ein gutes Znüni hat Frucht oder Gemüse, etwas für lange Kraft und Wasser zum Trinken."];
  const liste = ZNUENI_FRAGEN.find(f => f[0] === a.frage)?.[4];
  return ["Lies die Frage genau und dann jede Antwort.", liste === "region-saison"
    ? "Denk an den Markt, den Bauernhof oder den Garten: Was wächst hier bei uns, und wann ist es reif?"
    : "Denk an die Ernährungspyramide: unten das, wovon wir viel brauchen, oben das, wovon wir wenig brauchen."];
}

LS.spiel({
  id: "znueni-teller",
  einleitung: "Was gibt dir Kraft für die Schule? Stell dir ein feines und gesundes Znüni zusammen!",
  hilfe: "Schau das Lebensmittel an und tipp den Korb an, in den es gehört. Bei den Tellern und Fragen tippst du die Antwort an, die passt.",
  anzahl: 8,
  stufen: STUFEN,

  aufgabe(ctx) {
    const a = aufgabeErzeugen(ctx.stufe);
    if (STUFE[ctx.stufe].length > 1) ctx.serie("art", a.typ || a.art);
    if (a.art === "korb" && a.koerbe.length <= 3) ctx.serie("antwort", a.richtig);
    ctx.tipp(tippsFuer(a));
    if (a.art === "korb") {
      ctx.flaeche.append(el("div", { class: "frage", text: KORB_FRAGE[a.typ] }));
      const erkl = GRUPPEN_ZNUENI[a.x.gruppe].erklaerung;
      const { karte } = LS.koerbe(ctx, {
        karte: { bild: a.x.bild, text: a.x.name }, koerbe: a.koerbe, richtig: a.richtig, korbInhalt: korbInfo,
        // Der Hinweis erklärt den falsch gewählten Korb — die Erklärung des richtigen nennte die Lösung.
        hinweis: k => (ALLTAG[k] ? "Überleg: Viel Zucker, Fett oder Salz — nur ab und zu. Wasser, Früchte, Gemüse, Brot, Milch und Ei — jeden Tag." : `${GRUPPEN_ZNUENI[k].erklaerung} Passt ${a.x.name} dazu?`),
        loesung: `${a.x.name}: ${korbInfo(a.richtig).text}. ${erkl}`, lob: "Richtig!", erklaerung: erkl,
      });
      karte.querySelector("b").classList.add("frage"); // Name des Lebensmittels vorlesen (rahmen.md Abschnitt 12)
    } else if (a.art === "znueni") {
      ctx.flaeche.append(el("div", { class: "frage", text: "Welches Znüni ist ausgewogen?" }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 160, inhalt: t => el("span", { class: "teller", text: t }),
        hinweis: "Ein gutes Znüni hat Frucht oder Gemüse, etwas für lange Kraft und Wasser zum Trinken.", loesung: `Ausgewogen ist: ${a.richtig}`, lob: "Mmh, ein feines Znüni! 🍎" });
    } else {
      ctx.flaeche.append(el("div", { class: "frage", text: a.frage }));
      LS.auswahl(ctx, { optionen: a.optionen, richtig: a.richtig, breite: 180, hinweis: "Denk an die Ernährungspyramide: unten das, wovon wir viel brauchen, oben das, wovon wir wenig brauchen.", loesung: `${a.frage} ${a.richtig}.` });
    }
    if (ctx.nr === 0) ctx.sag("Was ist gut für jeden Tag?");
  },
});
</script>
</body>
</html>
