<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wortarten-Sortierer</title>
<link rel="stylesheet" href="../gemeinsam/stil.css">
<style>
  .wortkarte {
    margin: 6px auto 20px;
    width: fit-content;
    max-width: 100%;
    background: #fff;
    border: 4px solid var(--rand);
    border-radius: 20px;
    padding: 14px 30px;
    font-size: clamp(36px, 8vw, 58px);
    font-weight: 900;
    box-shadow: var(--schatten);
  }

  .satz {
    text-align: center;
    font-size: clamp(22px, 4.6vw, 32px);
    font-weight: 700;
    line-height: 1.6;
    margin: 6px 0 20px;
  }

  .satz mark {
    background: #fff1c2;
    border-bottom: 5px solid #f5b301;
    border-radius: 6px;
    padding: 0 6px;
    font-weight: 900;
  }

  /* Königsstufe: mehrere Wörter eines Satzes nacheinander — nur das aktuelle ist hervorgehoben. */
  .satz mark.ruhig { background: none; border-bottom-color: transparent; font-weight: 700; }
  .satz mark.sortiert { background: none; border-bottom: 5px dotted var(--rand); font-weight: 700; }

  .koerbe {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 680px;
    margin: 0 auto;
  }

  .korb {
    border: none;
    border-radius: 20px 20px 28px 28px;
    padding: 14px 6px 10px;
    min-height: 120px;
    cursor: pointer;
    color: #fff;
    background: var(--k);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .2);
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: transform .1s;
  }

  .korb:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); }
  .korb .bild { font-size: 36px; }
  .korb b { font-size: clamp(18px, 3.6vw, 24px); }
  .korb small { font-size: 14px; opacity: .9; }
  .korb .zahl { font-size: 15px; font-weight: 900; background: rgba(255, 255, 255, .25); border-radius: 999px; padding: 0 10px; margin-top: 4px; }
  .korb.falsch { animation: wackeln .4s; }

  .k-N { --k: var(--deko-6); }
  .k-V { --k: var(--deko-3); }
  .k-A { --k: var(--deko-5); }

</style>
</head>
<body>
<header class="kopf">
  <a class="zurueck" href="../../index.html" aria-label="Zur Übersicht">←</a>
  <h1>🧺 Wortarten-Sortierer</h1>
  <button class="ton" type="button" aria-label="Ton an oder aus"></button>
</header>
<main class="buehne"></main>

<script src="../gemeinsam/avatare.js"></script>
<script src="../../kern/kern.js"></script>
<script src="../gemeinsam/spiel.js"></script>
<script src="../gemeinsam/abgleich.js"></script>
<script src="../gemeinsam/katalog.js"></script>
<script src="../gemeinsam/pruefstand.js"></script>
<script src="../gemeinsam/entwicklung.js"></script>
<script src="woerter.js"></script>
<script>
"use strict";
// Lehrplan SG D.5.D.1: Nomen, Verb und Adjektiv — Stufe a erste Erfahrungen, b mit inhaltlichen
// Proben, c mit formalen Proben. Die Wörter stehen in woerter.js.

const { waehle, el } = LS;

const ARTEN = {
  N: { name: "Nomen", kind: "Namenwort", bild: "🏠", probe: "Nomen-Probe: Passt der, die oder das davor? (der Hund)" },
  V: { name: "Verb", kind: "Tunwort", bild: "🏃", probe: "Verb-Probe: Passt ich, du, er davor? (ich spiele, er spielt)" },
  A: { name: "Adjektiv", kind: "Wiewort", bild: "🎨", probe: "Adjektiv-Probe: Kann man es steigern? (gross, grösser, am grössten)" },
};

/** Satz „Der [Hund|N] bellt.“ in Teile zerlegen: Text oder { wort, art }. */
function zerlegeSatz(satz) {
  return satz.split(/(\[[^\]]+\])/).filter(Boolean).map(t => {
    const m = t.match(/^\[([^|]+)\|([NVA])\]$/);
    return m ? { wort: m[1], art: m[2] } : t;
  });
}

// Freigabe (Entscheid L4 a): Einzelwörter und je Satzgruppe eine Liste (Schlüssel in SAETZE). Nur
// Inhalte aus Listen, die der Spieler üben darf (Aufsicht: alle). Kennt der Katalog die Listen
// nicht, gilt alles als frei — dann entscheidet die Freigabe des Spiels.
const FREI = new Set(LS.spielListen("wortarten-sortierer").length ? LS.freieListen("wortarten-sortierer") : ["einzelwoerter", ...Object.keys(SAETZE)]);
// Je Stufe die Listen, aus denen sie zieht; die Königsstufe mischt Vergangenheit und Nominalisierung.
const STUFE_LISTEN = { s1: ["einzelwoerter"], s2: ["einzelwoerter"], s3: ["saetze-einfach"], s4: ["saetze-zeiten"],
  s5: ["saetze-nominal"], s6: ["saetze-zeiten", "saetze-nominal"] };
const freieListenIn = stufe => STUFE_LISTEN[stufe].filter(l => FREI.has(l));
/** Freie Sätze der Stufe; leer (und keine Einzelwörter) = Stufe wird nicht angeboten. */
const saetzeIn = stufe => freieListenIn(stufe).filter(l => l !== "einzelwoerter").flatMap(l => SAETZE[l]);
const nurMoegliche = texte => Object.fromEntries(Object.entries(texte).filter(([s]) => freieListenIn(s).length));

/** Aufgabe je Stufe: Wort einzeln (1–2) oder markiert im Satz (3–5). Die Königsstufe nimmt einen
    Satz der Stufen 4 und 5 und fragt bis zu drei Wörter darin nacheinander ab (ziele). */
function aufgabeErzeugen(stufe) {
  if (!freieListenIn(stufe).length) throw new Error(`Stufe ${stufe}: keine Liste frei`);
  if (stufe === "s1" || stufe === "s2") {
    const art = waehle(["N", "V", "A"]);
    const wort = waehle(WOERTER[art]);
    // Stufe 2: alles klein — die Grossschreibung verrät das Nomen nicht mehr, die Probe zählt.
    return { art, wort: stufe === "s2" ? wort.toLowerCase() : wort, satz: null };
  }
  const quelle = waehle(saetzeIn(stufe));
  if (stufe === "s6") {
    const teile = zerlegeSatz(quelle);
    const woerter = teile.filter(t => typeof t === "object");
    const gewaehlt = new Set(LS.mische(woerter).slice(0, 3));
    const ziele = woerter.filter(t => gewaehlt.has(t)); // in Satzreihenfolge
    return { art: ziele[0].art, wort: ziele[0].wort, satz: teile, quelle, ziel: ziele[0], ziele };
  }
  const teile = zerlegeSatz(quelle);
  const ziel = waehle(teile.filter(t => typeof t === "object"));
  return { art: ziel.art, wort: ziel.wort, satz: teile, quelle, ziel, ziele: [ziel] };
}

/** Mängel: Wortart bekannt, Ziele stehen im Satz, Königsstufe mit mindestens zwei Wörtern. */
function pruefeAufgabe(a, stufe) {
  const m = [];
  const ausListe = a.satz ? saetzeIn(stufe).includes(a.quelle)
    : FREI.has("einzelwoerter") && WOERTER[a.art].some(w => w.toLowerCase() === a.wort.toLowerCase());
  if (!ausListe) m.push("Inhalt nicht aus einer freien Liste");
  const ziele = a.ziele || [a];
  if (!ziele.every(z => ARTEN[z.art] && z.wort && z.wort.trim() === z.wort)) m.push("Wort oder Wortart fehlt");
  if (a.satz && !ziele.every(z => a.satz.includes(z))) m.push("abgefragtes Wort steht nicht im Satz");
  if (a.satz && a.satz.some(t => typeof t === "string" && /[[\]|]/.test(t))) m.push("Markierung im Satz nicht aufgelöst");
  if (!a.satz && (stufe !== "s1" && stufe !== "s2")) m.push("Einzelwort ausserhalb der Stufen 1–2");
  if (stufe === "s2" && a.wort !== a.wort.toLowerCase()) m.push("Stufe 2 nicht klein geschrieben");
  if (stufe === "s6" && (ziele.length < 2 || new Set(ziele).size !== ziele.length)) m.push("Königsstufe mit weniger als zwei verschiedenen Wörtern");
  return m;
}

const zaehler = { N: 0, V: 0, A: 0 };

/**
 * Tipps vor dem Antworten (ctx.tipp, LERN_Session9): alle drei Proben nennen (nie nur die richtige),
 * dazu je Stufe, worauf man achten muss.
 */
const TIPP_STUFE = {
  s1: "Schau auch auf den ersten Buchstaben: Nomen schreibt man gross.",
  s2: "Hier ist alles klein geschrieben. Die Grossschreibung hilft nicht — nur die Probe.",
  s3: "Mach die Probe mit dem Wort so, wie es im Satz gemeint ist.",
  s4: "Verben können in der Vergangenheit stehen (er sprang), Adjektive gesteigert sein (höher). Denk an die Grundform.",
  s5: "Achtung: Steht der, das oder beim davor, kann aus einem Tunwort oder Wiewort ein Nomen werden.",
  s6: "Mach die Probe für jedes markierte Wort neu. Achte auf Vergangenheit und auf der, das oder beim davor.",
};
function tippsFuer(stufe) {
  return ["Probier die drei Proben mit dem Wort aus: der, die, das davor? ich, du, er davor? Kann man es steigern?",
    TIPP_STUFE[stufe]];
}

LS.spiel({
  id: "wortarten-sortierer",
  einleitung: "Jedes Wort gehört in einen Korb: Nomen, Verb oder Adjektiv. Weisst du, wohin?",
  hilfe: stufe => (stufe === "s6"
    ? "Im Satz sind mehrere Wörter markiert. Tipp für das hervorgehobene Wort auf den Korb mit seiner Wortart — dann kommt das nächste dran."
    : "Lies das Wort und tipp auf den Korb mit seiner Wortart: Nomen, Verb oder Adjektiv. Die Zahl am Korb zählt mit."),
  anzahl: 10,
  stufen: nurMoegliche({
    s1: "Einzelne Wörter: Hund, spielen, rot.",
    s2: "Alles klein geschrieben — jetzt hilft nur die Probe.",
    s3: "Ein Wort im Satz: Der Hund bellt laut.",
    s4: "Vergangenheit und Steigerung: sprang, höher, am schnellsten.",
    s5: "Knifflig: das Lachen, beim Essen, das Blau.",
    s6: "Endgegner: drei Wörter im selben Satz, Vergangenheit und Nominalisierung gemischt.",
  }),

  aufgabe(ctx) {
    if (ctx.nr === 0) Object.keys(zaehler).forEach(k => { zaehler[k] = 0; });
    const a = aufgabeErzeugen(ctx.stufe);
    ctx.serie("antwort", a.art); // Korb (Königsstufe: der des ersten Worts)

    const karte = el("div", { class: "wortkarte", text: a.wort });
    const ist = art => (art === "A" ? "ein Adjektiv" : art === "V" ? "ein Verb" : "ein Nomen");
    // Abgefragte Wörter der Reihe nach (Königsstufe: mehrere im selben Satz, sonst eines).
    const ziele = a.ziele || [{ wort: a.wort, art: a.art }];
    const loesung = ziele.map(x => `«${x.wort}» ist ${ist(x.art)}.`).join(" ") + (ziele.length === 1 ? ` ${ARTEN[ziele[0].art].probe}` : "");
    ctx.loesung(loesung);
    ctx.tipp(tippsFuer(ctx.stufe));
    const marken = new Map(); // Satzteil → <mark>
    let pos = 0;
    if (a.satz) {
      const satz = el("div", { class: "satz" });
      for (const t of a.satz) {
        if (ziele.includes(t)) { const mk = el("mark", { text: t.wort }); marken.set(t, mk); satz.append(mk); }
        else satz.append(typeof t === "object" ? t.wort : t);
      }
      ziele.forEach((z, i) => marken.get(z).classList.toggle("ruhig", i > 0));
      ctx.flaeche.append(el("div", { class: "auftrag", text: ziele.length > 1 ? `Sortiere die ${ziele.length} Wörter nacheinander — immer das markierte.` : "Welche Wortart hat das markierte Wort?" }), satz);
    } else {
      ctx.flaeche.append(el("div", { class: "auftrag", text: "In welchen Korb gehört das Wort?" }));
      ctx.flaeche.append(karte);
    }

    const koerbe = el("div", { class: "koerbe" });
    let fertig = false;
    for (const [k, info] of Object.entries(ARTEN)) {
      const zahl = el("span", { class: "zahl", text: String(zaehler[k]) });
      const korb = el("button", { type: "button", class: `korb k-${k}`, "data-taste": k }, // Tasten N V A
        el("span", { class: "bild", text: info.bild }), el("b", { text: info.name }), el("small", { text: info.kind }), zahl);
      korb.addEventListener("click", () => {
        if (fertig) return;
        const z = ziele[pos];
        const quelle = a.satz ? marken.get(z) : karte;
        if (k === z.art) {
          zaehler[k]++;
          zahl.textContent = String(zaehler[k]);
          LS.fliegen(quelle, korb, quelle === karte);
          pos++;
          if (pos < ziele.length) {
            // Nächstes Wort im Satz hervorheben.
            quelle.classList.add("ruhig", "sortiert");
            marken.get(ziele[pos]).classList.remove("ruhig");
            LS.ton("tipp");
            ctx.sag(`Richtig: «${z.wort}» ist ${ist(k)}. Und das nächste?`, "gut");
            return;
          }
          fertig = true;
          ctx.richtig(`Richtig: «${z.wort}» ist ${ist(k)}.`);
          return;
        }
        korb.classList.remove("falsch");
        void korb.offsetWidth;
        korb.classList.add("falsch");
        // Hinweis: die Probe der gewählten Wortart machen lassen — sie klappt hier nicht.
        // Königsstufe: knapper, ohne Beispiel.
        ctx.falsch(ctx.stufe === "s6" ? `Mach die Probe für ${ARTEN[k].name} genau. Klappt sie mit «${z.wort}» in diesem Satz?`
          : `Mach die ${ARTEN[k].probe} Klappt das mit «${z.wort}»?`,
          loesung);
        if (ctx.flaeche.querySelector(".knopfzeile")) fertig = true;
      });
      koerbe.append(korb);
    }
    ctx.flaeche.append(koerbe);
    LS.kurztasten(koerbe);
    if (ctx.nr === 0) ctx.sag(a.satz ? "Lies den Satz und tipp auf den richtigen Korb." : "Tipp auf den richtigen Korb.");
  },
});
</script>
</body>
</html>
