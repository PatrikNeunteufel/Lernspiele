<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernsteig — Aufsicht</title>
<!-- Seit LERN_Session16 (Plan C2) ein Tab der Startseite: diese Adresse leitet dorthin weiter. -->
<meta http-equiv="refresh" content="0; url=index.html#verwaltung">
<script>
  // ?konto=<id> (Ansicht der Aufsicht) wird zu #verwaltung/<id>
  (function () { var k = new URLSearchParams(location.search).get("konto");
    location.replace("index.html#verwaltung" + (k ? "/" + encodeURIComponent(k) : "")); })();
</script>
</head>
<body>
<p><a href="index.html#verwaltung">Weiter zum Lernsteig</a></p>
</body>
</html>
